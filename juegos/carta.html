<title>Cartas de Potrero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
  /* Página de mundo único: la noche de estadio del Potrero 3D.
     Todos los colores pintados explícitos, sin depender del tema del visor. */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #131a26 0%, #0c1018 55%, #080b11 100%) #0c1018;
    color: #e8e4d8;
    font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 34px 16px 46px; gap: 22px;
  }
  h1 {
    margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 5px;
    color: #f5c542; text-transform: uppercase;
  }
  .sub { margin: -14px 0 0; font-size: 12.5px; letter-spacing: 1px; color: #7d8899;
         font-family: system-ui, sans-serif; }

  /* ---------- LA CARTA ---------- */
  .fut-card {
    --oroA: #f9dd7e; --oroB: #eeb84a; --oroC: #c97e22;
    --borde: #fff0bd; --tinta: #241a08; --tinta2: rgba(36,26,8,0.55);
    --raya: rgba(36,26,8,0.16);
    position: relative;
    width: 336px; height: 520px;
    clip-path: polygon(50% 0%, 96% 5.5%, 100% 9%, 100% 84%, 52% 99.6%, 48% 99.6%, 0% 84%, 0% 9%, 4% 5.5%);
    background: linear-gradient(160deg, var(--borde), var(--oroC));
    padding: 5px;                       /* el borde vive acá */
    filter: drop-shadow(0 24px 34px rgba(0,0,0,0.55));
  }
  .cuerpo {
    position: absolute; inset: 5px;
    clip-path: polygon(50% 0%, 96% 5.5%, 100% 9%, 100% 84%, 52% 99.6%, 48% 99.6%, 0% 84%, 0% 9%, 4% 5.5%);
    background:
      radial-gradient(120% 65% at 78% 6%, rgba(255,255,255,0.42) 0%, transparent 46%),
      repeating-linear-gradient(115deg, transparent 0 26px, rgba(255,255,255,0.05) 26px 27px),
      linear-gradient(158deg, var(--oroA) 0%, var(--oroB) 52%, var(--oroC) 100%);
    display: flex; flex-direction: column; align-items: center;
    color: var(--tinta);
  }

  .arriba { display: flex; width: 100%; height: 56%; padding: 30px 8px 0 20px; }
  .panel {
    width: 31%; display: flex; flex-direction: column; align-items: center;
    padding-top: 16px; gap: 2px;
    border-right: 2px solid var(--raya);
    align-self: flex-start; padding-bottom: 10px;
  }
  .valoracion {
    font-size: 58px; font-weight: 700; line-height: 0.95;
    font-variant-numeric: tabular-nums; outline: none;
  }
  .posicion {
    font-size: 21px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; outline: none;
    border-bottom: 2px solid var(--raya); padding-bottom: 5px; margin-bottom: 7px;
  }
  .panel svg { display: block; filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.25)); }

  .foto { flex: 1; position: relative; }
  .foto img {
    position: absolute; right: -10px; top: -30px;
    height: 127%; max-width: none;
    filter: drop-shadow(-8px 10px 10px rgba(60,30,0,0.35));
    /* el pie se funde antes de pisar el nombre */
    -webkit-mask-image: linear-gradient(to bottom, #000 74%, transparent 94%);
    mask-image: linear-gradient(to bottom, #000 74%, transparent 94%);
  }

  .abajo { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; z-index: 1; }
  .nombre {
    font-size: 27px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
    outline: none; text-align: center; max-width: 88%; white-space: nowrap; overflow: hidden;
    border-bottom: 2px solid var(--raya); padding: 0 12px 3px; margin-top: 2px;
  }
  .stats {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 26px; row-gap: 3px;
    margin-top: 9px; font-variant-numeric: tabular-nums;
  }
  .st { display: flex; gap: 8px; align-items: baseline; font-size: 19px; }
  .st b { font-weight: 700; min-width: 30px; text-align: right; outline: none; }
  .st span { font-weight: 500; letter-spacing: 1.5px; color: var(--tinta2); font-size: 16px; }
  .marca {
    margin-top: auto; margin-bottom: 46px;
    font-size: 10.5px; letter-spacing: 3.5px; color: var(--tinta2); font-weight: 600;
  }

  /* ---------- TIERS ---------- */
  .fut-card[data-tier="plata"] {
    --oroA: #f2f5f8; --oroB: #c3cbd6; --oroC: #7e8a99;
    --borde: #ffffff; --tinta: #1b2027; --tinta2: rgba(27,32,39,0.55); --raya: rgba(27,32,39,0.16);
  }
  .fut-card[data-tier="bronce"] {
    --oroA: #edb98a; --oroB: #c98550; --oroC: #7e4c22;
    --borde: #ffd9ae; --tinta: #26150a; --tinta2: rgba(38,21,10,0.55); --raya: rgba(38,21,10,0.18);
  }
  .fut-card[data-tier="potrero"] {
    --oroA: #57c07a; --oroB: #2c8a52; --oroC: #124a2a;
    --borde: #b6f0c8; --tinta: #f3f7ec; --tinta2: rgba(243,247,236,0.62); --raya: rgba(243,247,236,0.22);
  }
  .fut-card[data-tier="potrero"] .cuerpo {
    background:
      radial-gradient(120% 65% at 78% 6%, rgba(255,255,255,0.25) 0%, transparent 46%),
      repeating-linear-gradient(0deg, transparent 0 34px, rgba(255,255,255,0.06) 34px 35px),
      linear-gradient(158deg, var(--oroA) 0%, var(--oroB) 52%, var(--oroC) 100%);
  }

  .tiers { display: flex; gap: 10px; }
  .tiers button {
    font-family: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: 2px;
    padding: 8px 18px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,0.06); color: #aab5c4;
    border: 1px solid rgba(255,255,255,0.16);
  }
  .tiers button:hover { background: rgba(255,255,255,0.12); }
  .tiers button:focus-visible { outline: 2px solid #f5c542; outline-offset: 2px; }
  .tiers button[aria-pressed="true"] {
    background: #f5c542; color: #241a08; border-color: #f5c542;
  }

  [contenteditable]:focus { background: rgba(255,255,255,0.25); border-radius: 4px; }
</style>

<p class="sub">El jugador de la foto es el muñeco del Potrero 3D, renderizado desde el propio juego.</p>

<script>
  // tiers
  var botones = document.querySelectorAll('.tiers button');
  botones.forEach(function(b){
    b.addEventListener('click', function(){
      document.getElementById('carta').dataset.tier = b.dataset.tier;
      botones.forEach(function(o){ o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
    });
  });
  // campos numéricos: al salir, sólo dígitos y tope 1–99
  document.querySelectorAll('[data-num]').forEach(function(el){
    el.addEventListener('blur', function(){
      var n = parseInt(el.textContent.replace(/[^0-9]/g, ''), 10);
      if(isNaN(n)) n = 50;
      el.textContent = Math.max(1, Math.min(99, n));
    });
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
  });
  // nombre: mayúsculas y sin saltos de línea
  var nombre = document.querySelector('.nombre');
  nombre.addEventListener('blur', function(){
    nombre.textContent = nombre.textContent.replace(/\s+/g, ' ').trim().toUpperCase() || 'SIN NOMBRE';
  });
  nombre.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); nombre.blur(); } });
</script>
