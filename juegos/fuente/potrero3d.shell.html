<title>Potrero 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #070b11; color: #e6e6e6; overflow: hidden;
    font-family: system-ui, 'Segoe UI', Arial, sans-serif; touch-action: none;
  }
  #lienzo3d { display: block; width: 100vw; height: 100vh; }

  #hud {
    position: fixed; top: 12px; left: 14px; pointer-events: none;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }
  #hud .titulo { font-size: 22px; font-weight: 700; letter-spacing: 3px; color: #f5c542; }
  #hud .sub { font-size: 12px; letter-spacing: 2px; color: #93a0b2; margin-top: 2px; }
  #fps {
    position: fixed; top: 12px; right: 14px; font-family: 'Oswald', monospace;
    font-size: 13px; letter-spacing: 1px; color: #7f8b9c; pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }
  #ayuda {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 18px; align-items: center; pointer-events: none;
    background: rgba(8,12,18,0.62); border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px; padding: 8px 20px; font-size: 12.5px; letter-spacing: .4px;
    color: #aab5c4; white-space: nowrap;
  }
  #ayuda b { color: #f5c542; font-weight: 700; }
  @media (hover: none) and (pointer: coarse) { #ayuda { display: none; } }

  #tactil { position: fixed; inset: 0; pointer-events: none; display: none; }
  @media (hover: none) and (pointer: coarse) { #tactil { display: block; } }
  .cruz { position: fixed; left: 20px; bottom: 20px; width: 150px; height: 150px; }
  .tb {
    position: absolute; width: 50px; height: 50px; border-radius: 12px;
    background: rgba(255,255,255,0.13); border: 2px solid rgba(255,255,255,0.30);
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 19px; pointer-events: all; user-select: none;
  }
  .tb:active { background: rgba(255,255,255,0.34); }
  #btArriba { left: 50px; top: 0; }
  #btAbajo  { left: 50px; top: 100px; }
  #btIzq    { left: 0; top: 50px; }
  #btDer    { left: 100px; top: 50px; }
  #btPatear3d {
    position: fixed; right: 24px; bottom: 30px; width: 92px; height: 92px;
    border-radius: 50%; background: rgba(245,197,66,0.22);
    border: 2px solid rgba(245,197,66,0.65); color: #f5c542;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: all; user-select: none;
  }
  #btPatear3d span { font-size: 26px; line-height: 1; }
  #btPatear3d:active { background: rgba(245,197,66,0.45); }
  #btCam {
    position: fixed; right: 24px; bottom: 140px; padding: 10px 16px; border-radius: 999px;
    background: rgba(8,12,18,0.7); border: 1px solid rgba(255,255,255,0.22); color: #cfd6e2;
    font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 1.5px;
    pointer-events: all; user-select: none; cursor: pointer; z-index: 5;
  }
</style>

<canvas id="lienzo3d"></canvas>

<div id="hud">
  <div class="titulo">POTRERO 3D</div>
  <div class="sub">PROTOTIPO · MOTOR EN EL NAVEGADOR</div>
</div>
<div id="fps">—</div>

<div id="ayuda">
  <span><b>← ↑ → ↓</b> correr</span>
  <span><b>SHIFT</b> sprint</span>
  <span><b>ESPACIO</b> patear</span>
  <span><b>C</b> cambiar cámara</span>
</div>

<div id="tactil">
  <div class="cruz">
    <div class="tb" id="btArriba">▲</div>
    <div class="tb" id="btIzq">◀</div>
    <div class="tb" id="btDer">▶</div>
    <div class="tb" id="btAbajo">▼</div>
  </div>
  <div id="btPatear3d"><span>⚽</span>PATEAR</div>
</div>
<div id="btCam">CÁMARA</div>

<script>/*__THREE__*/</script>
<script>/*__DEMO__*/</script>
