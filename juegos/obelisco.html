/* ---------- Pasarruedas: arco oscuro sobre cada rueda ----------
   Es el detalle que más define la silueta de un auto visto de atrás.  */
function addArch(cx0, cz){
  const cx = cx0*SX;
  const sgn = cx > 0 ? 1 : -1;
  const y = 0.42, rIn = 0.47, rOut = 0.60;
  const xIn = cx - sgn*0.03, xOut = cx + sgn*0.055;
  const A0 = Math.PI*0.06, A1 = Math.PI*0.94;   // arco superior
  const N = 7;
  let prev = null;
  for(let i=0;i<=N;i++){
    const a = A0 + (A1-A0)*(i/N);
    const py = y + Math.sin(a)*rIn,  pz = cz + Math.cos(a)*rIn;
    const qy = y + Math.sin(a)*rOut, qz = cz + Math.cos(a)*rOut;
    const cur = [ V(xIn, py, pz), V(xOut, py, pz), V(xOut, qy, qz), V(xIn, qy, qz) ];
    if(prev){
      F([prev[1], cur[1], cur[2], prev[2]], M.arch);   // cara exterior
      F([prev[0], prev[3], cur[3], cur[0]], M.arch);   // cara interior
      F([prev[2], cur[2], cur[3], prev[3]], M.arch);   // canto superior
    }
    prev = cur;
  }
}
addArch(-1.00, 1.46);  addArch( 1.00, 1.46);
addArch(-1.02,-1.40);  addArch( 1.02,-1.40);

/* ---------- Ruedas ---------- */
const WS = 13;
function addWheel(cx0, cz, isFront){
  const cx = cx0*SX;
  const r=0.42, halfW=0.15, y=0.42;
  const g = G({x:cx,y:y,z:cz}, {spin:true, steer:isFront});
  const sgn = cx>0?1:-1;
  const inner=[], outer=[], rimPt=[];
  for(let i=0;i<WS;i++){
    const a=(i/WS)*Math.PI*2;
    const py=y+Math.cos(a)*r, pz=cz+Math.sin(a)*r;
    inner.push(V(cx-halfW*sgn, py, pz, g));
    outer.push(V(cx+halfW*sgn, py, pz, g));
    rimPt.push(V(cx+halfW*sgn*1.01, y+Math.cos(a)*r*0.72, cz+Math.sin(a)*r*0.72, g));
  }
  for(let i=0;i<WS;i++){ const j=(i+1)%WS;
    F([inner[i],inner[j],outer[j],outer[i]], (i%2===0)?M.tire:M.tire2); }
  for(let i=0;i<WS;i++){ const j=(i+1)%WS;
    F([outer[i],outer[j],rimPt[j],rimPt[i]], M.tire); }
  const hub = V(cx+halfW*sgn*1.03, y, cz, g);
  for(let i=0;i<WS;i++){ const j=(i+1)%WS;
    F([hub, rimPt[i], rimPt[j]], (i%3===0)?M.rim:M.rimDk); }
  const hubIn = V(cx-halfW*sgn*1.03, y, cz, g);
  for(let i=0;i<WS;i++){ const j=(i+1)%WS; F([hubIn, inner[j], inner[i]], M.dark); }
}
addWheel(-1.00, 1.46, true);  addWheel( 1.00, 1.46, true);
addWheel(-1.02,-1.40, false); addWheel( 1.02,-1.40, false);

/* ---------- Normales por vértice (sombreado suave) ---------- */
(function computeVertexNormals(){
  const n = MESH.verts.length;
  const acc = Array.from({length:n}, ()=>({x:0,y:0,z:0}));
  for(const f of MESH.faces){
    const [i0,i1,i2] = f.idx;
    const a=MESH.verts[i0], b=MESH.verts[i1], c=MESH.verts[i2];
    const ux=b.x-a.x, uy=b.y-a.y, uz=b.z-a.z;
    const vx=c.x-a.x, vy=c.y-a.y, vz=c.z-a.z;
    const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    f.fn = {x:nx, y:ny, z:nz};
    // sólo se suavizan las superficies grandes de carrocería y vidrio
    if(f.mat===M.paint || f.mat===M.glass || f.mat===M.paintD || f.mat===M.rocker){
      for(const i of f.idx){ acc[i].x+=nx; acc[i].y+=ny; acc[i].z+=nz; }
    }
  }
  MESH.vnorm = acc.map((v,i)=>{
    const m = Math.hypot(v.x,v.y,v.z);
    if(m < 1e-9) return null;                 // cara dura: usa normal plana
    return {x:v.x/m, y:v.y/m, z:v.z/m};
  });
  // oclusión ambiental simple por altura: lo de abajo recibe menos luz rebotada
  MESH.ao = MESH.verts.map(v => Math.max(0.52, Math.min(1, 0.52 + v.y*0.62)));
})();

/* ---------- Entorno reflejado ---------- */
// Sol de atardecer: bajo en el cielo (poca componente Y) y hacia la derecha
const SUN = (()=>{ const l={x:0.52,y:0.30,z:-0.40};
  const m=Math.hypot(l.x,l.y,l.z); return {x:l.x/m,y:l.y/m,z:l.z/m}; })();
const AMBIENT = 0.30;
const SUN_COLOR = [255, 214, 150];   // luz dorada del sol bajo
const SKY_TOP   = [96, 78, 130];     // cenit violáceo
const SKY_HORIZON = [255, 178, 118]; // horizonte naranja
const GROUND_REFL = [46, 38, 40];    // el suelo refleja poco y oscuro

// Color que "ve" un reflejo apuntando en la dirección (rx,ry,rz)
function envSample(rx, ry, rz, out){
  if(ry >= 0){
    // mezcla cenit -> horizonte según la altura del rayo
    const t = Math.min(1, ry*1.2);
    out[0] = SKY_HORIZON[0] + (SKY_TOP[0]-SKY_HORIZON[0])*t;
    out[1] = SKY_HORIZON[1] + (SKY_TOP[1]-SKY_HORIZON[1])*t;
    out[2] = SKY_HORIZON[2] + (SKY_TOP[2]-SKY_HORIZON[2])*t;
    // destello del sol reflejado
    const sd = rx*SUN.x + ry*SUN.y + rz*SUN.z;
    if(sd > 0.72){
      const sfr = (sd-0.72)/0.28;
      out[0] += sfr*sfr*230; out[1] += sfr*sfr*180; out[2] += sfr*sfr*110;
    }
  } else {
    const t = Math.min(1, -ry*1.5);
    out[0] = SKY_HORIZON[0] + (GROUND_REFL[0]-SKY_HORIZON[0])*t;
    out[1] = SKY_HORIZON[1] + (GROUND_REFL[1]-SKY_HORIZON[1])*t;
    out[2] = SKY_HORIZON[2] + (GROUND_REFL[2]-SKY_HORIZON[2])*t;
  }
  return out;
}

let carYaw=0, carRoll=0, carPitch=0, wheelSpin=0, steerAngle=0;
const _env = [0,0,0];

/* Color final de un vértice: difuso + reflejo de entorno + Fresnel + especular */
function shadeVertex(nx,ny,nz, px,py,pz, mat, ao, braking){
  // vector hacia la cámara (la cámara está en el origen)
  const vl = Math.hypot(px,py,pz) || 1;
  const vx = -px/vl, vy = -py/vl, vz = -pz/vl;

  let ndv = nx*vx + ny*vy + nz*vz;
  if(ndv < 0){ ndv = -ndv; }

  // reflejo R = 2(N·V)N - V
  const d2 = 2*ndv;
  const rx = d2*nx - vx, ry = d2*ny - vy, rz = d2*nz - vz;
  envSample(rx, ry, rz, _env);

  // Fresnel: al mirar de canto, todo refleja más
  const fres = Math.pow(1 - ndv, 4) * mat.fres;
  const refl = Math.min(0.96, mat.refl + (1-mat.refl)*fres);

  // difuso, teñido por el color del sol; relleno ambiente teñido por el cielo
  const diff = Math.max(0, nx*SUN.x + ny*SUN.y + nz*SUN.z);
  const sunLit = diff * ao;
  const ambLit = AMBIENT * ao;
  const c = mat.c;

  // especular (brillo directo del sol, con su color cálido)
  const hx = SUN.x+vx, hy = SUN.y+vy, hz = SUN.z+vz;
  const hl = Math.hypot(hx,hy,hz) || 1;
  const ndh = Math.max(0, (hx/hl)*nx + (hy/hl)*ny + (hz/hl)*nz);
  const shin = 2 + 220*(1-mat.rough);
  const spec = Math.pow(ndh, shin) * mat.spec;

  // Componente iluminada: base * (sol cálido + ambiente violáceo del cielo)
  const litR = (1-refl) * c[0]/255 * (sunLit*SUN_COLOR[0] + ambLit*SKY_TOP[0]*0.6);
  const litG = (1-refl) * c[1]/255 * (sunLit*SUN_COLOR[1] + ambLit*SKY_TOP[1]*0.6);
  const litB = (1-refl) * c[2]/255 * (sunLit*SUN_COLOR[2] + ambLit*SKY_TOP[2]*0.6);

  let r = litR + _env[0]*refl*(0.35+0.65*ao) + spec*SUN_COLOR[0];
  let g = litG + _env[1]*refl*(0.35+0.65*ao) + spec*SUN_COLOR[1];
  let b = litB + _env[2]*refl*(0.35+0.65*ao) + spec*SUN_COLOR[2];

  if(mat.tail && braking){ r = r*0.35 + 255*0.75; g = g*0.3 + 55; b = b*0.3 + 48; }

  // Compresión de brillos con "rodilla suave": los medios tonos quedan
  // intactos y sólo se comprime lo que pasa de 200, para no quemar a blanco.
  r = r<200 ? r : 200 + 55*(1-Math.exp(-(r-200)/70));
  g = g<200 ? g : 200 + 55*(1-Math.exp(-(g-200)/70));
  b = b<200 ? b : 200 + 55*(1-Math.exp(-(b-200)/70));
  return [r<0?0:r>255?255:r, g<0?0:g>255?255:g, b<0?0:b>255?255:b];
}

/* ---------- Render ---------- */
function drawPlayerCar(dt){
  const speedPct  = speed/MAX_SPEED;
  const steerAxis = (rightKey()?1:0) - (leftKey()?1:0);
  const braking   = brakeKey();
  const accel     = gasKey();
  const lerp = (a,b,t)=> a + (b-a)*Math.min(1,t);

  carYaw     = lerp(carYaw,   steerAxis*0.10*(0.35+speedPct), dt*7);
  carRoll    = lerp(carRoll, -steerAxis*0.050*(0.3+speedPct), dt*6);
  carPitch   = lerp(carPitch, braking ? 0.045 : (accel ? -0.026 : 0), dt*5);
  steerAngle = lerp(steerAngle, steerAxis*0.36, dt*9);
  wheelSpin += speed*dt*0.013;

  const cy=Math.cos(carYaw),   sy=Math.sin(carYaw);
  const cp=Math.cos(carPitch), sp=Math.sin(carPitch);
  const cr=Math.cos(carRoll),  sr=Math.sin(carRoll);
  const cs=Math.cos(wheelSpin),ss=Math.sin(wheelSpin);
  const cst=Math.cos(steerAngle), sst=Math.sin(steerAngle);

  const bounce  = Math.sin(elapsed*24)*speedPct*0.018 + Math.sin(elapsed*11)*speedPct*0.011;
  const lateral = -playerX*0.10 + steerAxis*0.09;

  // rotar posición y normal con la misma cadena
  function rot(x,y,z){
    const x1=x*cr-y*sr, y1=x*sr+y*cr, z1=z;
    const y2=y1*cp-z1*sp, z2=y1*sp+z1*cp;
    return { x:x1*cy+z2*sy, y:y2, z:-x1*sy+z2*cy };
  }

  const nv = MESH.verts.length;
  const tv = new Array(nv), tn = new Array(nv), sc = new Array(nv);
  for(let i=0;i<nv;i++){
    const v = MESH.verts[i];
    let x=v.x, y=v.y, z=v.z;
    let n = MESH.vnorm[i];
    let nx = n?n.x:0, ny = n?n.y:0, nz = n?n.z:0;

    if(v.g >= 0){
      const g = MESH.groups[v.g];
      let lx=x-g.pivot.x, ly=y-g.pivot.y, lz=z-g.pivot.z;
      if(g.spin){ let a=ly*cs-lz*ss, b2=ly*ss+lz*cs; ly=a; lz=b2;
                  a=ny*cs-nz*ss; b2=ny*ss+nz*cs; ny=a; nz=b2; }
      if(g.steer){ let a=lx*cst+lz*sst, b2=-lx*sst+lz*cst; lx=a; lz=b2;
                   a=nx*cst+nz*sst; b2=-nx*sst+nz*cst; nx=a; nz=b2; }
      x=lx+g.pivot.x; y=ly+g.pivot.y; z=lz+g.pivot.z;
    }

    const P = rot(x,y,z);
    tv[i] = { x:P.x+lateral, y:P.y+CAR_CAM_Y+bounce, z:P.z+CAR_CAM_Z };
    tn[i] = n ? rot(nx,ny,nz) : null;
    const f = FOCAL/tv[i].z;
    sc[i] = { x: W/2 + tv[i].x*f, y: HORIZON_Y - tv[i].y*f };
  }

  const list = [];
  for(const f of MESH.faces){
    const idx=f.idx, a=tv[idx[0]], b=tv[idx[1]], c=tv[idx[2]];
    const ux=b.x-a.x, uy=b.y-a.y, uz=b.z-a.z;
    const vx=c.x-a.x, vy=c.y-a.y, vz=c.z-a.z;
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;

    let cx=0, cyy=0, cz=0;
    for(const i of idx){ cx+=tv[i].x; cyy+=tv[i].y; cz+=tv[i].z; }
    const k=idx.length; cx/=k; cyy/=k; cz/=k;

    if(nx*cx + ny*cyy + nz*cz > 0) continue;
    if(cz <= 0.4) continue;
    list.push({f, z:cz, fn:{x:nx,y:ny,z:nz}, cen:{x:cx,y:cyy,z:cz}});
  }
  list.sort((p,q)=> q.z - p.z);

  // sombra de contacto
  const shX = W/2 + lateral*FOCAL/CAR_CAM_Z;
  const shY = HORIZON_Y - (CAR_CAM_Y + 0.02)*FOCAL/CAR_CAM_Z;
  const shW = 2.45*FOCAL/CAR_CAM_Z;
  const sg = ctx.createRadialGradient(shX, shY, 4, shX, shY, shW*0.55);
  sg.addColorStop(0,'rgba(8,10,16,0.62)');
  sg.addColorStop(0.55,'rgba(8,10,16,0.30)');
  sg.addColorStop(1,'rgba(8,10,16,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.ellipse(shX, shY, shW*0.55, shW*0.115, 0,0,Math.PI*2); ctx.fill();

  if(skidLevel > 0.25 && speed > 200){
    for(let i=0;i<5;i++){
      ctx.fillStyle = `rgba(226,228,232,${(skidLevel-0.25)*0.45*Math.random()})`;
      ctx.beginPath();
      ctx.arc(shX-150+Math.random()*300, shY+Math.random()*16, 12+Math.random()*26, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // ---- pintar caras con sombreado suave ----
  for(const item of list){
    const f = item.f, idx = f.idx, mat = f.mat;

    // colores por vértice
    let minL=1e9, maxL=-1e9, iMin=0, iMax=0;
    const cols = [];
    for(let i=0;i<idx.length;i++){
      const vi = idx[i];
      const n = tn[vi] || item.fn;               // normal suave, o plana si es arista dura
      const p = tv[vi];
      const col = shadeVertex(n.x,n.y,n.z, p.x,p.y,p.z, mat, MESH.ao[vi], braking);
      cols.push(col);
      const L = col[0]*0.3 + col[1]*0.59 + col[2]*0.11;
      if(L<minL){ minL=L; iMin=i; }
      if(L>maxL){ maxL=L; iMax=i; }
    }

    // trazar el polígono y medir su tamaño en pantalla
    let bx0=1e9, by0=1e9, bx1=-1e9, by1=-1e9;
    ctx.beginPath();
    for(let i=0;i<idx.length;i++){
      const s = sc[idx[i]];
      if(s.x<bx0) bx0=s.x; if(s.x>bx1) bx1=s.x;
      if(s.y<by0) by0=s.y; if(s.y>by1) by1=s.y;
      if(i===0) ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y);
    }
    ctx.closePath();
    const screenArea = (bx1-bx0)*(by1-by0);

    // degradado entre el vértice más oscuro y el más claro -> superficie continua
    // (sólo vale la pena en caras grandes; en las chicas no se distingue)
    const pA = sc[idx[iMin]], pB = sc[idx[iMax]];
    const span = Math.hypot(pB.x-pA.x, pB.y-pA.y);
    let style;
    if(screenArea > 110 && maxL-minL > 7 && span > 3){
      const gr = ctx.createLinearGradient(pA.x,pA.y, pB.x,pB.y);
      const a = cols[iMin], b = cols[iMax];
      gr.addColorStop(0, `rgb(${a[0]|0},${a[1]|0},${a[2]|0})`);
      gr.addColorStop(1, `rgb(${b[0]|0},${b[1]|0},${b[2]|0})`);
      style = gr;
    } else {
      let r=0,g=0,bb=0;
      for(const c of cols){ r+=c[0]; g+=c[1]; bb+=c[2]; }
      const m = cols.length;
      style = `rgb(${(r/m)|0},${(g/m)|0},${(bb/m)|0})`;
    }
    ctx.fillStyle = style;
    ctx.fill();
    ctx.strokeStyle = style;
    ctx.lineWidth = 0.9;
    ctx.stroke();
  }

  // resplandor de frenos
  if(braking){
    const gy = HORIZON_Y - (CAR_CAM_Y + 0.70)*FOCAL/CAR_CAM_Z;
    ctx.globalCompositeOperation = 'lighter';
    [-0.60, 0.60].forEach(off=>{
      const gx = W/2 + (off + lateral)*FOCAL/CAR_CAM_Z;
      const gg = ctx.createRadialGradient(gx, gy, 2, gx, gy, 54);
      gg.addColorStop(0,'rgba(255,86,66,0.8)');
      gg.addColorStop(1,'rgba(255,60,50,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(gx-54, gy-54, 108, 108);
    });
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ---------- Efectos de pantalla ---------- */
function drawSpeedFX(speedPct){
  if(speedPct > 0.45 || nitroActivo){
    const a = Math.min(1, Math.max(0,(speedPct-0.45)/0.55) + (nitroActivo ? 0.55 : 0));
    ctx.strokeStyle = nitroActivo
      ? `rgba(150,225,255,${a*0.30})`
      : `rgba(255,255,255,${a*0.16})`;
    ctx.lineWidth = 1.6;
    // Arrancan MUY afuera: son visión periférica. Naciendo cerca del centro
    // cruzaban el auto y la calle enteros y la pantalla parecía un vidrio rayado.
    const cx = W/2, cy = H*0.46;
    const N = 14;
    for(let i=0;i<N;i++){
      const ang = (i/N)*Math.PI*2 + elapsed*0.3;
      const r0 = 400, r1 = 400 + a*300;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(ang)*r0, cy+Math.sin(ang)*r0*0.62);
      ctx.lineTo(cx+Math.cos(ang)*r1, cy+Math.sin(ang)*r1*0.62);
      ctx.stroke();
    }
    // desenfoque de velocidad en los bordes
    const tinte = nitroActivo ? '150,225,255' : '255,255,255';
    const eg = ctx.createLinearGradient(0,0,W,0);
    eg.addColorStop(0,   `rgba(${tinte},${a*0.20})`);
    eg.addColorStop(0.2, `rgba(${tinte},0)`);
    eg.addColorStop(0.8, `rgba(${tinte},0)`);
    eg.addColorStop(1,   `rgba(${tinte},${a*0.20})`);
    ctx.fillStyle = eg;
    ctx.fillRect(0,0,W,H);
  }
  // viñeta
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,W*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}

// Corrección de color: unifica la paleta y da aire cinematográfico
// (sin globalCompositeOperation 'overlay', que fuerza recomposición lenta)
function drawColorGrade(){
  // Baño cálido que viene desde el sol (arriba-derecha).
  // Suave a propósito: con más carga tapaba el contraste y toda la escena
  // quedaba de un beige lechoso donde no se distinguía nada.
  const warm = ctx.createRadialGradient(W*0.68, H*0.34, 40, W*0.68, H*0.34, W*0.95);
  warm.addColorStop(0,   'rgba(255,196,120,0.13)');
  warm.addColorStop(0.45,'rgba(255,170,100,0.06)');
  warm.addColorStop(1,   'rgba(120,70,110,0.06)');
  ctx.fillStyle = warm;
  ctx.fillRect(0,0,W,H);

  // Esquina inferior-izquierda en sombra fría/violácea (opuesta al sol)
  const cool = ctx.createLinearGradient(0, H, W*0.55, H*0.4);
  cool.addColorStop(0, 'rgba(60,50,95,0.22)');
  cool.addColorStop(1, 'rgba(60,50,95,0)');
  ctx.fillStyle = cool;
  ctx.fillRect(0,0,W,H);

  // Neblina dorada, sólo en la franja del horizonte
  const haze = ctx.createLinearGradient(0, H*0.34, 0, H*0.54);
  haze.addColorStop(0,'rgba(232,168,122,0.15)');
  haze.addColorStop(1,'rgba(232,168,122,0)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, H*0.34, W, H*0.20);
}

function draw(dt){
  const speedPct = speed/MAX_SPEED;
  const offRoad = Math.abs(playerX) > 1;
  const shakeMag = speedPct*1.8 + (offRoad?5:0) + hitFlash*8;
  const sx = (Math.random()-0.5)*shakeMag, sy = (Math.random()-0.5)*shakeMag;

  const curveNow = segAt(position).curve;
  camRoll += ((-curveNow * speedPct * 0.028) - camRoll) * Math.min(1, dt*4);

  ctx.save();
  // La rotación con escala fuerza un resampling de pantalla completa;
  // sólo se aplica cuando el ángulo es perceptible (> ~0.2 grados).
  if(Math.abs(camRoll) > 0.004){
    ctx.translate(W/2 + sx, H/2 + sy);
    ctx.rotate(camRoll);
    ctx.scale(1.03, 1.03);
    ctx.translate(-W/2, -H/2);
  } else {
    ctx.translate(sx, sy);
  }
  render();
  drawColorGrade();
  drawPlayerCar(dt);
  ctx.restore();

  drawSpeedFX(speedPct);
  drawPopups();

  if(hitFlash > 0){
    ctx.fillStyle = `rgba(235,60,60,${hitFlash*0.5})`;
    ctx.fillRect(0,0,W,H);
    hitFlash = Math.max(0, hitFlash - dt*1.8);
  }
}

/* ============================================================
   BUCLE PRINCIPAL
   ============================================================ */
let lastTime = null;
function loop(ts){
  if(lastTime === null) lastTime = ts;
  const dt = Math.min((ts-lastTime)/1000, 0.05);
  lastTime = ts;
  if(raceStarted && !raceOver){
    elapsed += dt;
    update(dt);
    updateHUD();
    AUDIO.update(speed/MAX_SPEED, gasKey(), skidLevel, true);
  }
  draw(dt);
  drawMinimap();
  requestAnimationFrame(loop);
}

function startCountdown(){
  let n = 3;
  msgOverlay.style.display = 'flex';
  msgOverlay.textContent = n;
  const iv = setInterval(()=>{
    n--;
    if(n > 0)     { msgOverlay.textContent = n; AUDIO.beep(); }
    else if(n===0){ msgOverlay.textContent = '¡YA!'; AUDIO.go(); }
    else {
      clearInterval(iv);
      msgOverlay.style.display = 'none';
      raceStarted = true;
    }
  }, 800);
}

function clasificacion(){
  const lista = rivals.map(r=>({
    nombre: r.def.nombre, color: r.def.color, num: r.def.num, d: rivalDist(r), vos:false
  }));
  lista.push({nombre:'VOS', color:'#f5c542', num:'—', d: playerDist(), vos:true});
  lista.sort((a,b)=> b.d - a.d);
  return lista;
}

function endRace(){
  raceOver = true;
  const tiempo = formatoTiempo(finishTime, 2);
  // El bonus más grande es por el puesto: es una carrera, no una contrarreloj
  const bonusPuesto = Math.max(0, (9 - finalPos)) * 1200;
  // El bonus de tiempo se mide contra la carrera, no contra un número fijo:
  // con menos vueltas, 180 s de referencia regalaban puntos.
  const bonusTiempo = Math.max(0, Math.round((TOTAL_LAPS*SEG_POR_VUELTA - finishTime) * 25));
  score += bonusPuesto + bonusTiempo;

  const titulo = finalPos === 1 ? '🏆 ¡GANASTE EL OBELISCO GP!'
               : finalPos <= 3  ? '🥉 ¡AL PODIO!'
               : '🏁 CARRERA TERMINADA';

  const filas = clasificacion().slice(0,8).map((c,i)=>
    '<div style="display:flex;align-items:center;gap:8px;padding:2px 0;' +
      (c.vos ? 'background:rgba(245,197,66,0.14);border-radius:4px;' : '') + '">' +
      '<span style="width:22px;text-align:right;color:#9aa1ab">' + (i+1) + 'º</span>' +
      '<span style="width:10px;height:10px;border-radius:2px;background:' + c.color + '"></span>' +
      '<span style="flex:1;text-align:left;color:' + (c.vos ? '#f5c542' : '#cfd4dc') +
        ';font-weight:' + (c.vos ? '800' : '400') + '">' + c.nombre + '</span>' +
    '</div>'
  ).join('');

  finalText.innerHTML =
    titulo +
    '<div style="font-size:64px;margin:6px 0 0;color:#f5c542;line-height:1">' + finalPos + 'º</div>' +
    '<div style="font-size:13px;color:#9aa1ab;letter-spacing:1px;margin-bottom:10px">DE 8</div>' +
    '<div style="width:300px;margin:0 auto 12px;font-size:14px">' + filas + '</div>' +
    '<div style="font-size:30px;color:#fff;font-weight:800">' + score.toLocaleString('es-AR') + '</div>' +
    '<div style="font-size:14px;color:#cfd4dc;font-weight:400;line-height:1.7">' +
      'Tiempo ' + tiempo + '<br>' +
      'Bonus por puesto ' + bonusPuesto.toLocaleString('es-AR') +
      ' &nbsp;·&nbsp; por tiempo ' + bonusTiempo.toLocaleString('es-AR') + '<br>' +
      'Rivales pasados ' + rivalesPasados +
      ' &nbsp;·&nbsp; Tránsito esquivado ' + overtakes +
      ' &nbsp;·&nbsp; Al ras ' + closeCalls +
    '</div>';
  finalPanel.style.display = 'flex';
  AUDIO.update(0,false,0,false);
  AUDIO.finish();
}

function restart(){
  position = 0; playerX = 0; speed = 0;
  laps = 0; elapsed = 0; finished = false; finishTime = 0;
  raceStarted = false; raceOver = false; hitFlash = 0; skidLevel = 0;
  score = 0; combo = 1; comboTimer = 0; overtakes = 0; closeCalls = 0; popups = [];
  puesto = 8; mejorPuesto = 8; rivalesPasados = 0; finalPos = 8;
  nitro = 0; nitroActivo = false;
  resetTraffic();
  resetRivals();
  finalPanel.style.display = 'none';
  startCountdown();
}

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', ()=>{
  AUDIO.resume();
  const m = !AUDIO.isMuted();
  AUDIO.setMuted(m);
  muteBtn.textContent = m ? '🔇' : '🔊';
});

// La ayuda de abajo se arma sola, para que no quede desfasada del largo real
lapTxt.textContent = '1/' + TOTAL_LAPS;
document.getElementById('ayuda').textContent =
  'Flechas / WASD para manejar · ESPACIO: nitro (se carga pasando rivales y ' +
  'raspando el tránsito) · Salís último entre ' + (RIVAL_DEFS.length+1) + ' · ' +
  TOTAL_LAPS + (TOTAL_LAPS === 1 ? ' vuelta' : ' vueltas');

startCountdown();
requestAnimationFrame(loop);
</script>
</body>
</html>
