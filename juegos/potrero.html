<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picado de Potrero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b0e13;
    color: #e6e6e6;
    font-family: system-ui, 'Segoe UI', Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden; touch-action: none;
  }

  #stage { transform-origin: top center; }

  /* --- Marcador: chapa de estadio, tipografía condensada --- */
  #marcador {
    width: 1080px; display: flex; align-items: stretch; justify-content: center;
    gap: 0; margin: 6px 0 6px;
    font-family: 'Oswald', 'Arial Narrow', system-ui, sans-serif;
    background: linear-gradient(180deg,#161b24,#0f131a);
    border: 1px solid #262c38; border-radius: 8px; overflow: hidden;
  }
  .equipo { flex: 1; display: flex; align-items: center; gap: 10px; padding: 7px 16px; }
  .equipo.visita { flex-direction: row-reverse; }
  .camiseta { width: 16px; height: 16px; border-radius: 3px; flex: none; }
  .nombreEq { font-size: 19px; font-weight: 600; letter-spacing: 2px; color: #cfd6e2; }
  .goles {
    font-size: 34px; font-weight: 700; line-height: 1; color: #fff;
    padding: 4px 16px; min-width: 56px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #reloj {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 18px; background: #0a0d12; border-left: 1px solid #262c38; border-right: 1px solid #262c38;
  }
  #relojTxt { font-size: 26px; font-weight: 700; color: #f5c542; font-variant-numeric: tabular-nums; line-height: 1; }
  #relojEtq { font-size: 10px; letter-spacing: 3px; color: #6d7686; margin-top: 2px; }

  #wrap {
    position: relative; border: 1px solid #262c38; border-radius: 8px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.75); overflow: hidden; background: #10331f;
  }
  canvas { display: block; }

  #aviso {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(6,9,14,0.62); pointer-events: none;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
  }
  #avisoGrande { font-size: 76px; font-weight: 700; color: #f5c542; letter-spacing: 4px;
                 text-shadow: 0 8px 30px rgba(0,0,0,0.85); line-height: 1; }
  #avisoChico { font-size: 19px; letter-spacing: 3px; color: #cfd6e2; margin-top: 10px; }

  #final { position: absolute; inset: 0; display: none; flex-direction: column;
           align-items: center; justify-content: center; background: rgba(6,9,14,0.92);
           font-family: 'Oswald', 'Arial Narrow', sans-serif; }
  #final button {
    margin-top: 20px; padding: 12px 30px; font-size: 16px; letter-spacing: 2px;
    font-family: inherit; font-weight: 600;
    border: none; border-radius: 6px; background: #f5c542; color: #14161a; cursor: pointer;
  }
  #final button:focus-visible { outline: 3px solid #8ee6ff; outline-offset: 3px; }

  #barraPotenciaBg {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    width: 210px; height: 10px; background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 5px; overflow: hidden;
    opacity: 0; transition: opacity .12s;
  }
  #barraPotencia { height: 100%; width: 0%; background: linear-gradient(90deg,#8ee6ff,#f5c542,#e8443a); }

  /* La página corre dentro de un marco: hasta que no recibe el foco, las
     teclas se las queda la página de afuera y el juego parece no responder. */
  #clicTeclado {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(10,13,18,0.88); border: 1px solid #f5c542; border-radius: 999px;
    color: #f5c542; font-size: 13px; letter-spacing: .6px; padding: 8px 18px;
    font-family: 'Oswald','Arial Narrow',sans-serif; z-index: 6; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity .2s;
  }
  #clicTeclado.visible { opacity: 1; }
  @media (hover: none) and (pointer: coarse) { #clicTeclado { display: none; } }

  #mute { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px;
          border-radius: 50%; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.22);
          display: flex; align-items: center; justify-content: center; font-size: 17px;
          cursor: pointer; user-select: none; z-index: 5; }
  #mute:hover { background: rgba(0,0,0,0.72); }

  /* --- Controles táctiles --- */
  #tactil { position: absolute; inset: 0; pointer-events: none; }
  #palanca { position: absolute; left: 26px; bottom: 26px; width: 132px; height: 132px;
             border-radius: 50%; background: rgba(255,255,255,0.09);
             border: 2px solid rgba(255,255,255,0.22); pointer-events: all; }
  #palancaPunto { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
                  margin: -27px 0 0 -27px; border-radius: 50%;
                  background: rgba(255,255,255,0.30); border: 2px solid rgba(255,255,255,0.45); }
  #botones { position: absolute; right: 26px; bottom: 26px; display: flex; gap: 14px; pointer-events: none; }
  .bt { pointer-events: all; width: 76px; height: 76px; border-radius: 50%;
        background: rgba(255,255,255,0.13); border: 2px solid rgba(255,255,255,0.32);
        color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 1px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        user-select: none; font-family: 'Oswald', sans-serif; }
  .bt span { font-size: 22px; line-height: 1; margin-bottom: 2px; }
  .bt:active { background: rgba(255,255,255,0.34); }

  /* Los controles táctiles sólo estorban en escritorio */
  #tactil { display: none; }
  @media (hover: none) and (pointer: coarse) { #tactil { display: block; } }
  /* La cancha es apaisada: en un teléfono vertical no se puede jugar */
  #girar { display: none; }
  @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
    #girar {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: fixed; inset: 0; z-index: 50; background: #0b0e13; text-align: center;
      padding: 28px; gap: 14px;
    }
    #stage, #ayuda { visibility: hidden; }
  }
  #girar .icono { font-size: 58px; animation: girarIcono 2.4s ease-in-out infinite; }
  @keyframes girarIcono { 0%,45% { transform: rotate(0deg); } 60%,100% { transform: rotate(90deg); } }
  @media (prefers-reduced-motion: reduce) { #girar .icono { animation: none; transform: rotate(90deg); } }
  #girar .txt { font-family: 'Oswald','Arial Narrow',sans-serif; font-size: 22px;
                letter-spacing: 2px; color: #f5c542; }
  #girar .sub { font-size: 14px; color: #6d7686; max-width: 260px; line-height: 1.5; }
  #ayuda { color: #6d7686; font-size: 12px; margin-top: 7px; letter-spacing: .4px; text-align: center; }
  #ayuda b { color: #98a2b3; font-weight: 600; }
</style>
</head>
<body>
<div id="girar">
  <div class="icono">📱</div>
  <div class="txt">GIRÁ EL TELÉFONO</div>
  <div class="sub">La cancha es apaisada: de costado entra entera y los controles quedan a mano.</div>
</div>

<div id="stage">
<div id="marcador">
  <div class="equipo local">
    <span class="camiseta" style="background:#4da3ff"></span>
    <span class="nombreEq">POTRERO</span>
  </div>
  <div class="goles" id="golesLocal">0</div>
  <div id="reloj"><div id="relojTxt">0'</div><div id="relojEtq">MINUTO</div></div>
  <div class="goles" id="golesVisita">0</div>
  <div class="equipo visita">
    <span class="camiseta" style="background:#e8443a"></span>
    <span class="nombreEq">BARRIO</span>
  </div>
</div>
<div id="wrap" tabindex="0">
  <canvas id="c" width="1080" height="740"></canvas>
  <div id="barraPotenciaBg"><div id="barraPotencia"></div></div>
  <div id="clicTeclado">Hacé clic en la cancha para jugar con el teclado</div>
  <div id="mute" title="Silenciar">🔊</div>
  <div id="aviso"><div id="avisoGrande">¡A JUGAR!</div><div id="avisoChico"></div></div>
  <div id="final"></div>
  <div id="tactil">
    <div id="palanca"><div id="palancaPunto"></div></div>
    <div id="botones">
      <div class="bt" id="btPase"><span>➤</span>PASE</div>
      <div class="bt" id="btPatear"><span>⚽</span>PATEAR</div>
    </div>
  </div>
</div>
</div>

<div id="ayuda"></div>

<script>
/* ============================================================
   PICADO DE POTRERO — 5 contra 5, cancha cerrada
   Canvas + JS, sin librerías. Audio sintetizado con Web Audio.
   ============================================================ */
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1080, H = 740;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W*DPR; cv.height = H*DPR;
cv.style.width = W+'px'; cv.style.height = H+'px';
ctx.scale(DPR, DPR);

const elGolesL = document.getElementById('golesLocal');
const elGolesV = document.getElementById('golesVisita');
const elReloj  = document.getElementById('relojTxt');
const elAviso  = document.getElementById('aviso');
const elAvisoG = document.getElementById('avisoGrande');
const elAvisoC = document.getElementById('avisoChico');
const elFinal  = document.getElementById('final');
const elBarraBg= document.getElementById('barraPotenciaBg');
const elBarra  = document.getElementById('barraPotencia');
const stage    = document.getElementById('stage');

function ajustarEscala(){
  // Se mide el tamaño REAL sin transformar en vez de usar números fijos:
  // el marcador vive adentro de #stage y una altura hardcodeada quedaba mal.
  stage.style.transform = 'none';
  stage.style.height = '';
  const anchoReal = stage.offsetWidth  || 1010;
  const altoReal  = stage.offsetHeight || 720;
  const s = Math.min(1, (window.innerWidth - 12)/anchoReal, (window.innerHeight - 46)/altoReal);
  stage.style.transform = 'scale(' + s + ')';
  stage.style.height = Math.ceil(altoReal*s) + 'px';
}
window.addEventListener('resize', ajustarEscala);
window.addEventListener('orientationchange', ()=> setTimeout(ajustarEscala, 120));
ajustarEscala();

/* ============================================================
   MEDIDAS DE LA CANCHA
   ============================================================ */
/* La zona jugable mide lo mismo que antes (876x600): sólo se corrió dentro
   de un lienzo más grande para que entre el estadio alrededor sin cambiar
   una coma del balance ya medido. */
const CANCHA = { x0: 102, y0: 70, x1: 978, y1: 670 };
CANCHA.w = CANCHA.x1 - CANCHA.x0;
CANCHA.h = CANCHA.y1 - CANCHA.y0;
CANCHA.cx = (CANCHA.x0 + CANCHA.x1)/2;
CANCHA.cy = (CANCHA.y0 + CANCHA.y1)/2;

const ARCO_ALTO  = 158;                 // ancho de boca de arco (vertical)
const ARCO_FONDO = 34;                  // profundidad de la red
const ARCO_Y0 = CANCHA.cy - ARCO_ALTO/2;
const ARCO_Y1 = CANCHA.cy + ARCO_ALTO/2;
const AREA_ANCHO = 128, AREA_ALTO = 300;
const CIRCULO_R = 78;

const R_JUG = 13;                     // radio del jugador
const R_PEL = 7.5;                      // radio de la pelota

/* ============================================================
   AUDIO — todo sintetizado, sin archivos
   ============================================================ */
const AUDIO = (function(){
  let ac=null, listo=false, mudo=false, master, hinchadaGain, hinchadaFilt;

  function ruido(seg){
    const n = ac.sampleRate*seg;
    const b = ac.createBuffer(1, n, ac.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    return b;
  }

  function init(){
    if(listo) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);

      // Murmullo de la hinchada: ruido rosa filtrado, siempre de fondo
      const src = ac.createBufferSource();
      src.buffer = ruido(3); src.loop = true;
      hinchadaFilt = ac.createBiquadFilter();
      hinchadaFilt.type = 'bandpass'; hinchadaFilt.frequency.value = 420; hinchadaFilt.Q.value = 0.7;
      hinchadaGain = ac.createGain(); hinchadaGain.gain.value = 0.035;
      src.connect(hinchadaFilt); hinchadaFilt.connect(hinchadaGain); hinchadaGain.connect(master);
      src.start();
      listo = true;
    }catch(e){ listo = false; }
  }
  function activar(){ if(!listo) init(); if(ac && ac.state==='suspended') ac.resume(); }

  function tono(f, dur, tipo, vol, hasta){
    if(!listo || mudo) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(); o.type = tipo||'square';
    o.frequency.setValueAtTime(f, t);
    if(hasta) o.frequency.exponentialRampToValueAtTime(hasta, t+dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.14, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }

  // Golpe a la pelota: cuanto más fuerte, más grave y más cuerpo
  function patada(fuerza){
    if(!listo || mudo) return;
    const t = ac.currentTime, f = Math.max(0, Math.min(1, fuerza));
    const n = ac.createBufferSource(); n.buffer = ruido(0.2);
    const bp = ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.setValueAtTime(900 + f*700, t); bp.Q.value = 1.2;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.10 + f*0.22, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06 + f*0.05);
    n.connect(bp); bp.connect(g); g.connect(master);
    n.start(t); n.stop(t+0.2);

    const o = ac.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(190 - f*80, t);
    o.frequency.exponentialRampToValueAtTime(52, t+0.10);
    const og = ac.createGain();
    og.gain.setValueAtTime(0.12 + f*0.20, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
    o.connect(og); og.connect(master); o.start(t); o.stop(t+0.14);
  }

  const pase = ()=> patada(0.18);
  const rebote = ()=> tono(240, 0.05, 'triangle', 0.06, 150);
  const palo = ()=> { tono(1180, 0.16, 'square', 0.20, 620); tono(520, 0.20, 'triangle', 0.14, 300); };
  const atajada = ()=> tono(300, 0.12, 'sawtooth', 0.10, 160);
  const silbato = ()=>{
    if(!listo || mudo) return;
    [0,0.16].forEach(off=> setTimeout(()=> tono(2050, 0.13, 'square', 0.13, 2380), off*1000));
  };
  const silbatoFinal = ()=>{
    [0,0.2,0.4].forEach(off=> setTimeout(()=> tono(2050, 0.20, 'square', 0.14, 2300), off*1000));
  };

  // Gol: rugido de hinchada + fanfarria
  function gol(){
    if(!listo || mudo) return;
    const t = ac.currentTime;
    hinchadaGain.gain.cancelScheduledValues(t);
    hinchadaGain.gain.setValueAtTime(hinchadaGain.gain.value, t);
    hinchadaGain.gain.linearRampToValueAtTime(0.30, t+0.25);
    hinchadaGain.gain.linearRampToValueAtTime(0.035, t+3.4);
    hinchadaFilt.frequency.setValueAtTime(420, t);
    hinchadaFilt.frequency.linearRampToValueAtTime(1150, t+0.3);
    hinchadaFilt.frequency.linearRampToValueAtTime(420, t+3.4);
    [523,659,784,1047].forEach((f,i)=> setTimeout(()=> tono(f, 0.30, 'square', 0.13), i*110));
  }
  // Ambiente proporcional a lo cerca que está la pelota de un arco
  function tension(v){
    if(!listo || mudo) return;
    hinchadaGain.gain.setTargetAtTime(0.030 + v*0.045, ac.currentTime, 0.4);
  }
  function setMudo(m){
    mudo = m;
    if(listo) master.gain.setTargetAtTime(m?0:0.5, ac.currentTime, 0.05);
  }
  return { activar, patada, pase, rebote, palo, atajada, silbato, silbatoFinal, gol, tension,
           setMudo, estaMudo: ()=>mudo };
})();

/* ============================================================
   EQUIPOS
   ============================================================ */
const EQUIPOS = [
  { nombre:'POTRERO', camiseta:'#4da3ff', franja:'#2b6fb5', short:'#12233a', arquero:'#f5c542', dir: 1 },
  { nombre:'BARRIO',  camiseta:'#e8443a', franja:'#a52a24', short:'#2a1210', arquero:'#8be36b', dir:-1 }
];

// Formación 1-2-1-1 en fracciones de cancha, para el que ataca hacia la derecha
const FORMACION = [
  { rol:'ARQ', x:0.045, y:0.50 },
  { rol:'DEF', x:0.235, y:0.28 },
  { rol:'DEF', x:0.235, y:0.72 },
  { rol:'MED', x:0.455, y:0.50 },
  { rol:'DEL', x:0.680, y:0.50 }
];

let jugadores = [], pelota = null;
let golesL = 0, golesV = 0, reloj = 0, jugando = false, terminado = false;
let controlado = null, cambioBloqueo = 0;
let sacudida = 0, destellos = [], estelaPelota = [];
let avisoTimer = 0, tiempoDeGol = 0, ultimoGoleador = null;
let cargaPatada = 0, cargando = false;
/* RITMO escala TODO el juego en el tiempo: velocidades, fuerza de los pases y
   remates, gravedad y rozamiento. Bajar una velocidad suelta rompe el balance
   (la pelota llegaría igual de rápido que antes); escalando el conjunto, las
   trayectorias son las mismas y sólo tardan más. Como en 90 s entra menos
   juego, el partido dura proporcionalmente más y el reloj lo mapea a 0'–90'. */
const RITMO = 0.55;   // más lento todavía, a pedido
const DURACION = Math.round(90 / RITMO);   // segundos reales; el reloj muestra 0'–90'

function crearJugadores(){
  jugadores = [];
  EQUIPOS.forEach((eq, ei)=>{
    FORMACION.forEach((f, fi)=>{
      // El equipo 1 ataca hacia la izquierda: se espeja la formación
      const fx = eq.dir === 1 ? f.x : 1 - f.x;
      const p = {
        eq: ei, rol: f.rol, base: { x: fx, y: f.y },
        x: CANCHA.x0 + fx*CANCHA.w, y: CANCHA.y0 + f.y*CANCHA.h,
        vx: 0, vy: 0, mira: eq.dir, paso: 0,
        vel: (f.rol === 'ARQ' ? 182 : (f.rol === 'DEL' ? 232 : 218)) * RITMO,
        aturdido: 0, barrida: 0, num: fi === 0 ? 1 : fi + 1
      };
      jugadores.push(p);
    });
  });
}

function posicionarSaque(quienSaca){
  crearJugadores();
  // el que saca se para junto a la pelota, el resto en su campo
  pelota = { x: CANCHA.cx, y: CANCHA.cy, vx: 0, vy: 0, z: 0, vz: 0, dueno: null, cool: 0, giro: 0 };
  estelaPelota = [];
  const sacador = jugadores.find(p => p.eq === quienSaca && p.rol === 'MED');
  if(sacador){
    sacador.x = CANCHA.cx - EQUIPOS[quienSaca].dir*24;
    sacador.y = CANCHA.cy;
  }
  controlado = jugadores.find(p => p.eq === 0 && p.rol === 'MED');
}

/* ============================================================
   ENTRADA
   ============================================================ */
const teclas = {};
const TECLAS_JUEGO = [' ','z','arrowup','arrowdown','arrowleft','arrowright'];
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(TECLAS_JUEGO.indexOf(k) >= 0) e.preventDefault();
  if(!teclas[k]) AUDIO.activar();
  teclas[k] = true;
});
window.addEventListener('keyup', e=>{ teclas[e.key.toLowerCase()] = false; });

// Tomar el teclado: sin foco en el marco, las flechas y la barra no llegan.
const zonaJuego = document.getElementById('wrap');
const elClicTeclado = document.getElementById('clicTeclado');
function tomarTeclado(){
  try { window.focus(); } catch(e){}
  try { zonaJuego.focus({ preventScroll: true }); } catch(e){ zonaJuego.focus(); }
  revisarFoco();
}
function revisarFoco(){
  const ok = document.hasFocus();
  elClicTeclado.classList.toggle('visible', !ok);
}
document.addEventListener('pointerdown', tomarTeclado);
window.addEventListener('focus', revisarFoco);
window.addEventListener('blur', revisarFoco);
setInterval(revisarFoco, 700);
tomarTeclado();
setTimeout(tomarTeclado, 300);

// Palanca táctil
let palanca = { activa:false, dx:0, dy:0, id:null };
const elPalanca = document.getElementById('palanca');
const elPunto   = document.getElementById('palancaPunto');
function palancaDesde(t){
  const r = elPalanca.getBoundingClientRect();
  // el tablero puede estar escalado: normalizar contra el tamaño REAL en pantalla
  let dx = (t.clientX - (r.left + r.width/2)) / (r.width/2);
  let dy = (t.clientY - (r.top + r.height/2)) / (r.height/2);
  const m = Math.hypot(dx, dy);
  if(m > 1){ dx /= m; dy /= m; }
  palanca.dx = dx; palanca.dy = dy;
  elPunto.style.transform = 'translate(' + (dx*38) + 'px,' + (dy*38) + 'px)';
}
elPalanca.addEventListener('touchstart', e=>{ e.preventDefault(); AUDIO.activar();
  palanca.activa = true; palanca.id = e.changedTouches[0].identifier; palancaDesde(e.changedTouches[0]); });
elPalanca.addEventListener('touchmove', e=>{ e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier === palanca.id) palancaDesde(t); });
const soltarPalanca = e=>{ e.preventDefault(); palanca.activa=false; palanca.dx=0; palanca.dy=0;
  palanca.id=null; elPunto.style.transform = 'translate(0,0)'; };
elPalanca.addEventListener('touchend', soltarPalanca);
elPalanca.addEventListener('touchcancel', soltarPalanca);
elPalanca.addEventListener('mousedown', e=>{ AUDIO.activar(); palanca.activa=true; palancaDesde(e); });
window.addEventListener('mousemove', e=>{ if(palanca.activa) palancaDesde(e); });
window.addEventListener('mouseup', ()=>{ if(palanca.activa){ palanca.activa=false; palanca.dx=0; palanca.dy=0;
  elPunto.style.transform='translate(0,0)'; } });

function botonTactil(id, tecla){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); AUDIO.activar(); teclas[tecla] = true; };
  const off= e=>{ e.preventDefault(); teclas[tecla] = false; };
  el.addEventListener('touchstart', on); el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
}
botonTactil('btPatear', ' ');
botonTactil('btPase', 'z');

function ejeEntrada(){
  let dx = 0, dy = 0;
  if(teclas['arrowleft']||teclas['a'])  dx -= 1;
  if(teclas['arrowright']||teclas['d']) dx += 1;
  if(teclas['arrowup']||teclas['w'])    dy -= 1;
  if(teclas['arrowdown']||teclas['s'])  dy += 1;
  if(palanca.activa){ dx += palanca.dx; dy += palanca.dy; }
  const m = Math.hypot(dx, dy);
  if(m > 1){ dx /= m; dy /= m; }
  return { x: dx, y: dy, m: Math.min(1, m) };
}
const teclaPatear = ()=> !!teclas[' '];
const teclaPase   = ()=> !!teclas['z'];

/* ============================================================
   UTILIDADES
   ============================================================ */
const lim = (v,a,b)=> v<a?a:(v>b?b:v);
const dist = (a,b)=> Math.hypot(a.x-b.x, a.y-b.y);
function normalizar(x,y){ const m = Math.hypot(x,y)||1; return {x:x/m, y:y/m}; }
function arcoDe(eq){   // arco que DEFIENDE el equipo eq
  return { x: EQUIPOS[eq].dir === 1 ? CANCHA.x0 : CANCHA.x1, y: CANCHA.cy };
}
function arcoRival(eq){ return arcoDe(1-eq); }

/* ============================================================
   PELOTA
   ============================================================ */
// Parámetros del arquero, en un solo lugar para poder ajustarlos y medirlos
const ARQ = { alcance: 20, ruido: 44, estirada: 1.9, altoMax: 74, atajaHasta: 380*RITMO };
// El quite NO se deriva del radio del dibujo: si se ata al tamaño, agrandar
// al jugador para que se vea mejor cambia el balance del partido sin querer.
const QUITE = { alcance: 29, tiempo: 0.50 };
const VEL_DOMINABLE = 520*RITMO;   // por encima de esto la pelota no se domina de primera
const FRICCION_PISO = 0.86;    // por segundo
const GRAVEDAD = 900*RITMO*RITMO;

function soltarPelota(desde, dirx, diry, fuerza, altura){
  const n = normalizar(dirx, diry);
  pelota.dueno = null;
  pelota.cool = 0.22;              // no la puede recuperar el mismo al instante
  pelota.x = desde.x + n.x*(R_JUG + R_PEL + 1);
  pelota.y = desde.y + n.y*(R_JUG + R_PEL + 1);
  pelota.vx = n.x*fuerza;
  pelota.vy = n.y*fuerza;
  pelota.vz = altura || 0;
  pelota.ultimoToque = desde;
}

function actualizarPelota(dt){
  const b = pelota;
  if(b.cool > 0) b.cool -= dt;

  if(b.dueno){
    // Pegada al pie: se ubica adelante del jugador en la dirección que mira
    const p = b.dueno;
    const n = normalizar(Math.cos(p.mira), Math.sin(p.mira));
    b.x = p.x + n.x*(R_JUG + R_PEL - 1.5);
    b.y = p.y + n.y*(R_JUG + R_PEL - 1.5);
    b.vx = b.vy = 0; b.z = 0; b.vz = 0;
    b.giro += Math.hypot(p.vx, p.vy)*dt*0.05;
    return;
  }

  // vuelo
  b.z += b.vz*dt;
  if(b.z > 0) b.vz -= GRAVEDAD*dt;
  if(b.z <= 0){
    if(b.vz < -60*RITMO){ b.vz = -b.vz*0.42; AUDIO.rebote(); } else { b.vz = 0; }
    b.z = 0;
  }

  b.x += b.vx*dt;
  b.y += b.vy*dt;
  b.giro += Math.hypot(b.vx, b.vy)*dt*0.055;

  // rozamiento sólo cuando toca el piso
  if(b.z <= 0.6){
    const f = Math.pow(FRICCION_PISO, dt*RITMO);
    b.vx *= f; b.vy *= f;
    if(Math.hypot(b.vx, b.vy) < 6*RITMO){ b.vx = 0; b.vy = 0; }
  }

  estelaPelota.push({ x:b.x, y:b.y, z:b.z });
  if(estelaPelota.length > 14) estelaPelota.shift();

  bloquearPelota();
  rebotarPelota();
}

/* Choque de la pelota contra los jugadores.
   Sin esto, todo remate (que sale por el aire) atravesaba a los diez
   jugadores y al arquero: era imposible atajar y se hacían goles de a nueve. */
function bloquearPelota(){
  const b = pelota;
  if(b.dueno) return;
  const vel = Math.hypot(b.vx, b.vy);

  // Sólo se desvía lo que NO se puede dominar: pelotazos y pelota por el aire.
  // Desviando TODO lo que tocaba a alguien, ningún pase llegaba nunca a
  // destino: la pelota rebotaba entre los diez y se quedaba pegada al círculo
  // central el partido entero (0 remates en 90 s).
  const dominable = vel <= VEL_DOMINABLE && b.z <= 16;
  if(dominable || vel < 30*RITMO) return;

  for(const p of jugadores){
    if(p === b.ultimoToque && b.cool > 0.06) continue;
    if(p.aturdido > 0) continue;
    const esArq = p.rol === 'ARQ';
    // El arquero llega más alto y más lejos: es la estirada
    const altoMax = esArq ? ARQ.altoMax : 30;
    const radio   = esArq ? R_JUG + ARQ.alcance : R_JUG + 2.5;
    if(b.z > altoMax) continue;
    if(dist(p, b) > radio + R_PEL) continue;

    const n = normalizar(b.x - p.x, b.y - p.y);
    if(esArq){
      if(vel < ARQ.atajaHasta && b.z < 26){
        // la controla: la agarra
        b.dueno = p; b.vx = b.vy = 0; b.vz = 0; b.z = 0; b.cool = 0;
      } else {
        // manotazo: la saca hacia un costado y arriba
        const haciaAfuera = normalizar(n.x*1.6, n.y + (b.y < CANCHA.cy ? -0.9 : 0.9));
        b.vx = haciaAfuera.x*vel*0.42;
        b.vy = haciaAfuera.y*vel*0.42;
        b.vz = 120;
        b.cool = 0.18;
        b.ultimoToque = p;
      }
      AUDIO.atajada();
    } else {
      b.vx = n.x*vel*0.55; b.vy = n.y*vel*0.55;
      b.cool = 0.14;
      b.ultimoToque = p;
      AUDIO.rebote();
    }
    b.x = p.x + n.x*(radio + R_PEL + 1);
    b.y = p.y + n.y*(radio + R_PEL + 1);
    return;
  }
}

function rebotarPelota(){
  const b = pelota;
  // paredes de arriba y abajo
  if(b.y < CANCHA.y0 + R_PEL){ b.y = CANCHA.y0 + R_PEL; b.vy = -b.vy*0.72; AUDIO.rebote(); }
  if(b.y > CANCHA.y1 - R_PEL){ b.y = CANCHA.y1 - R_PEL; b.vy = -b.vy*0.72; AUDIO.rebote(); }

  const enBoca = b.y > ARCO_Y0 && b.y < ARCO_Y1;
  // izquierda
  if(b.x < CANCHA.x0 + R_PEL){
    if(enBoca && b.z < 62){
      if(b.x < CANCHA.x0 - 4){ gol(1); return; }     // gol del equipo que ataca a la izquierda
    } else {
      b.x = CANCHA.x0 + R_PEL; b.vx = -b.vx*0.72;
      AUDIO[enBoca ? 'palo' : 'rebote']();
    }
  }
  // derecha
  if(b.x > CANCHA.x1 - R_PEL){
    if(enBoca && b.z < 62){
      if(b.x > CANCHA.x1 + 4){ gol(0); return; }
    } else {
      b.x = CANCHA.x1 - R_PEL; b.vx = -b.vx*0.72;
      AUDIO[enBoca ? 'palo' : 'rebote']();
    }
  }
  // dentro de la red: frenar contra el fondo
  if(b.x < CANCHA.x0 - ARCO_FONDO + R_PEL){ b.x = CANCHA.x0 - ARCO_FONDO + R_PEL; b.vx = 0; }
  if(b.x > CANCHA.x1 + ARCO_FONDO - R_PEL){ b.x = CANCHA.x1 + ARCO_FONDO - R_PEL; b.vx = 0; }
}

/* ============================================================
   JUGADORES: posesión, choques, IA
   ============================================================ */
function intentarTomarPelota(dt){
  const b = pelota;
  if(b.dueno || b.cool > 0 || b.z > 16) return;
  let mejor = null, mejorD = 1e9;
  for(const p of jugadores){
    if(p.aturdido > 0) continue;
    const d = dist(p, b);
    if(d < R_JUG + R_PEL + 3 && d < mejorD){ mejor = p; mejorD = d; }
  }
  if(mejor){
    // Un pelotazo fuerte no se domina de primera: rebota y sigue
    const vel = Math.hypot(b.vx, b.vy);
    if(vel > VEL_DOMINABLE){
      const n = normalizar(b.vx, b.vy);
      b.vx = n.x*vel*0.32; b.vy = n.y*vel*0.32;
      b.cool = 0.12;
      return;
    }
    b.dueno = mejor;
    b.cool = 0;
  }
}

function separarJugadores(){
  for(let i=0;i<jugadores.length;i++){
    for(let j=i+1;j<jugadores.length;j++){
      const a = jugadores[i], b2 = jugadores[j];
      const dx = b2.x-a.x, dy = b2.y-a.y;
      const d = Math.hypot(dx,dy);
      const min = R_JUG*2;
      if(d > 0.001 && d < min){
        const e = (min-d)/2, n = { x:dx/d, y:dy/d };
        a.x -= n.x*e; a.y -= n.y*e;
        b2.x += n.x*e; b2.y += n.y*e;
      }
    }
  }
  for(const p of jugadores){
    p.x = lim(p.x, CANCHA.x0 + R_JUG, CANCHA.x1 - R_JUG);
    p.y = lim(p.y, CANCHA.y0 + R_JUG, CANCHA.y1 - R_JUG);
  }
}

// ¿Hay alguien tapando la línea entre dos puntos?
/* incluirFinal: al apuntar al arco hay que contar al arquero, que está
   justo en el extremo del segmento. Sin esto la línea SIEMPRE parecía
   libre y la IA remataba de cualquier lado. */
function lineaLibre(desde, hasta, equipoRival, margen, incluirFinal){
  const dx = hasta.x-desde.x, dy = hasta.y-desde.y;
  const largo = Math.hypot(dx,dy) || 1;
  const nx = dx/largo, ny = dy/largo;
  const corteFinal = incluirFinal ? largo + 22 : largo - 4;
  for(const p of jugadores){
    if(p.eq !== equipoRival) continue;
    const rx = p.x-desde.x, ry = p.y-desde.y;
    const t = rx*nx + ry*ny;
    if(t < 6 || t > corteFinal) continue;
    const perp = Math.abs(rx*ny - ry*nx);
    if(perp < (margen || R_JUG + 6)) return false;
  }
  return true;
}

function mejorPase(p){
  let mejor = null, mejorPuntaje = -1e9;
  const dirAtaque = EQUIPOS[p.eq].dir;
  for(const c of jugadores){
    if(c === p || c.eq !== p.eq || c.rol === 'ARQ') continue;
    const d = dist(p, c);
    if(d < 40 || d > 520) continue;
    // premiar los pases que ganan cancha y castigar los que van tapados
    let puntaje = (c.x - p.x)*dirAtaque*0.9 - d*0.18;
    if(!lineaLibre(p, c, 1-p.eq, R_JUG + 5)) puntaje -= 260;
    const rivalCerca = jugadores.reduce((m,o)=> o.eq!==p.eq ? Math.min(m, dist(o,c)) : m, 1e9);
    puntaje += Math.min(rivalCerca, 130)*0.55;
    if(puntaje > mejorPuntaje){ mejorPuntaje = puntaje; mejor = c; }
  }
  return mejor;
}

/* Buscar el HUECO del arco: el punto de la boca más lejos del arquero y con
   la línea despejada. Pedir la línea entera libre hasta el centro del arco
   hacía que casi nunca se rematara y los partidos terminaban 0 a 0. */
function mejorPuntoArco(p){
  const arco = arcoRival(p.eq);
  const arq = jugadores.find(o => o.eq !== p.eq && o.rol === 'ARQ');
  let mejor = { x: arco.x, y: CANCHA.cy }, mejorPunt = -1e9;
  for(let i=0;i<=8;i++){
    const y = ARCO_Y0 + 14 + (ARCO_ALTO-28)*(i/8);
    const destino = { x: arco.x, y };
    let punt = 0;
    if(arq) punt += Math.min(Math.hypot(arco.x - arq.x, y - arq.y), 150);
    else punt += 150;
    // los rivales de campo sí tapan; al arquero ya lo pesamos por distancia
    if(!lineaLibre(p, destino, 1-p.eq, R_JUG + 3, false)) punt -= 420;
    punt -= Math.abs(y - CANCHA.cy)*0.10;      // no buscar el palo justo
    if(punt > mejorPunt){ mejorPunt = punt; mejor = destino; }
  }
  return { punto: mejor, calidad: mejorPunt };
}

function patearAlArco(p, potencia, mira){
  const arco = arcoRival(p.eq);
  if(!mira) mira = mejorPuntoArco(p).punto;
  let ang = Math.atan2(mira.y - p.y, mira.x - p.x);
  // Puntería: cuanto más lejos y más fuerte, menos preciso. Sin esto todos
  // los remates iban al ángulo y el partido terminaba 9 a 0.
  const d = dist(p, arco);
  ang += (Math.random()-0.5)*(0.045 + potencia*0.075 + Math.min(d,420)/420*0.075);
  const n = { x: Math.cos(ang), y: Math.sin(ang) };
  const fuerza = (380 + potencia*400) * RITMO;
  soltarPelota(p, n.x, n.y, fuerza, (55 + potencia*140) * RITMO);
  AUDIO.patada(0.35 + potencia*0.65);
  p.mira = ang;
}

function pasarA(p, destino){
  if(!destino) return false;
  const n = normalizar(destino.x - p.x, destino.y - p.y);
  const d = dist(p, destino);
  soltarPelota(p, n.x, n.y, lim(d*1.65, 260, 560) * RITMO, 0);
  AUDIO.pase();
  p.mira = Math.atan2(n.y, n.x);
  return true;
}

/* --- IA de un jugador --- */
function iaJugador(p, dt){
  const b = pelota;
  const dirAtaque = EQUIPOS[p.eq].dir;
  const miArco = arcoDe(p.eq);
  let destino = null, correr = 1;

  if(p.rol === 'ARQ'){
    // Se anticipa: si viene un remate, va a DONDE VA A LLEGAR la pelota,
    // no a dónde está. Yendo a dónde está siempre llegaba tarde.
    let objetivoY = b.y;
    let remateEncima = false;
    if(!b.dueno && Math.abs(b.vx) > 80*RITMO && Math.sign(b.vx) === -dirAtaque){
      const t = (miArco.x - b.x)/b.vx;
      if(t > 0 && t < 1.5){
        // Lectura imperfecta a propósito: un arquero que adivina exacto
        // ataja todo y no se puede hacer un gol. El error crece con la
        // potencia del remate, que es lo que pasa de verdad.
        const vel = Math.hypot(b.vx, b.vy);
        objetivoY = b.y + b.vy*t + (p.ruidoArq || 0)*Math.min(vel/(700*RITMO), 1)*ARQ.ruido;
        remateEncima = true;
      }
    }
    if(!remateEncima) p.ruidoArq = (Math.random()-0.5)*2;
    const dy = lim(objetivoY, ARCO_Y0 + 4, ARCO_Y1 - 4);
    const distPel = dist(p, b);
    const salir = !remateEncima && distPel < 108 && (!b.dueno || b.dueno.eq !== p.eq);
    const avance = salir ? 52 : lim(50 - Math.abs(objetivoY - CANCHA.cy)*0.06, 12, 50);
    destino = { x: miArco.x + dirAtaque*avance, y: dy };
    correr = remateEncima ? ARQ.estirada : 1;      // estirada
    if(salir){ destino = { x: b.x, y: b.y }; correr = 1.25; }
    if(b.dueno === p){
      // despeja hacia adelante buscando compañero
      const c = mejorPase(p);
      if(c) pasarA(p, c);
      else {
        const n = normalizar(dirAtaque, (Math.random()-0.5)*0.7);
        soltarPelota(p, n.x, n.y, 480*RITMO, 120*RITMO);
        AUDIO.patada(0.6);
      }
    }
  }
  else if(b.dueno === p){
    const arco = arcoRival(p.eq);
    const dArco = dist(p, arco);
    const presionado = jugadores.some(o => o.eq !== p.eq && dist(o,p) < 34);
    const tiro = mejorPuntoArco(p);
    if(dArco < 350 && tiro.calidad > 32){
      patearAlArco(p, lim(1 - dArco/380, 0.25, 0.92), tiro.punto);
    } else if(presionado){
      const c = mejorPase(p);
      if(c && Math.random() < 0.9) pasarA(p, c);
      else destino = { x: arco.x, y: arco.y };
    } else {
      // conducir hacia el arco, abriéndose del rival más cercano
      destino = { x: arco.x, y: CANCHA.cy + (p.y - CANCHA.cy)*0.55 };
    }
  }
  else {
    const miEquipoTiene = b.dueno && b.dueno.eq === p.eq;
    // Se excluye al jugador que maneja la persona: si no, en TU equipo el más
    // cercano a la pelota siempre sos vos, ningún compañero sale a presionar
    // y el rival te ataca con uno de más todo el partido.
    const masCerca = jugadores
      .filter(o => o.eq === p.eq && o.rol !== 'ARQ' && o !== controlado)
      .sort((a,c)=> dist(a,b) - dist(c,b))[0];

    if(!miEquipoTiene && masCerca === p){
      destino = { x: b.x, y: b.y };            // el más cercano va a la pelota
      correr = 1.08;
    } else {
      // posición de formación, corrida según dónde está la pelota
      const fx = p.base.x, fy = p.base.y;
      const bx = (b.x - CANCHA.x0)/CANCHA.w;
      const by = (b.y - CANCHA.y0)/CANCHA.h;
      let tx = fx + (bx - 0.5)*(miEquipoTiene ? 0.46 : 0.34);
      let ty = fy + (by - 0.5)*0.42;
      if(miEquipoTiene && p.rol === 'DEL') tx += dirAtaque*0.06;
      destino = { x: CANCHA.x0 + lim(tx,0.03,0.97)*CANCHA.w,
                  y: CANCHA.y0 + lim(ty,0.03,0.97)*CANCHA.h };
      correr = 0.9;
    }
  }

  if(destino){
    const dx = destino.x - p.x, dy = destino.y - p.y;
    const d = Math.hypot(dx,dy);
    if(d > 4){
      const n = { x:dx/d, y:dy/d };
      const v = p.vel*correr*Math.min(1, d/26);
      p.vx = n.x*v; p.vy = n.y*v;
      p.mira = Math.atan2(n.y, n.x);
    } else { p.vx *= 0.6; p.vy *= 0.6; }
  }
}

/* --- Robar la pelota --- */
function disputar(dt){
  const b = pelota;
  if(!b.dueno) return;
  for(const p of jugadores){
    if(p.eq === b.dueno.eq || p.aturdido > 0) continue;
    const d = dist(p, b.dueno);
    if(d < QUITE.alcance){
      p.robando = (p.robando || 0) + dt*(p.barrida > 0 ? 3.2 : 1);
      if(p.robando > QUITE.tiempo){
        p.robando = 0;
        const perdedor = b.dueno;
        b.dueno = p;
        b.cool = 0.1;
        perdedor.aturdido = 0.28;
        AUDIO.atajada();
      }
    } else p.robando = 0;
  }
}

/* ============================================================
   CONTROL DEL JUGADOR HUMANO
   ============================================================ */
function elegirControlado(){
  // Con la pelota manda quien la tiene; sin ella, el más cercano
  if(pelota.dueno && pelota.dueno.eq === 0){ controlado = pelota.dueno; return; }
  const cand = jugadores.filter(p => p.eq === 0 && p.rol !== 'ARQ');
  cand.sort((a,b2)=> dist(a,pelota) - dist(b2,pelota));
  if(cand[0]) controlado = cand[0];
}

let pateoSoltado = false;
function actualizarHumano(dt){
  if(cambioBloqueo > 0) cambioBloqueo -= dt;
  if(!controlado || controlado.eq !== 0) elegirControlado();
  // si otro compañero agarró la pelota, pasar a manejarlo a él
  if(pelota.dueno && pelota.dueno.eq === 0 && pelota.dueno !== controlado) controlado = pelota.dueno;
  if(!pelota.dueno || pelota.dueno.eq !== 0){
    const cand = jugadores.filter(p => p.eq === 0 && p.rol !== 'ARQ')
                          .sort((a,b2)=> dist(a,pelota) - dist(b2,pelota));
    if(cand[0] && cand[0] !== controlado && dist(cand[0],pelota) < dist(controlado,pelota) - 44) controlado = cand[0];
  }

  const p = controlado;
  if(!p) return;
  const eje = ejeEntrada();

  if(p.aturdido <= 0){
    if(eje.m > 0.08){
      p.vx = eje.x*p.vel; p.vy = eje.y*p.vel;
      p.mira = Math.atan2(eje.y, eje.x);
    } else { p.vx *= 0.55; p.vy *= 0.55; }
  }

  const tengoPelota = pelota.dueno === p;

  if(tengoPelota){
    // Patear: se carga mientras se mantiene apretado
    if(teclaPatear()){
      cargando = true;
      cargaPatada = Math.min(1, cargaPatada + dt*1.5);
      pateoSoltado = false;
    } else if(cargando){
      patearAlArco(p, cargaPatada);
      cargando = false; cargaPatada = 0;
    }
    if(teclaPase() && !pateoSoltado){
      const c = mejorPase(p);
      if(pasarA(p, c)) pateoSoltado = true;
    }
    if(!teclaPase()) pateoSoltado = false;
  } else {
    cargando = false; cargaPatada = 0;
    // Sin la pelota: espacio = barrida, Z = cambiar de jugador
    if(teclaPatear() && p.barrida <= 0 && p.aturdido <= 0){
      p.barrida = 0.34;
      const n = normalizar(Math.cos(p.mira), Math.sin(p.mira));
      p.vx = n.x*p.vel*2.0; p.vy = n.y*p.vel*2.0;
    }
    if(teclaPase() && !pateoSoltado && cambioBloqueo <= 0){
      const cand = jugadores.filter(o => o.eq === 0 && o.rol !== 'ARQ' && o !== p)
                            .sort((a,b2)=> dist(a,pelota) - dist(b2,pelota));
      if(cand[0]){ controlado = cand[0]; cambioBloqueo = 0.3; }
      pateoSoltado = true;
    }
    if(!teclaPase()) pateoSoltado = false;
  }

  elBarraBg.style.opacity = (tengoPelota && cargaPatada > 0.02) ? '1' : '0';
  elBarra.style.width = Math.round(cargaPatada*100) + '%';
}

/* ============================================================
   GOL / RELOJ
   ============================================================ */
function gol(equipoQueConvirtio){
  if(!jugando) return;
  if(equipoQueConvirtio === 0) golesL++; else golesV++;
  elGolesL.textContent = golesL;
  elGolesV.textContent = golesV;
  ultimoGoleador = equipoQueConvirtio;
  jugando = false;
  tiempoDeGol = 2.6;
  sacudida = 16;
  AUDIO.gol();
  for(let i=0;i<70;i++) destellos.push({
    x: pelota.x, y: pelota.y, z: 10 + Math.random()*30,
    vx: (Math.random()-0.5)*440, vy: (Math.random()-0.5)*180,
    vz: 90 + Math.random()*190,
    vida: 0.7 + Math.random()*0.7,
    col: Math.random() < 0.5 ? EQUIPOS[equipoQueConvirtio].camiseta : '#f5c542'
  });
  mostrarAviso('¡GOL!', EQUIPOS[equipoQueConvirtio].nombre);
}

function mostrarAviso(grande, chico, seg){
  elAvisoG.textContent = grande;
  elAvisoC.textContent = chico || '';
  elAviso.style.display = 'flex';
  avisoTimer = seg || 0;
}
function ocultarAviso(){ elAviso.style.display = 'none'; }

function terminarPartido(){
  terminado = true; jugando = false;
  AUDIO.silbatoFinal();
  const gano = golesL > golesV, empate = golesL === golesV;
  const titulo = empate ? 'EMPATE' : (gano ? '¡GANASTE!' : 'PERDISTE');
  const color  = empate ? '#cfd6e2' : (gano ? '#8be36b' : '#e8443a');
  elFinal.innerHTML =
    '<div style="font-size:44px;font-weight:700;letter-spacing:4px;color:' + color + '">' + titulo + '</div>' +
    '<div style="display:flex;align-items:center;gap:22px;margin:16px 0 4px">' +
      '<span style="font-size:20px;letter-spacing:2px;color:#cfd6e2">POTRERO</span>' +
      '<span style="font-size:62px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums">' +
        golesL + ' - ' + golesV + '</span>' +
      '<span style="font-size:20px;letter-spacing:2px;color:#cfd6e2">BARRIO</span>' +
    '</div>' +
    '<button id="btRevancha">JUGAR DE NUEVO</button>';
  elFinal.style.display = 'flex';
  document.getElementById('btRevancha').addEventListener('click', reiniciar);
  ocultarAviso();
}

function reiniciar(){
  golesL = 0; golesV = 0; reloj = 0; terminado = false;
  elGolesL.textContent = '0'; elGolesV.textContent = '0';
  elFinal.style.display = 'none';
  destellos = []; sacudida = 0; cargaPatada = 0; cargando = false;
  posicionarSaque(1);
  arrancarSaque('¡A JUGAR!', '');
}

let cuentaSaque = 0;
function arrancarSaque(grande, chico){
  mostrarAviso(grande, chico);
  cuentaSaque = 1.5;
  jugando = false;
}

/* ============================================================
   BUCLE
   ============================================================ */
function actualizar(dt){
  if(terminado) return;

  if(cuentaSaque > 0){
    cuentaSaque -= dt;
    if(cuentaSaque <= 0){ ocultarAviso(); jugando = true; AUDIO.silbato(); }
    return;
  }
  if(tiempoDeGol > 0){
    tiempoDeGol -= dt;
    if(tiempoDeGol <= 0){
      posicionarSaque(1 - ultimoGoleador);   // saca el que recibió el gol
      arrancarSaque('SAQUE', EQUIPOS[1-ultimoGoleador].nombre);
    }
    return;
  }
  if(!jugando) return;

  reloj += dt;
  if(reloj >= DURACION){ reloj = DURACION; terminarPartido(); return; }
  elReloj.textContent = Math.floor(reloj/DURACION*90) + "'";

  for(const p of jugadores){
    if(p.aturdido > 0) p.aturdido -= dt;
    if(p.barrida > 0){
      p.barrida -= dt;
      p.vx *= 0.93; p.vy *= 0.93;
      if(p.barrida <= 0) p.aturdido = Math.max(p.aturdido, 0.22);
    } else if(p !== controlado){
      iaJugador(p, dt);
    } else if(p.aturdido > 0){
      p.vx *= 0.85; p.vy *= 0.85;
    }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.paso += Math.hypot(p.vx,p.vy)*dt*0.06;
  }

  actualizarHumano(dt);
  separarJugadores();
  disputar(dt);
  actualizarPelota(dt);
  intentarTomarPelota(dt);

  // ambiente: sube cuando la pelota se acerca a un arco
  const cercaArco = 1 - Math.min(1, Math.abs(pelota.x - CANCHA.cx)/(CANCHA.w/2));
  AUDIO.tension(1 - cercaArco);

  for(let i=destellos.length-1;i>=0;i--){
    const d = destellos[i];
    d.x += d.vx*dt; d.y += d.vy*dt; d.z += (d.vz||0)*dt;
    d.vz = (d.vz||0) - 420*dt;
    if(d.z < 0){ d.z = 0; d.vz = -(d.vz||0)*0.35; }
    d.vx *= 0.94; d.vy *= 0.94;
    d.vida -= dt;
    if(d.vida <= 0) destellos.splice(i,1);
  }
  if(sacudida > 0) sacudida = Math.max(0, sacudida - dt*30);
}

/* ============================================================
   DIBUJO
   ============================================================ */
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);     c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
// Azar con semilla: la tribuna tiene que verse igual en cada partida
function azar(semilla){
  let z = semilla;
  return ()=> (z = (z*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
}

/* ============================================================
   CÁMARA DE COSTADO, CON PERSPECTIVA
   La simulación sigue siendo la misma en el plano de la cancha; lo único
   que cambia es cómo se proyecta. Así el balance ya medido no se toca.
   ============================================================ */
const CAM = {
  dist: 340,      // cuánto atrás de la línea de banda cercana está la cámara
  alto: 400,      // y cuánto por encima del piso
  yCerca: 716,    // en qué fila de pantalla cae la línea de banda cercana
  yLejos: 180,    // y la lejana
  x: CANCHA.cx, objetivo: CANCHA.cx
};
// La distancia focal y el horizonte salen de esas dos filas: así se encuadra
// con números que se entienden en vez de a prueba y error.
(function(){
  const dCerca = CAM.dist, dLejos = CAM.dist + CANCHA.h;
  CAM.focal = (CAM.yCerca - CAM.yLejos) / (CAM.alto*(1/dCerca - 1/dLejos));
  CAM.horiz = CAM.yLejos - CAM.alto*CAM.focal/dLejos;
})();
const ALTURA_JUG = 46;        // alto de un jugador en unidades de cancha
const ALTURA_ARCO = 62;       // coincide con el tope de altura que ya vale gol

function proj(wx, wy, wz){
  const d = wy - (CANCHA.y0 - CAM.dist);
  const s = CAM.focal / d;
  return { x: W/2 + (wx - CAM.x)*s, y: CAM.horiz + (CAM.alto - (wz||0))*s, s };
}

function moverCamara(dt){
  const foco = pelota.dueno ? pelota.dueno : pelota;
  CAM.objetivo = lim(foco.x, CANCHA.x0 + 40, CANCHA.x1 - 40);
  CAM.x += (CAM.objetivo - CAM.x) * Math.min(1, dt*2.6);
}

/* Una línea de cal en el piso: se proyectan los dos extremos y el ancho
   se achica con la distancia, si no las líneas del fondo se ven gordas. */
function lineaCal(ax, ay, bx, by, anchoMundo, color){
  const A = proj(ax, ay, 0), B = proj(bx, by, 0);
  const wA = anchoMundo*A.s/2, wB = anchoMundo*B.s/2;
  const dx = B.x-A.x, dy = B.y-A.y, L = Math.hypot(dx,dy) || 1;
  const nx = -dy/L, ny = dx/L;
  ctx.fillStyle = color || 'rgba(248,252,255,0.92)';
  ctx.beginPath();
  ctx.moveTo(A.x+nx*wA, A.y+ny*wA);
  ctx.lineTo(B.x+nx*wB, B.y+ny*wB);
  ctx.lineTo(B.x-nx*wB, B.y-ny*wB);
  ctx.lineTo(A.x-nx*wA, A.y-ny*wA);
  ctx.closePath(); ctx.fill();
}
function arcoCal(cxm, cym, radio, desde, hasta, pasos, ancho){
  const n = pasos || 40;
  for(let i=0;i<n;i++){
    const a0 = desde + (hasta-desde)*(i/n), a1 = desde + (hasta-desde)*((i+1)/n);
    lineaCal(cxm + Math.cos(a0)*radio, cym + Math.sin(a0)*radio,
             cxm + Math.cos(a1)*radio, cym + Math.sin(a1)*radio, ancho || 3.2);
  }
}

/* ---------- Tribuna del fondo, pre-renderizada y con parallax ---------- */
let TRIBUNA = null;
const TRIB_W = 2600, TRIB_H = 320;
function construirTribuna(){
  const c2 = document.createElement('canvas');
  c2.width = TRIB_W; c2.height = TRIB_H;
  const g = c2.getContext('2d');
  const rnd = azar(77123);

  // estructura
  const gg = g.createLinearGradient(0,0,0,TRIB_H);
  gg.addColorStop(0,'#0a0d13'); gg.addColorStop(0.30,'#141a23');
  gg.addColorStop(1,'#1d242f');
  g.fillStyle = gg; g.fillRect(0,0,TRIB_W,TRIB_H);

  // techo con vigas
  g.fillStyle = '#0b0e14'; g.fillRect(0,0,TRIB_W,72);
  g.fillStyle = 'rgba(120,140,170,0.10)';
  for(let x=0;x<TRIB_W;x+=48) g.fillRect(x, 0, 5, 72);
  g.fillStyle = 'rgba(180,200,230,0.14)'; g.fillRect(0,68,TRIB_W,3);

  // reflectores colgados del techo
  for(let x=120;x<TRIB_W;x+=340){
    const halo = g.createRadialGradient(x,74,3,x,74,120);
    halo.addColorStop(0,'rgba(255,252,232,0.75)');
    halo.addColorStop(0.20,'rgba(255,248,205,0.22)');
    halo.addColorStop(1,'rgba(255,248,205,0)');
    g.fillStyle = halo; g.beginPath(); g.arc(x,74,120,0,Math.PI*2); g.fill();
    g.fillStyle = '#2b323c'; g.fillRect(x-26,62,52,14);
    g.fillStyle = 'rgba(255,252,230,0.9)';
    for(let i=0;i<4;i++) g.fillRect(x-22+i*11, 65, 8, 8);
  }

  // gente: filas que suben, más apretadas y oscuras arriba
  const FILAS = 26;
  for(let f=0; f<FILAS; f++){
    const t = f/FILAS;                       // 0 = arriba (lejos)
    const y = 82 + t*(TRIB_H-96);
    const paso = 9 + t*5;
    const rad = 2.1 + t*1.9;
    for(let x=-10; x<TRIB_W+10; x+=paso){
      if(rnd() < 0.10) continue;
      const r2 = rnd();
      const sector = Math.floor((x/TRIB_W)*6);
      let col;
      if(r2 < 0.16) col = (sector%2===0) ? '#2c5f92' : '#8e3129';
      else col = ['#39404b','#454d5a','#2e353f','#515a68','#3c434f'][(f*3+Math.floor(x/paso))%5];
      g.globalAlpha = (0.30 + t*0.55)*(0.6 + rnd()*0.4);
      g.fillStyle = col;
      g.beginPath(); g.arc(x + rnd()*3, y + rnd()*2, rad, 0, Math.PI*2); g.fill();
      // cabeza más clara
      if(rnd() < 0.5){
        g.globalAlpha *= 0.8;
        g.fillStyle = ['#c9a184','#8a6247','#e0bd9c','#6d4a34'][(Math.floor(x/paso)+f)%4];
        g.beginPath(); g.arc(x + rnd()*3, y - rad*0.9, rad*0.55, 0, Math.PI*2); g.fill();
      }
    }
  }
  g.globalAlpha = 1;

  // baranda y publicidad al pie de la tribuna
  g.fillStyle = '#10151d'; g.fillRect(0, TRIB_H-30, TRIB_W, 30);
  const LEMAS = ['POTRERO','· RK ·','BARRIO','FÚTBOL','· 5 ·','PICADO'];
  for(let i=0; i*190 < TRIB_W; i++){
    const px = i*190;
    const base = ['#152134','#1d2733','#2b1517','#1a2c1f'][i%4];
    const pg = g.createLinearGradient(px, TRIB_H-30, px, TRIB_H);
    pg.addColorStop(0, base); pg.addColorStop(1,'#0a0e15');
    g.fillStyle = pg; g.fillRect(px, TRIB_H-30, 188, 30);
    g.fillStyle = ['#f5c542','#e8eef7','#4da3ff','#e8443a'][i%4];
    g.font = '700 17px Oswald, Arial Narrow, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(LEMAS[i%LEMAS.length], px+94, TRIB_H-15);
  }
  return c2;
}

/* ---------- Vallas de publicidad, paradas en el fondo ---------- */
function dibujarVallas(wy, altura){
  const { x0, x1 } = CANCHA;
  const COLS = ['#152134','#1d2733','#2b1517','#1a2c1f'];
  const ACC  = ['#f5c542','#e8eef7','#4da3ff','#e8443a'];
  const n = 18, paso = (x1-x0+180)/n;
  for(let i=0;i<n;i++){
    const a = x0 - 90 + i*paso, b = a + paso - 3;
    const p1 = proj(a, wy, 0), p2 = proj(b, wy, 0);
    const p3 = proj(b, wy, altura), p4 = proj(a, wy, altura);
    if(p2.x < -40 || p1.x > W+40) continue;
    ctx.fillStyle = COLS[i%4];
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y);
    ctx.closePath(); ctx.fill();
    // franja de color arriba: a esta escala el texto no se leería
    const h = Math.abs(p4.y - p1.y);
    ctx.fillStyle = ACC[i%4];
    ctx.globalAlpha = 0.75;
    ctx.fillRect(Math.min(p1.x,p4.x), p4.y, Math.abs(p2.x-p1.x), Math.max(1.5, h*0.22));
    ctx.globalAlpha = 1;
  }
}

/* ---------- La cancha, dibujada en perspectiva cada cuadro ---------- */
function dibujarCancha(){
  const { x0, y0, x1, y1, cx, cy } = CANCHA;

  ctx.fillStyle = '#070a0f';
  ctx.fillRect(0, 0, W, H);

  // tribuna del fondo, corrida con parallax al mover la cámara
  if(!TRIBUNA) TRIBUNA = construirTribuna();
  const parY = CAM.yLejos - TRIB_H + 4;
  let off = (-(CAM.x - CANCHA.cx)*0.38) % TRIB_W;
  if(off > 0) off -= TRIB_W;
  for(let x = off; x < W; x += TRIB_W) ctx.drawImage(TRIBUNA, x, parY);

  // perímetro: sin esto quedaba un borde negro duro entre tribuna y cancha
  const yPer = proj(cx, y1 + 60, 0).y;
  ctx.fillStyle = '#25583a';
  ctx.fillRect(0, yPer - 2, W, H - yPer + 2);

  // vallas paradas, detrás de la línea de banda lejana
  dibujarVallas(y1 + 46, 26);

  // ---- césped ----
  const A = proj(x0, y1, 0), B = proj(x1, y1, 0), C = proj(x1, y0, 0), D = proj(x0, y0, 0);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y); ctx.lineTo(D.x,D.y);
  ctx.closePath();
  ctx.clip();

  const gg = ctx.createLinearGradient(0, A.y, 0, D.y);
  gg.addColorStop(0, '#357c4b'); gg.addColorStop(0.40, '#3d9157');
  gg.addColorStop(1, '#47a462');
  ctx.fillStyle = gg;
  ctx.fillRect(0, A.y - 4, W, D.y - A.y + 8);

  // franjas de corte, a lo largo de la cancha
  const FR = 14, fw = (x1-x0)/FR;
  for(let i=0;i<FR;i+=2){
    const a = proj(x0+i*fw, y1, 0), b = proj(x0+(i+1)*fw, y1, 0);
    const c = proj(x0+(i+1)*fw, y0, 0), d = proj(x0+i*fw, y0, 0);
    ctx.fillStyle = 'rgba(255,255,255,0.075)';
    ctx.beginPath();
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y);
    ctx.closePath(); ctx.fill();
  }
  // grano por bandas de profundidad
  for(let i=0;i<50;i++){
    const wyA = y0 + (y1-y0)*(i/50), wyB = y0 + (y1-y0)*((i+1)/50);
    const pa = proj(x0, wyA, 0), pb = proj(x0, wyB, 0);
    ctx.fillStyle = i%2 ? 'rgba(0,0,0,0.035)' : 'rgba(200,240,200,0.026)';
    ctx.fillRect(0, pb.y, W, Math.max(1, pa.y - pb.y));
  }
  // zonas peladas frente a los arcos
  [x0+52, x1-52].forEach(px=>{
    const p = proj(px, cy, 0);
    const rg = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 150*p.s);
    rg.addColorStop(0,'rgba(132,110,66,0.30)');
    rg.addColorStop(1,'rgba(132,110,66,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, 150*p.s, 60*p.s, 0, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();

  // ---- líneas ----
  lineaCal(x0, y0, x1, y0, 4.5);
  lineaCal(x0, y1, x1, y1, 4.5);
  lineaCal(x0, y0, x0, y1, 4.5);
  lineaCal(x1, y0, x1, y1, 4.5);
  lineaCal(cx, y0, cx, y1, 4);
  arcoCal(cx, cy, CIRCULO_R, 0, Math.PI*2, 44, 3.6);
  [0,1].forEach(lado=>{
    const izq = lado === 0;
    const ax = izq ? x0 : x1, sg = izq ? 1 : -1;
    lineaCal(ax, cy-AREA_ALTO/2, ax + sg*AREA_ANCHO, cy-AREA_ALTO/2, 3.6);
    lineaCal(ax, cy+AREA_ALTO/2, ax + sg*AREA_ANCHO, cy+AREA_ALTO/2, 3.6);
    lineaCal(ax + sg*AREA_ANCHO, cy-AREA_ALTO/2, ax + sg*AREA_ANCHO, cy+AREA_ALTO/2, 3.6);
    const aw = AREA_ANCHO*0.42, ah = AREA_ALTO*0.46;
    lineaCal(ax, cy-ah/2, ax + sg*aw, cy-ah/2, 3);
    lineaCal(ax, cy+ah/2, ax + sg*aw, cy+ah/2, 3);
    lineaCal(ax + sg*aw, cy-ah/2, ax + sg*aw, cy+ah/2, 3);
    const pp = proj(ax + sg*AREA_ANCHO*0.72, cy, 0);
    ctx.fillStyle = 'rgba(248,252,255,0.92)';
    ctx.beginPath(); ctx.ellipse(pp.x, pp.y, 4*pp.s, 2*pp.s, 0, 0, Math.PI*2); ctx.fill();
  });
  const pc = proj(cx, cy, 0);
  ctx.fillStyle = 'rgba(248,252,255,0.92)';
  ctx.beginPath(); ctx.ellipse(pc.x, pc.y, 4.5*pc.s, 2.2*pc.s, 0, 0, Math.PI*2); ctx.fill();
}

/* ---------- Arcos en 3D ---------- */
function dibujarArco(lado, delante){
  const izq = lado === 0;
  const xl = izq ? CANCHA.x0 : CANCHA.x1;
  const s = izq ? -1 : 1;
  const xf = xl + s*ARCO_FONDO;
  const A = ARCO_Y0, B = ARCO_Y1;
  // el poste cercano va DELANTE de los jugadores, el lejano detrás
  const yPoste = delante ? A : B;

  if(!delante){
    // red: paño del fondo y los dos laterales
    const p1 = proj(xf, A, 0), p2 = proj(xf, B, 0);
    const p3 = proj(xf, B, ALTURA_ARCO), p4 = proj(xf, A, ALTURA_ARCO);
    ctx.fillStyle = 'rgba(12,18,26,0.42)';
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(228,240,255,0.30)'; ctx.lineWidth = 1;
    for(let i=0;i<=9;i++){
      const wy = A + (B-A)*(i/9);
      const a = proj(xf, wy, 0), b = proj(xf, wy, ALTURA_ARCO);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    for(let i=0;i<=6;i++){
      const wz = ALTURA_ARCO*(i/6);
      const a = proj(xf, A, wz), b = proj(xf, B, wz);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    // travesaño y poste lejano
    const c1 = proj(xl, B, ALTURA_ARCO), c2 = proj(xl, A, ALTURA_ARCO);
    ctx.strokeStyle = '#f2f6fb'; ctx.lineWidth = Math.max(2, 5*proj(xl,(A+B)/2,0).s);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y); ctx.stroke();
  }

  const base = proj(xl, yPoste, 0), alto = proj(xl, yPoste, ALTURA_ARCO);
  ctx.strokeStyle = delante ? '#ffffff' : '#e6ecf4';
  ctx.lineWidth = Math.max(2.5, 6*base.s);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(base.x,base.y); ctx.lineTo(alto.x,alto.y); ctx.stroke();
}

/* ============================================================
   JUGADORES DE COSTADO
   Sprites parados, pre-renderizados en cuatro orientaciones y varios
   cuadros de carrera. En el bucle sólo se pega la imagen escalada.
   ============================================================ */
const PIELES = ['#e8b98f','#c98d5f','#8d5a34','#f0cfae','#a9703f'];
const PELOS  = ['#2a1d14','#12100e','#5b3a1e','#1c1712','#3d2a18'];
const CUADROS = 8;
const SPR_W = 88, SPR_H = 132;          // se dibuja grande y se achica al pegarlo
const spritesJ = new Map();

function construirSprite(eqI, esArq, num, dir, ciclo){
  const c2 = document.createElement('canvas');
  c2.width = SPR_W; c2.height = SPR_H;
  const g = c2.getContext('2d');
  const eq = EQUIPOS[eqI];
  const camiseta = esArq ? eq.arquero : eq.camiseta;
  const oscuro   = esArq ? '#b8902a' : eq.franja;
  const piel = PIELES[(num*2 + eqI) % PIELES.length];
  const pelo = PELOS[(num + eqI*3) % PELOS.length];
  const perfil = (dir === 'der' || dir === 'izq');
  const deFrente = dir === 'frente';

  const cx = SPR_W/2, piso = SPR_H - 4;
  const anchoTorso = perfil ? 20 : 27;

  // --- piernas ---
  const sep = perfil ? 0 : 11;
  [[-1, ciclo],[1, -ciclo]].forEach(([lado, fase])=>{
    const px = cx + lado*sep + (perfil ? fase*15 : 0);
    const pxPie = px + (perfil ? fase*9 : 0);
    const alturaRod = piso - 28;
    g.strokeStyle = piel; g.lineWidth = 9; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(cx + lado*sep*0.7, piso - 52);
    g.lineTo(px, alturaRod);
    g.lineTo(pxPie, piso - 5 - Math.max(0, fase*(perfil?6:3)));
    g.stroke();
    // medias
    g.strokeStyle = eq.short === '#12233a' ? '#e8eef7' : '#f0f3f8';
    g.lineWidth = 9;
    g.beginPath();
    g.moveTo(px, alturaRod); g.lineTo(pxPie, piso - 5 - Math.max(0, fase*(perfil?6:3)));
    g.stroke();
    // botín
    g.fillStyle = '#14171c';
    g.beginPath();
    g.ellipse(pxPie + (perfil ? (dir==='der'?4:-4) : 0), piso - 3 - Math.max(0, fase*(perfil?6:3)),
              7, 4, 0, 0, Math.PI*2);
    g.fill();
  });

  // --- short ---
  g.fillStyle = eq.short;
  g.beginPath();
  g.moveTo(cx - anchoTorso/2 - 1, piso - 62);
  g.lineTo(cx + anchoTorso/2 + 1, piso - 62);
  g.lineTo(cx + anchoTorso/2 + 3, piso - 44);
  g.lineTo(cx - anchoTorso/2 - 3, piso - 44);
  g.closePath(); g.fill();

  // --- brazos, detrás del torso ---
  [[-1, -ciclo],[1, ciclo]].forEach(([lado, fase])=>{
    const hx = cx + lado*(anchoTorso/2 + 2);
    g.strokeStyle = camiseta; g.lineWidth = 8; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(hx, piso - 96);
    g.lineTo(hx + lado*4 + (perfil ? fase*10 : 0), piso - 82);
    g.stroke();
    g.strokeStyle = piel; g.lineWidth = 7;
    g.beginPath();
    g.moveTo(hx + lado*4 + (perfil ? fase*10 : 0), piso - 82);
    g.lineTo(hx + lado*6 + (perfil ? fase*15 : 0), piso - 66);
    g.stroke();
    if(esArq){
      g.fillStyle = '#f2f6fb';
      g.beginPath();
      g.arc(hx + lado*6 + (perfil ? fase*15 : 0), piso - 64, 5.5, 0, Math.PI*2);
      g.fill();
    }
  });

  // --- torso ---
  const gt = g.createLinearGradient(cx - anchoTorso/2, 0, cx + anchoTorso/2, 0);
  gt.addColorStop(0, oscuro); gt.addColorStop(0.45, camiseta); gt.addColorStop(1, oscuro);
  g.fillStyle = gt;
  g.beginPath();
  g.moveTo(cx - anchoTorso/2, piso - 100);
  g.lineTo(cx + anchoTorso/2, piso - 100);
  g.lineTo(cx + anchoTorso/2 + 2, piso - 60);
  g.lineTo(cx - anchoTorso/2 - 2, piso - 60);
  g.closePath(); g.fill();

  // franjas verticales, sólo de frente o de espaldas
  if(!perfil && !esArq){
    g.save();
    g.beginPath();
    g.moveTo(cx - anchoTorso/2, piso - 100); g.lineTo(cx + anchoTorso/2, piso - 100);
    g.lineTo(cx + anchoTorso/2 + 2, piso - 60); g.lineTo(cx - anchoTorso/2 - 2, piso - 60);
    g.closePath(); g.clip();
    g.fillStyle = 'rgba(255,255,255,0.32)';
    [-0.28, 0.28].forEach(d=> g.fillRect(cx + d*anchoTorso - 3, piso - 102, 6, 44));
    g.restore();
  }
  // sombra bajo el pecho, da volumen
  g.fillStyle = 'rgba(0,0,0,0.16)';
  g.fillRect(cx - anchoTorso/2, piso - 70, anchoTorso, 10);

  // número, sólo cuando se ve la espalda
  if(dir === 'espalda'){
    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 2.5;
    g.font = '700 22px Oswald, Arial Narrow, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.strokeText(num, cx, piso - 84); g.fillText(num, cx, piso - 84);
  }

  // --- cabeza ---
  const hy = piso - 112;
  g.fillStyle = piel;
  g.beginPath(); g.ellipse(cx, hy, 10, 11.5, 0, 0, Math.PI*2); g.fill();
  // cuello
  g.fillStyle = 'rgba(0,0,0,0.18)';
  g.fillRect(cx - 5, hy + 8, 10, 6);
  // pelo
  g.fillStyle = pelo;
  if(deFrente){
    g.beginPath(); g.arc(cx, hy - 1, 10.4, Math.PI, 0); g.fill();
    g.fillRect(cx - 10.4, hy - 2, 20.8, 3);
    // cara
    g.fillStyle = 'rgba(28,22,18,0.85)';
    g.beginPath(); g.ellipse(cx - 3.6, hy + 1, 1.5, 1.9, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(cx + 3.6, hy + 1, 1.5, 1.9, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = 'rgba(120,60,50,0.55)';
    g.beginPath(); g.ellipse(cx, hy + 6, 3, 1.4, 0, 0, Math.PI*2); g.fill();
  } else if(dir === 'espalda'){
    g.beginPath(); g.arc(cx, hy, 10.4, 0, Math.PI*2); g.fill();
    g.fillStyle = piel;
    g.beginPath(); g.ellipse(cx, hy + 7, 6, 4, 0, 0, Math.PI*2); g.fill();
  } else {
    const sgn = dir === 'der' ? 1 : -1;
    g.beginPath(); g.arc(cx, hy - 1, 10.4, Math.PI, 0); g.fill();
    g.beginPath(); g.arc(cx - sgn*4, hy, 10.4, Math.PI*0.4, Math.PI*1.6); g.fill();
    // nariz
    g.fillStyle = piel;
    g.beginPath();
    g.moveTo(cx + sgn*9, hy - 1); g.lineTo(cx + sgn*13, hy + 2); g.lineTo(cx + sgn*9, hy + 4);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(28,22,18,0.85)';
    g.beginPath(); g.ellipse(cx + sgn*5, hy + 1, 1.4, 1.8, 0, 0, Math.PI*2); g.fill();
  }

  return c2;
}

function dirDe(p){
  const dx = Math.cos(p.mira), dy = Math.sin(p.mira);
  if(Math.abs(dy) > Math.abs(dx)) return dy > 0 ? 'espalda' : 'frente';
  return dx > 0 ? 'der' : 'izq';
}
function spriteDe(p, dir, cuadro){
  const esArq = p.rol === 'ARQ';
  const clave = p.eq + '|' + (esArq?'a':'j') + '|' + p.num + '|' + dir + '|' + cuadro;
  let spr = spritesJ.get(clave);
  if(!spr){
    const ciclo = cuadro === CUADROS ? 0 : Math.sin(cuadro/CUADROS*Math.PI*2);
    spr = construirSprite(p.eq, esArq, p.num, dir, ciclo);
    spritesJ.set(clave, spr);
  }
  return spr;
}

function dibujarJugador(p){
  const suelo = proj(p.x, p.y, 0);
  const s = suelo.s;
  const corriendo = Math.hypot(p.vx, p.vy) > 12;
  const fase = p.paso*2.2;
  const cuadro = corriendo
    ? ((Math.floor(fase/(Math.PI*2)*CUADROS) % CUADROS) + CUADROS) % CUADROS
    : CUADROS;

  // sombra en el piso
  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  ctx.beginPath();
  ctx.ellipse(suelo.x + 3*s, suelo.y, 15*s, 6*s, 0, 0, Math.PI*2);
  ctx.fill();

  if(p === controlado){
    ctx.strokeStyle = 'rgba(245,197,66,0.95)'; ctx.lineWidth = Math.max(1.5, 2.4*s);
    ctx.beginPath(); ctx.ellipse(suelo.x, suelo.y, 19*s, 8*s, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(245,197,66,0.18)'; ctx.fill();
    // flecha arriba de la cabeza
    const top = suelo.y - ALTURA_JUG*s - 12*s;
    ctx.fillStyle = 'rgba(245,197,66,0.95)';
    ctx.beginPath();
    ctx.moveTo(suelo.x, top + 9*s);
    ctx.lineTo(suelo.x - 6*s, top);
    ctx.lineTo(suelo.x + 6*s, top);
    ctx.closePath(); ctx.fill();
  }

  const dir = dirDe(p);
  const spr = spriteDe(p, dir, cuadro);
  const h = ALTURA_JUG*s*1.06;
  const w = h*(SPR_W/SPR_H);
  const rebote = corriendo ? Math.abs(Math.sin(fase))*1.6*s : 0;
  ctx.drawImage(spr, suelo.x - w/2, suelo.y - h - rebote, w, h);

  if(p.barrida > 0){
    ctx.fillStyle = 'rgba(220,232,214,0.34)';
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.ellipse(suelo.x - Math.cos(p.mira)*i*7*s + (Math.random()-0.5)*10*s,
                  suelo.y + (Math.random()-0.5)*5*s, (5-i)*s, (2.6-i*0.4)*s, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

/* ---------- Pelota ---------- */
function dibujarPelota(){
  const b = pelota;
  const suelo = proj(b.x, b.y, 0);
  const aire  = proj(b.x, b.y, b.z);
  const r = Math.max(2, R_PEL*aire.s*1.35);

  // sombra: se achica y aclara con la altura
  const k = Math.min(1, b.z/160);
  ctx.fillStyle = 'rgba(0,0,0,' + (0.36 - k*0.20) + ')';
  ctx.beginPath();
  ctx.ellipse(suelo.x + 2*suelo.s, suelo.y, r*(1.05 - k*0.25), r*0.42*(1.05 - k*0.25), 0, 0, Math.PI*2);
  ctx.fill();

  const gg = ctx.createRadialGradient(aire.x - r*0.36, aire.y - r*0.42, r*0.05, aire.x, aire.y, r);
  gg.addColorStop(0,'#ffffff'); gg.addColorStop(0.55,'#f2f5f9');
  gg.addColorStop(0.86,'#cdd5df'); gg.addColorStop(1,'#98a3b0');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(aire.x, aire.y, r, 0, Math.PI*2); ctx.fill();

  if(r > 4){
    ctx.save();
    ctx.beginPath(); ctx.arc(aire.x, aire.y, r, 0, Math.PI*2); ctx.clip();
    ctx.translate(aire.x, aire.y); ctx.rotate(b.giro*0.5);
    ctx.fillStyle = 'rgba(26,32,42,0.88)';
    const pent = (px,py,rad,rot)=>{
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a = rot + i*Math.PI*2/5 - Math.PI/2;
        const vx = px + Math.cos(a)*rad, vy = py + Math.sin(a)*rad;
        if(i===0) ctx.moveTo(vx,vy); else ctx.lineTo(vx,vy);
      }
      ctx.closePath(); ctx.fill();
    };
    pent(-r*0.16, -r*0.10, r*0.34, 0.3);
    for(let i=0;i<5;i++){
      const a = b.giro*0.22 + i*Math.PI*2/5;
      pent(Math.cos(a)*r*0.92, Math.sin(a)*r*0.92, r*0.30, a);
    }
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(24,30,40,0.35)'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.arc(aire.x, aire.y, r, 0, Math.PI*2); ctx.stroke();
}

/* ---------- Radar: con la cámara siguiendo la pelota hace falta ---------- */
function dibujarRadar(){
  const RW = 168, RH = 108, RX = 14, RY = 14;
  ctx.fillStyle = 'rgba(8,11,16,0.72)';
  rr(ctx, RX, RY, RW, RH, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
  rr(ctx, RX+0.5, RY+0.5, RW-1, RH-1, 7); ctx.stroke();
  const mx = x => RX + 8 + (x - CANCHA.x0)/CANCHA.w*(RW-16);
  const my = y => RY + 8 + (y - CANCHA.y0)/CANCHA.h*(RH-16);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.strokeRect(mx(CANCHA.x0), my(CANCHA.y0), mx(CANCHA.x1)-mx(CANCHA.x0), my(CANCHA.y1)-my(CANCHA.y0));
  ctx.beginPath(); ctx.moveTo(mx(CANCHA.cx), my(CANCHA.y0)); ctx.lineTo(mx(CANCHA.cx), my(CANCHA.y1)); ctx.stroke();
  for(const p of jugadores){
    ctx.fillStyle = p === controlado ? '#f5c542'
                  : (p.rol==='ARQ' ? EQUIPOS[p.eq].arquero : EQUIPOS[p.eq].camiseta);
    ctx.beginPath(); ctx.arc(mx(p.x), my(p.y), p === controlado ? 3.4 : 2.6, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(mx(pelota.x), my(pelota.y), 2.2, 0, Math.PI*2); ctx.fill();
  // qué parte se está viendo
  const medio = W/2/(CAM.focal/(CANCHA.h/2 + CAM.dist));
  const vi = Math.max(mx(CANCHA.x0), mx(CAM.x - medio));
  const vd = Math.min(mx(CANCHA.x1), mx(CAM.x + medio));
  ctx.strokeStyle = 'rgba(245,197,66,0.6)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(vi, my(CANCHA.y0), vd - vi, my(CANCHA.y1) - my(CANCHA.y0));
}

/* ============================================================
   COMPOSICIÓN DEL CUADRO
   Con cámara de costado hay profundidad: lo que está más lejos se dibuja
   primero, y el poste cercano del arco va DELANTE de todos.
   ============================================================ */
function dibujar(dt){
  moverCamara(dt || 0.016);

  ctx.save();
  if(sacudida > 0.3){
    ctx.translate((Math.random()-0.5)*sacudida, (Math.random()-0.5)*sacudida);
  }

  dibujarCancha();
  dibujarArco(0, false);
  dibujarArco(1, false);

  // todo lo que está sobre el campo, del fondo hacia adelante
  const cosas = jugadores.map(p => ({ j: p, wy: p.y }));
  cosas.push({ j: null, wy: pelota.y });
  cosas.sort((a,b) => b.wy - a.wy);
  for(const c of cosas){
    if(c.j) dibujarJugador(c.j); else dibujarPelota();
  }

  dibujarArco(0, true);
  dibujarArco(1, true);

  // festejo: los destellos viven en coordenadas de cancha, hay que proyectarlos
  for(const d of destellos){
    const p = proj(d.x, d.y, d.z || 0);
    ctx.globalAlpha = Math.min(1, d.vida);
    ctx.fillStyle = d.col;
    const t = Math.max(1.5, 4*p.s);
    ctx.fillRect(p.x, p.y, t, t);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
  dibujarRadar();
}

let ultimo = null;
function bucle(ts){
  if(ultimo === null) ultimo = ts;
  const dt = Math.min((ts - ultimo)/1000, 0.05);
  ultimo = ts;
  actualizar(dt);
  dibujar(dt);
  requestAnimationFrame(bucle);
}

document.getElementById('mute').addEventListener('click', ()=>{
  AUDIO.activar();
  const m = !AUDIO.estaMudo();
  AUDIO.setMudo(m);
  document.getElementById('mute').textContent = m ? '🔇' : '🔊';
});

document.getElementById('ayuda').innerHTML =
  '<b>← ↑ → ↓</b> mover &nbsp;·&nbsp; ' +
  '<b>BARRA ESPACIADORA</b> patear, mantenela apretada para pegarle más fuerte ' +
  '(sin la pelota: barrida) &nbsp;·&nbsp; ' +
  '<b>Z</b> pasar (sin la pelota: cambiar de jugador)<br>' +
  'Si las teclas no responden, hacé un clic sobre la cancha.'

posicionarSaque(1);
arrancarSaque('¡A JUGAR!', '');
requestAnimationFrame(bucle);
