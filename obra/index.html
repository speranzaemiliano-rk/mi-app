<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parte de obra — Personal</title>
<meta name="description" content="Parte diario de personal en obra por gremio.">
<meta name="theme-color" content="#1B1A18">
<!-- Se puede instalar en el celular (Agregar a pantalla de inicio) y funciona sin señal. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Parte de obra">
<style>
  :root{
    --hormigon:#E9E7E2;
    --carta:#FFFFFF;
    --tinta:#1B1A18;
    --lapiz:#6F6C66;
    --linea:#D6D3CC;
    --casco:#F2B705;
    --casco-osc:#B98A00;
    --ausente:#B4342A;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--hormigon);
    color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.35;
    padding:0 0 96px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  header{
    background:var(--tinta);color:#fff;
    padding:16px 0 14px;margin-bottom:14px;
    border-bottom:6px solid var(--casco);
  }
  .titulo{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--casco)}
  .fecha-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:8px}
  input[type=date]{
    background:transparent;border:0;border-bottom:2px solid rgba(255,255,255,.35);
    color:#fff;font-size:19px;font-weight:700;font-family:inherit;padding:2px 0;min-width:150px;
  }
  input[type=date]:focus{outline:none;border-bottom-color:var(--casco)}
  .tablero{margin-left:auto;text-align:right;line-height:1}
  .tablero .n{font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tablero .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#A9A69F;margin-top:4px}
  .chapas{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chapa{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:3px;padding:4px 8px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
    display:flex;gap:6px;align-items:center;
  }
  .chapa b{font-size:13px;color:var(--casco);font-variant-numeric:tabular-nums}
  .chapa.alerta{background:rgba(180,52,42,.22);border-color:var(--ausente)}
  .chapa.alerta b{color:#FF9A90}

  .nube{
    display:flex;align-items:center;gap:7px;margin-top:11px;width:100%;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    color:#D8D5CE;border-radius:4px;padding:8px 10px;font-family:inherit;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-align:left;
  }
  .nube:active{background:rgba(255,255,255,.16)}
  .nube.on{border-color:var(--casco);color:var(--casco)}
  .nube.mal{border-color:var(--ausente);color:#FF9A90}
  .link-caja{
    background:#F6F4F1;border:1px solid var(--linea);border-radius:5px;padding:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
    word-break:break-all;margin-bottom:12px;color:var(--tinta);
  }

  .gremio{background:var(--carta);border:1px solid var(--linea);border-radius:6px;margin-bottom:12px;overflow:hidden}
  .gremio-head{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--linea);background:#FBFAF8}
  .gremio-head .nom{
    flex:1;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--tinta);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cuenta{
    background:var(--casco);color:#1B1A18;font-weight:800;font-size:13px;
    min-width:26px;height:24px;border-radius:3px;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;padding:0 6px;
  }
  .cuenta.cero{background:var(--linea);color:var(--lapiz)}

  .item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #F0EEEA}
  .item:last-child{border-bottom:0}
  .item.off{opacity:.42}
  .item.off .tarea{text-decoration:line-through}
  .stepper{display:flex;align-items:center;border:1px solid var(--linea);border-radius:4px;overflow:hidden;flex:0 0 auto}
  .stepper button{width:32px;height:34px;border:0;background:#F6F4F1;font-size:19px;font-weight:700;color:var(--tinta);cursor:pointer;font-family:inherit;line-height:1}
  .stepper button:active{background:var(--casco)}
  .stepper .val{width:34px;height:34px;border:0;text-align:center;font-size:17px;font-weight:800;font-family:inherit;font-variant-numeric:tabular-nums;background:#fff;color:var(--tinta)}
  .stepper .val:focus{outline:2px solid var(--casco);outline-offset:-2px}
  .tarea{flex:1;min-width:0;border:0;background:transparent;font-family:inherit;font-size:15px;color:var(--tinta);padding:6px 2px;border-bottom:1px solid transparent}
  .tarea:focus{outline:none;border-bottom-color:var(--casco)}
  .icono{flex:0 0 auto;width:32px;height:32px;border:1px solid var(--linea);border-radius:4px;background:#fff;cursor:pointer;font-size:15px;line-height:1;color:var(--lapiz)}
  .icono:active{background:#F0EEEA}
  .icono.presente{border-color:var(--casco-osc);color:var(--casco-osc);background:#FFF9E6}
  .icono.ausente{border-color:var(--ausente);color:var(--ausente);background:#FDF0EF}

  .nota{width:100%;border:0;border-top:1px dashed var(--linea);background:#FFFDF6;font-family:inherit;font-size:13px;color:#4A4843;padding:9px 12px;resize:vertical;min-height:38px}
  .nota:focus{outline:none;background:#FFF9E6}
  .nota::placeholder{color:#A9A59D}

  .add-item{display:block;width:100%;border:0;border-top:1px solid var(--linea);background:#FBFAF8;padding:9px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lapiz);cursor:pointer}
  .add-item:active{background:var(--casco);color:var(--tinta)}

  .btn{border:1px solid var(--linea);background:#fff;border-radius:5px;padding:11px 14px;font-family:inherit;font-size:13px;font-weight:700;color:var(--tinta);cursor:pointer}
  .btn:active{background:#F0EEEA}
  .btn.full{width:100%;margin-bottom:10px}
  .btn.ghost{background:transparent;border-style:dashed;color:var(--lapiz)}
  .btn.primario-wa{background:#1B1A18;border-color:#1B1A18;color:var(--casco)}
  .btn.primario-wa:active{background:#000}

  .barra{
    position:fixed;left:0;right:0;bottom:0;background:var(--tinta);
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
    display:flex;gap:8px;justify-content:center;z-index:20;
  }
  .barra .btn{background:transparent;border-color:rgba(255,255,255,.2);color:#fff;flex:1;padding:11px 4px;font-size:12px}
  .barra .btn.primario{background:var(--casco);border-color:var(--casco);color:#1B1A18;flex:1.4}
  .barra .btn:active{background:rgba(255,255,255,.12)}
  .barra .btn.primario:active{background:var(--casco-osc)}

  .modal{position:fixed;inset:0;background:rgba(27,26,24,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .modal.open{display:flex}
  .modal-box{background:var(--carta);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:10px 10px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  .modal-box h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;color:var(--lapiz)}
  .modal-box .ayuda{font-size:13px;color:var(--lapiz);margin-bottom:14px}
  pre.parte{white-space:pre-wrap;word-break:break-word;background:#F6F4F1;border:1px solid var(--linea);border-radius:5px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;margin-bottom:12px}
  .dia-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--linea)}
  .dia-row .f{flex:1;font-weight:700;font-size:14px}
  .dia-row .t{font-size:12px;color:var(--lapiz);font-variant-numeric:tabular-nums}
  .g-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--linea)}
  .g-row input{flex:1;min-width:0;border:1px solid transparent;background:#F6F4F1;border-radius:4px;font-family:inherit;font-size:15px;padding:9px 10px;color:var(--tinta)}
  .g-row input:focus{outline:none;border-color:var(--casco);background:#fff}
  .nuevo{display:flex;gap:8px;margin-top:14px}
  .nuevo input{flex:1;min-width:0;border:1px solid var(--linea);border-radius:5px;font-family:inherit;font-size:15px;padding:11px 10px}
  .nuevo input:focus{outline:none;border-color:var(--casco)}
  .vacio{color:var(--lapiz);font-size:14px;padding:16px 0;text-align:center}

  /* --- Personas dentro del parte del día --- */
  .persona{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #F0EEEA}
  .persona.off{opacity:.45}
  .persona.off .pn{text-decoration:line-through}
  .pd{flex:1;min-width:0}
  .pn{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt{width:100%;border:0;background:transparent;font-family:inherit;font-size:13px;color:var(--lapiz);padding:2px 0;border-bottom:1px solid transparent}
  .pt:focus{outline:none;border-bottom-color:var(--casco);color:var(--tinta)}
  .chip{display:inline-block;border-radius:3px;font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 4px;margin-left:6px;vertical-align:1px;background:#FDF0EF;border:1px solid var(--ausente);color:var(--ausente)}
  .subcab{padding:6px 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--lapiz);background:#FBFAF8;border-bottom:1px solid #F0EEEA}

  /* --- Pantalla de personal --- */
  .n-row{display:flex;gap:8px;padding:10px 2px;border-bottom:1px solid var(--linea);align-items:flex-start}
  .n-d{flex:1;min-width:0}
  .n-nom{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n-sub{font-size:11px;color:var(--lapiz);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n-tarea,.n-sel{width:100%;margin-top:5px;border:1px solid var(--linea);border-radius:4px;background:#F6F4F1;font-family:inherit;font-size:13px;padding:7px 8px;color:var(--tinta)}
  .n-tarea:focus,.n-sel:focus{outline:none;border-color:var(--casco);background:#fff}
  .n-acc{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  textarea.imp{width:100%;min-height:150px;border:1px solid var(--linea);border-radius:5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;padding:10px;margin-bottom:12px;resize:vertical;color:var(--tinta);background:#F6F4F1}
  textarea.imp:focus{outline:none;border-color:var(--casco);background:#fff}
  .aviso{background:#FFF9E6;border:1px solid var(--casco);border-radius:5px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.45}
  .aviso.rojo{background:#FDF0EF;border-color:var(--ausente);color:#7A241C}
  .filtro{display:flex;gap:6px;margin-bottom:10px}
  .filtro button{flex:1;border:1px solid var(--linea);background:#fff;border-radius:4px;padding:8px 4px;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--lapiz);cursor:pointer}
  .filtro button.on{background:var(--tinta);border-color:var(--tinta);color:var(--casco)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:50;background:var(--tinta);color:var(--casco);padding:10px 16px;border-radius:4px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{.barra,.add-item,.icono,.stepper button,.btn{display:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="titulo">Parte de obra · Personal</div>
    <div class="fecha-row">
      <input type="date" id="fecha">
      <div class="tablero">
        <div class="n" id="total">0</div>
        <div class="lbl">en obra</div>
      </div>
    </div>
    <div class="chapas" id="chapas"></div>
    <button class="nube" id="btnNube"><span id="nubeTxt">Sin sincronizar — sólo en este equipo</span></button>
  </div>
</header>

<div class="wrap">
  <div id="gremios">
    <div class="vacio" id="avisoJS" style="padding:28px 10px;line-height:1.6">
      <b style="color:#B4342A">La planilla no se está ejecutando.</b><br><br>
      Este archivo necesita abrirse con un navegador.<br>
      En el celular: mantené apretado el archivo en Descargas →<br>
      <b>Abrir con → Chrome</b>.
    </div>
  </div>
</div>

<div class="barra">
  <button class="btn primario" id="btnEnviar">Enviar parte</button>
  <button class="btn" id="btnPersonal">Personal</button>
  <button class="btn" id="btnGremios">Gremios</button>
  <button class="btn" id="btnHistorial">Días</button>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div id="modalContenido"></div>
    <button class="btn full" id="btnCerrar">Cerrar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- La base a la que sincroniza se define en config.js, al lado de este archivo. -->
<script src="config.js"></script>
<!-- ============ INICIO SCRIPT PRINCIPAL ============ -->
<script>
(function(){
  "use strict";

  /* =========================================================
     1) PERSISTENCIA
     Prueba window.storage (vista previa de Claude); si no está,
     usa localStorage (archivo local o GitHub Pages).
  ========================================================= */
  var CLAVE = "parteObra_v2";
  var memoria = {};

  function leer(k){
    if (typeof window.storage !== "undefined" && window.storage) {
      return window.storage.get(k).then(function(r){ return r ? r.value : null; })
                                  .catch(function(){ return null; });
    }
    try { return Promise.resolve(localStorage.getItem(k)); }
    catch(e){ return Promise.resolve(memoria[k] || null); }
  }
  function escribir(k, v){
    if (typeof window.storage !== "undefined" && window.storage) {
      return window.storage.set(k, v).catch(function(){ memoria[k] = v; });
    }
    try { localStorage.setItem(k, v); } catch(e){ memoria[k] = v; }
    return Promise.resolve();
  }

  /* =========================================================
     2) ESTADO
     datos.gremios -> lista fija, se usa todos los días
     datos.dias[fecha].bloques -> lo cargado ese día por gremio
  ========================================================= */
  var datos = { wa: "", gremios: [], personal: [], dias: {} };
  var fechaActual = hoyISO();

  function hoyISO(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function uid(){ return Math.random().toString(36).slice(2, 9); }
  function it(cant, tarea){ return { id: uid(), cant: cant, tarea: tarea, presente: true }; }

  function sembrar(){
    var base = [
      ["Albañiles / Oficiales", [
        it(1, "Denis revocando cantero de la pileta"),
        it(2, "ayudantes"),
        it(2, "detalles de hormigón en cochera, después pasan al interior de los dptos")
      ]],
      ["Silleteros / Fachada", [ it(2, "fachada") ]],
      ["Pintores", [
        it(2, "tarquineros palier piso 10 (terminan palier y entran a los dptos)"),
        it(2, "negro y masilla en palier piso 9"),
        it(3, "interiores piso 1")
      ]],
      ["Yda / Applyseal", [ it(1, "termina el TB") ]],
      ["Electricistas", [ it(2, "cañerías y cable en cochera, terminando cocinas") ]]
    ];
    datos.gremios = [];
    datos.dias[fechaActual] = { bloques: [] };
    base.forEach(function(par){
      var id = uid();
      datos.gremios.push({ id: id, nombre: par[0] });
      datos.dias[fechaActual].bloques.push({ gid: id, nombre: par[0], nota: "", items: par[1] });
    });
  }

  // Convierte datos guardados con la versión anterior (gremios dentro del día)
  function migrar(){
    if (!datos.personal) datos.personal = [];
    if (datos.gremios && datos.gremios.length) return;
    if (!datos.dias) { datos.dias = {}; return; }
    datos.gremios = [];
    var mapa = {};
    Object.keys(datos.dias).sort().forEach(function(f){
      var d = datos.dias[f];
      if (!d.gremios) return;
      d.bloques = d.gremios.map(function(gr){
        if (!mapa[gr.nombre]) {
          var id = uid();
          mapa[gr.nombre] = id;
          datos.gremios.push({ id: id, nombre: gr.nombre });
        }
        return { gid: mapa[gr.nombre], nombre: gr.nombre, nota: gr.nota || "", items: gr.items || [] };
      });
      delete d.gremios;
    });
  }

  function dia(){ return datos.dias[fechaActual]; }

  /* ---------------------------------------------------------
     PERSONAL (nómina)
     La lista es fija y se usa todos los días, igual que los
     gremios. Cada día guarda aparte quién vino (asistencia).
  --------------------------------------------------------- */
  function nuevaPersona(nombre, cuil, art, desde){
    return { id: uid(), nombre: nombre, cuil: cuil || '', gremioId: '',
             tarea: '', art: art !== false, artDesde: desde || '', activo: true };
  }
  function personalActivo(){
    return datos.personal.filter(function(p){ return p.activo !== false; });
  }
  function personalDe(gid){
    return personalActivo().filter(function(p){ return p.gremioId === gid; });
  }
  // Sin gremio, o con un gremio que después se borró: si no, quedarían invisibles.
  function personalSinGremio(){
    return personalActivo().filter(function(p){
      if (!p.gremioId) return true;
      return !datos.gremios.some(function(g){ return g.id === p.gremioId; });
    });
  }
  function asistenciaDe(f){
    var d = datos.dias[f];
    if (!d.asistencia) d.asistencia = {};
    return d.asistencia;
  }
  // Sólo cuenta quien tiene marca explícita en ESE día. Así, alguien que se
  // da de alta hoy no aparece retroactivamente en los partes de la semana pasada.
  function vinoEn(f, pid){
    var d = datos.dias[f];
    return !!(d && d.asistencia && d.asistencia[pid] === true);
  }
  function vino(pid){ return vinoEn(fechaActual, pid); }
  function marcarVino(pid, v){ asistenciaDe(fechaActual)[pid] = !!v; }
  function sumarAHoy(pid){ asistenciaDe(fechaActual)[pid] = true; }

  function bloqueDe(gid){
    var bs = dia().bloques;
    for (var i = 0; i < bs.length; i++) if (bs[i].gid === gid) return bs[i];
    return null;
  }

  // Arma el día: cada gremio de la lista arrastra las tareas del último día que las tenga
  function asegurarDia(f){
    var esNuevo = !datos.dias[f];
    if (esNuevo) datos.dias[f] = { bloques: [], asistencia: {} };
    var d = datos.dias[f];
    if (!d.bloques) d.bloques = [];
    if (!d.asistencia) d.asistencia = {};
    // Día nuevo: arranca con toda la nómina presente y el capataz destilda al que faltó.
    if (esNuevo) personalActivo().forEach(function(p){ d.asistencia[p.id] = true; });
    datos.gremios.forEach(function(gr){
      var existe = d.bloques.some(function(b){ return b.gid === gr.id; });
      if (!existe) d.bloques.push(bloqueDesdeHistorial(gr, f));
    });
    // Ordena los bloques según el orden de la lista de gremios
    var orden = {};
    datos.gremios.forEach(function(gr, i){ orden[gr.id] = i; });
    d.bloques.sort(function(a, b){
      var oa = orden[a.gid], ob = orden[b.gid];
      if (oa === undefined) return 1;
      if (ob === undefined) return -1;
      return oa - ob;
    });
  }

  function bloqueDesdeHistorial(gr, f){
    var previas = Object.keys(datos.dias).filter(function(x){ return x < f; }).sort().reverse();
    for (var i = 0; i < previas.length; i++) {
      var bs = datos.dias[previas[i]].bloques || [];
      for (var j = 0; j < bs.length; j++) {
        if (bs[j].gid === gr.id) {
          return {
            gid: gr.id, nombre: gr.nombre, nota: "",
            items: bs[j].items.map(function(x){
              return { id: uid(), cant: x.cant, tarea: x.tarea, presente: x.presente };
            })
          };
        }
      }
    }
    // Con la nómina cargada, el gremio arranca vacío: la gente sale del personal,
    // no de una fila de cantidad que sumaría de más.
    return { gid: gr.id, nombre: gr.nombre, nota: "",
             items: datos.personal.length ? [] : [ it(1, "") ] };
  }

  var guardarTimer = null;
  function guardar(){
    clearTimeout(guardarTimer);
    guardarTimer = setTimeout(function(){
      escribir(CLAVE, JSON.stringify(datos));
      subirTodo();
    }, 250);
  }

  /* =========================================================
     3) RENDER
  ========================================================= */
  var elGremios = document.getElementById("gremios");
  var elTotal   = document.getElementById("total");
  var elChapas  = document.getElementById("chapas");
  var elFecha   = document.getElementById("fecha");

  // Las "filas sueltas" son el modo viejo: una cantidad y una tarea, sin nombre.
  // Se mantienen para el personal que no está en la nómina (changas, subcontratos).
  function totalBloque(b){
    if (!b) return 0;
    return b.items.reduce(function(s,i){ return s + (i.presente ? (i.cant||0) : 0); }, 0);
  }
  function totalGremio(gid){
    var n = personalDe(gid).filter(function(p){ return vino(p.id); }).length;
    return n + totalBloque(bloqueDe(gid));
  }
  function totalSinGremio(){
    return personalSinGremio().filter(function(p){ return vino(p.id); }).length;
  }
  function totalDia(){
    var n = 0;
    datos.gremios.forEach(function(g){ n += totalGremio(g.id); });
    return n + totalSinGremio();
  }
  // Total de un día cualquiera (historial y CSV), sin depender de la fecha abierta.
  function totalDeDia(f){
    var d = datos.dias[f];
    if (!d) return 0;
    var n = (d.bloques || []).reduce(function(s,b){ return s + totalBloque(b); }, 0);
    personalActivo().forEach(function(p){ if (vinoEn(f, p.id)) n++; });
    return n;
  }
  function sinArtEnObra(){
    return personalActivo().filter(function(p){ return p.art === false && vino(p.id); });
  }

  function render(){
    elFecha.value = fechaActual;
    elGremios.innerHTML = "";

    if (!datos.gremios.length && !personalActivo().length) {
      elGremios.innerHTML = '<div class="vacio">Todavía no hay nada cargado.<br><br>' +
        'Tocá «Personal» para traer la nómina,<br>o «Gremios» para armar la lista de gremios.</div>';
      actualizarTablero();
      return;
    }

    datos.gremios.forEach(function(gr){ elGremios.appendChild(tarjetaGremio(gr)); });

    var sueltos = personalSinGremio();
    if (sueltos.length) elGremios.appendChild(tarjetaSinGremio(sueltos));

    actualizarTablero();
  }

  function cabecera(nombre, t){
    var head = document.createElement("div");
    head.className = "gremio-head";
    var nom = document.createElement("div");
    nom.className = "nom"; nom.textContent = nombre;
    var cta = document.createElement("div");
    cta.className = "cuenta" + (t === 0 ? " cero" : "");
    cta.textContent = t;
    head.appendChild(nom); head.appendChild(cta);
    return head;
  }

  function subcab(txt){
    var d = document.createElement("div");
    d.className = "subcab"; d.textContent = txt;
    return d;
  }

  function tarjetaGremio(gr){
    var b = bloqueDe(gr.id);
    var card = document.createElement("div");
    card.className = "gremio";
    card.setAttribute("data-gid", gr.id);
    card.appendChild(cabecera(gr.nombre, totalGremio(gr.id)));

    var gente = personalDe(gr.id);
    gente.forEach(function(p){ card.appendChild(filaPersona(p)); });

    if (b) {
      if (gente.length && b.items.length) card.appendChild(subcab("Sin nombre (por cantidad)"));
      b.items.forEach(function(item){ card.appendChild(filaItem(b, item)); });

      var nota = document.createElement("textarea");
      nota.className = "nota"; nota.rows = 1;
      nota.placeholder = "Nota del día (ej: no vinieron por la lluvia)";
      nota.value = b.nota;
      nota.addEventListener("input", function(){ b.nota = nota.value; guardar(); });
      card.appendChild(nota);

      var add = document.createElement("button");
      add.className = "add-item"; add.textContent = "+ Tarea sin nombre";
      add.addEventListener("click", function(){
        b.items.push(it(1, ""));
        guardar(); render();
        enfocarUltimaVacia();
      });
      card.appendChild(add);
    }
    return card;
  }

  // Nadie puede quedar fuera de la pantalla por no tener gremio todavía.
  function tarjetaSinGremio(gente){
    var card = document.createElement("div");
    card.className = "gremio";
    card.setAttribute("data-gid", "");
    card.appendChild(cabecera("Sin gremio asignado", totalSinGremio()));
    card.appendChild(subcab("Asignales el gremio desde «Personal»"));
    gente.forEach(function(p){ card.appendChild(filaPersona(p)); });
    return card;
  }

  function filaPersona(p){
    var fila = document.createElement("div");
    var presente = vino(p.id);
    fila.className = "persona" + (presente ? "" : " off");

    var d = document.createElement("div");
    d.className = "pd";

    var nom = document.createElement("div");
    nom.className = "pn";
    nom.textContent = p.nombre;
    if (p.art === false) {
      var chip = document.createElement("span");
      chip.className = "chip"; chip.textContent = "SIN ART";
      nom.appendChild(chip);
    }

    var tarea = document.createElement("input");
    tarea.className = "pt"; tarea.type = "text";
    tarea.value = p.tarea || "";
    tarea.placeholder = "Qué está haciendo";
    tarea.addEventListener("input", function(){ p.tarea = tarea.value; guardar(); });

    d.appendChild(nom); d.appendChild(tarea);

    var btn = document.createElement("button");
    btn.className = "icono " + (presente ? "presente" : "ausente");
    btn.textContent = presente ? "✓" : "✕";
    btn.title = presente ? "Está en obra" : "No vino";
    btn.addEventListener("click", function(){
      marcarVino(p.id, !vino(p.id));
      guardar(); render();
    });

    fila.appendChild(d); fila.appendChild(btn);
    return fila;
  }

  function enfocarUltimaVacia(){
    var todas = Array.prototype.slice.call(elGremios.querySelectorAll(".tarea"));
    for (var k = todas.length - 1; k >= 0; k--) {
      if (todas[k].value === "") { todas[k].focus(); break; }
    }
  }

  function filaItem(b, item){
    var fila = document.createElement("div");
    fila.className = "item" + (item.presente ? "" : " off");

    var step = document.createElement("div");
    step.className = "stepper";
    var menos = document.createElement("button"); menos.textContent = "−";
    var val = document.createElement("input");
    val.className = "val"; val.type = "text"; val.inputMode = "numeric"; val.value = item.cant;
    var mas = document.createElement("button"); mas.textContent = "+";

    menos.addEventListener("click", function(){
      item.cant = Math.max(0, (item.cant||0) - 1);
      val.value = item.cant; guardar(); actualizarTablero(); refrescarCuentas();
    });
    mas.addEventListener("click", function(){
      item.cant = (item.cant||0) + 1;
      val.value = item.cant; guardar(); actualizarTablero(); refrescarCuentas();
    });
    val.addEventListener("input", function(){
      var n = parseInt(val.value.replace(/\D/g, ""), 10);
      item.cant = isNaN(n) ? 0 : n;
      guardar(); actualizarTablero(); refrescarCuentas();
    });
    val.addEventListener("blur", function(){ val.value = item.cant; });
    step.appendChild(menos); step.appendChild(val); step.appendChild(mas);

    var tarea = document.createElement("input");
    tarea.className = "tarea"; tarea.type = "text"; tarea.value = item.tarea;
    tarea.placeholder = "Qué está haciendo";
    tarea.addEventListener("input", function(){ item.tarea = tarea.value; guardar(); });

    var pres = document.createElement("button");
    pres.className = "icono " + (item.presente ? "presente" : "ausente");
    pres.textContent = item.presente ? "✓" : "✕";
    pres.title = item.presente ? "Está en obra" : "No vino";
    pres.addEventListener("click", function(){ item.presente = !item.presente; guardar(); render(); });

    var quitar = document.createElement("button");
    quitar.className = "icono"; quitar.textContent = "✕"; quitar.title = "Borrar tarea";
    quitar.style.fontSize = "12px";
    quitar.addEventListener("click", function(){
      b.items = b.items.filter(function(x){ return x.id !== item.id; });
      guardar(); render();
    });

    fila.appendChild(step); fila.appendChild(tarea);
    fila.appendChild(pres); fila.appendChild(quitar);
    return fila;
  }

  function refrescarCuentas(){
    Array.prototype.forEach.call(elGremios.querySelectorAll(".gremio"), function(card){
      var cta = card.querySelector(".cuenta");
      if (!cta) return;
      var gid = card.getAttribute("data-gid");
      var t = gid ? totalGremio(gid) : totalSinGremio();
      cta.textContent = t;
      cta.className = "cuenta" + (t === 0 ? " cero" : "");
    });
  }

  function chapa(n, txt, alerta){
    var c = document.createElement("div");
    c.className = "chapa" + (alerta ? " alerta" : "");
    var b = document.createElement("b"); b.textContent = n;
    c.appendChild(b);
    c.appendChild(document.createTextNode(" " + txt));
    elChapas.appendChild(c);
  }

  function actualizarTablero(){
    elTotal.textContent = totalDia();
    elChapas.innerHTML = "";
    datos.gremios.forEach(function(g){
      var t = totalGremio(g.id);
      if (t) chapa(t, g.nombre);
    });
    var sg = totalSinGremio();
    if (sg) chapa(sg, "sin gremio");
    var sa = sinArtEnObra().length;
    if (sa) chapa(sa, "SIN ART", true);
  }

  /* =========================================================
     4) TEXTO DEL PARTE
  ========================================================= */
  var DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  function fechaLarga(iso){
    var p = iso.split("-");
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return DIAS[d.getDay()] + " " + p[2] + "/" + p[1] + "/" + p[0];
  }

  function lineaPersona(p){
    return "• " + p.nombre + (p.tarea ? " — " + p.tarea : "");
  }

  function generarTexto(){
    var L = [];
    L.push("PARTE DE OBRA — " + fechaLarga(fechaActual));
    L.push("Personal en obra: " + totalDia());
    L.push("");

    datos.gremios.forEach(function(g){
      var b        = bloqueDe(g.id);
      var gente    = personalDe(g.id);
      var vinieron = gente.filter(function(p){ return vino(p.id); });
      var faltaron = gente.filter(function(p){ return !vino(p.id); });
      var sueltas  = b ? b.items.filter(function(i){ return i.presente && i.cant > 0; }) : [];
      var sueltasNo= b ? b.items.filter(function(i){ return !i.presente && i.tarea; }) : [];
      var nota     = b ? b.nota : "";
      if (!vinieron.length && !faltaron.length && !sueltas.length && !sueltasNo.length && !nota) return;

      L.push(g.nombre.toUpperCase() + " (" + totalGremio(g.id) + ")");
      vinieron.forEach(function(p){ L.push(lineaPersona(p)); });
      sueltas.forEach(function(i){ L.push(i.cant + " " + i.tarea); });
      faltaron.forEach(function(p){ L.push("— no vino: " + p.nombre); });
      sueltasNo.forEach(function(i){ L.push("— no vino: " + i.tarea); });
      if (nota) L.push("· " + nota);
      L.push("");
    });

    var sg = personalSinGremio().filter(function(p){ return vino(p.id); });
    if (sg.length) {
      L.push("SIN GREMIO ASIGNADO (" + sg.length + ")");
      sg.forEach(function(p){ L.push(lineaPersona(p)); });
      L.push("");
    }

    // Va al final y bien visible: es lo que no puede pasar desapercibido.
    var sa = sinArtEnObra();
    if (sa.length) {
      L.push("*** EN OBRA SIN ART (" + sa.length + ") ***");
      sa.forEach(function(p){ L.push("— " + p.nombre); });
      L.push("");
    }
    return L.join("\n").trim();
  }

  /* =========================================================
     5) MODALES
  ========================================================= */
  var modal = document.getElementById("modal");
  var modalContenido = document.getElementById("modalContenido");
  function abrirModal(html){ modalContenido.innerHTML = html; modal.classList.add("open"); }
  function cerrarModal(){ modal.classList.remove("open"); modalContenido.innerHTML = ""; }
  document.getElementById("btnCerrar").addEventListener("click", cerrarModal);
  modal.addEventListener("click", function(e){ if (e.target === modal) cerrarModal(); });

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  /* ---- Enviar parte ---- */
  document.getElementById("btnEnviar").addEventListener("click", function(){
    if (!datos.gremios.length) { toast("Primero cargá los gremios"); return; }
    var txt = generarTexto();
    abrirModal('<h2>Parte del día</h2><pre class="parte" id="preParte"></pre>' +
               '<button class="btn full primario-wa" id="btnWA">Enviar por WhatsApp</button>' +
               '<button class="btn full" id="btnCopiar2">Copiar al portapapeles</button>' +
               '<button class="btn ghost full" id="btnNum">Cambiar destinatario</button>');
    document.getElementById("preParte").textContent = txt;
    document.getElementById("btnWA").addEventListener("click", function(){ enviarWA(txt); });
    document.getElementById("btnCopiar2").addEventListener("click", function(){ copiarTexto(txt); });
    document.getElementById("btnNum").addEventListener("click", pedirNumero);
  });

  function enviarWA(txt){
    var num = (datos.wa || "").replace(/\D/g, "");
    window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(txt), "_blank");
  }
  function pedirNumero(){
    var n = prompt("Número de WhatsApp que recibe el parte, con código de país y sin 0 ni 15.\nEjemplo: 5491122334455\n\nDejalo vacío para elegir el contacto cada vez.", datos.wa || "");
    if (n === null) return;
    datos.wa = n.replace(/\D/g, "");
    guardar();
    toast(datos.wa ? "Destinatario guardado" : "Se elige el contacto cada vez");
  }

  function copiarTexto(txt){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function(){ toast("Parte copiado"); })
        .catch(function(){ copiarFallback(txt); });
    } else { copiarFallback(txt); }
  }
  function copiarFallback(txt){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Parte copiado"); }
    catch(e){ toast("Copiá el texto a mano"); }
    document.body.removeChild(ta);
  }

  /* ---- Administrar gremios (lista fija) ---- */
  document.getElementById("btnGremios").addEventListener("click", abrirGremios);

  function abrirGremios(){
    var html = '<h2>Gremios</h2>' +
               '<div class="ayuda">Esta lista se usa todos los días. Lo que agregues queda para siempre.</div>' +
               '<div id="listaG"></div>' +
               '<div class="nuevo">' +
                 '<input type="text" id="nuevoG" placeholder="Ej: Plomeros, Herreros, Yeseros">' +
                 '<button class="btn" id="btnAddG">Agregar</button>' +
               '</div>';
    abrirModal(html);
    pintarLista();

    document.getElementById("btnAddG").addEventListener("click", agregarG);
    document.getElementById("nuevoG").addEventListener("keydown", function(e){
      if (e.key === "Enter") agregarG();
    });

  function pintarLista(){
    var cont = document.getElementById("listaG");
    if (!cont) return;
    cont.innerHTML = "";
    if (!datos.gremios.length) {
      cont.innerHTML = '<div class="vacio">Todavía no hay gremios.</div>';
      return;
    }
    datos.gremios.forEach(function(gr){
      var row = document.createElement("div");
      row.className = "g-row";

      var inp = document.createElement("input");

      inp.addEventListener("input", function(){
        gr.nombre = inp.value;
        // El nombre se actualiza en el día abierto también
        dia().bloques.forEach(function(b){ if (b.gid === gr.id) b.nombre = inp.value; });
        guardar();
      });

      var del = document.createElement("button");
      del.className = "icono"; del.textContent = "✕"; del.title = "Eliminar gremio";
      del.addEventListener("click", function(){
        if (!confirm("¿Eliminar «" + gr.nombre + "» de la lista?\n\nDeja de aparecer de acá en adelante. Los partes ya guardados no se tocan.")) return;
        datos.gremios = datos.gremios.filter(function(x){ return x.id !== gr.id; });
        var d = dia();
        d.bloques = d.bloques.filter(function(b){ return b.gid !== gr.id; });
        guardar(); pintarLista(); render();
      });

      row.appendChild(inp); row.appendChild(del);
      cont.appendChild(row);
    });
  }

  function agregarG(){
    var inp = document.getElementById("nuevoG");
    var nombre = inp.value.trim();
    if (!nombre) { inp.focus(); return; }
    var id = uid();
    datos.gremios.push({ id: id, nombre: nombre });
    dia().bloques.push({ gid: id, nombre: nombre, nota: "",
                         items: datos.personal.length ? [] : [ it(1, "") ] });
    inp.value = "";
    guardar(); pintarLista(); render();
    toast("«" + nombre + "» agregado");
    inp.focus();
  }

  /* =========================================================
     5bis) SINCRONIZAR ENTRE EQUIPOS
     Sin login: el permiso es un código largo que viaja en el
     link. La planilla sigue guardando en el teléfono, así que
     funciona sin señal; la nube es un espejo que se pone al
     día cuando hay conexión.
     OJO: cualquiera con el link lee y escribe estos datos.
  ========================================================= */
  // La base sale de config.js. Sin config no hay sincronización, pero la
  // planilla funciona igual guardando en el equipo.
  var FB = (window.OBRA_CONFIG && window.OBRA_CONFIG.firebase) || {};
  // Para la Realtime Database alcanza con la databaseURL: la apiKey sólo
  // haría falta si algún día se agregara login.
  function hayBase(){ return !!FB.databaseURL; }
  function configFirebase(){
    var c = {};
    if (FB.apiKey)      c.apiKey      = FB.apiKey;
    if (FB.projectId)   c.projectId   = FB.projectId;
    c.databaseURL = FB.databaseURL;
    return c;
  }
  var CLAVE_COD = "parteObra_codigo";
  var nube = { ref: null, codigo: "", estado: "off", ultimo: "" };

  function generarCodigo(){
    // Sin l/I/1/0/O para que se pueda dictar por teléfono sin errores.
    var abc = "abcdefghijkmnpqrstuvwxyz23456789", out = "";
    var cr = window.crypto || window.msCrypto;
    if (cr && cr.getRandomValues) {
      var b = new Uint8Array(24);
      cr.getRandomValues(b);
      for (var i = 0; i < 24; i++) out += abc.charAt(b[i] % abc.length);
    } else {
      for (var j = 0; j < 24; j++) out += abc.charAt(Math.floor(Math.random() * abc.length));
    }
    return out;
  }

  function codigoDeURL(){
    var m = location.search.match(/[?&]o=([A-Za-z0-9]{20,64})/);
    return m ? m[1] : "";
  }

  function linkDeObra(cod){
    return location.origin + location.pathname + "?o=" + cod;
  }

  function pintarNube(){
    var b = document.getElementById("btnNube");
    var t = document.getElementById("nubeTxt");
    if (!b || !t) return;
    b.className = "nube" + (nube.estado === "ok" ? " on" : (nube.estado === "mal" ? " mal" : ""));
    if (nube.estado === "ok")        t.textContent = "Sincronizado — se ve en otros equipos";
    else if (nube.estado === "yendo")t.textContent = "Conectando…";
    else if (nube.estado === "mal")  t.textContent = "No sincroniza — tocá para ver por qué";
    else if (!hayBase())             t.textContent = "Sin sincronizar — falta configurar la base";
    else                             t.textContent = "Sin sincronizar — sólo en este equipo";
  }

  // El SDK de Firebase se baja recién cuando hace falta: sin código,
  // la planilla no pide nada a la red y abre igual de rápido.
  function cargarFirebase(cb){
    if (window.firebase && window.firebase.database) return cb(true);
    var urls = ["https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js",
                "https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"];
    var i = 0;
    (function siguiente(){
      if (i >= urls.length) {
        try { if (!firebase.apps.length) firebase.initializeApp(configFirebase()); } catch(e){ return cb(false); }
        return cb(true);
      }
      var sc = document.createElement("script");
      sc.src = urls[i++];
      sc.onload = siguiente;
      sc.onerror = function(){ cb(false); };
      document.head.appendChild(sc);
    })();
  }

  function paraNube(){
    return { gremios: datos.gremios, personal: datos.personal, dias: datos.dias };
  }

  function subirTodo(){
    if (!nube.ref) return;
    var payload = paraNube();
    nube.ultimo = JSON.stringify(payload);
    nube.ref.set(payload).then(function(){
      nube.estado = "ok"; pintarNube();
    }).catch(function(e){
      nube.estado = "mal"; nube.error = e && e.message ? e.message : String(e); pintarNube();
    });
  }

  function escribiendo(){
    var a = document.activeElement;
    return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"));
  }

  function bajarDeNube(v){
    var entrante = JSON.stringify({ gremios: v.gremios || [], personal: v.personal || [], dias: v.dias || {} });
    if (entrante === nube.ultimo) return;          // es el eco de lo que acabamos de subir
    if (entrante === JSON.stringify(paraNube())) return;
    nube.ultimo = entrante;
    datos.gremios  = v.gremios  || [];
    datos.personal = v.personal || [];
    datos.dias     = v.dias     || {};
    escribir(CLAVE, JSON.stringify(datos));
    asegurarDia(fechaActual);
    // Si está tipeando, no le arrebato el foco: sólo actualizo los números.
    if (escribiendo()) actualizarTablero(); else render();
  }

  function conectarNube(cod){
    if (!cod) return;
    if (!hayBase()) {
      nube.estado = "mal";
      nube.error = "Falta cargar la databaseURL en obra/config.js. Sin eso la planilla no puede sincronizar, pero sigue guardando en este equipo.";
      pintarNube(); return;
    }
    nube.codigo = cod;
    nube.estado = "yendo"; pintarNube();
    try { localStorage.setItem(CLAVE_COD, cod); } catch(e){}

    cargarFirebase(function(ok){
      if (!ok) {
        nube.estado = "mal";
        nube.error = "No se pudo cargar Firebase (¿sin señal?). La planilla sigue funcionando en este equipo.";
        pintarNube(); return;
      }
      try {
        nube.ref = firebase.database().ref("parteObra/" + cod);
      } catch(e){
        nube.estado = "mal"; nube.error = String(e); pintarNube(); return;
      }
      nube.ref.on("value", function(snap){
        var v = snap.val();
        nube.estado = "ok"; pintarNube();
        if (!v) { subirTodo(); return; }   // primera vez: sube lo que hay
        bajarDeNube(v);
      }, function(err){
        nube.estado = "mal";
        nube.error = (err && err.code === "PERMISSION_DENIED")
          ? "Firebase rechaza la conexión: falta publicar la regla «parteObra» en la consola (Realtime Database → Reglas)."
          : (err && err.message ? err.message : String(err));
        pintarNube();
      });
    });
  }

  function desconectarNube(){
    if (nube.ref) { try { nube.ref.off(); } catch(e){} }
    nube = { ref: null, codigo: "", estado: "off", ultimo: "" };
    try { localStorage.removeItem(CLAVE_COD); } catch(e){}
    if (location.search) history.replaceState(null, "", location.pathname);
    pintarNube();
  }

  document.getElementById("btnNube").addEventListener("click", abrirNube);

  function abrirNube(){
    var h = '<h2>Compartir la planilla</h2>';
    if (nube.codigo) {
      h += '<div class="ayuda">Cualquiera que abra este link ve y edita la misma planilla, sin usuario ni contraseña. ' +
           'Mandáselo sólo a quien tiene que cargar el parte.</div>' +
           (nube.estado === "mal"
             ? '<div class="aviso rojo"><b>No está sincronizando.</b><br>' + escapar(nube.error || "") + '</div>'
             : '<div class="aviso">Estado: ' + (nube.estado === "ok" ? "sincronizando bien." : "conectando…") + '</div>') +
           '<div class="link-caja" id="linkObra"></div>' +
           '<button class="btn full primario-wa" id="btnLinkWA">Mandar el link por WhatsApp</button>' +
           '<button class="btn full" id="btnLinkCopiar">Copiar el link</button>' +
           '<button class="btn ghost full" id="btnLinkOff">Dejar de sincronizar en este equipo</button>';
    } else if (!hayBase()) {
      h += '<div class="ayuda">Para sincronizar entre equipos falta indicar a qué base de datos se conecta.</div>' +
           '<div class="aviso"><b>Qué falta:</b> cargar la <b>databaseURL</b> del proyecto de Firebase en el archivo ' +
           '<b>obra/config.js</b>, y publicar la regla <b>parteObra</b> ' +
           'en ese proyecto.<br><br>Mientras tanto la planilla anda igual: guarda en este equipo.</div>';
    } else {
      h += '<div class="ayuda">Hoy la planilla se guarda sólo en este equipo. Si la activás, se copia a la nube ' +
           'y podés abrirla desde otra compu o celular con el mismo link.</div>' +
           '<div class="aviso rojo"><b>Ojo:</b> el link es la única llave. No pide contraseña, así que ' +
           'cualquiera que lo tenga ve y edita la nómina completa, con nombres y CUIL.</div>' +
           '<button class="btn full primario-wa" id="btnLinkOn">Activar y generar el link</button>' +
           '<div class="ayuda" style="margin-top:12px">¿Ya tenés un link de otra planilla? Abrilo directamente en este equipo y se conecta solo.</div>';
    }
    abrirModal(h);

    if (nube.codigo) {
      var link = linkDeObra(nube.codigo);
      document.getElementById("linkObra").textContent = link;
      document.getElementById("btnLinkWA").addEventListener("click", function(){
        window.open("https://wa.me/?text=" + encodeURIComponent("Planilla de parte de obra: " + link), "_blank");
      });
      document.getElementById("btnLinkCopiar").addEventListener("click", function(){ copiarTexto(link); });
      document.getElementById("btnLinkOff").addEventListener("click", function(){
        if (!confirm("¿Dejar de sincronizar en ESTE equipo?\n\nLos datos que ya están en la nube no se borran, y podés volver a entrar con el link.")) return;
        desconectarNube(); cerrarModal(); toast("Desconectado");
      });
    } else {
      // Sin base configurada el modal no dibuja este botón: sólo explica qué falta.
      var bOn = document.getElementById("btnLinkOn");
      if (bOn) bOn.addEventListener("click", function(){
        var cod = generarCodigo();
        history.replaceState(null, "", location.pathname + "?o=" + cod);
        conectarNube(cod);
        cerrarModal();
        setTimeout(abrirNube, 400);
      });
    }
  }

  function escapar(t){
    var d = document.createElement("div");
    d.textContent = String(t);
    return d.innerHTML;
  }

  /* ---- Personal (nómina) ---- */
  var filtroPersonal = "todos";
  document.getElementById("btnPersonal").addEventListener("click", abrirPersonal);

  function abrirPersonal(){
    abrirModal('<h2>Personal</h2>' +
      '<div class="ayuda" id="pResumen"></div>' +
      '<div class="filtro">' +
        '<button data-f="todos">Todos</button>' +
        '<button data-f="singremio">Sin gremio</button>' +
        '<button data-f="sinart">Sin ART</button>' +
      '</div>' +
      '<div id="pLista"></div>' +
      '<div class="nuevo">' +
        '<input type="text" id="nuevoP" placeholder="Nombre y apellido">' +
        '<button class="btn" id="btnAddP">Agregar</button>' +
      '</div>' +
      '<button class="btn ghost full" style="margin-top:12px" id="btnImp">Importar nómina de ART</button>');
    pintarPersonal();

    modalContenido.querySelectorAll("[data-f]").forEach(function(b){
      b.addEventListener("click", function(){
        filtroPersonal = b.getAttribute("data-f");
        pintarPersonal();
      });
    });
    document.getElementById("btnAddP").addEventListener("click", agregarPersonaManual);
    document.getElementById("nuevoP").addEventListener("keydown", function(e){
      if (e.key === "Enter") agregarPersonaManual();
    });
    document.getElementById("btnImp").addEventListener("click", abrirImportar);
  }

  function pintarPersonal(){
    var cont = document.getElementById("pLista");
    if (!cont) return;

    var todos  = personalActivo();
    var sinArt = todos.filter(function(p){ return p.art === false; });
    var sinG   = personalSinGremio();

    var res = document.getElementById("pResumen");
    if (res) {
      res.textContent = todos.length + (todos.length === 1 ? " persona" : " personas") +
                        " · " + sinArt.length + " sin ART · " + sinG.length + " sin gremio";
    }
    modalContenido.querySelectorAll("[data-f]").forEach(function(b){
      b.className = (b.getAttribute("data-f") === filtroPersonal) ? "on" : "";
    });

    var lista = todos;
    if (filtroPersonal === "singremio") lista = sinG;
    if (filtroPersonal === "sinart")    lista = sinArt;

    cont.innerHTML = "";
    if (!lista.length) {
      cont.innerHTML = '<div class="vacio">' +
        (todos.length ? "Nadie en este filtro."
                      : "Todavía no hay personal cargado.<br>Escribí un nombre abajo, o traé la lista completa con «Importar nómina de ART».") +
        '</div>';
      return;
    }
    lista.forEach(function(p){ cont.appendChild(filaNomina(p)); });
  }

  function filaNomina(p){
    var row = document.createElement("div");
    row.className = "n-row";

    var d = document.createElement("div");
    d.className = "n-d";

    var nom = document.createElement("div");
    nom.className = "n-nom";
    nom.textContent = p.nombre;
    if (p.art === false) {
      var chip = document.createElement("span");
      chip.className = "chip"; chip.textContent = "SIN ART";
      nom.appendChild(chip);
    }
    d.appendChild(nom);

    var sub = document.createElement("div");
    sub.className = "n-sub";
    var partes = [];
    if (p.cuil) partes.push("CUIL " + p.cuil);
    if (p.art === false) partes.push("no figura en la nómina de ART");
    else if (p.artDesde) partes.push("ART desde " + p.artDesde);
    sub.textContent = partes.join(" · ") || "sin datos de ART";
    d.appendChild(sub);

    var sel = document.createElement("select");
    sel.className = "n-sel";
    var op0 = document.createElement("option");
    op0.value = ""; op0.textContent = "— Sin gremio —";
    sel.appendChild(op0);
    datos.gremios.forEach(function(g){
      var o = document.createElement("option");
      o.value = g.id; o.textContent = g.nombre;
      if (g.id === p.gremioId) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", function(){
      p.gremioId = sel.value;
      guardar(); pintarPersonal(); render();
    });
    d.appendChild(sel);

    var tarea = document.createElement("input");
    tarea.className = "n-tarea"; tarea.type = "text";
    tarea.value = p.tarea || "";
    tarea.placeholder = "Qué hace";
    tarea.addEventListener("input", function(){ p.tarea = tarea.value; guardar(); });
    tarea.addEventListener("blur", render);
    d.appendChild(tarea);

    var acc = document.createElement("div");
    acc.className = "n-acc";

    var art = document.createElement("button");
    art.className = "icono " + (p.art === false ? "ausente" : "presente");
    art.textContent = p.art === false ? "✕" : "✓";
    art.title = p.art === false ? "No tiene ART — tocá para marcar que sí" : "Tiene ART — tocá para marcar que no";
    art.addEventListener("click", function(){
      p.art = (p.art === false);
      if (p.art === false) p.artDesde = "";
      guardar(); pintarPersonal(); render();
    });

    var del = document.createElement("button");
    del.className = "icono"; del.textContent = "✕";
    del.title = "Sacar de la lista";
    del.style.fontSize = "12px";
    del.addEventListener("click", function(){
      if (!confirm("¿Sacar a «" + p.nombre + "» de la lista?\n\nDeja de aparecer de acá en adelante. Los partes ya guardados no se tocan.")) return;
      datos.personal = datos.personal.filter(function(x){ return x.id !== p.id; });
      guardar(); pintarPersonal(); render();
    });

    acc.appendChild(art); acc.appendChild(del);
    row.appendChild(d); row.appendChild(acc);
    return row;
  }

  function agregarPersonaManual(){
    var inp = document.getElementById("nuevoP");
    var nombre = inp.value.trim();
    if (!nombre) { inp.focus(); return; }
    var tieneArt = confirm("¿«" + nombre + "» está dado de alta en la ART?\n\nAceptar = sí.\nCancelar = no, queda marcado SIN ART.");
    var np = nuevaPersona(nombre, "", tieneArt, "");
    datos.personal.push(np);
    sumarAHoy(np.id);
    inp.value = "";
    guardar(); pintarPersonal(); render();
    toast(tieneArt ? "«" + nombre + "» agregado" : "«" + nombre + "» agregado SIN ART");
    inp.focus();
  }

  /* ---- Importar la nómina de la ART ---- */
  function abrirImportar(){
    abrirModal('<h2>Importar nómina de ART</h2>' +
      '<div class="ayuda">Pegá el listado tal como te llega de la ART, una persona por línea. ' +
      'Lee el nombre, el CUIL y la fecha de alta. Si alguien ya está cargado, lo actualiza en vez de repetirlo.</div>' +
      '<textarea id="impTxt" class="imp" placeholder="APELLIDO NOMBRE•CUIL: 20-12345678-9• Inicio de cobertura: 18/08/2026•Alta: Experta Online"></textarea>' +
      '<button class="btn full primario-wa" id="btnImpOk">Importar</button>' +
      '<button class="btn ghost full" id="btnImpVolver">Volver a Personal</button>');
    document.getElementById("btnImpOk").addEventListener("click", hacerImportacion);
    document.getElementById("btnImpVolver").addEventListener("click", abrirPersonal);
    document.getElementById("impTxt").focus();
  }

  // Acepta el formato de la ART (campos separados por •) y también líneas con
  // sólo el nombre. Del resto de la línea saca el CUIL y la fecha si están.
  function parsearNomina(txt){
    var out = [];
    txt.split(/\r?\n/).forEach(function(linea){
      var l = linea.replace(/\s+/g, " ").trim();
      if (!l) return;
      var mc = l.match(/(\d{2})[-\s.]?(\d{8})[-\s.]?(\d)/);
      var mf = l.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/);
      var nombre = l.split(/[•|\t;]/)[0];
      nombre = nombre.replace(/CUIL:?/i, "")
                     .replace(/\d{2}[-\s.]?\d{8}[-\s.]?\d/, "")
                     .replace(/\d{1,2}\/\d{1,2}\/\d{2,4}/, "")
                     .replace(/\s{2,}/g, " ").trim();
      if (!nombre) return;
      out.push({
        nombre: nombre,
        cuil:   mc ? (mc[1] + "-" + mc[2] + "-" + mc[3]) : "",
        desde:  mf ? mf[1] : ""
      });
    });
    return out;
  }

  function buscarPersona(r){
    var hallada = null;
    datos.personal.forEach(function(p){
      if (hallada) return;
      if (r.cuil && p.cuil) { if (p.cuil === r.cuil) hallada = p; return; }
      if (p.nombre.toUpperCase() === r.nombre.toUpperCase()) hallada = p;
    });
    return hallada;
  }

  function hacerImportacion(){
    var caja = document.getElementById("impTxt");
    var leidos = parsearNomina(caja ? caja.value : "");
    if (!leidos.length) { toast("No pude leer ninguna línea"); return; }

    var nuevos = 0, actualizados = 0;
    leidos.forEach(function(r){
      var ya = buscarPersona(r);
      if (ya) {
        ya.cuil     = r.cuil  || ya.cuil;
        ya.artDesde = r.desde || ya.artDesde;
        ya.art      = true;
        ya.activo   = true;
        sumarAHoy(ya.id);
        actualizados++;
      } else {
        var np = nuevaPersona(r.nombre, r.cuil, true, r.desde);
        datos.personal.push(np);
        sumarAHoy(np.id);
        nuevos++;
      }
    });
    guardar();

    // Si el parte de hoy ya traía cantidades sin nombre, se contarían dos veces.
    var sueltas = dia().bloques.reduce(function(s, b){ return s + totalBloque(b); }, 0);
    if (sueltas > 0) {
      var msg = "Importé " + nuevos + " y actualicé " + actualizados + ".\n\n" +
                "El parte de hoy ya tenía " + sueltas + " personas cargadas como cantidad, sin nombre. " +
                "Si quedan, se cuentan dos veces.\n\nAceptar = las saco.\nCancelar = las dejo.";
      if (confirm(msg)) {
        dia().bloques.forEach(function(b){ b.items = []; });
        guardar();
      }
    } else {
      toast(nuevos + " nuevos · " + actualizados + " actualizados");
    }
    abrirPersonal();
    render();
  }

  /* ---- Historial ---- */
  document.getElementById("btnHistorial").addEventListener("click", function(){
    var fechas = Object.keys(datos.dias).sort().reverse();
    var html = '<h2>Días cargados</h2>';
    if (!fechas.length) {
      html += '<div class="vacio">Todavía no hay días guardados.</div>';
    } else {
      fechas.forEach(function(f){
        var t = totalDeDia(f);
        html += '<div class="dia-row">' +
                  '<div class="f">' + fechaLarga(f) + '</div>' +
                  '<div class="t">' + t + ' pers.</div>' +
                  '<button class="btn" data-ir="' + f + '">Abrir</button>' +
                  '<button class="icono" data-borrar="' + f + '">✕</button>' +
                '</div>';
      });
      html += '<button class="btn ghost full" style="margin-top:14px" id="btnCSV">Descargar historial (CSV para Excel)</button>';
    }
    abrirModal(html);

    modalContenido.querySelectorAll("[data-ir]").forEach(function(b){
      b.addEventListener("click", function(){
        fechaActual = b.getAttribute("data-ir");
        asegurarDia(fechaActual);
        guardar(); cerrarModal(); render();
      });
    });
    modalContenido.querySelectorAll("[data-borrar]").forEach(function(b){
      b.addEventListener("click", function(){
        var f = b.getAttribute("data-borrar");
        if (!confirm("¿Borrar el parte del " + fechaLarga(f) + "?")) return;
        delete datos.dias[f];
        asegurarDia(fechaActual);
        guardar(); cerrarModal(); render();
      });
    });
    var csv = document.getElementById("btnCSV");
    if (csv) csv.addEventListener("click", exportarCSV);
  });

  function exportarCSV(){
    var filas = [["Fecha","Gremio","Nombre","CUIL","ART","Cantidad","Tarea","Estado","Nota del gremio"]];
    var nombreGremio = {};
    datos.gremios.forEach(function(g){ nombreGremio[g.id] = g.nombre; });

    Object.keys(datos.dias).sort().forEach(function(f){
      var d = datos.dias[f];
      var notaDe = {};
      (d.bloques || []).forEach(function(b){ notaDe[b.gid] = b.nota || ""; });

      // Una fila por persona con marca de asistencia en ese día.
      personalActivo().forEach(function(p){
        var a = (d.asistencia || {})[p.id];
        if (a === undefined) return;
        filas.push([f, nombreGremio[p.gremioId] || "Sin gremio", p.nombre, p.cuil || "",
                    p.art === false ? "SIN ART" : "Sí", 1, p.tarea || "",
                    a === true ? "En obra" : "No vino", notaDe[p.gremioId] || ""]);
      });

      // Y las filas sueltas (cantidad sin nombre).
      (d.bloques || []).forEach(function(b){
        b.items.forEach(function(i){
          filas.push([f, b.nombre, "", "", "", i.cant, i.tarea,
                      i.presente ? "En obra" : "No vino", b.nota]);
        });
      });
    });
    var csv = filas.map(function(r){
      return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(";");
    }).join("\r\n");
    var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "parte_obra_" + hoyISO() + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("CSV descargado");
  }

  /* =========================================================
     6) EVENTOS GENERALES
  ========================================================= */
  elFecha.addEventListener("change", function(){
    if (!elFecha.value) return;
    fechaActual = elFecha.value;
    asegurarDia(fechaActual);
    guardar(); render();
  });

  /* =========================================================
     7) ARRANQUE
     Primero dibuja con lo que hay (así siempre se ve algo),
     después lee lo guardado y vuelve a dibujar.
  ========================================================= */
  function preparar(){
    migrar();
    if (!datos.gremios.length && !Object.keys(datos.dias).length) sembrar();
    asegurarDia(fechaActual);
    render();
  }

  function mostrarError(e){
    var cont = document.getElementById("gremios");
    if (!cont) return;
    cont.innerHTML = '<div class="vacio" style="padding:24px 10px;line-height:1.6">' +
      '<b style="color:#B4342A">Se cortó al iniciar.</b><br><br>' +
      '<span style="font-family:monospace;font-size:12px;word-break:break-word">' +
      String(e && e.message ? e.message : e) + '</span></div>';
  }

  window.addEventListener("error", function(ev){ mostrarError(ev.error || ev.message); });

  try { preparar(); } catch(e){ mostrarError(e); }

  Promise.resolve(leer(CLAVE)).then(function(txt){
    if (!txt) { return leer("parteObra_v1"); }
    return txt;
  }).then(function(txt){
    if (txt) {
      try {
        var d = JSON.parse(txt);
        if (d && d.dias) {
          datos = { wa: d.wa || "", gremios: d.gremios || [],
                    personal: d.personal || [], dias: d.dias };
          preparar();
        }
      } catch(e){ /* si el guardado está roto, se queda con lo que ya dibujó */ }
    }
    guardar();
  }).catch(function(){ guardar(); }).then(function(){
    pintarNube();
    var cod = codigoDeURL();
    if (!cod) { try { cod = localStorage.getItem(CLAVE_COD) || ""; } catch(e){} }
    if (cod) conectarNube(cod);
  });

})();
</script>
