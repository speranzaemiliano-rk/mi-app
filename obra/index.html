  // Acepta el formato de la ART (campos separados por •) y también líneas con
  // sólo el nombre. Del resto de la línea saca el CUIL y la fecha si están.
  function parsearNomina(txt){
    var out = [];
    txt.split(/\r?\n/).forEach(function(linea){
      var l = linea.replace(/\s+/g, " ").trim();
      if (!l) return;
      var mc = l.match(/(\d{2})[-\s.]?(\d{8})[-\s.]?(\d)/);
      var mf = l.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/);
      var nombre = l.split(/[•|\t;]/)[0];
      nombre = nombre.replace(/CUIL:?/i, "")
                     .replace(/\d{2}[-\s.]?\d{8}[-\s.]?\d/, "")
                     .replace(/\d{1,2}\/\d{1,2}\/\d{2,4}/, "")
                     .replace(/\s{2,}/g, " ").trim();
      if (!nombre) return;
      out.push({
        nombre: nombre,
        cuil:   mc ? (mc[1] + "-" + mc[2] + "-" + mc[3]) : "",
        desde:  mf ? mf[1] : ""
      });
    });
    return out;
  }

  function buscarPersona(r){
    var hallada = null;
    datos.personal.forEach(function(p){
      if (hallada) return;
      if (r.cuil && p.cuil) { if (p.cuil === r.cuil) hallada = p; return; }
      if (p.nombre.toUpperCase() === r.nombre.toUpperCase()) hallada = p;
    });
    return hallada;
  }

  function hacerImportacion(){
    var caja = document.getElementById("impTxt");
    var leidos = parsearNomina(caja ? caja.value : "");
    if (!leidos.length) { toast("No pude leer ninguna línea"); return; }

    var nuevos = 0, actualizados = 0;
    leidos.forEach(function(r){
      var ya = buscarPersona(r);
      if (ya) {
        ya.cuil     = r.cuil  || ya.cuil;
        ya.artDesde = r.desde || ya.artDesde;
        ya.art      = true;
        ya.activo   = true;
        sumarAHoy(ya.id);
        actualizados++;
      } else {
        var np = nuevaPersona(r.nombre, r.cuil, true, r.desde);
        datos.personal.push(np);
        sumarAHoy(np.id);
        nuevos++;
      }
    });
    guardar();

    // Si el parte de hoy ya traía cantidades sin nombre, se contarían dos veces.
    var sueltas = dia().bloques.reduce(function(s, b){ return s + totalBloque(b); }, 0);
    if (sueltas > 0) {
      var msg = "Importé " + nuevos + " y actualicé " + actualizados + ".\n\n" +
                "El parte de hoy ya tenía " + sueltas + " personas cargadas como cantidad, sin nombre. " +
                "Si quedan, se cuentan dos veces.\n\nAceptar = las saco.\nCancelar = las dejo.";
      if (confirm(msg)) {
        dia().bloques.forEach(function(b){ b.items = []; });
        guardar();
      }
    } else {
      toast(nuevos + " nuevos · " + actualizados + " actualizados");
    }
    abrirPersonal();
    render();
  }

  /* =========================================================
     EXPORTAR A PDF
     Antes de exportar se elige qué entra: qué días, qué
     gremios, qué columnas y si van los ausentes.
     Sale por la impresión del navegador ("Guardar como PDF"),
     así no hace falta bajar ninguna librería y anda sin señal.
  ========================================================= */
  var pdfCfg = {
    rango: "dia",            // 'dia' | 'entre' | 'todos'
    desde: "", hasta: "",
    gremios: null,           // null = todos; si no, { gid: true }
    sinGremio: true,
    ausentes: true,
    cols: { tarea: true, cuil: false, art: true, estado: true }
  };

  function diasDisponibles(){
    return Object.keys(datos.dias).sort();
  }

  function diasElegidos(){
    var todos = diasDisponibles();
    if (pdfCfg.rango === "dia")   return todos.indexOf(fechaActual) >= 0 ? [fechaActual] : [];
    if (pdfCfg.rango === "todos") return todos;
    var d = pdfCfg.desde || todos[0] || "";
    var h = pdfCfg.hasta || todos[todos.length - 1] || "";
    return todos.filter(function(f){ return f >= d && f <= h; });
  }

  function gremioElegido(gid){
    if (!gid) return pdfCfg.sinGremio;
    return !pdfCfg.gremios || pdfCfg.gremios[gid] !== false;
  }

  // Quién figura en un día: sólo los que tienen marca de asistencia ahí.
  function estabaEse(f, pid){
    var d = datos.dias[f];
    return !!(d && d.asistencia && Object.prototype.hasOwnProperty.call(d.asistencia, pid));
  }

  function abrirExportar(){
    var todos = diasDisponibles();
    if (!todos.length) { toast("Todavía no hay días cargados"); return; }
    if (!pdfCfg.desde) pdfCfg.desde = todos[0];
    if (!pdfCfg.hasta) pdfCfg.hasta = todos[todos.length - 1];

    var h = '<h2>Exportar a PDF</h2>' +
      '<div class="ayuda">Elegí qué entra en el PDF. Después el navegador te va a ofrecer ' +
      '«Guardar como PDF» en el destino de impresión.</div>' +

      '<div class="grupo"><h3>Qué días</h3>' +
        '<label class="op"><input type="radio" name="rg" value="dia">Sólo el día abierto (' + fechaLarga(fechaActual) + ')</label>' +
        '<label class="op"><input type="radio" name="rg" value="entre">Entre dos fechas</label>' +
        '<div class="fechas" id="cajaFechas">' +
          '<input type="date" id="pdfDesde"><input type="date" id="pdfHasta">' +
        '</div>' +
        '<label class="op"><input type="radio" name="rg" value="todos">Todos los días cargados (' + todos.length + ')</label>' +
      '</div>' +

      '<div class="grupo"><h3>Qué gremios</h3><div id="pdfGremios"></div></div>' +

      '<div class="grupo"><h3>Qué datos de cada persona</h3>' +
        '<label class="op"><input type="checkbox" id="cTarea">Tarea que hizo</label>' +
        '<label class="op"><input type="checkbox" id="cEstado">Si vino o no</label>' +
        '<label class="op"><input type="checkbox" id="cArt">Si tiene ART</label>' +
        '<label class="op"><input type="checkbox" id="cCuil">CUIL</label>' +
        '<label class="op"><input type="checkbox" id="cAus">Incluir a los que no vinieron</label>' +
      '</div>' +

      '<div class="cuenta-sel" id="pdfCuenta"></div>' +
      '<button class="btn full primario-wa" style="margin-top:10px" id="btnGenPDF">Generar el PDF</button>';
    abrirModal(h);

    // gremios (todos marcados por defecto)
    var cont = document.getElementById("pdfGremios");
    if (!datos.gremios.length) cont.innerHTML = '<div class="ayuda">No hay gremios cargados.</div>';
    datos.gremios.forEach(function(g){
      var l = document.createElement("label");
      l.className = "op";
      var c = document.createElement("input");
      c.type = "checkbox"; c.checked = gremioElegido(g.id);
      c.addEventListener("change", function(){
        if (!pdfCfg.gremios) pdfCfg.gremios = {};
        pdfCfg.gremios[g.id] = c.checked;
        contarSel();
      });
      l.appendChild(c);
      l.appendChild(document.createTextNode(g.nombre));
      cont.appendChild(l);
    });
    var lsg = document.createElement("label");
    lsg.className = "op";
    var csg = document.createElement("input");
    csg.type = "checkbox"; csg.checked = pdfCfg.sinGremio;
    csg.addEventListener("change", function(){ pdfCfg.sinGremio = csg.checked; contarSel(); });
    lsg.appendChild(csg);
    lsg.appendChild(document.createTextNode("Sin gremio asignado"));
    cont.appendChild(lsg);

    // días
    modalContenido.querySelectorAll('input[name="rg"]').forEach(function(r){
      r.checked = (r.value === pdfCfg.rango);
      r.addEventListener("change", function(){
        pdfCfg.rango = r.value;
        document.getElementById("cajaFechas").style.display = (r.value === "entre") ? "flex" : "none";
        contarSel();
      });
    });
    document.getElementById("cajaFechas").style.display = (pdfCfg.rango === "entre") ? "flex" : "none";
    var dd = document.getElementById("pdfDesde"), hh = document.getElementById("pdfHasta");
    dd.value = pdfCfg.desde; hh.value = pdfCfg.hasta;
    dd.addEventListener("change", function(){ pdfCfg.desde = dd.value; contarSel(); });
    hh.addEventListener("change", function(){ pdfCfg.hasta = hh.value; contarSel(); });

    // columnas
    var cajas = [["cTarea","tarea"], ["cEstado","estado"], ["cArt","art"], ["cCuil","cuil"]];
    cajas.forEach(function(par){
      var el = document.getElementById(par[0]);
      el.checked = !!pdfCfg.cols[par[1]];
      el.addEventListener("change", function(){ pdfCfg.cols[par[1]] = el.checked; });
    });
    var aus = document.getElementById("cAus");
    aus.checked = pdfCfg.ausentes;
    aus.addEventListener("change", function(){ pdfCfg.ausentes = aus.checked; contarSel(); });

    document.getElementById("btnGenPDF").addEventListener("click", generarPDF);
    contarSel();
  }

  function contarSel(){
    var el = document.getElementById("pdfCuenta");
    if (!el) return;
    var ds = diasElegidos(), filas = 0;
    ds.forEach(function(f){
      personalActivo().forEach(function(p){
        if (!estabaEse(f, p.id)) return;
        if (!gremioElegido(p.gremioId)) return;
        if (!pdfCfg.ausentes && !vinoEn(f, p.id)) return;
        filas++;
      });
    });
    el.textContent = ds.length
      ? "Van a salir " + ds.length + (ds.length === 1 ? " día" : " días") + " y " + filas + (filas === 1 ? " línea" : " líneas") + "."
      : "No hay ningún día en ese rango.";
  }

  function _td(t, clase){
    return '<td' + (clase ? ' class="' + clase + '"' : '') + '>' + escapar(t == null ? "" : t) + '</td>';
  }

  function armarReporte(){
    var ds = diasElegidos();
    var cols = pdfCfg.cols;
    var L = [];

    // Encabezado con la marca del sistema
    L.push('<div class="rep-head">' +
             '<img class="rep-logo" src="../assets/mess-logo.svg" alt="">' +
             '<div class="rep-t"><h1>Parte de obra</h1>' +
               '<div class="rep-sub">Personal en obra</div></div>' +
             '<div class="rep-meta">' +
               '<span class="f">' + escapar(ds.length === 1 ? fechaLarga(ds[0])
                    : fechaLarga(ds[0]) + ' — ' + fechaLarga(ds[ds.length-1])) + '</span>' +
               (ds.length > 1 ? escapar(ds.length + ' días') + '<br>' : '') +
               'Emitido ' + escapar(fechaLarga(hoyISO())) +
             '</div>' +
           '</div>');

    ds.forEach(function(f){
      var dGuardado = datos.dias[f] || {};
      var bloquesDe = {};
      (dGuardado.bloques || []).forEach(function(b){ bloquesDe[b.gid] = b; });

      var secciones = [], resumen = [], totalDia = 0;

      function seccion(titulo, gente, bloque){
        var visibles = gente.filter(function(p){ return pdfCfg.ausentes || vinoEn(f, p.id); });
        var sueltas = (bloque && bloque.items) ? bloque.items.filter(function(i){
          return pdfCfg.ausentes ? (i.cant > 0 || i.tarea) : (i.presente && i.cant > 0);
        }) : [];
        var nota = bloque ? (bloque.nota || "") : "";
        if (!visibles.length && !sueltas.length && !nota) return;

        var presentes = gente.filter(function(p){ return vinoEn(f, p.id); }).length +
          (bloque ? bloque.items.reduce(function(s,i){ return s + (i.presente ? (i.cant||0) : 0); }, 0) : 0);
        totalDia += presentes;
        resumen.push([titulo, presentes]);

        var t = ['<div class="gr"><h3>' + escapar(titulo) +
                 '<span>' + presentes + ' en obra</span></h3>' +
                 '<table class="gente"><thead><tr><th></th><th>Nombre</th>'];
        if (cols.tarea)  t.push('<th>Tarea</th>');
        if (cols.estado) t.push('<th>Estado</th>');
        if (cols.art)    t.push('<th>ART</th>');
        if (cols.cuil)   t.push('<th>CUIL</th>');
        t.push('</tr></thead><tbody>');

        var n = 0;
        visibles.forEach(function(p){
          var vino = vinoEn(f, p.id);
          n++;
          t.push('<tr' + (vino ? '' : ' class="no"') + '>' +
                 '<td class="i">' + n + '</td>' + _td(p.nombre, "nom"));
          if (cols.tarea)  t.push(_td(p.tarea || "—"));
          if (cols.estado) t.push(_td(vino ? "En obra" : "No vino", "est"));
          if (cols.art)    t.push(_td(p.art === false ? "SIN ART" : "Sí", p.art === false ? "art-no" : ""));
          if (cols.cuil)   t.push(_td(p.cuil || "—"));
          t.push('</tr>');
        });
        sueltas.forEach(function(i){
          n++;
          t.push('<tr' + (i.presente ? '' : ' class="no"') + '>' +
                 '<td class="i">' + n + '</td>' +
                 _td(i.cant + " sin identificar", "nom"));
          if (cols.tarea)  t.push(_td(i.tarea || "—"));
          if (cols.estado) t.push(_td(i.presente ? "En obra" : "No vino", "est"));
          if (cols.art)    t.push(_td("—"));
          if (cols.cuil)   t.push(_td("—"));
          t.push('</tr>');
        });
        t.push('</tbody></table>');
        if (nota) t.push('<div class="nota-gr">' + escapar(nota) + '</div>');
        t.push('</div>');
        secciones.push(t.join(""));
      }

      datos.gremios.forEach(function(g){
        if (!gremioElegido(g.id)) return;
        seccion(g.nombre, personalDe(g.id).filter(function(p){ return estabaEse(f, p.id); }), bloquesDe[g.id]);
      });
      if (pdfCfg.sinGremio) {
        seccion("Sin gremio asignado",
                personalSinGremio().filter(function(p){ return estabaEse(f, p.id); }), null);
      }
      if (!secciones.length) return;

      // Resumen del día, antes del detalle
      var res = ['<table class="resumen"><tbody>'];
      resumen.forEach(function(r){
        res.push('<tr>' + _td(r[0]) + '<td class="n">' + r[1] + '</td></tr>');
      });
      res.push('<tr class="tot">' + _td("Total en obra") + '<td class="n">' + totalDia + '</td></tr>');
      res.push('</tbody></table>');

      // Quién estuvo sin ART ese día
      var sinArt = personalActivo().filter(function(p){
        return p.art === false && estabaEse(f, p.id) && vinoEn(f, p.id) && gremioElegido(p.gremioId);
      });
      var aviso = sinArt.length
        ? '<div class="art-box"><b>En obra sin cobertura de ART (' + sinArt.length + ')</b>' +
          escapar(sinArt.map(function(p){ return p.nombre; }).join(" · ")) + '</div>'
        : '';

      // El parte de un día se firma; un listado de varios días, no.
      var firmas = (ds.length === 1)
        ? '<div class="firmas">' +
            '<div><div class="linea"></div>Capataz</div>' +
            '<div><div class="linea"></div>Jefe de obra</div>' +
            '<div><div class="linea"></div>Fecha</div>' +
          '</div>'
        : '';

      L.push('<div class="dia"><h2>' + escapar(fechaLarga(f)) + ' — ' + totalDia + ' en obra</h2>' +
             res.join("") + secciones.join("") + aviso + firmas + '</div>');
    });

    L.push('<div class="pie">Generado con Mess · Parte de obra — ' + escapar(fechaLarga(hoyISO())) + '</div>');
    return L.join("");
  }

  function generarPDF(){
    var ds = diasElegidos();
    if (!ds.length) { toast("No hay días en ese rango"); return; }
    var rep = document.getElementById("reporte");
    rep.innerHTML = armarReporte();
    cerrarModal();
    document.body.classList.add("imprimiendo");
    // El navegador necesita un respiro para pintar el reporte antes de imprimir.
    setTimeout(function(){
      try { window.print(); } catch(e){}
      setTimeout(function(){ document.body.classList.remove("imprimiendo"); }, 400);
    }, 120);
  }

  /* ---- Historial ---- */

  document.getElementById("btnHistorial").addEventListener("click", function(){
    var fechas = Object.keys(datos.dias).sort().reverse();
    var html = '<h2>Días cargados</h2>';
    if (!fechas.length) {
      html += '<div class="vacio">Todavía no hay días guardados.</div>';
    } else {
      fechas.forEach(function(f){
        var t = totalDeDia(f);
        html += '<div class="dia-row">' +
                  '<div class="f">' + fechaLarga(f) + '</div>' +
                  '<div class="t">' + t + ' pers.</div>' +
                  '<button class="btn" data-ir="' + f + '">Abrir</button>' +
                  '<button class="icono" data-borrar="' + f + '">✕</button>' +
                '</div>';
      });
      html += '<button class="btn full primario-wa" style="margin-top:14px" id="btnPDF">Exportar a PDF</button>' +
              '<button class="btn ghost full" id="btnCSV">Descargar historial (CSV para Excel)</button>';
    }
    abrirModal(html);

    modalContenido.querySelectorAll("[data-ir]").forEach(function(b){
      b.addEventListener("click", function(){
        fechaActual = b.getAttribute("data-ir");
        asegurarDia(fechaActual);
        guardar(); cerrarModal(); render();
      });
    });
    modalContenido.querySelectorAll("[data-borrar]").forEach(function(b){
      b.addEventListener("click", function(){
        var f = b.getAttribute("data-borrar");
        if (!confirm("¿Borrar el parte del " + fechaLarga(f) + "?")) return;
        delete datos.dias[f];
        asegurarDia(fechaActual);
        guardar(); cerrarModal(); render();
      });
    });
    var csv = document.getElementById("btnCSV");
    if (csv) csv.addEventListener("click", exportarCSV);
    var pdf = document.getElementById("btnPDF");
    if (pdf) pdf.addEventListener("click", abrirExportar);
  });

  function exportarCSV(){
    var filas = [["Fecha","Gremio","Nombre","CUIL","ART","Cantidad","Tarea","Estado","Nota del gremio"]];
    var nombreGremio = {};
    datos.gremios.forEach(function(g){ nombreGremio[g.id] = g.nombre; });

    Object.keys(datos.dias).sort().forEach(function(f){
      var d = datos.dias[f];
      var notaDe = {};
      (d.bloques || []).forEach(function(b){ notaDe[b.gid] = b.nota || ""; });

      // Una fila por persona con marca de asistencia en ese día.
      personalActivo().forEach(function(p){
        var a = (d.asistencia || {})[p.id];
        if (a === undefined) return;
        filas.push([f, nombreGremio[p.gremioId] || "Sin gremio", p.nombre, p.cuil || "",
                    p.art === false ? "SIN ART" : "Sí", 1, p.tarea || "",
                    a === true ? "En obra" : "No vino", notaDe[p.gremioId] || ""]);
      });

      // Y las filas sueltas (cantidad sin nombre).
      (d.bloques || []).forEach(function(b){
        b.items.forEach(function(i){
          filas.push([f, b.nombre, "", "", "", i.cant, i.tarea,
                      i.presente ? "En obra" : "No vino", b.nota]);
        });
      });
    });
    var csv = filas.map(function(r){
      return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(";");
    }).join("\r\n");
    var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "parte_obra_" + hoyISO() + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("CSV descargado");
  }

  /* =========================================================
     6) EVENTOS GENERALES
  ========================================================= */
  elFecha.addEventListener("change", function(){
    if (!elFecha.value) return;
    fechaActual = elFecha.value;
    asegurarDia(fechaActual);
    guardar(); render();
  });

  /* =========================================================
     7) ARRANQUE
     Primero dibuja con lo que hay (así siempre se ve algo),
     después lee lo guardado y vuelve a dibujar.
  ========================================================= */
  function preparar(){
    migrar();
    if (!datos.gremios.length && !Object.keys(datos.dias).length) sembrar();
    asegurarDia(fechaActual);
    render();
  }

  function mostrarError(e){
    var cont = document.getElementById("gremios");
    if (!cont) return;
    cont.innerHTML = '<div class="vacio" style="padding:24px 10px;line-height:1.6">' +
      '<b style="color:#D70015">Se cortó al iniciar.</b><br><br>' +
      '<span style="font-family:monospace;font-size:12px;word-break:break-word">' +
      String(e && e.message ? e.message : e) + '</span></div>';
  }

  window.addEventListener("error", function(ev){ mostrarError(ev.error || ev.message); });

  try { preparar(); } catch(e){ mostrarError(e); }

  Promise.resolve(leer(CLAVE)).then(function(txt){
    if (!txt) { return leer("parteObra_v1"); }
    return txt;
  }).then(function(txt){
    if (txt) {
      try {
        var d = JSON.parse(txt);
        if (d && d.dias) {
          var n = normalizar(d);
          datos = { wa: d.wa || "", gremios: n.gremios,
                    personal: n.personal, dias: n.dias };
          preparar();
        }
      } catch(e){ /* si el guardado está roto, se queda con lo que ya dibujó */ }
    }
    guardar();
  }).catch(function(){ guardar(); }).then(function(){
    iniciarNube();
  });

})();
</script>
