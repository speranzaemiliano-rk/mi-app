<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parte de obra — Personal</title>
<meta name="description" content="Parte diario de personal en obra por gremio.">
<meta name="theme-color" content="#F0F0F3">
<!-- Se puede instalar en el celular (Agregar a pantalla de inicio) y funciona sin señal. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Parte de obra">
<style>
  :root{
    /* Misma paleta que el sistema y la caja (ver :root de index.html):
       superficie casi blanca, bordes finos y acento azul. Los nombres
       viejos quedan como alias para no reescribir cada regla. */
    --surface:      #FAFAFC;
    --surface-2:    #E8E8EE;
    --card:         #FFFFFF;
    --ink:          #1D1D1F;
    --text-2:       #4A4A52;
    --text-3:       #9A9AA2;
    --border:       #E3E3EA;
    --border-soft:  #ECECF0;
    --sidebar-bg:   #F0F0F3;
    --acento:       #0071E3;
    --acento-osc:   #0062C4;
    --acento-pale:  #EEF5FE;
    --danger:       #D70015;
    --danger-bg:    #FDEEF0;
    --brand-mark:   #6D4BE0;
    --radius:       14px;
    --radius-sm:    10px;
    --radius-pill:  980px;
    --shadow:       0 1px 2px rgba(20,20,40,.04);

    --hormigon:  var(--surface);
    --carta:     var(--card);
    --tinta:     var(--ink);
    --lapiz:     var(--text-2);
    --linea:     var(--border);
    --casco:     var(--acento);
    --casco-osc: var(--acento-osc);
    --ausente:   var(--danger);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--hormigon);
    color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.35;
    padding:0 0 96px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  header{
    background:var(--sidebar-bg);color:var(--ink);
    padding:16px 0 14px;margin-bottom:14px;
    border-bottom:1px solid var(--border);
  }
  .titulo{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-mark)}
  .fecha-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:8px}
  input[type=date]{
    background:transparent;border:0;border-bottom:1.5px solid var(--border);
    color:var(--ink);font-size:19px;font-weight:700;font-family:inherit;padding:2px 0;min-width:150px;
  }
  input[type=date]:focus{outline:none;border-bottom-color:var(--acento)}
  .tablero{margin-left:auto;text-align:right;line-height:1}
  .tablero .n{font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tablero .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2);margin-top:4px}
  .chapas{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chapa{
    background:var(--card);border:1px solid var(--border);color:var(--text-2);
    border-radius:var(--radius-sm);padding:4px 9px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
    display:flex;gap:6px;align-items:center;
  }
  .chapa b{font-size:13px;color:var(--acento);font-variant-numeric:tabular-nums}
  .chapa.alerta{background:var(--danger-bg);border-color:var(--danger);color:#7A0710}
  .chapa.alerta b{color:var(--danger)}

  .nube{
    display:flex;align-items:center;gap:9px;margin-top:12px;width:100%;
    background:var(--acento);border:0;color:#fff;
    border-radius:var(--radius-pill);padding:11px 16px;font-family:inherit;
    font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    cursor:pointer;text-align:left;
  }
  .nube:active{background:var(--acento-osc)}
  .instalar{
    display:flex;align-items:center;gap:8px;margin-top:11px;width:100%;
    background:transparent;border:1px dashed var(--border);color:var(--text-2);
    border-radius:var(--radius-pill);padding:9px 15px;font-family:inherit;font-size:11px;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-align:left;
  }
  .instalar:active{background:var(--surface-2)}
  .instalar[hidden]{display:none}
  .nube-ico{font-size:16px;line-height:1;flex:0 0 auto}
  .nube-txt{flex:1;min-width:0}
  .nube-mas{
    flex:0 0 auto;font-size:15px;font-weight:700;line-height:1;
    background:rgba(255,255,255,.22);border-radius:var(--radius-pill);padding:2px 8px;
  }
  /* Ya sincronizando: deja de gritar, pasa a ser un estado. */
  .nube.on{background:var(--acento-pale);border:1px solid var(--acento);color:var(--acento-osc)}
  .nube.on:active{background:#DDEBFB}
  .nube.on .nube-mas{display:none}
  /* Sin señal no es un error: en obra es lo normal. */
  .nube.gris{background:var(--card);border:1px solid var(--border);color:var(--text-2)}
  .nube.gris:active{background:var(--surface-2)}
  .nube.gris .nube-mas{display:none}
  .nube.mal{background:var(--danger);color:#fff}
  .nube.mal:active{background:#A80010}
  .nube.mal .nube-mas{background:rgba(0,0,0,.18)}
  .campo{
    width:100%;border:1px solid var(--linea);border-radius:5px;background:var(--surface);
    font-family:inherit;font-size:16px;padding:12px 11px;margin-bottom:10px;color:var(--tinta);
  }
  .campo:focus{outline:none;border-color:var(--casco);background:#fff}
  .link-caja{
    background:var(--surface);border:1px solid var(--linea);border-radius:5px;padding:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
    word-break:break-all;margin-bottom:12px;color:var(--tinta);
  }

  .gremio{background:var(--carta);border:1px solid var(--linea);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
  .gremio-head{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--linea);background:var(--surface)}
  .gremio-head .nom{
    flex:1;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--tinta);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cuenta{
    background:var(--acento);color:#fff;font-weight:700;font-size:13px;
    min-width:26px;height:24px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;padding:0 9px;
  }
  .cuenta.cero{background:var(--surface-2);color:var(--text-2)}

  .item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border-soft)}
  .item:last-child{border-bottom:0}
  .item.off{opacity:.42}
  .item.off .tarea{text-decoration:line-through}
  .stepper{display:flex;align-items:center;border:1px solid var(--linea);border-radius:4px;overflow:hidden;flex:0 0 auto}
  .stepper button{width:32px;height:34px;border:0;background:var(--surface);font-size:19px;font-weight:700;color:var(--tinta);cursor:pointer;font-family:inherit;line-height:1}
  .stepper button:active{background:var(--surface-2)}
  .stepper .val{width:34px;height:34px;border:0;text-align:center;font-size:17px;font-weight:800;font-family:inherit;font-variant-numeric:tabular-nums;background:#fff;color:var(--tinta)}
  .stepper .val:focus{outline:2px solid var(--casco);outline-offset:-2px}
  .tarea{flex:1;min-width:0;border:0;background:transparent;font-family:inherit;font-size:15px;color:var(--tinta);padding:6px 2px;border-bottom:1px solid transparent}
  .tarea:focus{outline:none;border-bottom-color:var(--casco)}
  .icono{flex:0 0 auto;width:32px;height:32px;border:1px solid var(--linea);border-radius:4px;background:#fff;cursor:pointer;font-size:15px;line-height:1;color:var(--lapiz)}
  .icono:active{background:var(--surface-2)}
  .icono.presente{border-color:var(--casco-osc);color:var(--casco-osc);background:var(--acento-pale)}
  .icono.ausente{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}

  .nota{width:100%;border:0;border-top:1px dashed var(--border);background:var(--surface);font-family:inherit;font-size:13px;color:var(--text-2);padding:9px 12px;resize:vertical;min-height:38px}
  .nota:focus{outline:none;background:var(--acento-pale)}
  .nota::placeholder{color:var(--text-3)}

  .add-item{display:block;width:100%;border:0;border-top:1px solid var(--linea);background:var(--surface);padding:9px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lapiz);cursor:pointer}
  .add-item:active{background:var(--acento-pale);color:var(--acento-osc)}

  .btn{border:1px solid var(--linea);background:#fff;border-radius:var(--radius-pill);padding:11px 18px;font-family:inherit;font-size:13px;font-weight:600;color:var(--tinta);cursor:pointer}
  .btn:active{background:var(--surface-2)}
  .btn.full{width:100%;margin-bottom:10px}
  .btn.ghost{background:transparent;border-style:dashed;color:var(--lapiz)}
  .btn.primario-wa{background:var(--acento);border-color:var(--acento);color:#fff}
  .btn.primario-wa:active{background:var(--acento-osc)}

  .barra{
    position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--border);
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
    display:flex;gap:8px;justify-content:center;z-index:20;
  }
  .barra .btn{background:transparent;border-color:var(--border);color:var(--ink);flex:1;padding:11px 4px;font-size:12px}
  .barra .btn.primario{background:var(--acento);border-color:var(--acento);color:#fff;flex:1.4}
  .barra .btn:active{background:var(--surface-2)}
  .barra .btn.primario:active{background:var(--acento-osc)}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .modal.open{display:flex}
  .modal-box{background:var(--carta);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:var(--radius) var(--radius) 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  .modal-box h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;color:var(--lapiz)}
  .modal-box .ayuda{font-size:13px;color:var(--lapiz);margin-bottom:14px}
  pre.parte{white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--linea);border-radius:5px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;margin-bottom:12px}
  .dia-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--linea)}
  .dia-row .f{flex:1;font-weight:700;font-size:14px}
  .dia-row .t{font-size:12px;color:var(--lapiz);font-variant-numeric:tabular-nums}
  .g-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--linea)}
  .g-row input{flex:1;min-width:0;border:1px solid transparent;background:var(--surface);border-radius:4px;font-family:inherit;font-size:15px;padding:9px 10px;color:var(--tinta)}
  .g-row input:focus{outline:none;border-color:var(--casco);background:#fff}
  .nuevo{display:flex;gap:8px;margin-top:14px}
  .nuevo input{flex:1;min-width:0;border:1px solid var(--linea);border-radius:5px;font-family:inherit;font-size:15px;padding:11px 10px}
  .nuevo input:focus{outline:none;border-color:var(--casco)}
  .vacio{color:var(--lapiz);font-size:14px;padding:16px 0;text-align:center}

  /* --- Personas dentro del parte del día --- */
  .persona{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border-soft)}
  .persona.off{opacity:.45}
  .persona.off .pn{text-decoration:line-through}
  .pd{flex:1;min-width:0}
  .pn{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt{width:100%;border:0;background:transparent;font-family:inherit;font-size:13px;color:var(--lapiz);padding:2px 0;border-bottom:1px solid transparent}
  .pt:focus{outline:none;border-bottom-color:var(--casco);color:var(--tinta)}
  .chip{display:inline-block;border-radius:3px;font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 4px;margin-left:6px;vertical-align:1px;background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger)}
  .subcab{padding:6px 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--lapiz);background:var(--surface);border-bottom:1px solid var(--border-soft)}

  /* --- Pantalla de personal --- */
  .n-row{display:flex;gap:8px;padding:10px 2px;border-bottom:1px solid var(--linea);align-items:flex-start}
  .n-d{flex:1;min-width:0}
  .n-nom{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n-sub{font-size:11px;color:var(--lapiz);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n-tarea,.n-sel{width:100%;margin-top:5px;border:1px solid var(--linea);border-radius:4px;background:var(--surface);font-family:inherit;font-size:13px;padding:7px 8px;color:var(--tinta)}
  .n-tarea:focus,.n-sel:focus{outline:none;border-color:var(--casco);background:#fff}
  .n-acc{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  textarea.imp{width:100%;min-height:150px;border:1px solid var(--linea);border-radius:5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;padding:10px;margin-bottom:12px;resize:vertical;color:var(--tinta);background:var(--surface)}
  textarea.imp:focus{outline:none;border-color:var(--casco);background:#fff}
  .aviso{background:var(--acento-pale);border:1px solid #BFDDFB;border-radius:var(--radius-sm);padding:11px 13px;font-size:13px;margin-bottom:12px;line-height:1.45;color:#0B3C6B}
  .aviso.rojo{background:var(--danger-bg);border-color:var(--danger);color:#7A0710}
  .filtro{display:flex;gap:6px;margin-bottom:10px}
  .filtro button{flex:1;border:1px solid var(--linea);background:#fff;border-radius:4px;padding:8px 4px;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--lapiz);cursor:pointer}
  .filtro button.on{background:var(--acento);border-color:var(--acento);color:#fff}

  /* --- Exportar a PDF --- */
  .grupo{border:1px solid var(--linea);border-radius:5px;padding:11px 12px;margin-bottom:11px}
  .grupo h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lapiz);margin-bottom:9px}
  .op{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;cursor:pointer}
  .op input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--casco-osc)}
  .fechas{display:flex;gap:8px;margin-top:8px}
  .fechas input{flex:1;min-width:0;border:1px solid var(--linea);border-radius:4px;background:var(--surface);
                font-family:inherit;font-size:14px;padding:8px;color:var(--tinta)}
  .fechas input:focus{outline:none;border-color:var(--casco);background:#fff}
  .cuenta-sel{font-size:12px;color:var(--lapiz);margin-top:8px}

  /* El reporte sólo existe al imprimir. */
  #reporte{display:none}
  @media print{
    body.imprimiendo{background:#fff;color:#000;padding:0}
    body.imprimiendo > header,
    body.imprimiendo > .wrap,
    body.imprimiendo > .barra,
    body.imprimiendo > .modal,
    body.imprimiendo > .toast{display:none !important}
    body.imprimiendo #reporte{display:block !important}
    @page{margin:14mm}
  }
  /* --- Aspecto del informe impreso --- */
  #reporte{
    font-size:10.5pt;color:#111;line-height:1.35;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* Que los grises y las líneas salgan aunque el navegador no imprima fondos. */
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }

  /* Encabezado con la marca */
  #reporte .rep-head{
    display:flex;align-items:flex-start;gap:6mm;
    border-bottom:2.2pt solid #111;padding-bottom:3mm;margin-bottom:5mm;
  }
  #reporte .rep-logo{width:26mm;flex:0 0 auto}
  #reporte .rep-t{flex:1;min-width:0}
  #reporte .rep-t h1{
    font-family:ui-serif,'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    font-size:19pt;font-weight:600;letter-spacing:-.2pt;line-height:1;margin:0;
  }
  #reporte .rep-t .rep-sub{font-size:8.5pt;letter-spacing:.18em;text-transform:uppercase;color:#666;margin-top:1.5mm}
  #reporte .rep-meta{text-align:right;flex:0 0 auto;font-size:8.5pt;color:#444}
  #reporte .rep-meta .f{font-size:11pt;font-weight:700;color:#111;display:block;margin-bottom:1mm}

  /* Un día */
  #reporte .dia{margin-bottom:9mm}
  #reporte .dia + .dia{page-break-before:always}
  #reporte .dia > h2{
    font-size:12pt;font-weight:700;margin:0 0 3mm;
    border-bottom:.8pt solid #111;padding-bottom:1.2mm;
  }

  /* Resumen del día */
  #reporte table.resumen{width:auto;min-width:70mm;margin:0 0 5mm}
  #reporte table.resumen td{padding:1mm 6mm 1mm 0;border-bottom:.4pt solid #ddd}
  #reporte table.resumen td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;padding-right:0}
  #reporte table.resumen tr.tot td{border-top:1pt solid #111;border-bottom:0;font-weight:700;padding-top:1.5mm}

  /* Gremio */
  #reporte .gr{margin:0 0 5mm;page-break-inside:avoid}
  #reporte .gr > h3{
    font-size:9.5pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    background:#ECECF0;padding:1.6mm 2.5mm;margin:0 0 1.5mm;
    display:flex;justify-content:space-between;
  }
  #reporte .gr > h3 span{font-weight:600;letter-spacing:0;text-transform:none;color:#444}

  #reporte table.gente{width:100%;border-collapse:collapse;font-size:9pt}
  #reporte table.gente th{
    text-align:left;border-bottom:.8pt solid #111;padding:1.2mm 2mm;
    font-size:7.5pt;text-transform:uppercase;letter-spacing:.08em;color:#333;
  }
  #reporte table.gente td{border-bottom:.35pt solid #E3E3EA;padding:1.4mm 2mm;vertical-align:top}
  #reporte table.gente tbody tr:nth-child(even) td{background:#FAFAFC}
  #reporte table.gente td.i{width:7mm;color:#888;font-variant-numeric:tabular-nums}
  #reporte table.gente td.nom{font-weight:600}
  #reporte .no td.nom, #reporte .no td.est{color:#888;text-decoration:line-through}
  #reporte td.art-no{font-weight:700}
  #reporte .nota-gr{font-size:8.5pt;color:#444;margin-top:1.2mm;padding-left:2mm;border-left:2pt solid #ccc}

  /* Aviso de ART */
  #reporte .art-box{
    border:1pt solid #111;padding:2.5mm 3mm;margin:4mm 0 0;font-size:9pt;page-break-inside:avoid;
  }
  #reporte .art-box b{display:block;font-size:8pt;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1mm}

  /* Firmas */
  #reporte .firmas{display:flex;gap:14mm;margin-top:14mm;page-break-inside:avoid}
  #reporte .firmas div{flex:1;text-align:center;font-size:8.5pt;color:#444}
  #reporte .firmas .linea{border-top:.6pt solid #111;margin-bottom:1.5mm;height:0}

  #reporte .pie{margin-top:8mm;padding-top:2mm;border-top:.4pt solid #bbb;font-size:7.5pt;color:#777}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:50;background:var(--tinta);color:var(--casco);padding:10px 16px;border-radius:4px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{.barra,.add-item,.icono,.stepper button,.btn{display:none!important}}
</style>
</head>
<body>

<div id="splash">
  <div class="sp">
    <img src="../assets/mess-logo.svg" alt="Mess">
    <div class="sp-nom">Mess</div>
    <div class="sp-linea"></div>
    <div class="sp-sub">Parte de obra</div>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="titulo">Parte de obra · Personal</div>
    <div class="fecha-row">
      <input type="date" id="fecha">
      <div class="tablero">
        <div class="n" id="total">0</div>
        <div class="lbl">en obra</div>
      </div>
    </div>
    <div class="chapas" id="chapas"></div>
    <button class="instalar" id="btnInstalar" hidden>📲 Instalar en este equipo</button>
    <button class="nube" id="btnNube">
      <span class="nube-ico" id="nubeIco">☁</span>
      <span class="nube-txt" id="nubeTxt">Sin sincronizar — sólo en este equipo</span>
      <span class="nube-mas">＋</span>
    </button>
  </div>
</header>

<div class="wrap">
  <div id="gremios">
    <div class="vacio" id="avisoJS" style="padding:28px 10px;line-height:1.6">
      <b style="color:#D70015">La planilla no se está ejecutando.</b><br><br>
      Este archivo necesita abrirse con un navegador.<br>
      En el celular: mantené apretado el archivo en Descargas →<br>
      <b>Abrir con → Chrome</b>.
    </div>

  <button class="btn primario" id="btnEnviar">Enviar parte</button>
  <button class="btn" id="btnPersonal">Personal</button>
  <button class="btn" id="btnGremios">Gremios</button>
  <button class="btn" id="btnHistorial">Días</button>

  <div class="modal-box">
    <div id="modalContenido"></div>
    <button class="btn full" id="btnCerrar">Cerrar</button>
  </div>
</div>

<!-- Se arma sólo al exportar; en pantalla no se ve. -->
<div id="reporte"></div>

<!-- La base a la que sincroniza se define en config.js, al lado de este archivo. -->
<script src="config.js"></script>
<!-- ============ INICIO SCRIPT PRINCIPAL ============ -->
<script>
(function(){
  "use strict";

  /* =========================================================
     0) PRESENTACIÓN
     La salida ya está resuelta por CSS (animación con forwards),
     así que aunque esto falle la pantalla no queda tapada. Acá
     sólo se agrega poder saltearla tocando, y sacar el nodo del
     DOM una vez que terminó.
  ========================================================= */
  (function(){
    var sp = document.getElementById("splash");
    if (!sp) return;
    function irse(){
      sp.classList.add("fuera");
      setTimeout(function(){ if (sp.parentNode) sp.parentNode.removeChild(sp); }, 350);
    }
    sp.addEventListener("click", irse);
    setTimeout(irse, 2000);
  })();

  /* =========================================================
     0bis) INSTALAR
     En Chrome/Edge se usa el diálogo nativo. En iPhone no
     existe: Safari sólo deja "Compartir → Agregar a inicio",
     así que ahí se explica dónde tocar.
  ========================================================= */
  (function(){
    var btn = document.getElementById("btnInstalar");
    if (!btn) return;

    function yaInstalada(){
      return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
             window.navigator.standalone === true;
    }
    function esIOS(){
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
             (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }
    function oculta(){
      try { return localStorage.getItem("parteObra_instalarOculto") === "1"; } catch(e){ return false; }
    }

    if (yaInstalada() || oculta()) return;

    var propuesta = null;
    window.addEventListener("beforeinstallprompt", function(e){
      e.preventDefault();
      propuesta = e;
      btn.hidden = false;
    });
    // Safari nunca dispara ese evento: el botón se muestra igual y explica cómo.
    if (esIOS()) btn.hidden = false;

    window.addEventListener("appinstalled", function(){
      btn.hidden = true;
      try { localStorage.setItem("parteObra_instalarOculto", "1"); } catch(e){}
      toast("Instalada");
    });

    btn.addEventListener("click", function(){
      if (propuesta) {
        propuesta.prompt();
        propuesta.userChoice.then(function(r){
          if (r && r.outcome === "accepted") btn.hidden = true;
          propuesta = null;
        });
        return;
      }
      abrirModal('<h2>Instalar en este equipo</h2>' +
        (esIOS()
          ? '<div class="ayuda">En iPhone y iPad se agrega desde Safari, no hay botón automático.</div>' +
            '<div class="aviso"><b>1.</b> Tocá <b>Compartir</b> — el cuadrado con la flecha para arriba, abajo en el centro.<br><br>' +
            '<b>2.</b> Deslizá y elegí <b>«Agregar a pantalla de inicio»</b>.<br><br>' +
            '<b>3.</b> Tocá <b>Agregar</b>.</div>' +
            '<div class="ayuda">Queda como una app más, a pantalla completa y sin la barra del navegador.</div>'
          : '<div class="ayuda">En la computadora se instala desde el navegador.</div>' +
            '<div class="aviso">En <b>Chrome</b> o <b>Edge</b>, tocá el ícono de instalar (una pantalla con una flecha) ' +
            'a la derecha de la barra de direcciones. O desde el menú <b>⋮</b> → <b>Instalar</b>.<br><br>' +
            'En <b>Firefox</b> no se puede instalar: usá el link normal.</div>') +
        '<button class="btn ghost full" id="btnNoInstalar">No mostrar más este aviso</button>');
      document.getElementById("btnNoInstalar").addEventListener("click", function(){
        try { localStorage.setItem("parteObra_instalarOculto", "1"); } catch(e){}
        btn.hidden = true; cerrarModal();
      });
    });
  })();

  /* =========================================================
     1) PERSISTENCIA
     Prueba window.storage (vista previa de Claude); si no está,
     usa localStorage (archivo local o GitHub Pages).
  ========================================================= */
  var CLAVE = "parteObra_v2";
  var memoria = {};

  function leer(k){
    if (typeof window.storage !== "undefined" && window.storage) {
      return window.storage.get(k).then(function(r){ return r ? r.value : null; })
                                  .catch(function(){ return null; });
    }
    try { return Promise.resolve(localStorage.getItem(k)); }
    catch(e){ return Promise.resolve(memoria[k] || null); }
  }
  function escribir(k, v){
    if (typeof window.storage !== "undefined" && window.storage) {
      return window.storage.set(k, v).catch(function(){ memoria[k] = v; });
    }
    try { localStorage.setItem(k, v); } catch(e){ memoria[k] = v; }
    return Promise.resolve();
  }

  /* =========================================================
     2) ESTADO
     datos.gremios -> lista fija, se usa todos los días
     datos.dias[fecha].bloques -> lo cargado ese día por gremio
  ========================================================= */
  var datos = { wa: "", gremios: [], personal: [], dias: {} };
  var fechaActual = hoyISO();

  function hoyISO(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function uid(){ return Math.random().toString(36).slice(2, 9); }
  function it(cant, tarea){ return { id: uid(), cant: cant, tarea: tarea, presente: true }; }

  function sembrar(){
    var base = [
      ["Albañiles / Oficiales", [
        it(1, "Denis revocando cantero de la pileta"),
        it(2, "ayudantes"),
        it(2, "detalles de hormigón en cochera, después pasan al interior de los dptos")
      ]],
      ["Silleteros / Fachada", [ it(2, "fachada") ]],
      ["Pintores", [
        it(2, "tarquineros palier piso 10 (terminan palier y entran a los dptos)"),
        it(2, "negro y masilla en palier piso 9"),
        it(3, "interiores piso 1")
      ]],
      ["Yda / Applyseal", [ it(1, "termina el TB") ]],
      ["Electricistas", [ it(2, "cañerías y cable en cochera, terminando cocinas") ]]
    ];
    datos.gremios = [];
    datos.dias[fechaActual] = { bloques: [] };
    base.forEach(function(par){
      var id = uid();
      datos.gremios.push({ id: id, nombre: par[0] });
      datos.dias[fechaActual].bloques.push({ gid: id, nombre: par[0], nota: "", items: par[1] });
    });
  }

  // Convierte datos guardados con la versión anterior (gremios dentro del día)
  function migrar(){
    if (!datos.personal) datos.personal = [];
    if (datos.gremios && datos.gremios.length) return;
    if (!datos.dias) { datos.dias = {}; return; }
    datos.gremios = [];
    var mapa = {};
    Object.keys(datos.dias).sort().forEach(function(f){
      var d = datos.dias[f];
      if (!d.gremios) return;
      d.bloques = d.gremios.map(function(gr){
        if (!mapa[gr.nombre]) {
          var id = uid();
          mapa[gr.nombre] = id;
          datos.gremios.push({ id: id, nombre: gr.nombre });
        }
        return { gid: mapa[gr.nombre], nombre: gr.nombre, nota: gr.nota || "", items: gr.items || [] };
      });
      delete d.gremios;
    });
  }

  function dia(){ return datos.dias[fechaActual]; }

  /* ---------------------------------------------------------
     PERSONAL (nómina)
     La lista es fija y se usa todos los días, igual que los
     gremios. Cada día guarda aparte quién vino (asistencia).
  --------------------------------------------------------- */
  function nuevaPersona(nombre, cuil, art, desde){
    return { id: uid(), nombre: nombre, cuil: cuil || '', gremioId: '',
             tarea: '', art: art !== false, artDesde: desde || '', activo: true };
  }
  function personalActivo(){
    return datos.personal.filter(function(p){ return p.activo !== false; });
  }
  function personalDe(gid){
    return personalActivo().filter(function(p){ return p.gremioId === gid; });
  }
  // Sin gremio, o con un gremio que después se borró: si no, quedarían invisibles.
  function personalSinGremio(){
    return personalActivo().filter(function(p){
      if (!p.gremioId) return true;
      return !datos.gremios.some(function(g){ return g.id === p.gremioId; });
    });
  }
  function asistenciaDe(f){
    var d = datos.dias[f];
    if (!d.asistencia) d.asistencia = {};
    return d.asistencia;
  }
  // Sólo cuenta quien tiene marca explícita en ESE día. Así, alguien que se
  // da de alta hoy no aparece retroactivamente en los partes de la semana pasada.
  function vinoEn(f, pid){
    var d = datos.dias[f];
    return !!(d && d.asistencia && d.asistencia[pid] === true);
  }
  function vino(pid){ return vinoEn(fechaActual, pid); }
  function marcarVino(pid, v){ asistenciaDe(fechaActual)[pid] = !!v; }
  function sumarAHoy(pid){ asistenciaDe(fechaActual)[pid] = true; }

  /* Cuando baja algo de la nube, los objetos de `datos` se reemplazan por
     otros nuevos. Un botón dibujado antes que se guarde el objeto viejo le
     escribiría a algo que ya no está en la lista, y el cambio se pierde
     (había que hacerlo dos veces). Por eso todo handler resuelve por id
     recién cuando lo tocan. */
  function personaPorId(id){
    for (var i = 0; i < datos.personal.length; i++)
      if (datos.personal[i].id === id) return datos.personal[i];
    return null;
  }
  function gremioPorId(id){
    for (var i = 0; i < datos.gremios.length; i++)
      if (datos.gremios[i].id === id) return datos.gremios[i];
    return null;
  }
  function itemPorId(gid, iid){
    var b = bloqueDe(gid);
    if (!b) return null;
    for (var i = 0; i < b.items.length; i++)
      if (b.items[i].id === iid) return b.items[i];
    return null;
  }

  function bloqueDe(gid){
    var bs = dia().bloques;
    for (var i = 0; i < bs.length; i++) if (bs[i].gid === gid) return bs[i];
    return null;
  }

  // Arma el día: cada gremio de la lista arrastra las tareas del último día que las tenga
  function asegurarDia(f){
    var esNuevo = !datos.dias[f];
    if (esNuevo) datos.dias[f] = { bloques: [], asistencia: {} };
    var d = datos.dias[f];
    if (!d.bloques) d.bloques = [];
    if (!d.asistencia) d.asistencia = {};
    // Día nuevo: arranca con toda la nómina presente y el capataz destilda al que faltó.
    if (esNuevo) personalActivo().forEach(function(p){ d.asistencia[p.id] = true; });
    datos.gremios.forEach(function(gr){
      var existe = d.bloques.some(function(b){ return b.gid === gr.id; });
      if (!existe) d.bloques.push(bloqueDesdeHistorial(gr, f));
    });
    // Ordena los bloques según el orden de la lista de gremios
    var orden = {};
    datos.gremios.forEach(function(gr, i){ orden[gr.id] = i; });
    d.bloques.sort(function(a, b){
      var oa = orden[a.gid], ob = orden[b.gid];
      if (oa === undefined) return 1;
      if (ob === undefined) return -1;
      return oa - ob;
    });
  }

  function bloqueDesdeHistorial(gr, f){
    var previas = Object.keys(datos.dias).filter(function(x){ return x < f; }).sort().reverse();
    for (var i = 0; i < previas.length; i++) {
      var bs = datos.dias[previas[i]].bloques || [];
      for (var j = 0; j < bs.length; j++) {
        if (bs[j].gid === gr.id) {
          return {
            gid: gr.id, nombre: gr.nombre, nota: "",
            items: bs[j].items.map(function(x){
              return { id: uid(), cant: x.cant, tarea: x.tarea, presente: x.presente };
            })
          };
        }
      }
    }
    // Con la nómina cargada, el gremio arranca vacío: la gente sale del personal,
    // no de una fila de cantidad que sumaría de más.
    return { gid: gr.id, nombre: gr.nombre, nota: "",
             items: datos.personal.length ? [] : [ it(1, "") ] };
  }

  var guardarTimer = null;
  function guardar(){
    clearTimeout(guardarTimer);
    guardarTimer = setTimeout(function(){
      escribir(CLAVE, JSON.stringify(datos));
      subirTodo();
    }, 250);
  }

  /* =========================================================
     3) RENDER
  ========================================================= */
  var elGremios = document.getElementById("gremios");
  var elTotal   = document.getElementById("total");
  var elChapas  = document.getElementById("chapas");
  var elFecha   = document.getElementById("fecha");

  // Las "filas sueltas" son el modo viejo: una cantidad y una tarea, sin nombre.
  // Se mantienen para el personal que no está en la nómina (changas, subcontratos).
  function totalBloque(b){
    if (!b) return 0;
    return b.items.reduce(function(s,i){ return s + (i.presente ? (i.cant||0) : 0); }, 0);
  }
  function totalGremio(gid){
    var n = personalDe(gid).filter(function(p){ return vino(p.id); }).length;
    return n + totalBloque(bloqueDe(gid));
  }
  function totalSinGremio(){
    return personalSinGremio().filter(function(p){ return vino(p.id); }).length;
  }
  function totalDia(){
    var n = 0;
    datos.gremios.forEach(function(g){ n += totalGremio(g.id); });
    return n + totalSinGremio();
  }
  // Total de un día cualquiera (historial y CSV), sin depender de la fecha abierta.
  function totalDeDia(f){
    var d = datos.dias[f];
    if (!d) return 0;
    var n = (d.bloques || []).reduce(function(s,b){ return s + totalBloque(b); }, 0);
    personalActivo().forEach(function(p){ if (vinoEn(f, p.id)) n++; });
    return n;
  }
  function sinArtEnObra(){
    return personalActivo().filter(function(p){ return p.art === false && vino(p.id); });
  }

  function render(){
    elFecha.value = fechaActual;
    elGremios.innerHTML = "";

    if (!datos.gremios.length && !personalActivo().length) {
      elGremios.innerHTML = '<div class="vacio">Todavía no hay nada cargado.<br><br>' +
        'Tocá «Personal» para traer la nómina,<br>o «Gremios» para armar la lista de gremios.</div>';
      actualizarTablero();
      return;
    }

    datos.gremios.forEach(function(gr){ elGremios.appendChild(tarjetaGremio(gr)); });

    var sueltos = personalSinGremio();
    if (sueltos.length) elGremios.appendChild(tarjetaSinGremio(sueltos));

    actualizarTablero();
  }

  function cabecera(nombre, t){
    var head = document.createElement("div");
    head.className = "gremio-head";
    var nom = document.createElement("div");
    nom.className = "nom"; nom.textContent = nombre;
    var cta = document.createElement("div");
    cta.className = "cuenta" + (t === 0 ? " cero" : "");
    cta.textContent = t;
    head.appendChild(nom); head.appendChild(cta);
    return head;
  }

  function subcab(txt){
    var d = document.createElement("div");
    d.className = "subcab"; d.textContent = txt;
    return d;
  }

  function tarjetaGremio(gr){
    var b = bloqueDe(gr.id);
    var card = document.createElement("div");
    card.className = "gremio";
    card.setAttribute("data-gid", gr.id);
    card.appendChild(cabecera(gr.nombre, totalGremio(gr.id)));

    var gente = personalDe(gr.id);
    gente.forEach(function(p){ card.appendChild(filaPersona(p)); });

    if (b) {
      if (gente.length && b.items.length) card.appendChild(subcab("Sin nombre (por cantidad)"));
      b.items.forEach(function(item){ card.appendChild(filaItem(b, item)); });

      var nota = document.createElement("textarea");
      nota.className = "nota"; nota.rows = 1;
      nota.placeholder = "Nota del día (ej: no vinieron por la lluvia)";
      nota.value = b.nota;
      nota.addEventListener("input", function(){
        var bl = bloqueDe(gr.id);
        if (bl) { bl.nota = nota.value; guardar(); }
      });
      card.appendChild(nota);

      var add = document.createElement("button");
      add.className = "add-item"; add.textContent = "+ Tarea sin nombre";
      add.addEventListener("click", function(){
        var bl = bloqueDe(gr.id);
        if (!bl) return;
        bl.items.push(it(1, ""));
        guardar(); render();
        enfocarUltimaVacia();
      });
      card.appendChild(add);
    }
    return card;
  }

  // Nadie puede quedar fuera de la pantalla por no tener gremio todavía.
  function tarjetaSinGremio(gente){
    var card = document.createElement("div");
    card.className = "gremio";
    card.setAttribute("data-gid", "");
    card.appendChild(cabecera("Sin gremio asignado", totalSinGremio()));
    card.appendChild(subcab("Asignales el gremio desde «Personal»"));
    gente.forEach(function(p){ card.appendChild(filaPersona(p)); });
    return card;
  }

  function filaPersona(p){
    var fila = document.createElement("div");
    var presente = vino(p.id);
    fila.className = "persona" + (presente ? "" : " off");

    var d = document.createElement("div");
    d.className = "pd";

    var nom = document.createElement("div");
    nom.className = "pn";
    nom.textContent = p.nombre;
    if (p.art === false) {
      var chip = document.createElement("span");
      chip.className = "chip"; chip.textContent = "SIN ART";
      nom.appendChild(chip);
    }

    var tarea = document.createElement("input");
    tarea.className = "pt"; tarea.type = "text";
    tarea.value = p.tarea || "";
    tarea.placeholder = "Qué está haciendo";
    tarea.addEventListener("input", function(){
      var x = personaPorId(p.id);
      if (x) { x.tarea = tarea.value; guardar(); }
    });

    d.appendChild(nom); d.appendChild(tarea);

    var btn = document.createElement("button");
    btn.className = "icono " + (presente ? "presente" : "ausente");
    btn.textContent = presente ? "✓" : "✕";
    btn.title = presente ? "Está en obra" : "No vino";
    btn.addEventListener("click", function(){
      marcarVino(p.id, !vino(p.id));
      guardar(); render();
    });

    fila.appendChild(d); fila.appendChild(btn);
    return fila;
  }

  function enfocarUltimaVacia(){
    var todas = Array.prototype.slice.call(elGremios.querySelectorAll(".tarea"));
    for (var k = todas.length - 1; k >= 0; k--) {
      if (todas[k].value === "") { todas[k].focus(); break; }
    }
  }

  function filaItem(b, item){
    var fila = document.createElement("div");
    fila.className = "item" + (item.presente ? "" : " off");

    var step = document.createElement("div");
    step.className = "stepper";
    var menos = document.createElement("button"); menos.textContent = "−";
    var val = document.createElement("input");
    val.className = "val"; val.type = "text"; val.inputMode = "numeric"; val.value = item.cant;
    var mas = document.createElement("button"); mas.textContent = "+";

    function elItem(){ return itemPorId(b.gid, item.id) || item; }
    menos.addEventListener("click", function(){
      var i = elItem();
      i.cant = Math.max(0, (i.cant||0) - 1);
      val.value = i.cant; guardar(); actualizarTablero(); refrescarCuentas();
    });
    mas.addEventListener("click", function(){
      var i = elItem();
      i.cant = (i.cant||0) + 1;
      val.value = i.cant; guardar(); actualizarTablero(); refrescarCuentas();
    });
    val.addEventListener("input", function(){
      var n = parseInt(val.value.replace(/\D/g, ""), 10);
      elItem().cant = isNaN(n) ? 0 : n;
      guardar(); actualizarTablero(); refrescarCuentas();
    });
    val.addEventListener("blur", function(){ val.value = elItem().cant; });
    step.appendChild(menos); step.appendChild(val); step.appendChild(mas);

    var tarea = document.createElement("input");
    tarea.className = "tarea"; tarea.type = "text"; tarea.value = item.tarea;
    tarea.placeholder = "Qué está haciendo";
    tarea.addEventListener("input", function(){ elItem().tarea = tarea.value; guardar(); });

    var pres = document.createElement("button");
    pres.className = "icono " + (item.presente ? "presente" : "ausente");
    pres.textContent = item.presente ? "✓" : "✕";
    pres.title = item.presente ? "Está en obra" : "No vino";
    pres.addEventListener("click", function(){
      var i = elItem(); i.presente = !i.presente; guardar(); render();
    });

    var quitar = document.createElement("button");
    quitar.className = "icono"; quitar.textContent = "✕"; quitar.title = "Borrar tarea";
    quitar.style.fontSize = "12px";
    quitar.addEventListener("click", function(){
      var bl = bloqueDe(b.gid) || b;
      bl.items = bl.items.filter(function(x){ return x.id !== item.id; });
      guardar(); render();
    });

    fila.appendChild(step); fila.appendChild(tarea);
    fila.appendChild(pres); fila.appendChild(quitar);
    return fila;
  }

  function refrescarCuentas(){
    Array.prototype.forEach.call(elGremios.querySelectorAll(".gremio"), function(card){
      var cta = card.querySelector(".cuenta");
      if (!cta) return;
      var gid = card.getAttribute("data-gid");
      var t = gid ? totalGremio(gid) : totalSinGremio();
      cta.textContent = t;
      cta.className = "cuenta" + (t === 0 ? " cero" : "");
    });
  }

  function chapa(n, txt, alerta){
    var c = document.createElement("div");
    c.className = "chapa" + (alerta ? " alerta" : "");
    var b = document.createElement("b"); b.textContent = n;
    c.appendChild(b);
    c.appendChild(document.createTextNode(" " + txt));
    elChapas.appendChild(c);
  }

  function actualizarTablero(){
    elTotal.textContent = totalDia();
    elChapas.innerHTML = "";
    datos.gremios.forEach(function(g){
      var t = totalGremio(g.id);
      if (t) chapa(t, g.nombre);
    });
    var sg = totalSinGremio();
    if (sg) chapa(sg, "sin gremio");
    var sa = sinArtEnObra().length;
    if (sa) chapa(sa, "SIN ART", true);
  }

  /* =========================================================
     4) TEXTO DEL PARTE
  ========================================================= */
  var DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  function fechaLarga(iso){
    var p = iso.split("-");
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return DIAS[d.getDay()] + " " + p[2] + "/" + p[1] + "/" + p[0];
  }

  function lineaPersona(p){
    return "• " + p.nombre + (p.tarea ? " — " + p.tarea : "");
  }

  function generarTexto(){
    var L = [];
    L.push("PARTE DE OBRA — " + fechaLarga(fechaActual));
    L.push("Personal en obra: " + totalDia());
    L.push("");

    datos.gremios.forEach(function(g){
      var b        = bloqueDe(g.id);
      var gente    = personalDe(g.id);
      var vinieron = gente.filter(function(p){ return vino(p.id); });
      var faltaron = gente.filter(function(p){ return !vino(p.id); });
      var sueltas  = b ? b.items.filter(function(i){ return i.presente && i.cant > 0; }) : [];
      var sueltasNo= b ? b.items.filter(function(i){ return !i.presente && i.tarea; }) : [];
      var nota     = b ? b.nota : "";
      if (!vinieron.length && !faltaron.length && !sueltas.length && !sueltasNo.length && !nota) return;

      L.push(g.nombre.toUpperCase() + " (" + totalGremio(g.id) + ")");
      vinieron.forEach(function(p){ L.push(lineaPersona(p)); });
      sueltas.forEach(function(i){ L.push(i.cant + " " + i.tarea); });
      faltaron.forEach(function(p){ L.push("— no vino: " + p.nombre); });
      sueltasNo.forEach(function(i){ L.push("— no vino: " + i.tarea); });
      if (nota) L.push("· " + nota);
      L.push("");
    });

    var sg = personalSinGremio().filter(function(p){ return vino(p.id); });
    if (sg.length) {
      L.push("SIN GREMIO ASIGNADO (" + sg.length + ")");
      sg.forEach(function(p){ L.push(lineaPersona(p)); });
      L.push("");
    }

    // Va al final y bien visible: es lo que no puede pasar desapercibido.
    var sa = sinArtEnObra();
    if (sa.length) {
      L.push("*** EN OBRA SIN ART (" + sa.length + ") ***");
      sa.forEach(function(p){ L.push("— " + p.nombre); });
      L.push("");
    }
    return L.join("\n").trim();
  }

  /* =========================================================
     5bis) SINCRONIZAR ENTRE EQUIPOS (con login)
     Los datos viven en parteObra/<obraId> del proyecto de la
     obra, aparte del sistema de gestión. Sólo entra quien
     tenga cuenta Y esté en la lista de permitidos.
     El localStorage sigue siendo la fuente local: la planilla
     abre y se usa sin señal; la nube es un espejo.
  ========================================================= */
  var FB = (window.OBRA_CONFIG && window.OBRA_CONFIG.firebase) || {};
  var OBRA_ID = (window.OBRA_CONFIG && window.OBRA_CONFIG.obraId) || "obra1";
  // Con login hacen falta las dos: apiKey para Authentication y
  // databaseURL para la base.
  function hayBase(){ return !!(FB.databaseURL && FB.apiKey); }
  function configFirebase(){
    var c = { apiKey: FB.apiKey, databaseURL: FB.databaseURL };
    if (FB.projectId)  c.projectId  = FB.projectId;
    if (FB.authDomain) c.authDomain = FB.authDomain;
    else if (FB.projectId) c.authDomain = FB.projectId + ".firebaseapp.com";
    return c;
  }

  var nube = { ref: null, estado: "off", ultimo: "", usuario: null, uid: "", error: "", motivo: "" };

  function pintarNube(){
    var b = document.getElementById("btnNube");
    var t = document.getElementById("nubeTxt");
    var i = document.getElementById("nubeIco");
    if (!b || !t) return;
    b.className = "nube" +
      (nube.estado === "ok" ? " on" :
       (nube.estado === "mal" ? " mal" :
        (nube.estado === "sinred" ? " gris" : "")));
    if (nube.estado === "ok") {
      if (i) i.textContent = "☁";
      t.textContent = "Sincronizado — " + (nube.usuario || "");
    } else if (nube.estado === "yendo") {
      if (i) i.textContent = "☁";
      t.textContent = "Conectando…";
    } else if (nube.estado === "sinred") {
      if (i) i.textContent = "☁";
      t.textContent = "Sin señal — sincroniza cuando vuelva";
    } else if (nube.estado === "mal") {
      if (i) i.textContent = "⚠";
      t.textContent = (nube.motivo === "permiso")
        ? "Falta habilitar tu cuenta — tocá acá"
        : "No sincroniza — tocá acá";
    } else if (!hayBase()) {
      if (i) i.textContent = "☁";
      t.textContent = "Sin sincronizar — falta configurar";
    } else {
      if (i) i.textContent = "☁";
      t.textContent = "Entrar para sincronizar";
    }
  }

  // El SDK se baja recién cuando hace falta: sin configurar,
  // la planilla no pide nada a la red y abre igual de rápido.
  var fbCargando = false, fbCola = [];
  function cargarFirebase(cb){
    if (window.firebase && window.firebase.database && window.firebase.auth) return cb(true);
    fbCola.push(cb);
    if (fbCargando) return;
    fbCargando = true;
    var urls = ["https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js",
                "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js",
                "https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"];
    var i = 0;
    function listo(ok){
      fbCargando = false;
      var cola = fbCola; fbCola = [];
      cola.forEach(function(f){ f(ok); });
    }
    (function siguiente(){
      if (i >= urls.length) {
        try { if (!firebase.apps.length) firebase.initializeApp(configFirebase()); }
        catch(e){ return listo(false); }
        return listo(true);
      }
      var sc = document.createElement("script");
      sc.src = urls[i++];
      sc.onload = siguiente;
      sc.onerror = function(){ listo(false); };
      document.head.appendChild(sc);
    })();
  }

  /* ---------------------------------------------------------
     Firebase NO conserva los arreglos: si tienen huecos los
     devuelve como objeto con claves numéricas, y si quedan
     vacíos borra la clave entera. Todo lo que entra y sale de
     la nube pasa por acá, así el resto del código siempre ve
     arreglos de verdad.
  --------------------------------------------------------- */
  function aArray(x){
    if (Array.isArray(x)) return x.filter(function(i){ return i != null; });
    if (x && typeof x === "object") {
      return Object.keys(x)
        .sort(function(a, b){ return (+a) - (+b); })
        .map(function(k){ return x[k]; })
        .filter(function(i){ return i != null; });
    }
    return [];
  }

  function normPersona(p){
    p = p || {};
    return { id: p.id || uid(), nombre: p.nombre || "", cuil: p.cuil || "",
             gremioId: p.gremioId || "", tarea: p.tarea || "",
             art: p.art !== false, artDesde: p.artDesde || "", activo: p.activo !== false };
  }
  function normItem(i){
    i = i || {};
    var n = parseInt(i.cant, 10);
    return { id: i.id || uid(), cant: isNaN(n) ? 0 : n,
             tarea: i.tarea || "", presente: i.presente !== false };
  }
  function normBloque(b){
    b = b || {};
    return { gid: b.gid || "", nombre: b.nombre || "", nota: b.nota || "",
             items: aArray(b.items).map(normItem) };
  }

  function normalizar(v){
    v = v || {};
    var d = {
      gremios: aArray(v.gremios).map(function(g){
        g = g || {};
        return { id: g.id || uid(), nombre: g.nombre || "" };
      }),
      personal: aArray(v.personal).map(normPersona),
      dias: {}
    };
    var dias = v.dias || {};
    Object.keys(dias).forEach(function(f){
      var x = dias[f] || {};
      var a = x.asistencia || {}, limpia = {};
      Object.keys(a).forEach(function(k){ limpia[k] = a[k] === true; });
      d.dias[f] = { bloques: aArray(x.bloques).map(normBloque), asistencia: limpia };
    });
    return d;
  }

  // Los dos lados de la comparación pasan por la misma normalización,
  // así el eco de la nube no se confunde con un cambio real.
  function paraNube(){
    return normalizar({ gremios: datos.gremios, personal: datos.personal, dias: datos.dias });
  }

  function subirTodo(){
    if (!nube.ref) return;
    var payload = paraNube();
    nube.ultimo = JSON.stringify(payload);
    nube.ref.set(payload).then(function(){
      nube.estado = "ok"; nube.motivo = ""; pintarNube();
    }).catch(marcarError);
  }

  function escribiendo(){
    var a = document.activeElement;
    return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"));
  }

  function bajarDeNube(v){
    var n = normalizar(v);
    var entrante = JSON.stringify(n);
    if (entrante === nube.ultimo) return;      // ya procesamos exactamente esto
    nube.ultimo = entrante;
    if (entrante === JSON.stringify(paraNube())) return;   // ya lo tenemos igual

    // Si algo viniera mal formado, no se cae la planilla: se queda con lo local.
    try {
      datos.gremios  = n.gremios;
      datos.personal = n.personal;
      datos.dias     = n.dias;
      escribir(CLAVE, JSON.stringify(datos));
      asegurarDia(fechaActual);
      // Si está tipeando no le arrebato el foco: sólo actualizo los números.
      if (escribiendo()) actualizarTablero(); else render();
      guardar();   // sube lo que haya reconciliado asegurarDia()
    } catch(e) {
      if (window.console) console.error("No pude aplicar lo que bajó de la nube:", e);
    }
  }

  function marcarError(e){
    var c = e && e.code ? e.code : "";
    nube.motivo = (c === "PERMISSION_DENIED" || c === "permission-denied") ? "permiso" : "otro";
    nube.error  = mensajeError(e);
    nube.estado = "mal";
    pintarNube();
  }

  function mensajeError(e){
    var c = e && e.code ? e.code : "";
    if (c === "PERMISSION_DENIED" || c === "permission-denied")
      return "Tu cuenta entró bien, pero no está habilitada para esta obra. Hay que agregarla a «permitidos» en la consola de Firebase.";
    if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found")
      return "Mail o contraseña incorrectos.";
    if (c === "auth/invalid-email")        return "Ese mail no tiene un formato válido.";
    if (c === "auth/too-many-requests")    return "Demasiados intentos seguidos. Esperá un rato y probá de nuevo.";
    if (c === "auth/network-request-failed") return "Sin conexión. La planilla sigue funcionando en este equipo.";
    if (c === "auth/operation-not-allowed")
      return "Falta habilitar el ingreso con mail y contraseña en Firebase (Authentication → Sign-in method).";
    return (e && e.message) ? e.message : String(e);
  }

  function conectarDatos(){
    try {
      nube.ref = firebase.database().ref("parteObra/" + OBRA_ID);
    } catch(e){ marcarError(e); return; }
    nube.estado = "yendo"; pintarNube();
    nube.ref.on("value", function(snap){
      var v = snap.val();
      nube.estado = "ok"; nube.motivo = ""; pintarNube();
      if (!v) { subirTodo(); return; }    // primera vez: sube lo que hay
      bajarDeNube(v);
    }, marcarError);
  }

  function soltarDatos(){
    if (nube.ref) { try { nube.ref.off(); } catch(e){} }
    nube.ref = null; nube.ultimo = "";
  }

  // Arranca el login: si ya había sesión, Firebase la recuerda y entra solo.
  function iniciarNube(){
    pintarNube();
    if (!hayBase()) return;
    cargarFirebase(function(ok){
      if (!ok) {
        nube.estado = "sinred";
        nube.error = "";
        pintarNube(); return;
      }
      firebase.auth().onAuthStateChanged(function(u){
        if (u) {
          nube.usuario = u.email || "";
          nube.uid     = u.uid || "";
          conectarDatos();
        } else {
          nube.usuario = null;
          nube.uid = "";
          soltarDatos();
          nube.estado = "off";
          pintarNube();
        }
      });
    });
  }

  // Al volver la señal, reintenta solo: nadie tiene que acordarse de tocar nada.
  window.addEventListener("online", function(){
    if (nube.estado === "sinred") iniciarNube();
  });

  function entrar(mail, clave, cuando){
    cargarFirebase(function(ok){
      if (!ok) return cuando("No se pudo cargar Firebase. ¿Hay señal?");
      firebase.auth().signInWithEmailAndPassword(mail, clave)
        .then(function(){ cuando(null); })
        .catch(function(e){ cuando(mensajeError(e)); });
    });
  }

  function salir(){
    if (!(window.firebase && firebase.auth)) return;
    firebase.auth().signOut().catch(function(){});
  }

  document.getElementById("btnNube").addEventListener("click", abrirNube);

  function abrirNube(){
    if (!hayBase()) {
      abrirModal('<h2>Compartir la planilla</h2>' +
        '<div class="ayuda">Para que la planilla se vea desde otra compu o celular falta terminar de configurarla.</div>' +
        '<div class="aviso"><b>Qué falta:</b> cargar <b>apiKey</b> y <b>databaseURL</b> del proyecto de Firebase en ' +
        '<b>obra/config.js</b>, habilitar el ingreso con mail y contraseña, y publicar las reglas.' +
        '<br><br>Mientras tanto la planilla anda igual: guarda en este equipo.</div>');
      return;
    }

    if (nube.estado === "sinred") {
      abrirModal('<h2>Sin señal</h2>' +
        '<div class="aviso">No hay conexión, así que por ahora no se sincroniza. ' +
        '<b>No perdés nada</b>: todo lo que cargues queda guardado en este equipo y sube solo ' +
        'cuando vuelva la señal.</div>' +
        '<div class="ayuda">No hace falta que hagas nada.</div>');
      return;
    }

    if (nube.estado === "mal" && nube.motivo === "permiso") {
      abrirModal('<h2>Falta habilitar tu cuenta</h2>' +
        '<div class="aviso rojo">Entraste bien como <b>' + escapar(nube.usuario || "") + '</b>, ' +
        'pero esta cuenta todavía no está habilitada para la obra.</div>' +
        '<div class="ayuda">Copiá este código y cargalo en Firebase → Realtime Database → Datos, ' +
        'dentro de <b>permitidos</b>, con el valor <b>true</b>. Es un paso que se hace una sola vez ' +
        'por persona.</div>' +
        '<div class="link-caja" id="uidCaja"></div>' +
        '<button class="btn full primario-wa" id="btnCopiarUid">Copiar el código</button>' +
        '<div class="ayuda">Si ya lo cargaste, tocá acá: cuando Firebase rechaza la conexión la corta, ' +
        'y hay que volver a engancharla.</div>' +
        '<button class="btn full" id="btnReintentar">Ya lo cargué — reintentar</button>' +
        '<button class="btn ghost full" id="btnSalir">Cerrar sesión</button>');
      document.getElementById("uidCaja").textContent = nube.uid || "(sin código)";
      document.getElementById("btnCopiarUid").addEventListener("click", function(){ copiarTexto(nube.uid || ""); });
      document.getElementById("btnReintentar").addEventListener("click", function(){
        cerrarModal(); toast("Reintentando…");
        soltarDatos();
        nube.motivo = ""; nube.error = "";
        conectarDatos();
      });
      document.getElementById("btnSalir").addEventListener("click", function(){
        salir(); cerrarModal(); toast("Sesión cerrada");
      });
      return;
    }

    if (nube.usuario) {
      abrirModal('<h2>Sincronización</h2>' +
        (nube.estado === "mal"
          ? '<div class="aviso rojo"><b>No está sincronizando.</b><br>' + escapar(nube.error) + '</div>'
          : '<div class="aviso"><b>Todo bien.</b> Lo que cargues acá se ve en los otros equipos que entren con una cuenta habilitada.</div>') +
        '<div class="ayuda">Sesión iniciada como <b>' + escapar(nube.usuario) + '</b>. ' +
        'Queda abierta en este equipo: no hay que entrar cada vez.</div>' +
        '<button class="btn ghost full" id="btnSalir">Cerrar sesión en este equipo</button>');
      document.getElementById("btnSalir").addEventListener("click", function(){
        if (!confirm("¿Cerrar sesión en este equipo?\n\nDeja de sincronizar. Los datos que ya están acá no se borran.")) return;
        salir(); cerrarModal(); toast("Sesión cerrada");
      });
      return;
    }

    abrirModal('<h2>Entrar</h2>' +
      '<div class="ayuda">Entrá con la cuenta que te dieron para esta obra. La sesión queda abierta en este equipo: ' +
      'se hace una sola vez.</div>' +
      '<div id="loginError"></div>' +
      '<input class="campo" type="email" id="logMail" placeholder="Mail" autocomplete="username" inputmode="email">' +
      '<input class="campo" type="password" id="logClave" placeholder="Contraseña" autocomplete="current-password">' +
      '<button class="btn full primario-wa" id="btnEntrar">Entrar</button>' +
      '<div class="ayuda" style="margin-top:12px">Sin entrar, la planilla funciona igual pero los datos quedan sólo en este equipo.</div>');

    var mail = document.getElementById("logMail");
    var clave = document.getElementById("logClave");
    var btn = document.getElementById("btnEntrar");

    function intentar(){
      var m = mail.value.trim(), c = clave.value;
      if (!m || !c) { (m ? clave : mail).focus(); return; }
      btn.disabled = true; btn.textContent = "Entrando…";
      document.getElementById("loginError").innerHTML = "";
      entrar(m, c, function(err){
        btn.disabled = false; btn.textContent = "Entrar";
        if (err) {
          document.getElementById("loginError").innerHTML =
            '<div class="aviso rojo">' + escapar(err) + '</div>';
          clave.value = ""; clave.focus();
          return;
        }
        cerrarModal(); toast("Sincronizando");
      });
    }
    btn.addEventListener("click", intentar);
    clave.addEventListener("keydown", function(e){ if (e.key === "Enter") intentar(); });
    mail.addEventListener("keydown", function(e){ if (e.key === "Enter") clave.focus(); });
    mail.focus();
  }

  function escapar(t){

  /* ---- Personal (nómina) ---- */
  var filtroPersonal = "todos";
  var buscaPersonal = "";

  // Sin tildes y en minúscula: buscar "albaniles" tiene que encontrar "Albañiles".
  function _plano(t){
    return String(t == null ? "" : t).toLowerCase()
      .replace(/[áàäâ]/g, "a").replace(/[éèëê]/g, "e").replace(/[íìïî]/g, "i")
      .replace(/[óòöô]/g, "o").replace(/[úùüû]/g, "u").replace(/ñ/g, "n");
  }

  // Busca en nombre, gremio, tarea y CUIL. Varias palabras: tienen que estar todas.
  function coincide(p, texto){
    var q = _plano(texto).split(/\s+/).filter(function(x){ return x; });
    if (!q.length) return true;
    var g = gremioPorId(p.gremioId);
    var heno = _plano([p.nombre, g ? g.nombre : "", p.tarea, p.cuil].join(" "));
    return q.every(function(t){ return heno.indexOf(t) >= 0; });
  }

  function pintarPersonal(){
    var cont = document.getElementById("pLista");
    if (!cont) return;

    var todos  = personalActivo();
    var sinArt = todos.filter(function(p){ return p.art === false; });
    var sinG   = personalSinGremio();

    var res = document.getElementById("pResumen");
    if (res) {
      res.textContent = todos.length + (todos.length === 1 ? " persona" : " personas") +
                        " · " + sinArt.length + " sin ART · " + sinG.length + " sin gremio";
    }
    modalContenido.querySelectorAll("[data-f]").forEach(function(b){
      b.className = (b.getAttribute("data-f") === filtroPersonal) ? "on" : "";
    });

    var lista = todos;
    if (filtroPersonal === "singremio") lista = sinG;
    if (filtroPersonal === "sinart")    lista = sinArt;

    var enFiltro = lista.length;
    if (buscaPersonal.trim()) {
      lista = lista.filter(function(p){ return coincide(p, buscaPersonal); });
      if (res) res.textContent = lista.length + " de " + enFiltro +
                                 (enFiltro === 1 ? " persona" : " personas") + " coinciden";
    }

    cont.innerHTML = "";
    if (!lista.length) {
      cont.innerHTML = '<div class="vacio">' +
        (buscaPersonal.trim() ? "Nadie coincide con «" + escapar(buscaPersonal.trim()) + "»."

                          : "Todavía no hay personal cargado.<br>Escribí un nombre abajo, o traé la lista completa con «Importar nómina de ART».")) +
