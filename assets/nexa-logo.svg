<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Nexa">
  <defs>
    <radialGradient id="nexaSphere" cx="38%" cy="33%" r="72%">
      <stop offset="0%" stop-color="#D6CCFF"/>
      <stop offset="42%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#3A1E8C"/>
    </radialGradient>
    <linearGradient id="nexaOrbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="nexaGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Órbitas (galaxia) -->
  <g fill="none" stroke="url(#nexaOrbit)" stroke-width="3.6" stroke-linecap="round">
    <ellipse cx="100" cy="100" rx="84" ry="30" transform="rotate(0 100 100)" opacity="0.95"/>
    <ellipse cx="100" cy="100" rx="84" ry="30" transform="rotate(60 100 100)" opacity="0.8"/>
    <ellipse cx="100" cy="100" rx="84" ry="30" transform="rotate(120 100 100)" opacity="0.65"/>
  </g>

  <!-- Nodos sobre las órbitas -->
  <g fill="#22D3EE">
    <circle cx="184" cy="100" r="5.5"/>
    <circle cx="142" cy="28" r="4"/>
    <circle cx="58" cy="172" r="4.5"/>
  </g>
  <circle cx="16" cy="100" r="3" fill="#C084FC"/>

  <!-- Esfera central -->
  <circle cx="100" cy="100" r="25" fill="url(#nexaSphere)" filter="url(#nexaGlow)"/>
  <ellipse cx="92" cy="91" rx="8" ry="5" fill="#FFFFFF" opacity="0.35"/>
</svg>
