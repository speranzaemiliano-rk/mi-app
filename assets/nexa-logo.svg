<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Nexa">
  <defs>
    <radialGradient id="nexaSphere" cx="38%" cy="33%" r="72%">
      <stop offset="0%" stop-color="#EAE4FF"/>
      <stop offset="45%" stop-color="#9E86FF"/>
      <stop offset="100%" stop-color="#6D4BE0"/>
    </radialGradient>
    <linearGradient id="nexaOrbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="nexaGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- El movimiento se hace con animación SMIL (<animateTransform>), no con CSS.
         Motivo: cuando el logo se usa como <img src="nexa-logo.svg"> —que es como lo
         usa la presentación— el navegador NO ejecuta las animaciones CSS internas,
         pero SÍ las SMIL. Así el logo se mueve en cualquier lado, sin JavaScript y
         sin tener que tocar el código de la app que lo muestra. -->
  </defs>

  <!-- Campo de estrellas (galaxia) -->
  <g fill="#C084FC">
    <circle cx="30" cy="42" r="1.6" opacity="0.8"/>
    <circle cx="168" cy="54" r="1.3" opacity="0.7"/>
    <circle cx="176" cy="150" r="1.7" opacity="0.75"/>
    <circle cx="44" cy="160" r="1.2" opacity="0.65"/>
    <circle cx="150" cy="176" r="1.4" opacity="0.6"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="22" cy="118" r="1.3" opacity="0.7"/>
    <circle cx="120" cy="20" r="1.5" opacity="0.75"/>
    <circle cx="182" cy="96" r="1.2" opacity="0.6"/>
  </g>

  <!-- Órbitas: giran lento, como una galaxia -->
  <g fill="none" stroke="url(#nexaOrbit)" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 100 100" to="360 100 100" dur="48s" repeatCount="indefinite"/>
    <ellipse cx="100" cy="100" rx="86" ry="28" transform="rotate(0 100 100)" opacity="0.95"/>
    <ellipse cx="100" cy="100" rx="86" ry="28" transform="rotate(30 100 100)" opacity="0.85"/>
    <ellipse cx="100" cy="100" rx="86" ry="28" transform="rotate(60 100 100)" opacity="0.75"/>
    <ellipse cx="100" cy="100" rx="86" ry="28" transform="rotate(90 100 100)" opacity="0.68"/>
    <ellipse cx="100" cy="100" rx="86" ry="28" transform="rotate(120 100 100)" opacity="0.6"/>
    <ellipse cx="100" cy="100" rx="86" ry="28" transform="rotate(150 100 100)" opacity="0.52"/>
  </g>

  <!-- Nodos: giran al revés y más lento, para dar profundidad -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="360 100 100" to="0 100 100" dur="72s" repeatCount="indefinite"/>
    <g fill="#22D3EE">
      <circle cx="186" cy="100" r="5"/>
      <circle cx="100" cy="14" r="4"/>
      <circle cx="143" cy="26" r="3.2"/>
    </g>
    <g fill="#C084FC">
      <circle cx="14" cy="100" r="3.4"/>
      <circle cx="57" cy="174" r="3.2"/>
      <circle cx="26" cy="57" r="2.8"/>
    </g>
  </g>

  <!-- Esfera central translúcida (las órbitas se ven a través) -->
  <circle cx="100" cy="100" r="24" fill="url(#nexaSphere)" fill-opacity="0.5" filter="url(#nexaGlow)">
    <animate attributeName="fill-opacity" values="0.5;0.78;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="24" fill="none" stroke="#EAE4FF" stroke-width="1.2" stroke-opacity="0.55"/>
  <ellipse cx="92" cy="90" rx="7.5" ry="4.5" fill="#FFFFFF" opacity="0.5"/>
</svg>
