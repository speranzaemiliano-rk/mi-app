<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nexa">
  <defs>
    <radialGradient id="nxBg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#2A1466"/>
      <stop offset="60%" stop-color="#160B38"/>
      <stop offset="100%" stop-color="#0B0620"/>
    </radialGradient>
    <radialGradient id="nxSphere" cx="38%" cy="33%" r="72%">
      <stop offset="0%" stop-color="#D6CCFF"/>
      <stop offset="42%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#3A1E8C"/>
    </radialGradient>
    <linearGradient id="nxOrbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="nxGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo full-bleed (maskable) -->
  <rect width="512" height="512" fill="url(#nxBg)"/>

  <!-- Galaxia centrada dentro de la zona segura (~64%) -->
  <g transform="translate(96 96) scale(1.6)">
    <!-- Estrellas -->
    <g fill="#C084FC">
      <circle cx="30" cy="42" r="1.6" opacity="0.8"/>
      <circle cx="168" cy="54" r="1.3" opacity="0.7"/>
      <circle cx="176" cy="150" r="1.7" opacity="0.75"/>
      <circle cx="44" cy="160" r="1.2" opacity="0.65"/>
      <circle cx="150" cy="176" r="1.4" opacity="0.6"/>
    </g>
    <g fill="#22D3EE">
      <circle cx="22" cy="118" r="1.3" opacity="0.7"/>
      <circle cx="120" cy="20" r="1.5" opacity="0.75"/>
      <circle cx="182" cy="96" r="1.2" opacity="0.6"/>
    </g>
    <!-- Órbitas -->
    <g fill="none" stroke="url(#nxOrbit)" stroke-width="3.4" stroke-linecap="round">
      <ellipse cx="100" cy="100" rx="86" ry="30" transform="rotate(0 100 100)" opacity="0.95"/>
      <ellipse cx="100" cy="100" rx="86" ry="30" transform="rotate(45 100 100)" opacity="0.82"/>
      <ellipse cx="100" cy="100" rx="86" ry="30" transform="rotate(90 100 100)" opacity="0.68"/>
      <ellipse cx="100" cy="100" rx="86" ry="30" transform="rotate(135 100 100)" opacity="0.55"/>
    </g>
    <!-- Nodos -->
    <g fill="#22D3EE">
      <circle cx="186" cy="100" r="5.5"/>
      <circle cx="100" cy="14" r="4.2"/>
      <circle cx="39" cy="139" r="4"/>
      <circle cx="161" cy="61" r="3.4"/>
    </g>
    <g fill="#C084FC">
      <circle cx="14" cy="100" r="3.4"/>
      <circle cx="61" cy="61" r="3"/>
    </g>
    <!-- Esfera central -->
    <circle cx="100" cy="100" r="25" fill="url(#nxSphere)" filter="url(#nxGlow)"/>
    <ellipse cx="92" cy="91" rx="8" ry="5" fill="#FFFFFF" opacity="0.35"/>
  </g>
</svg>
