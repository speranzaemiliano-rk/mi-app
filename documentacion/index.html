<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<title>Documentación · Escribanía y contable</title>
<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#0A0D14; --bg2:#0E1220; --card:#121828; --card2:#161D30;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#E9ECF5; --ink2:rgba(233,236,245,.74); --ink3:rgba(233,236,245,.46);
  --acc:#7C5CFF; --acc2:#22D3EE; --ok:#34D399; --warn:#FBBF24; --bad:#F87171;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.hid{display:none!important}

/* ── Pantallas de bloqueo (cargando / sin permiso) ── */
#capa{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:24px;text-align:center}
#capa .box{max-width:460px}
#capa img{width:66px;opacity:.9;margin-bottom:18px}
#capa h1{font-size:19px;font-weight:600;margin:0 0 10px}
#capa p{color:var(--ink3);margin:0 0 18px;font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);
  background:var(--card2);border-radius:10px;padding:9px 15px;font-size:13px;
  font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);background:var(--card)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px;font-weight:500}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ── Barra superior ── */
#top{display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
#top .marca{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap}
#top .marca img{width:26px}
#top .marca small{display:block;font-size:10.5px;color:var(--ink3);font-weight:400;letter-spacing:.3px}
#top select{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;max-width:190px}
#top .sp{flex:1}
#busca{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;min-width:160px;width:230px}
#quien{font-size:11.5px;color:var(--ink3);white-space:nowrap}

/* ── Cuerpo: carpetas + listado ── */
#cuerpo{display:grid;grid-template-columns:250px 1fr;height:calc(100% - 53px);min-height:0}
#arbol{border-right:1px solid var(--line);overflow:auto;padding:12px 10px;background:var(--bg2)}
#arbol h4{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);
  margin:0 0 9px;padding:0 6px;font-weight:600}
.cp{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;
  font-size:13px;cursor:pointer;color:var(--ink2);user-select:none}
.cp:hover{background:var(--card)}
.cp.on{background:var(--card2);color:var(--ink);font-weight:600}
.cp .ico{opacity:.75;flex:0 0 15px;display:flex}
.cp .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp .ct{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.cp .mas{opacity:0;padding:0 2px;background:none;border:none;color:var(--ink3);font-size:13px}
.cp:hover .mas{opacity:1}
.cp .mas:hover{color:var(--ink)}

#panel{overflow:auto;padding:16px 18px;min-height:0;position:relative}
#ruta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;
  font-size:12.5px;color:var(--ink3)}
#ruta b{color:var(--ink);font-weight:600}
#ruta span.sep{opacity:.5}
#ruta a{color:var(--ink3);cursor:pointer;text-decoration:none}
#ruta a:hover{color:var(--acc2)}
#acciones{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:4px 11px;font-size:11.5px;color:var(--ink2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink3);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
tr.doc:hover td{background:var(--card)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
td.acc{text-align:right;white-space:nowrap}
.nmdoc{display:flex;align-items:center;gap:9px;min-width:0}
.nmdoc .ext{flex:0 0 32px;height:32px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:9.5px;font-weight:700;letter-spacing:.4px;
  background:var(--card2);border:1px solid var(--line);color:var(--ink3)}
.nmdoc .ext.pdf{color:#FCA5A5;border-color:rgba(248,113,113,.35)}
.nmdoc .ext.xls{color:#6EE7B7;border-color:rgba(52,211,153,.35)}
.nmdoc .ext.img{color:#93C5FD;border-color:rgba(147,197,253,.35)}
.nmdoc .ext.doc{color:#A5B4FC;border-color:rgba(165,180,252,.35)}
.nmdoc .t{min-width:0}
.nmdoc .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmdoc .t small{color:var(--ink3);font-size:11.5px}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:6px;padding:1px 7px;
  font-size:10.5px;color:var(--ink2);background:var(--card2)}
.vacio{text-align:center;padding:52px 20px;color:var(--ink3);font-size:13px}
.vacio .big{font-size:30px;opacity:.5;margin-bottom:10px}

/* ── Zona de arrastre ── */
#drop{position:absolute;inset:0;z-index:30;background:rgba(124,92,255,.10);
  border:2px dashed var(--acc);border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:600;pointer-events:none}

/* ── Modales ── */
#velo{position:fixed;inset:0;z-index:500;background:rgba(5,7,12,.72);
  display:flex;align-items:center;justify-content:center;padding:18px}
#modal{background:var(--card);border:1px solid var(--line2);border-radius:14px;
  width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}
#modal.ancho{max-width:1000px}
#modal h3{margin:0 0 4px;font-size:16px}
#modal .sub{color:var(--ink3);font-size:12.5px;margin-bottom:16px}
#modal label{display:block;font-size:11.5px;color:var(--ink3);margin:12px 0 5px;font-weight:600}
#modal input[type=text],#modal textarea,#modal select{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
#modal textarea{min-height:66px;resize:vertical}
#modal .pie{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
#modal .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:17px}
#visor{width:100%;height:68vh;border:1px solid var(--line);border-radius:10px;background:#fff}
#visorImg{max-width:100%;max-height:68vh;display:block;margin:0 auto;border-radius:10px}

/* ── Progreso de subida ── */
#subiendo{position:fixed;right:18px;bottom:18px;z-index:600;background:var(--card);
  border:1px solid var(--line2);border-radius:12px;padding:13px 16px;min-width:270px;
  box-shadow:0 10px 36px rgba(0,0,0,.45)}
#subiendo b{display:block;font-size:12.5px;margin-bottom:8px}
#subiendo .barra{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}
#subiendo .barra i{display:block;height:100%;background:var(--acc);width:0;transition:width .18s}
#subiendo small{display:block;color:var(--ink3);font-size:11px;margin-top:7px}

#aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:700;
  background:#1b2236;border:1px solid var(--line2);color:var(--ink);padding:10px 17px;
  border-radius:10px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.45);
  opacity:0;transition:opacity .18s;pointer-events:none;max-width:90vw;text-align:center}
#aviso.on{opacity:1}

@media (max-width:860px){
  #cuerpo{grid-template-columns:1fr;height:auto}
  #arbol{border-right:none;border-bottom:1px solid var(--line);max-height:206px}
  #busca{width:100%}
  th.ocu,td.ocu{display:none}
}
</style>

<input type="file" id="archivoInput" multiple class="hid">
<div id="aviso"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   DOCUMENTACIÓN, ESCRIBANÍA Y CONTABLE

   Módulo aparte del sistema de gestión, en el MISMO proyecto de Firebase
   (ver config.js para el porqué). Sirve para guardar y compartir los
   papeles de cada obra: escrituras en PDF, planillas de Excel, boletos,
   posesiones, movimientos de fondos, documentación contable.

   ── Dónde viven los datos ───────────────────────────────────────────
   Raíz `documentacion`, separada en DOS ramas a propósito:

     documentacion/<empresaId>/<proyectoId>/carpetas/<id>
         { nombre, padre, creado, por, porMail }
     documentacion/<empresaId>/<proyectoId>/docs/<id>
         { nombre, carpeta, etiqueta, nota, mime, ext, tam, partes,
           creado, por, porMail, mod, modPor }

     documentacion/archivos/<docId>/v/<n>/partes/<k> = "<pedazo de base64>"
     documentacion/versiones/<docId>/<n> = { tam, partes, creado, porMail,
                                             origen, ver }

   El CONTENIDO del archivo NUNCA está en el índice. Es la lección que ya
   dejó el nodo `documentos` del sistema: si los adjuntos cuelgan de lo
   que se escucha al arrancar, abrir la pantalla baja todos los PDF del
   proyecto y la app queda inutilizable. Acá el índice pesa unos bytes por
   documento y el contenido se busca SÓLO cuando alguien abre o descarga
   uno (`_leerArchivo`), de a un documento por vez.

   ── Por qué va en pedazos ───────────────────────────────────────────
   Realtime Database tiene un tope por escritura, y base64 infla el
   archivo cerca de un tercio. Partirlo en pedazos de 512 KB saca ese
   tope del medio, deja subir una escritura escaneada entera y permite
   mostrar el avance real de la subida. Al leer se rearman en orden.

   ── Varias personas a la vez ────────────────────────────────────────
   El índice se escucha con on('value'): lo que sube uno aparece solo en
   la pantalla del otro, sin recargar. Como cada documento y cada carpeta
   es un nodo con su propio id, dos personas trabajando al mismo tiempo
   no se pisan — nunca se reescribe la colección entera, igual que el
   criterio de `_colPersist` en el sistema.

   ── Versiones ───────────────────────────────────────────────────────
   Un documento nunca se pisa: cada guardado nuevo escribe la versión n+1 y
   la anterior queda entera, con su contenido y quién la hizo. `docs/<id>.ver`
   apunta a la vigente; el listado de versiones vive en su propia rama y se
   lee sólo cuando alguien lo abre. Los documentos subidos antes de que esto
   existiera no tienen `ver` y su contenido está en la ruta vieja
   (`archivos/<id>/partes`): `_rutaPartes` lo contempla, y el registro de cada
   versión guarda su propio `ver` para saber de dónde leerla.

   ── Editar en Excel de verdad (Microsoft 365) ────────────────────────
   El sistema sigue siendo el dueño del archivo. OneDrive es un taller
   prestado: se sube la planilla, la edita Excel para la web —con fórmulas,
   formato, gráficos y tablas dinámicas intactos, porque la edita Excel y no
   nosotros— y al volver se trae y se guarda como versión nueva.

   El permiso para Graph sale del MISMO login con Microsoft que ya usa el
   sistema (`OAuthProvider('microsoft.com')`), pidiendo además el scope
   `Files.ReadWrite`: así no hace falta un segundo registro de app ni un
   segundo login. Firebase no devuelve refresh token del proveedor, así que
   el token de Graph dura lo que dura y se vuelve a pedir con una ventanita
   cuando vence o cuando Graph contesta 401.

   ── Permisos ────────────────────────────────────────────────────────
   Los mismos del sistema: hace falta tener rol en `roles/<uid>` para
   entrar, y ser superadmin/admin/editor para subir, renombrar o borrar.
   Un `lector` ve y descarga, pero no toca nada. Las reglas del servidor
   exigen lo mismo (ver la rama `documentacion` en database.rules.json):
   esconder los botones solo no alcanzaría.
   ══════════════════════════════════════════════════════════════════════ */

var CFG = window.DOCU_CONFIG || {};
var MAX_MB     = CFG.maxMB || 20;
var MAX_BYTES  = MAX_MB * 1024 * 1024;
var PEDAZO     = 512 * 1024;          // tamaño de cada pedazo de base64
var ETIQUETAS  = CFG.etiquetas || [];

var db = null, auth = null;
var uid = '', mail = '', rol = '', puedeEditar = false;
var empresas = [];                     // [{id, nombre, proyectos:[{id,nombre}]}]
var empId = '', proyId = '';
var carpetas = {}, docs = {};          // índices del proyecto activo
var carpActual = '';                   // '' = raíz
var filtroTexto = '', filtroEtiqueta = '';
var _refCarp = null, _refDocs = null;  // listeners activos, para desengancharlos

/* ── Utilidades ────────────────────────────────────────────────────── */
function esc(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function norm(s){
  return (s == null ? '' : String(s)).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
}
function peso(b){
  if (!b && b !== 0) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(0) + ' KB';
  return (b/1024/1024).toFixed(b < 10*1024*1024 ? 1 : 0) + ' MB';
}
function fecha(ms){
  if (!ms) return '—';
  var d = new Date(ms);
  var p = function(n){ return String(n).padStart(2,'0'); };
  return p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear();
}
function extDe(nombre){
  var m = /\.([a-z0-9]{1,6})$/i.exec(nombre || '');
  return m ? m[1].toLowerCase() : '';
}
function claseExt(e){
  if (e === 'pdf') return 'pdf';
  if (['xls','xlsx','xlsm','csv','ods'].indexOf(e) >= 0) return 'xls';
  if (['jpg','jpeg','png','webp','gif','heic','bmp','tif','tiff'].indexOf(e) >= 0) return 'img';
  if (['doc','docx','odt','txt','rtf'].indexOf(e) >= 0) return 'doc';
  return '';
}
// Firebase contesta PERMISSION_DENIED tanto si falta publicar la rama de
// reglas como si al usuario le falta el rol. Son dos arreglos muy distintos y
// el mensaje crudo no dice ninguno, así que acá se traduce. Es el error número
// uno de este repo: `database.rules.json` NO se aplica solo.
function _esPermiso(e){
  var t = (e && (e.code || e.message) || '') + '';
  return /permission[_ ]denied/i.test(t);
}
function _txtError(e){
  if (_esPermiso(e)) {
    return 'Firebase dice «permiso denegado». Falta publicar la rama "documentacion" ' +
           'en Firebase → Realtime Database → Reglas. El archivo del repositorio no se ' +
           'aplica solo. Usá 🔧 Diagnóstico para confirmarlo.';
  }
  return (e && e.message) ? e.message : String(e || 'error desconocido');
}
var _avisoT = null;
function aviso(txt){
  var el = document.getElementById('aviso');
  el.textContent = txt; el.classList.add('on');
  clearTimeout(_avisoT);
  _avisoT = setTimeout(function(){ el.classList.remove('on'); }, 3200);
}
function bloquear(tit, txt, accionHTML){
  var c = document.getElementById('capa');
  document.getElementById('capaTit').textContent = tit;
  document.getElementById('capaTxt').textContent = txt;
  document.getElementById('capaAcc').innerHTML = accionHTML || '';
  c.classList.remove('hid');
  document.getElementById('app').classList.add('hid');
}

/* ── Arranque: Firebase, sesión y rol ──────────────────────────────── */
(function init(){
  try {
    firebase.initializeApp(CFG.firebase);
    db = firebase.database(); auth = firebase.auth();
  } catch (e) {
    bloquear('No se pudo conectar', 'Revisá config.js: falta o está mal la configuración de Firebase.');
    return;
  }
  auth.onAuthStateChanged(function(user){
    if (!user) {
      // La sesión se comparte con el sistema de gestión: mismo proyecto y
      // mismo origen. Si no hay sesión, se entra por la puerta de siempre.
      bloquear('Entrá primero al sistema',
               'Esta pantalla usa la misma cuenta que el sistema de gestión.',
               '<a class="btn pri" href="../">Ir al ingreso</a>');
      return;
    }
    uid = user.uid; mail = user.email || '';
    // Tener rol ES el permiso de acceso: estar autenticado no alcanza. Mismo
    // criterio que el sistema, y las reglas del servidor exigen lo mismo.
    db.ref('roles/' + uid).once('value').then(function(s){
      rol = s.val() || '';
      if (!rol) {
        bloquear('Tu cuenta todavía no tiene permiso',
                 'Pedile a un administrador que te habilite desde Config → Usuarios.',
                 '<a class="btn" href="../">← Volver</a>');
        return;
      }
      puedeEditar = ['superadmin','admin','editor'].indexOf(rol) >= 0;
      document.getElementById('quien').textContent = mail + ' · ' + rol;
      cargarEmpresas();
    }).catch(function(){
      bloquear('No se pudo leer tu permiso',
               'Puede que falte publicar las reglas de la base. Probá de nuevo en un rato.',
               '<a class="btn" href="../">← Volver</a>');
    });
  });
})();

function cargarEmpresas(){
  db.ref('empresas').once('value').then(function(s){
    var v = s.val() || {};
    empresas = Object.keys(v).map(function(eid){
      var e = v[eid] || {}, ps = e.proyectos || {};
      return {
        id: eid,
        nombre: e.nombre || eid,
        proyectos: Object.keys(ps).map(function(pid){
          return { id: pid, nombre: (ps[pid] && ps[pid].nombre) || pid };
        })
      };
    }).filter(function(e){ return e.proyectos.length; });
    if (!empresas.length) {
      bloquear('Todavía no hay obras cargadas',
               'Creá una empresa y un proyecto desde el sistema de gestión y volvé.',
               '<a class="btn" href="../">← Volver</a>');
      return;
    }
    // Se recuerda la última obra elegida, por equipo.
    var guard = {};
    try { guard = JSON.parse(localStorage.getItem('docu_obra') || '{}'); } catch(e) {}
    var e0 = empresas.find(function(e){ return e.id === guard.emp; }) || empresas[0];
    empId = e0.id;
    var p0 = e0.proyectos.find(function(p){ return p.id === guard.proy; }) || e0.proyectos[0];
    proyId = p0.id;
    document.getElementById('capa').classList.add('hid');
    document.getElementById('app').classList.remove('hid');
    pintarSelectores();
    engancharProyecto();
  }).catch(function(){
    bloquear('No se pudieron leer las obras',
             'Puede que falte publicar las reglas de la base.',
             '<a class="btn" href="../">← Volver</a>');
  });
}

function pintarSelectores(){
  var se = document.getElementById('selEmp'), sp = document.getElementById('selProy');

/* ── Índice del proyecto activo, en vivo ───────────────────────────── */
function basePath(){ return 'documentacion/' + empId + '/' + proyId; }

function engancharProyecto(){
  try { localStorage.setItem('docu_obra', JSON.stringify({ emp: empId, proy: proyId })); } catch(e) {}
  if (_refCarp) _refCarp.off();
  if (_refDocs) _refDocs.off();
  carpetas = {}; docs = {}; carpActual = ''; filtroEtiqueta = '';
  pintar();
  _refCarp = db.ref(basePath() + '/carpetas');
  _refDocs = db.ref(basePath() + '/docs');
  // Se escucha SÓLO el índice. El contenido de los archivos cuelga de otra
  // rama (documentacion/archivos) justamente para que no viaje con esto.
  _refCarp.on('value', function(s){ carpetas = s.val() || {}; pintar(); });
  _refDocs.on('value', function(s){ docs = s.val() || {}; pintar(); });
}

/* ── Árbol de carpetas ─────────────────────────────────────────────── */
function hijasDe(padre){
  return Object.keys(carpetas)
    .filter(function(id){ return (carpetas[id].padre || '') === (padre || ''); })
    .map(function(id){ var c = carpetas[id]; return { id: id, nombre: c.nombre || '(sin nombre)', padre: c.padre || '' }; })
    .sort(function(a, b){ return norm(a.nombre) < norm(b.nombre) ? -1 : 1; });
}
function cuentaEn(carpId){
  // Cuenta los documentos de la carpeta y de todo lo que cuelga de ella, para
  // que una carpeta madre no aparezca vacía cuando todo está en sus hijas.
  var n = 0, id;
  for (id in docs) if ((docs[id].carpeta || '') === (carpId || '')) n++;
  hijasDe(carpId).forEach(function(h){ n += cuentaEn(h.id); });
  return n;
}
function rutaDe(carpId){
  var ruta = [], guard = 0;
  while (carpId && carpetas[carpId] && guard++ < 50) {
    ruta.unshift({ id: carpId, nombre: carpetas[carpId].nombre || '(sin nombre)' });
    carpId = carpetas[carpId].padre || '';
  }
  return ruta;
}
function pintarArbol(){
  var icoCarp = '<svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  function fila(c, nivel){
    var sel = carpActual === c.id ? ' on' : '';
    return '<div class="cp' + sel + '" style="padding-left:' + (8 + nivel * 13) + 'px" data-carp="' + esc(c.id) + '">' +
      icoCarp +
      '<span class="nm">' + esc(c.nombre) + '</span>' +
      '<span class="ct">' + cuentaEn(c.id) + '</span>' +
      (puedeEditar ? '<button class="mas" data-menu="' + esc(c.id) + '" title="Opciones de la carpeta">⋯</button>' : '') +
      '</div>' +
      hijasDe(c.id).map(function(h){ return fila(h, nivel + 1); }).join('');
  }
  var html = '<div class="cp' + (carpActual === '' ? ' on' : '') + '" data-carp="">' +
    icoCarp + '<span class="nm">Todo el proyecto</span><span class="ct">' + Object.keys(docs).length + '</span></div>';
  html += hijasDe('').map(function(c){ return fila(c, 1); }).join('');
  var el = document.getElementById('arbolLista');
  el.innerHTML = html;
  el.querySelectorAll('[data-carp]').forEach(function(d){
    d.onclick = function(ev){
      if (ev.target.dataset.menu) return;
      carpActual = d.dataset.carp; pintar();
    };
  });
  el.querySelectorAll('[data-menu]').forEach(function(b){
    b.onclick = function(ev){ ev.stopPropagation(); menuCarpeta(b.dataset.menu); };
  });
}

/* ── Listado de documentos ─────────────────────────────────────────── */
function docsVisibles(){
  var terminos = norm(filtroTexto).split(' ').filter(Boolean);
  // Dentro de una carpeta se ve lo de ESA carpeta; buscando, se busca en todo
  // el proyecto — si no, habría que acordarse en qué carpeta quedó el papel.
  var buscando = terminos.length > 0;
  return Object.keys(docs).map(function(id){
    var d = docs[id] || {}; d = Object.assign({ id: id }, d); return d;
  }).filter(function(d){
    if (!buscando && (d.carpeta || '') !== (carpActual || '')) return false;
    if (filtroEtiqueta && (d.etiqueta || '') !== filtroEtiqueta) return false;
    if (buscando) {
      var blob = norm([d.nombre, d.etiqueta, d.nota, d.porMail].filter(Boolean).join(' '));
      for (var i = 0; i < terminos.length; i++) if (blob.indexOf(terminos[i]) === -1) return false;
    }
    return true;
  }).sort(function(a, b){ return (b.creado || 0) - (a.creado || 0); });
}
function pintarRuta(){
  var r = rutaDe(carpActual);
  var html = '<a data-ir="">Todo el proyecto</a>';
  r.forEach(function(c, i){
    html += '<span class="sep">›</span>' +
      (i === r.length - 1 ? '<b>' + esc(c.nombre) + '</b>' : '<a data-ir="' + esc(c.id) + '">' + esc(c.nombre) + '</a>');
  });
  var el = document.getElementById('ruta');
  el.innerHTML = html;
  el.querySelectorAll('[data-ir]').forEach(function(a){
    a.onclick = function(){ carpActual = a.dataset.ir; pintar(); };
  });
}
function pintarChips(){
  var usadas = {};
  Object.keys(docs).forEach(function(id){ var e = docs[id].etiqueta; if (e) usadas[e] = (usadas[e] || 0) + 1; });
  var lista = Object.keys(usadas).sort();
  var el = document.getElementById('chips');
  if (!lista.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<button class="chip' + (filtroEtiqueta ? '' : ' on') + '" data-et="">Todas</button>' +
    lista.map(function(e){
      return '<button class="chip' + (filtroEtiqueta === e ? ' on' : '') + '" data-et="' + esc(e) + '">' +
             esc(e) + ' · ' + usadas[e] + '</button>';
    }).join('');
  el.querySelectorAll('[data-et]').forEach(function(b){
    b.onclick = function(){ filtroEtiqueta = b.dataset.et; pintar(); };
  });
}
function pintarAcciones(){

        '<button class="btn sm" data-ver="' + esc(d.id) + '">Abrir</button> ' +
        '<button class="btn sm" data-baj="' + esc(d.id) + '">↓</button>' +
        (puedeEditar ? ' <button class="btn sm" data-ed="' + esc(d.id) + '">✎</button>' +
                       ' <button class="btn sm" data-del="' + esc(d.id) + '">✕</button>' : '') +

  el.innerHTML = '<table><thead><tr>' +
    '<th>Documento</th><th class="ocu">Etiqueta</th><th>Tamaño</th>' +
    '<th class="ocu">Subido</th><th class="ocu">Por</th><th></th>' +
    '</tr></thead><tbody>' + filas + '</tbody></table>';
  el.querySelectorAll('[data-xls]').forEach(function(b){ b.onclick = function(){ editarEnExcel(b.dataset.xls); }; });
  el.querySelectorAll('[data-vers]').forEach(function(b){ b.onclick = function(){ verVersiones(b.dataset.vers); }; });
  el.querySelectorAll('[data-ver]').forEach(function(b){ b.onclick = function(){ abrirDoc(b.dataset.ver); }; });
  el.querySelectorAll('[data-baj]').forEach(function(b){ b.onclick = function(){ bajarDoc(b.dataset.baj); }; });
  el.querySelectorAll('[data-ed]').forEach(function(b){ b.onclick = function(){ editarDoc(b.dataset.ed); }; });
  el.querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){ borrarDoc(b.dataset.del); }; });
}

/* ── Carpetas ──────────────────────────────────────────────────────── */
function nuevaCarpeta(padre){
  if (!puedeEditar) return;
  var nombre = prompt('Nombre de la carpeta nueva:', '');
  if (nombre == null) return;
  nombre = nombre.trim();
  if (!nombre) { aviso('Poné un nombre.'); return; }
  var ref = db.ref(basePath() + '/carpetas').push();
  ref.set({ nombre: nombre, padre: padre || '', creado: Date.now(), por: uid, porMail: mail })
    .then(function(){ carpActual = ref.key; pintar(); aviso('Carpeta creada.'); })
    .catch(function(e){ alert('No se pudo crear la carpeta.\n\n' + _txtError(e)); });
}
document.getElementById('btnNuevaCarp').onclick = function(){ nuevaCarpeta(carpActual); };

function menuCarpeta(id){
  var c = carpetas[id]; if (!c) return;
  var q = prompt('Carpeta "' + (c.nombre || '') + '"\n\n' +
                 'Escribí el nombre nuevo para renombrarla,\n' +
                 'o escribí BORRAR para eliminarla.', c.nombre || '');
  if (q == null) return;
  q = q.trim();
  if (!q) return;
  if (q.toUpperCase() === 'BORRAR') {
    var dentro = cuentaEn(id), sub = hijasDe(id).length;
    if (dentro || sub) {
      alert('No se puede borrar: la carpeta tiene ' +
            (dentro ? dentro + ' documento(s)' : '') + (dentro && sub ? ' y ' : '') +
            (sub ? sub + ' subcarpeta(s)' : '') + '.\n\n' +
            'Vaciala primero (mové o borrá lo que tiene adentro).');
      return;
    }
    if (!confirm('¿Borrar la carpeta "' + (c.nombre || '') + '"?')) return;
    db.ref(basePath() + '/carpetas/' + id).remove().then(function(){
      if (carpActual === id) carpActual = c.padre || '';
      aviso('Carpeta borrada.');
    });
    return;
  }
  db.ref(basePath() + '/carpetas/' + id + '/nombre').set(q).then(function(){ aviso('Carpeta renombrada.'); });
}

}
document.getElementById('btnSubir').onclick = elegirArchivos;

};

// Arrastrar y soltar sobre el panel.
(function dnd(){
  var panel = document.getElementById('panel'), capa = null, cont = 0;
  panel.addEventListener('dragover', function(e){ e.preventDefault(); });
  panel.addEventListener('dragenter', function(e){
    e.preventDefault();
    if (!puedeEditar) return;
    cont++;
    if (!capa) {
      capa = document.createElement('div');
      capa.id = 'drop'; capa.textContent = 'Soltá los archivos acá';
      panel.appendChild(capa);
    }
  });
  panel.addEventListener('dragleave', function(){
    // dragleave salta también al pasar por encima de los hijos: se cuenta
    // entrada/salida para no apagar el cartel mientras el archivo sigue arriba.
    if (--cont <= 0 && capa) { capa.remove(); capa = null; cont = 0; }
  });
  panel.addEventListener('drop', function(e){
    e.preventDefault();
    cont = 0; if (capa) { capa.remove(); capa = null; }
    if (!puedeEditar) { aviso('Tu rol no puede subir archivos.'); return; }
    var fs = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []);
    if (fs.length) subirVarios(fs);
  });
})();

function mostrarProgreso(txt, pct, detalle){
  var el = document.getElementById('subiendo');
  if (!el) {
    el = document.createElement('div'); el.id = 'subiendo';
    el.innerHTML = '<b></b><div class="barra"><i></i></div><small></small>';
    document.body.appendChild(el);
  }
  el.querySelector('b').textContent = txt;
  el.querySelector('.barra i').style.width = Math.max(0, Math.min(100, pct)) + '%';
  el.querySelector('small').textContent = detalle || '';
}
function cerrarProgreso(){
  var el = document.getElementById('subiendo');
  if (el) el.remove();
}

function subirVarios(archivos){
  var i = 0, ok = 0, fallo = [];
  function siguiente(){
    if (i >= archivos.length) {
      cerrarProgreso();
      if (fallo.length) {
        alert('Subidos: ' + ok + '\n\nNo se pudieron subir:\n\n' + fallo.join('\n') +
              (fallo.some(function(x){ return /permiso denegado/i.test(x); })
                ? '\n\n⚠️ Es un problema de permisos, no de los archivos. ' +
                  'Abrí 🔧 Diagnóstico (arriba a la derecha) para ver exactamente qué falta.'
                : ''));
      } else {
        aviso(ok === 1 ? 'Documento subido.' : ok + ' documentos subidos.');
      }
      return;
    }
    var f = archivos[i++];
    mostrarProgreso('Subiendo ' + i + ' de ' + archivos.length, 0, f.name);
    subirUno(f, function(pct){
      mostrarProgreso('Subiendo ' + i + ' de ' + archivos.length, pct, f.name + ' · ' + peso(f.size));
    }).then(function(){ ok++; siguiente(); })
      .catch(function(err){ fallo.push('· ' + f.name + ' — ' + _txtError(err)); siguiente(); });
  }
  siguiente();
}

function _leerBase64(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var s = String(fr.result || '');
      var coma = s.indexOf(',');
      res(coma >= 0 ? s.slice(coma + 1) : s);
    };
    fr.onerror = function(){ rej(new Error('no se pudo leer el archivo')); };
    fr.readAsDataURL(file);
  });
}

// Las fotos sacadas con el celular pesan de más para lo que son. Se achican
// antes de subir; los PDF NO se tocan: una escritura recomprimida pierde
// legibilidad y eso en un documento legal no se puede hacer.
function _achicarImagen(file){
  return new Promise(function(res){
    if (!/^image\//.test(file.type) || file.size < 1024*1024) { res(file); return; }
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var MAX = 2200;
      var k = Math.min(1, MAX / Math.max(img.width, img.height));
      var w = Math.round(img.width * k), h = Math.round(img.height * k);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(function(b){
        URL.revokeObjectURL(url);
        res(b && b.size < file.size ? new File([b], file.name, { type: 'image/jpeg' }) : file);
      }, 'image/jpeg', 0.84);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

function subirUno(file, onProgreso){
  return _achicarImagen(file).then(function(f){
    if (f.size > MAX_BYTES) {
      throw new Error('pesa ' + peso(f.size) + ' y el tope es ' + MAX_MB + ' MB');
    }
    return _leerBase64(f).then(function(b64){
      var id = db.ref(basePath() + '/docs').push().key;
      // Primero el contenido, de a un pedazo (así se ve el avance de verdad y
      // ninguna escritura pasa el tope de la base). El índice se escribe AL
      // FINAL: si la subida se corta a la mitad, el documento no aparece
      // listado como si estuviera completo.
      return _subirPartes(id, 1, b64, onProgreso).then(function(partes){
        return db.ref(basePath() + '/docs/' + id).set({
          nombre: f.name,
          carpeta: carpActual || '',
          etiqueta: '',
          nota: '',
          mime: f.type || '',
          ext: extDe(f.name),
          tam: f.size,
          partes: partes,
          ver: 1,
          creado: Date.now(), por: uid, porMail: mail
        });
      }).then(function(){ if (onProgreso) onProgreso(100); });
    });
  });
}

/* ── Contenido: rutas, lectura y escritura ─────────────────────────── */
// `ver` vacío = documento de antes de las versiones, contenido en la ruta
// vieja. Los nuevos siempre nacen con ver 1.
function _rutaPartes(docId, ver){
  return 'documentacion/archivos/' + docId + (ver ? '/v/' + ver : '') + '/partes';
}
// Escribe el contenido de a un pedazo. Devuelve cuántos pedazos quedaron.
function _subirPartes(docId, ver, b64, onProgreso){
  var partes = [];
  for (var i = 0; i < b64.length; i += PEDAZO) partes.push(b64.slice(i, i + PEDAZO));
  var hecho = 0, ruta = _rutaPartes(docId, ver);
  return partes.reduce(function(prev, pedazo, n){
    return prev.then(function(){
      return db.ref(ruta + '/' + n).set(pedazo).then(function(){
        hecho++;
        if (onProgreso) onProgreso(Math.round(hecho / partes.length * 96));
      });
    });
  }, Promise.resolve()).then(function(){ return partes.length; });
}
function _blobABase64(blob){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ var t = String(fr.result || ''), c = t.indexOf(','); res(c >= 0 ? t.slice(c+1) : t); };
    fr.onerror = function(){ rej(new Error('no se pudo leer el archivo')); };
    fr.readAsDataURL(blob);
  });
}

/* ── Leer un archivo (sólo cuando alguien lo pide) ─────────────────── */
function _leerArchivo(id, d){
  return db.ref(_rutaPartes(id, d && d.ver)).once('value').then(function(s){
    var v = s.val();
    if (!v) throw new Error('El contenido de este documento no está en la base.');
    // El nodo puede volver como objeto o como array según cómo lo serialice
    // Firebase; en los dos casos hay que reordenar por índice numérico.
    var claves = Object.keys(v).sort(function(a, b){ return (+a) - (+b); });
    var b64 = claves.map(function(k){ return v[k]; }).join('');
    var bin = atob(b64), n = bin.length, buf = new Uint8Array(n);
    for (var i = 0; i < n; i++) buf[i] = bin.charCodeAt(i);
    return new Blob([buf], { type: d.mime || 'application/octet-stream' });
  });
}

function bajarDoc(id){
  var d = docs[id]; if (!d) return;
  aviso('Preparando la descarga…');
  _leerArchivo(id, d).then(function(blob){
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = d.nombre || 'documento';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }).catch(function(e){ alert('No se pudo descargar.\n\n' + (e && e.message ? e.message : e)); });
}

function abrirDoc(id){
  var d = docs[id]; if (!d) return;
  var e = d.ext || extDe(d.nombre);
  var esPDF = e === 'pdf' || d.mime === 'application/pdf';
  var esImg = /^image\//.test(d.mime || '') || claseExt(e) === 'img';
  if (!esPDF && !esImg) {
    // Excel, Word y compañía no se pueden mostrar en el navegador. Si es una
    // planilla y la persona puede editar, el camino útil es Excel para la web;
    // el resto se baja.
    if (esExcel(d) && puedeEditar) editarEnExcel(id);
    else bajarDoc(id);
    return;
  }
  aviso('Abriendo…');
  _leerArchivo(id, d).then(function(blob){
    var url = URL.createObjectURL(blob);
    modal('<h3>' + esc(d.nombre) + '</h3>' +
      '<div class="sub">' + esc([d.etiqueta, peso(d.tam), 'subido el ' + fecha(d.creado), d.porMail].filter(Boolean).join(' · ')) + '</div>' +
      (esPDF ? '<iframe id="visor" src="' + url + '"></iframe>'

function opcionesCarpetas(sel){
  var out = '<option value=""' + (sel ? '' : ' selected') + '>Todo el proyecto (sin carpeta)</option>';

    hijasDe(padre).forEach(function(c){

             new Array(nivel + 1).join('— ') + esc(c.nombre) + '</option>';

function borrarDoc(id){
  var d = docs[id]; if (!d || !puedeEditar) return;
  if (!confirm('¿Borrar "' + (d.nombre || '') + '"?\n\n' +

               'Se borra también el archivo. Esta acción no se puede deshacer.')) return;

/* ── Diagnóstico ───────────────────────────────────────────────────
   Hace las MISMAS operaciones que hace la app y cuenta cuál falló. Existe
   porque «permiso denegado» a secas no distingue entre «falta publicar la
   rama de reglas» y «esta cuenta no tiene rol», que se arreglan en lugares
   distintos; y porque Firebase, cuando falta la rama, no falla con estrépito:
   simplemente niega todo y la pantalla se ve vacía. Mismo espíritu que el
   verificador del índice de documentos en el sistema. */
function diagnostico(){
  var filas = [];
  function linea(ok, titulo, detalle){
    filas.push('<div style="display:flex;gap:9px;align-items:flex-start;padding:8px 0;' +
      'border-bottom:1px solid var(--line)">' +
      '<span style="flex:0 0 18px;color:' + (ok ? 'var(--ok)' : 'var(--bad)') + '">' + (ok ? '✓' : '✕') + '</span>' +
      '<span><b>' + esc(titulo) + '</b>' + (detalle ? '<br><span style="color:var(--ink3);font-size:12px">' +
      esc(detalle) + '</span>' : '') + '</span></div>');
  }
  modal('<h3>🔧 Diagnóstico</h3><div class="sub">Probando…</div>');
  var pruebaId = 'diag_' + Date.now();
  var rutaPrueba = 'documentacion/_diagnostico/' + uid;

  linea(!!uid, 'Sesión abierta', mail || 'sin sesión');
  linea(!!rol, 'Rol en el sistema', rol ? ('es «' + rol + '»' + (puedeEditar ? ', puede escribir' : ', SÓLO LECTURA: un lector no sube archivos')) : 'sin rol — pedí que te habiliten en Config → Usuarios');

  db.ref('empresas').once('value').then(function(){
    linea(true, 'Leer las obras (nodo empresas)', 'bien');
  }).catch(function(e){
    linea(false, 'Leer las obras (nodo empresas)', _esPermiso(e) ? 'permiso denegado' : String(e));
  }).then(function(){
    return db.ref(basePath() + '/docs').once('value').then(function(s){
      var n = s.val() ? Object.keys(s.val()).length : 0;
      linea(true, 'Leer los documentos de esta obra', n + ' documento(s) en el índice');
    }).catch(function(e){
      linea(false, 'Leer los documentos de esta obra',
            _esPermiso(e) ? 'permiso denegado — falta la rama "documentacion" en las reglas' : String(e));
    });
  }).then(function(){
    // La prueba que importa: escribir y borrar, que es lo que falla al subir.
    return db.ref(rutaPrueba).set({ cuando: Date.now(), por: mail, id: pruebaId }).then(function(){
      linea(true, 'Escribir en la base', 'bien — se puede subir');
      return db.ref(rutaPrueba).remove().then(function(){
        linea(true, 'Borrar de la base', 'bien');
      }).catch(function(e){ linea(false, 'Borrar de la base', String(e)); });
    }).catch(function(e){
      linea(false, 'Escribir en la base',
            _esPermiso(e) ? 'PERMISO DENEGADO — es esto lo que te impide subir archivos' : String(e));
    });
  }).then(function(){
    var fallo = filas.some(function(f){ return f.indexOf('var(--bad)') >= 0; });
    var reglas = '"documentacion": {\n' +
      '  ".read": "auth != null && root.child(\'roles\').child(auth.uid).exists()",\n' +
      '  ".write": "root.child(\'roles\').child(auth.uid).val() === \'superadmin\' || ' +
      'root.child(\'roles\').child(auth.uid).val() === \'admin\' || ' +
      'root.child(\'roles\').child(auth.uid).val() === \'editor\'"\n}';
    modal('<h3>🔧 Diagnóstico</h3>' +
      '<div class="sub">' + esc(mail) + ' · ' + esc(empId) + ' / ' + esc(proyId) + '</div>' +
      filas.join('') +
      (fallo
        ? '<div style="margin-top:16px;padding:13px;border:1px solid var(--line2);border-radius:10px;background:var(--card2)">' +
          '<b style="font-size:13px">Qué hacer</b>' +
          '<div style="color:var(--ink2);font-size:12.5px;line-height:1.6;margin-top:7px">' +
          'Entrá a <b>Firebase → Realtime Database → Reglas</b> y agregá esta rama al mismo nivel que ' +
          '<code>empresas</code>. El archivo <code>database.rules.json</code> del repositorio ' +
          '<b>no se aplica solo</b>: hay que pegarlo y publicarlo a mano.' +
          '</div>' +
          '<textarea readonly style="width:100%;margin-top:10px;min-height:120px;font-family:var(--mono);' +
          'font-size:11.5px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;' +
          'padding:9px;color:var(--ink2)">' + esc(reglas) + '</textarea>' +
          '<button class="btn sm" id="dCopiar" style="margin-top:8px">Copiar</button>' +
          '</div>'
        : '<div style="margin-top:14px;color:var(--ok);font-size:13px">Todo en orden.</div>') +
      '<div class="pie"><button class="btn pri" id="dCerrar">Cerrar</button></div>');
    var c = document.getElementById('dCopiar');
    if (c) c.onclick = function(){
      var t = document.querySelector('#modal textarea');
      t.select();
      try { document.execCommand('copy'); aviso('Copiado.'); } catch(e) { aviso('Copialo a mano.'); }
    };
    document.getElementById('dCerrar').onclick = cerrarModal;
  });
}

/* ══════════════════════════════════════════════════════════════════
   EDITAR EN EXCEL PARA LA WEB (Microsoft 365)

   El sistema no deja de ser el dueño del archivo: OneDrive es un taller
   prestado. Se sube la planilla, la edita Excel —con fórmulas, formato,
   gráficos y tablas dinámicas intactos, porque la edita Excel y no
   nosotros— y al volver se trae y se guarda como versión nueva.
   ══════════════════════════════════════════════════════════════════ */
var MS = CFG.ms || {};
var _msTok = null;                     // { token, vence }
var EXT_EXCEL = ['xlsx','xlsm','xls','csv'];

function esExcel(d){
  return EXT_EXCEL.indexOf(d.ext || extDe(d.nombre)) >= 0;
}
function _msTenant(){
  // El tenant sale del MISMO lugar que el login del sistema, que lo cachea en
  // localStorage después del primer ingreso. Así se cambia en un solo lado.
  try { var c = localStorage.getItem('rk_ms_tenant'); if (c) return c; } catch(e) {}
  return MS.tenant || 'common';
}
// Permiso de Graph a partir del login con Microsoft que ya usa el sistema.
// Firebase no devuelve refresh token del proveedor, así que el token dura lo
// que dura: se vuelve a pedir al vencer o cuando Graph contesta 401.
function _graphToken(forzar){
  if (!forzar && _msTok && _msTok.vence > Date.now() + 60000) return Promise.resolve(_msTok.token);
  var user = auth.currentUser;
  if (!user) return Promise.reject(new Error('No hay sesión abierta.'));
  var prov = new firebase.auth.OAuthProvider('microsoft.com');
  (MS.scopes || ['Files.ReadWrite']).forEach(function(x){ prov.addScope(x); });
  prov.setCustomParameters({ tenant: _msTenant(), prompt: 'select_account' });
  var yaEsta = (user.providerData || []).some(function(x){ return x.providerId === 'microsoft.com'; });
  // Si la cuenta ya tiene Microsoft vinculado hay que REAUTENTICAR (vincular
  // de nuevo daría 'provider-already-linked'); si no, se vincula — igual que
  // hace el sistema para no duplicar el uid y perder el rol.
  function pedir(reauth){
    return reauth ? user.reauthenticateWithPopup(prov) : user.linkWithPopup(prov);
  }
  return pedir(yaEsta).catch(function(e){
    var c = (e && e.code) || '';
    // El estado del vínculo puede no ser el que creíamos (por ejemplo si se
    // vinculó desde otro dispositivo): se prueba una vez por el otro camino.
    if (c === 'auth/provider-already-linked' || c === 'auth/credential-already-in-use') return pedir(true);
    if (c === 'auth/user-mismatch') {
      throw new Error('Esa cuenta de Microsoft no es la misma con la que entraste al sistema.');
    }
    throw e;
  }).then(function(r){
    var t = r && r.credential && r.credential.accessToken;
    if (!t) throw new Error('Microsoft no devolvió el permiso para los archivos. Revisá que la app tenga Files.ReadWrite con consentimiento de administrador.');
    _msTok = { token: t, vence: Date.now() + 50 * 60 * 1000 };
    return t;
  });
}
function _graph(ruta, opts, reintento){
  return _graphToken().then(function(tok){
    var o = Object.assign({}, opts || {});
    o.headers = Object.assign({}, o.headers, { Authorization: 'Bearer ' + tok });
    return fetch(ruta.indexOf('http') === 0 ? ruta : 'https://graph.microsoft.com/v1.0' + ruta, o);
  }).then(function(r){
    if (r.status === 401 && !reintento) { _msTok = null; return _graph(ruta, opts, true); }
    return r;
  });
}
function _msError(r){
  return r.text().then(function(t){
    var m = '';
    try { m = (JSON.parse(t).error || {}).message || ''; } catch(e) { m = t.slice(0, 180); }
    return new Error('Microsoft respondió ' + r.status + (m ? ': ' + m : ''));
  });
}
function _msCarpeta(){
  var e = empresas.find(function(x){ return x.id === empId; }) || {};
  var pr = ((e.proyectos || []).find(function(x){ return x.id === proyId; }) || {});
  // OneDrive no acepta estos caracteres en nombres de archivo ni de carpeta.
  var limpio = function(x){ return String(x || '').replace(/[\\/:*?"<>|#%]/g, '-').trim() || 'sin-nombre'; };
  return limpio(MS.carpeta || 'Documentación') + '/' + limpio(e.nombre || empId) + ' - ' + limpio(pr.nombre || proyId);
}
// Sube a OneDrive. Hasta 4 MB va de una; más grande, por sesión de carga en
// pedazos, que es lo que pide Graph.
function _msSubir(nombreRuta, blob){
  var url = '/me/drive/root:/' + nombreRuta.split('/').map(encodeURIComponent).join('/');
  if (blob.size < 4 * 1024 * 1024) {
    return _graph(url + ':/content', {
      method: 'PUT',
      headers: { 'Content-Type': blob.type || 'application/octet-stream' },
      body: blob
    }).then(function(r){ return r.ok ? r.json() : _msError(r).then(function(e){ throw e; }); });
  }
  return _graph(url + ':/createUploadSession', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } })
  }).then(function(r){ return r.ok ? r.json() : _msError(r).then(function(e){ throw e; }); })
    .then(function(ses){
      var TROZO = 3200 * 1024, pos = 0, ultimo = null;
      function trozo(){
        if (pos >= blob.size) return Promise.resolve(ultimo);
        var fin = Math.min(pos + TROZO, blob.size), ini = pos;
        return fetch(ses.uploadUrl, {
          method: 'PUT',
          headers: { 'Content-Range': 'bytes ' + ini + '-' + (fin - 1) + '/' + blob.size },
          body: blob.slice(ini, fin)
        }).then(function(r){
          if (!r.ok && r.status !== 202) return _msError(r).then(function(e){ throw e; });
          pos = fin;
          return r.status === 202 ? null : r.json();
        }).then(function(j){ if (j) ultimo = j; return trozo(); });
      }
      return trozo();
    });
}

function editarEnExcel(id){
  var d = docs[id]; if (!d) return;
  if (!puedeEditar) { aviso('Tu rol no puede modificar documentos.'); return; }
  modal('<h3>Editar en Excel</h3>' +

      '<li>Se sube la planilla a tu OneDrive, a la carpeta <b>' + esc(_msCarpeta()) + '</b>.</li>' +

      '<li>Cuando termines, volvé acá y tocá «Ya terminé». El archivo vuelve al sistema como <b>versión nueva</b>; la actual no se pierde.</li>' +
    '</ol>' +
    '<div class="err" id="xErr"></div>' +
    '<div class="pie">' +
      '<button class="btn" id="xCerrar">Cerrar</button>' +
      '<button class="btn" id="xTraer" disabled>Ya terminé — traer los cambios</button>' +
      '<button class="btn pri" id="xAbrir">Abrir en Excel</button>' +
    '</div>');
  var err = document.getElementById('xErr');
  document.getElementById('xCerrar').onclick = cerrarModal;
  document.getElementById('xAbrir').onclick = function(){
    var bAbrir = document.getElementById('xAbrir');
    bAbrir.disabled = true; err.textContent = ''; err.style.color = '';
    aviso('Subiendo a OneDrive…');
    _leerArchivo(id, d).then(function(blob){
      return _msSubir(_msCarpeta() + '/' + d.nombre, blob);
    }).then(function(item){
      if (!item || !item.id) throw new Error('OneDrive no devolvió el archivo subido.');
      // Se recuerda a qué archivo de OneDrive corresponde, para poder traerlo
      // de vuelta aunque se cierre la ventana o se siga desde otro equipo.
      return db.ref(basePath() + '/docs/' + id).update({
        msItemId: item.id, msWebUrl: item.webUrl || '', msSubido: Date.now(), msPor: mail
      }).then(function(){ return item; });
    }).then(function(item){
      document.getElementById('xTraer').disabled = false;
      bAbrir.disabled = false;
      if (item.webUrl) window.open(item.webUrl, '_blank', 'noopener');
      else err.textContent = 'Se subió, pero OneDrive no devolvió el link para abrirlo.';
    }).catch(function(e){
      bAbrir.disabled = false;
      err.textContent = (e && e.message) ? e.message : 'No se pudo abrir en Excel.';
    });
  };
  document.getElementById('xTraer').onclick = function(){ traerDeExcel(id, err); };
  // Si ya se había subido antes, se puede traer sin volver a subir.
  if (d.msItemId) {
    document.getElementById('xTraer').disabled = false;
    err.style.color = 'var(--ink3)';
    err.textContent = 'Ya hay una copia en OneDrive desde el ' + fecha(d.msSubido) +
                      (d.msPor ? ' (' + d.msPor + ')' : '') + '. Podés traerla directamente.';
  }
}

function traerDeExcel(id, err){
  var d = docs[id]; if (!d || !d.msItemId) return;
  var b = document.getElementById('xTraer');
  if (b) b.disabled = true;
  if (err) { err.style.color = ''; err.textContent = ''; }
  aviso('Trayendo los cambios…');
  _graph('/me/drive/items/' + encodeURIComponent(d.msItemId) + '/content')
    .then(function(r){ return r.ok ? r.blob() : _msError(r).then(function(e){ throw e; }); })
    .then(function(blob){ return _guardarVersion(id, blob, 'excel'); })
    .then(function(ver){
      cerrarModal();
      aviso('Guardado como versión ' + ver + '. La anterior quedó en el historial.');
    })
    .catch(function(e){
      if (b) b.disabled = false;
      if (err) err.textContent = (e && e.message) ? e.message : 'No se pudieron traer los cambios.';
      else alert('No se pudieron traer los cambios.\n\n' + (e && e.message ? e.message : e));
    });
}

/* ── Versiones ─────────────────────────────────────────────────────── */
// Guarda `blob` como la versión siguiente. La actual NO se pisa: se anota en
// documentacion/versiones/<id> con su propio `ver`, que es de dónde hay que
// leerla (los documentos viejos, sin `ver`, viven en la ruta de antes).
function _guardarVersion(id, blob, origen){
  var d = docs[id];
  var verAnterior = d.ver || null;
  var verNueva = (d.ver || 1) + 1;
  return _blobABase64(blob).then(function(b64){
    return _subirPartes(id, verNueva, b64, null);
  }).then(function(partes){
    return db.ref('documentacion/versiones/' + id + '/' + (d.ver || 1)).set({
      ver: verAnterior, tam: d.tam || 0, partes: d.partes || 0,
      creado: d.creado || 0, porMail: d.porMail || '', origen: d.origen || 'subida'
    }).then(function(){
      return db.ref(basePath() + '/docs/' + id).update({
        tam: blob.size, partes: partes, ver: verNueva,
        origen: origen || 'edicion', mod: Date.now(), modPor: mail
      });
    });
  }).then(function(){ return verNueva; });
}

function verVersiones(id){
  var d = docs[id]; if (!d) return;
  db.ref('documentacion/versiones/' + id).once('value').then(function(s){
    var v = s.val() || {};
    var nums = Object.keys(v).sort(function(a, b){ return (+b) - (+a); });
    var filas = '<div class="crow" style="display:flex;justify-content:space-between;align-items:center;' +
      'padding:9px 0;border-bottom:1px solid var(--line)">' +
      '<span><b>Versión ' + (d.ver || 1) + '</b> · actual · ' + peso(d.tam) + ' · ' +
        fecha(d.mod || d.creado) + ' · ' + esc(d.modPor || d.porMail || '') + '</span>' +
      '<button class="btn sm" id="vAct">↓</button></div>' +
      nums.map(function(n){
        var x = v[n];
        return '<div style="display:flex;justify-content:space-between;align-items:center;' +
          'padding:9px 0;border-bottom:1px solid var(--line)">' +
          '<span style="color:var(--ink2)">Versión ' + esc(n) + ' · ' + peso(x.tam) + ' · ' +
            fecha(x.creado) + ' · ' + esc(x.porMail || '') + '</span>' +
          '<span><button class="btn sm" data-vbaj="' + esc(n) + '">↓</button> ' +
          (puedeEditar ? '<button class="btn sm" data-vrest="' + esc(n) + '">Restaurar</button>' : '') +
          '</span></div>';
      }).join('');
    modal('<h3>Versiones</h3><div class="sub">' + esc(d.nombre) + '</div>' + filas +
      (nums.length ? '' : '<div style="color:var(--ink3);font-size:12.5px;margin-top:10px">Todavía no tiene versiones anteriores.</div>') +
      '<div class="pie"><button class="btn pri" id="vCerrar">Cerrar</button></div>');
    document.getElementById('vCerrar').onclick = cerrarModal;
    document.getElementById('vAct').onclick = function(){ bajarDoc(id); };
    document.querySelectorAll('[data-vbaj]').forEach(function(b){
      b.onclick = function(){ bajarVersion(id, b.dataset.vbaj, v[b.dataset.vbaj]); };
    });
    document.querySelectorAll('[data-vrest]').forEach(function(b){
      b.onclick = function(){ restaurarVersion(id, b.dataset.vrest, v[b.dataset.vrest]); };
    });
  });
}
function _blobDeVersion(id, reg){
  // `reg.ver` dice de dónde sale esa versión: null = la ruta vieja, de antes
  // de que existieran las versiones.
  return _leerArchivo(id, { ver: reg.ver, mime: (docs[id] || {}).mime });
}
function bajarVersion(id, n, reg){
  var d = docs[id]; if (!d || !reg) return;
  aviso('Preparando la versión ' + n + '…');
  _blobDeVersion(id, reg).then(function(blob){
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    var punto = (d.nombre || '').lastIndexOf('.');
    a.href = url;
    a.download = punto > 0 ? d.nombre.slice(0, punto) + ' (v' + n + ')' + d.nombre.slice(punto)
                           : (d.nombre || 'documento') + ' (v' + n + ')';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }).catch(function(e){ alert('No se pudo descargar esa versión.\n\n' + (e && e.message ? e.message : e)); });
}
function restaurarVersion(id, n, reg){
  var d = docs[id]; if (!d || !reg || !puedeEditar) return;
  if (!confirm('¿Volver a la versión ' + n + '?\n\n' +
               'No se borra nada: la versión actual (' + (d.ver || 1) + ') queda en el historial ' +
               'y la ' + n + ' pasa a ser la vigente.')) return;
  aviso('Restaurando…');
  _blobDeVersion(id, reg).then(function(blob){
    return _guardarVersion(id, blob, 'restaurada de v' + n);
  }).then(function(ver){
    cerrarModal();
    aviso('Listo: ahora rige el contenido de la versión ' + n + ' (guardado como ' + ver + ').');
  }).catch(function(e){ alert('No se pudo restaurar.\n\n' + (e && e.message ? e.message : e)); });
}

/* ── Modal ─────────────────────────────────────────────────────────── */
function modal(html, ancho){
  cerrarModal();
  var velo = document.createElement('div'); velo.id = 'velo';
  velo.innerHTML = '<div id="modal"' + (ancho ? ' class="ancho"' : '') + '>' + html + '</div>';
  velo.onclick = function(e){ if (e.target === velo) cerrarModal(); };
  document.body.appendChild(velo);
}
function cerrarModal(){
  var v = document.getElementById('velo');
  if (v) v.remove();
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') cerrarModal(); });

/* ── Service worker ────────────────────────────────────────────────── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
