<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<title>Documentación · Escribanía y contable</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0D14; --bg2:#0E1220; --card:#121828; --card2:#161D30;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#E9ECF5; --ink2:rgba(233,236,245,.74); --ink3:rgba(233,236,245,.46);
  --acc:#7C5CFF; --acc2:#22D3EE; --ok:#34D399; --warn:#FBBF24; --bad:#F87171;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.hid{display:none!important}

/* ── Pantallas de bloqueo (cargando / sin permiso) ── */
#capa{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:24px;text-align:center}
#capa .box{max-width:460px}
#capa img{width:66px;opacity:.9;margin-bottom:18px}
#capa h1{font-size:19px;font-weight:600;margin:0 0 10px}
#capa p{color:var(--ink3);margin:0 0 18px;font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);
  background:var(--card2);border-radius:10px;padding:9px 15px;font-size:13px;
  font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);background:var(--card)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px;font-weight:500}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ── Barra superior ── */
#top{display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
#top .marca{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap}
#top .marca img{width:26px}
#top .marca small{display:block;font-size:10.5px;color:var(--ink3);font-weight:400;letter-spacing:.3px}
#top select{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;max-width:190px}
#top .sp{flex:1}
#busca{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;min-width:160px;width:230px}
#quien{font-size:11.5px;color:var(--ink3);white-space:nowrap}

/* ── Cuerpo: carpetas + listado ── */
#cuerpo{display:grid;grid-template-columns:250px 1fr;height:calc(100% - 53px);min-height:0}
#arbol{border-right:1px solid var(--line);overflow:auto;padding:12px 10px;background:var(--bg2)}
#arbol h4{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);
  margin:0 0 9px;padding:0 6px;font-weight:600}
.cp{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;
  font-size:13px;cursor:pointer;color:var(--ink2);user-select:none}
.cp:hover{background:var(--card)}
.cp.on{background:var(--card2);color:var(--ink);font-weight:600}
.cp .ico{opacity:.75;flex:0 0 15px;display:flex}
.cp .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp .ct{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.cp .mas{opacity:0;padding:0 2px;background:none;border:none;color:var(--ink3);font-size:13px}
.cp:hover .mas{opacity:1}
.cp .mas:hover{color:var(--ink)}

#panel{overflow:auto;padding:16px 18px;min-height:0;position:relative}
#ruta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;
  font-size:12.5px;color:var(--ink3)}
#ruta b{color:var(--ink);font-weight:600}
#ruta span.sep{opacity:.5}
#ruta a{color:var(--ink3);cursor:pointer;text-decoration:none}
#ruta a:hover{color:var(--acc2)}
#acciones{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:4px 11px;font-size:11.5px;color:var(--ink2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink3);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
tr.doc:hover td{background:var(--card)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
td.acc{text-align:right;white-space:nowrap}
.nmdoc{display:flex;align-items:center;gap:9px;min-width:0}
.nmdoc .ext{flex:0 0 32px;height:32px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:9.5px;font-weight:700;letter-spacing:.4px;
  background:var(--card2);border:1px solid var(--line);color:var(--ink3)}
.nmdoc .ext.pdf{color:#FCA5A5;border-color:rgba(248,113,113,.35)}
.nmdoc .ext.xls{color:#6EE7B7;border-color:rgba(52,211,153,.35)}
.nmdoc .ext.img{color:#93C5FD;border-color:rgba(147,197,253,.35)}
.nmdoc .ext.doc{color:#A5B4FC;border-color:rgba(165,180,252,.35)}
.nmdoc .t{min-width:0}
.nmdoc .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmdoc .t small{color:var(--ink3);font-size:11.5px}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:6px;padding:1px 7px;
  font-size:10.5px;color:var(--ink2);background:var(--card2)}
.vacio{text-align:center;padding:52px 20px;color:var(--ink3);font-size:13px}
.vacio .big{font-size:30px;opacity:.5;margin-bottom:10px}

/* ── Zona de arrastre ── */
#drop{position:absolute;inset:0;z-index:30;background:rgba(124,92,255,.10);
  border:2px dashed var(--acc);border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:600;pointer-events:none}

/* ── Modales ── */
#velo{position:fixed;inset:0;z-index:500;background:rgba(5,7,12,.72);
  display:flex;align-items:center;justify-content:center;padding:18px}
#modal{background:var(--card);border:1px solid var(--line2);border-radius:14px;
  width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}
#modal.ancho{max-width:1000px}
#modal h3{margin:0 0 4px;font-size:16px}
#modal .sub{color:var(--ink3);font-size:12.5px;margin-bottom:16px}
#modal label{display:block;font-size:11.5px;color:var(--ink3);margin:12px 0 5px;font-weight:600}
#modal input[type=text],#modal textarea,#modal select{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
#modal textarea{min-height:66px;resize:vertical}
#modal .pie{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
#modal .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:17px}
#visor{width:100%;height:68vh;border:1px solid var(--line);border-radius:10px;background:#fff}
#visorImg{max-width:100%;max-height:68vh;display:block;margin:0 auto;border-radius:10px}

/* ── Progreso de subida ── */
#subiendo{position:fixed;right:18px;bottom:18px;z-index:600;background:var(--card);
  border:1px solid var(--line2);border-radius:12px;padding:13px 16px;min-width:270px;
  box-shadow:0 10px 36px rgba(0,0,0,.45)}
#subiendo b{display:block;font-size:12.5px;margin-bottom:8px}
#subiendo .barra{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}
#subiendo .barra i{display:block;height:100%;background:var(--acc);width:0;transition:width .18s}
#subiendo small{display:block;color:var(--ink3);font-size:11px;margin-top:7px}

#aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:700;
  background:#1b2236;border:1px solid var(--line2);color:var(--ink);padding:10px 17px;
  border-radius:10px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.45);
  opacity:0;transition:opacity .18s;pointer-events:none;max-width:90vw;text-align:center}
#aviso.on{opacity:1}

@media (max-width:860px){
  #cuerpo{grid-template-columns:1fr;height:auto}
  #arbol{border-right:none;border-bottom:1px solid var(--line);max-height:206px}
  #busca{width:100%}
  th.ocu,td.ocu{display:none}
}
</style>

<body>

<!-- Pantalla de bloqueo: cargando, sin sesión o sin permiso -->
<div id="capa"><div class="box">
  <img id="capaLogo" src="../assets/mess-logo.svg" alt="">
  <h1 id="capaTit">Abriendo documentación…</h1>
  <p id="capaTxt">Un momento.</p>
  <div id="capaAcc"></div>
</div></div>

<div id="app" class="hid" style="height:100%;display:flex;flex-direction:column">

  <div id="top">
    <div class="marca">
      <img src="../assets/mess-logo.svg" alt="">
      <div>Documentación<small>Escribanía y contable</small></div>
    </div>
    <select id="selEmp" title="Empresa"></select>
    <select id="selProy" title="Proyecto"></select>
    <div class="sp"></div>
    <input id="busca" type="text" placeholder="Buscar por nombre, etiqueta o nota…" autocomplete="off">
    <button class="btn pri" id="btnSubir">⬆ Subir archivos</button>
    <span id="quien"></span>
    <a class="btn sm" href="../" title="Volver a elegir módulo">← Módulos</a>
  </div>

  <div id="cuerpo">
    <div id="arbol">
      <h4>Carpetas</h4>
      <div id="arbolLista"></div>
      <button class="btn sm" id="btnNuevaCarp" style="margin-top:10px;width:100%;justify-content:center">＋ Nueva carpeta</button>
    </div>
    <div id="panel">
      <div id="ruta"></div>
      <div id="acciones"></div>
      <div id="chips"></div>
      <div id="lista"></div>
    </div>
  </div>
</div>

<input type="file" id="archivoInput" multiple class="hid">
<div id="aviso"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   DOCUMENTACIÓN, ESCRIBANÍA Y CONTABLE

   Módulo aparte del sistema de gestión, en el MISMO proyecto de Firebase
   (ver config.js para el porqué). Sirve para guardar y compartir los
   papeles de cada obra: escrituras en PDF, planillas de Excel, boletos,
   posesiones, movimientos de fondos, documentación contable.

   ── Dónde viven los datos ───────────────────────────────────────────
   Raíz `documentacion`, separada en DOS ramas a propósito:

     documentacion/<empresaId>/<proyectoId>/carpetas/<id>
         { nombre, padre, creado, por, porMail }
     documentacion/<empresaId>/<proyectoId>/docs/<id>
         { nombre, carpeta, etiqueta, nota, mime, ext, tam, partes,
           creado, por, porMail, mod, modPor }

     documentacion/archivos/<docId>/partes/<n> = "<pedazo de base64>"

   El CONTENIDO del archivo NUNCA está en el índice. Es la lección que ya
   dejó el nodo `documentos` del sistema: si los adjuntos cuelgan de lo
   que se escucha al arrancar, abrir la pantalla baja todos los PDF del
   proyecto y la app queda inutilizable. Acá el índice pesa unos bytes por
   documento y el contenido se busca SÓLO cuando alguien abre o descarga
   uno (`_leerArchivo`), de a un documento por vez.

   ── Por qué va en pedazos ───────────────────────────────────────────
   Realtime Database tiene un tope por escritura, y base64 infla el
   archivo cerca de un tercio. Partirlo en pedazos de 512 KB saca ese
   tope del medio, deja subir una escritura escaneada entera y permite
   mostrar el avance real de la subida. Al leer se rearman en orden.

   ── Varias personas a la vez ────────────────────────────────────────
   El índice se escucha con on('value'): lo que sube uno aparece solo en
   la pantalla del otro, sin recargar. Como cada documento y cada carpeta
   es un nodo con su propio id, dos personas trabajando al mismo tiempo
   no se pisan — nunca se reescribe la colección entera, igual que el
   criterio de `_colPersist` en el sistema.

   ── Permisos ────────────────────────────────────────────────────────
   Los mismos del sistema: hace falta tener rol en `roles/<uid>` para
   entrar, y ser superadmin/admin/editor para subir, renombrar o borrar.
   Un `lector` ve y descarga, pero no toca nada. Las reglas del servidor
   exigen lo mismo (ver la rama `documentacion` en database.rules.json):
   esconder los botones solo no alcanzaría.
   ══════════════════════════════════════════════════════════════════════ */

var CFG = window.DOCU_CONFIG || {};
var MAX_MB     = CFG.maxMB || 20;
var MAX_BYTES  = MAX_MB * 1024 * 1024;
var PEDAZO     = 512 * 1024;          // tamaño de cada pedazo de base64
var ETIQUETAS  = CFG.etiquetas || [];

var db = null, auth = null;
var uid = '', mail = '', rol = '', puedeEditar = false;
var empresas = [];                     // [{id, nombre, proyectos:[{id,nombre}]}]
var empId = '', proyId = '';
var carpetas = {}, docs = {};          // índices del proyecto activo
var carpActual = '';                   // '' = raíz
var filtroTexto = '', filtroEtiqueta = '';
var _refCarp = null, _refDocs = null;  // listeners activos, para desengancharlos

/* ── Utilidades ────────────────────────────────────────────────────── */
function esc(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function norm(s){
  return (s == null ? '' : String(s)).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
}
function peso(b){
  if (!b && b !== 0) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(0) + ' KB';
  return (b/1024/1024).toFixed(b < 10*1024*1024 ? 1 : 0) + ' MB';
}
function fecha(ms){
  if (!ms) return '—';
  var d = new Date(ms);
  var p = function(n){ return String(n).padStart(2,'0'); };
  return p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear();
}
function extDe(nombre){
  var m = /\.([a-z0-9]{1,6})$/i.exec(nombre || '');
  return m ? m[1].toLowerCase() : '';
}
function claseExt(e){
  if (e === 'pdf') return 'pdf';
  if (['xls','xlsx','xlsm','csv','ods'].indexOf(e) >= 0) return 'xls';
  if (['jpg','jpeg','png','webp','gif','heic','bmp','tif','tiff'].indexOf(e) >= 0) return 'img';
  if (['doc','docx','odt','txt','rtf'].indexOf(e) >= 0) return 'doc';
  return '';
}
var _avisoT = null;
function aviso(txt){
  var el = document.getElementById('aviso');
  el.textContent = txt; el.classList.add('on');
  clearTimeout(_avisoT);
  _avisoT = setTimeout(function(){ el.classList.remove('on'); }, 3200);
}
function bloquear(tit, txt, accionHTML){
  var c = document.getElementById('capa');
  document.getElementById('capaTit').textContent = tit;
  document.getElementById('capaTxt').textContent = txt;
  document.getElementById('capaAcc').innerHTML = accionHTML || '';
  c.classList.remove('hid');
  document.getElementById('app').classList.add('hid');
}

/* ── Arranque: Firebase, sesión y rol ──────────────────────────────── */
(function init(){
  try {
    firebase.initializeApp(CFG.firebase);
    db = firebase.database(); auth = firebase.auth();
  } catch (e) {
    bloquear('No se pudo conectar', 'Revisá config.js: falta o está mal la configuración de Firebase.');
    return;
  }
  auth.onAuthStateChanged(function(user){
    if (!user) {
      // La sesión se comparte con el sistema de gestión: mismo proyecto y
      // mismo origen. Si no hay sesión, se entra por la puerta de siempre.
      bloquear('Entrá primero al sistema',
               'Esta pantalla usa la misma cuenta que el sistema de gestión.',
               '<a class="btn pri" href="../">Ir al ingreso</a>');
      return;
    }
    uid = user.uid; mail = user.email || '';
    // Tener rol ES el permiso de acceso: estar autenticado no alcanza. Mismo
    // criterio que el sistema, y las reglas del servidor exigen lo mismo.
    db.ref('roles/' + uid).once('value').then(function(s){
      rol = s.val() || '';
      if (!rol) {
        bloquear('Tu cuenta todavía no tiene permiso',
                 'Pedile a un administrador que te habilite desde Config → Usuarios.',
                 '<a class="btn" href="../">← Volver</a>');
        return;
      }
      puedeEditar = ['superadmin','admin','editor'].indexOf(rol) >= 0;
      document.getElementById('quien').textContent = mail + ' · ' + rol;
      cargarEmpresas();
    }).catch(function(){
      bloquear('No se pudo leer tu permiso',
               'Puede que falte publicar las reglas de la base. Probá de nuevo en un rato.',
               '<a class="btn" href="../">← Volver</a>');
    });
  });
})();

function cargarEmpresas(){
  db.ref('empresas').once('value').then(function(s){
    var v = s.val() || {};
    empresas = Object.keys(v).map(function(eid){
      var e = v[eid] || {}, ps = e.proyectos || {};
      return {
        id: eid,
        nombre: e.nombre || eid,
        proyectos: Object.keys(ps).map(function(pid){
          return { id: pid, nombre: (ps[pid] && ps[pid].nombre) || pid };
        })
      };
    }).filter(function(e){ return e.proyectos.length; });
    if (!empresas.length) {
      bloquear('Todavía no hay obras cargadas',
               'Creá una empresa y un proyecto desde el sistema de gestión y volvé.',
               '<a class="btn" href="../">← Volver</a>');
      return;
    }
    // Se recuerda la última obra elegida, por equipo.
    var guard = {};
    try { guard = JSON.parse(localStorage.getItem('docu_obra') || '{}'); } catch(e) {}
    var e0 = empresas.find(function(e){ return e.id === guard.emp; }) || empresas[0];
    empId = e0.id;
    var p0 = e0.proyectos.find(function(p){ return p.id === guard.proy; }) || e0.proyectos[0];
    proyId = p0.id;
    document.getElementById('capa').classList.add('hid');
    document.getElementById('app').classList.remove('hid');
    pintarSelectores();
    engancharProyecto();
  }).catch(function(){
    bloquear('No se pudieron leer las obras',
             'Puede que falte publicar las reglas de la base.',
             '<a class="btn" href="../">← Volver</a>');
  });
}

function pintarSelectores(){
  var se = document.getElementById('selEmp'), sp = document.getElementById('selProy');
  se.innerHTML = empresas.map(function(e){
    return '<option value="' + esc(e.id) + '"' + (e.id === empId ? ' selected' : '') + '>' + esc(e.nombre) + '</option>';
  }).join('');
  var e = empresas.find(function(x){ return x.id === empId; }) || empresas[0];
  sp.innerHTML = e.proyectos.map(function(p){
    return '<option value="' + esc(p.id) + '"' + (p.id === proyId ? ' selected' : '') + '>' + esc(p.nombre) + '</option>';
  }).join('');
}
document.getElementById('selEmp').onchange = function(){
  empId = this.value;
  var e = empresas.find(function(x){ return x.id === empId; });
  proyId = (e && e.proyectos[0] && e.proyectos[0].id) || '';
  pintarSelectores(); engancharProyecto();
};
document.getElementById('selProy').onchange = function(){
  proyId = this.value; engancharProyecto();
};

/* ── Índice del proyecto activo, en vivo ───────────────────────────── */
function basePath(){ return 'documentacion/' + empId + '/' + proyId; }

function engancharProyecto(){
  try { localStorage.setItem('docu_obra', JSON.stringify({ emp: empId, proy: proyId })); } catch(e) {}
  if (_refCarp) _refCarp.off();
  if (_refDocs) _refDocs.off();
  carpetas = {}; docs = {}; carpActual = ''; filtroEtiqueta = '';
  pintar();
  _refCarp = db.ref(basePath() + '/carpetas');
  _refDocs = db.ref(basePath() + '/docs');
  // Se escucha SÓLO el índice. El contenido de los archivos cuelga de otra
  // rama (documentacion/archivos) justamente para que no viaje con esto.
  _refCarp.on('value', function(s){ carpetas = s.val() || {}; pintar(); });
  _refDocs.on('value', function(s){ docs = s.val() || {}; pintar(); });
}

/* ── Árbol de carpetas ─────────────────────────────────────────────── */
function hijasDe(padre){
  return Object.keys(carpetas)
    .filter(function(id){ return (carpetas[id].padre || '') === (padre || ''); })
    .map(function(id){ var c = carpetas[id]; return { id: id, nombre: c.nombre || '(sin nombre)', padre: c.padre || '' }; })
    .sort(function(a, b){ return norm(a.nombre) < norm(b.nombre) ? -1 : 1; });
}
function cuentaEn(carpId){
  // Cuenta los documentos de la carpeta y de todo lo que cuelga de ella, para
  // que una carpeta madre no aparezca vacía cuando todo está en sus hijas.
  var n = 0, id;
  for (id in docs) if ((docs[id].carpeta || '') === (carpId || '')) n++;
  hijasDe(carpId).forEach(function(h){ n += cuentaEn(h.id); });
  return n;
}
function rutaDe(carpId){
  var ruta = [], guard = 0;
  while (carpId && carpetas[carpId] && guard++ < 50) {
    ruta.unshift({ id: carpId, nombre: carpetas[carpId].nombre || '(sin nombre)' });
    carpId = carpetas[carpId].padre || '';
  }
  return ruta;
}

  function fila(c, nivel){

  html += hijasDe('').map(function(c){ return fila(c, 1); }).join('');

/* ── Listado de documentos ─────────────────────────────────────────── */
function docsVisibles(){
  var terminos = norm(filtroTexto).split(' ').filter(Boolean);
  // Dentro de una carpeta se ve lo de ESA carpeta; buscando, se busca en todo
  // el proyecto — si no, habría que acordarse en qué carpeta quedó el papel.
  var buscando = terminos.length > 0;
  return Object.keys(docs).map(function(id){
    var d = docs[id] || {}; d = Object.assign({ id: id }, d); return d;
  }).filter(function(d){
    if (!buscando && (d.carpeta || '') !== (carpActual || '')) return false;
    if (filtroEtiqueta && (d.etiqueta || '') !== filtroEtiqueta) return false;
    if (buscando) {
      var blob = norm([d.nombre, d.etiqueta, d.nota, d.porMail].filter(Boolean).join(' '));
      for (var i = 0; i < terminos.length; i++) if (blob.indexOf(terminos[i]) === -1) return false;
    }
    return true;
  }).sort(function(a, b){ return (b.creado || 0) - (a.creado || 0); });
}

function nuevaCarpeta(padre){
  if (!puedeEditar) return;
  var nombre = prompt('Nombre de la carpeta nueva:', '');
  if (nombre == null) return;
  nombre = nombre.trim();
  if (!nombre) { aviso('Poné un nombre.'); return; }
  var ref = db.ref(basePath() + '/carpetas').push();
  ref.set({ nombre: nombre, padre: padre || '', creado: Date.now(), por: uid, porMail: mail })
    .then(function(){ carpActual = ref.key; pintar(); aviso('Carpeta creada.'); })
    .catch(function(){ aviso('No se pudo crear. ¿Están publicadas las reglas?'); });
}
document.getElementById('btnNuevaCarp').onclick = function(){ nuevaCarpeta(carpActual); };

function menuCarpeta(id){
  var c = carpetas[id]; if (!c) return;
  var q = prompt('Carpeta "' + (c.nombre || '') + '"\n\n' +
                 'Escribí el nombre nuevo para renombrarla,\n' +
                 'o escribí BORRAR para eliminarla.', c.nombre || '');
  if (q == null) return;
  q = q.trim();
  if (!q) return;
  if (q.toUpperCase() === 'BORRAR') {
    var dentro = cuentaEn(id), sub = hijasDe(id).length;
    if (dentro || sub) {
      alert('No se puede borrar: la carpeta tiene ' +
            (dentro ? dentro + ' documento(s)' : '') + (dentro && sub ? ' y ' : '') +
            (sub ? sub + ' subcarpeta(s)' : '') + '.\n\n' +
            'Vaciala primero (mové o borrá lo que tiene adentro).');
      return;
    }
    if (!confirm('¿Borrar la carpeta "' + (c.nombre || '') + '"?')) return;
    db.ref(basePath() + '/carpetas/' + id).remove().then(function(){
      if (carpActual === id) carpActual = c.padre || '';
      aviso('Carpeta borrada.');
    });
    return;
  }
  db.ref(basePath() + '/carpetas/' + id + '/nombre').set(q).then(function(){ aviso('Carpeta renombrada.'); });
}

// Arrastrar y soltar sobre el panel.
(function dnd(){
  var panel = document.getElementById('panel'), capa = null, cont = 0;
  panel.addEventListener('dragover', function(e){ e.preventDefault(); });
  panel.addEventListener('dragenter', function(e){
    e.preventDefault();
    if (!puedeEditar) return;
    cont++;
    if (!capa) {
      capa = document.createElement('div');
      capa.id = 'drop'; capa.textContent = 'Soltá los archivos acá';
      panel.appendChild(capa);
    }
  });
  panel.addEventListener('dragleave', function(){
    // dragleave salta también al pasar por encima de los hijos: se cuenta
    // entrada/salida para no apagar el cartel mientras el archivo sigue arriba.
    if (--cont <= 0 && capa) { capa.remove(); capa = null; cont = 0; }
  });
  panel.addEventListener('drop', function(e){
    e.preventDefault();
    cont = 0; if (capa) { capa.remove(); capa = null; }
    if (!puedeEditar) { aviso('Tu rol no puede subir archivos.'); return; }
    var fs = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []);
    if (fs.length) subirVarios(fs);
  });
})();

function mostrarProgreso(txt, pct, detalle){
  var el = document.getElementById('subiendo');
  if (!el) {
    el = document.createElement('div'); el.id = 'subiendo';
    el.innerHTML = '<b></b><div class="barra"><i></i></div><small></small>';
    document.body.appendChild(el);
  }
  el.querySelector('b').textContent = txt;
  el.querySelector('.barra i').style.width = Math.max(0, Math.min(100, pct)) + '%';
  el.querySelector('small').textContent = detalle || '';
}
function cerrarProgreso(){
  var el = document.getElementById('subiendo');
  if (el) el.remove();
}

function subirVarios(archivos){
  var i = 0, ok = 0, fallo = [];
  function siguiente(){
    if (i >= archivos.length) {
      cerrarProgreso();
      if (fallo.length) {
        alert('Subidos: ' + ok + '\n\nNo se pudieron subir:\n\n' + fallo.join('\n'));
      } else {
        aviso(ok === 1 ? 'Documento subido.' : ok + ' documentos subidos.');
      }
      return;
    }
    var f = archivos[i++];
    mostrarProgreso('Subiendo ' + i + ' de ' + archivos.length, 0, f.name);
    subirUno(f, function(pct){
      mostrarProgreso('Subiendo ' + i + ' de ' + archivos.length, pct, f.name + ' · ' + peso(f.size));
    }).then(function(){ ok++; siguiente(); })
      .catch(function(err){ fallo.push('· ' + f.name + ' — ' + (err && err.message ? err.message : err)); siguiente(); });
  }
  siguiente();
}

function _leerBase64(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var s = String(fr.result || '');
      var coma = s.indexOf(',');
      res(coma >= 0 ? s.slice(coma + 1) : s);
    };
    fr.onerror = function(){ rej(new Error('no se pudo leer el archivo')); };
    fr.readAsDataURL(file);
  });
}

// Las fotos sacadas con el celular pesan de más para lo que son. Se achican
// antes de subir; los PDF NO se tocan: una escritura recomprimida pierde
// legibilidad y eso en un documento legal no se puede hacer.
function _achicarImagen(file){
  return new Promise(function(res){
    if (!/^image\//.test(file.type) || file.size < 1024*1024) { res(file); return; }
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var MAX = 2200;
      var k = Math.min(1, MAX / Math.max(img.width, img.height));
      var w = Math.round(img.width * k), h = Math.round(img.height * k);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(function(b){
        URL.revokeObjectURL(url);
        res(b && b.size < file.size ? new File([b], file.name, { type: 'image/jpeg' }) : file);
      }, 'image/jpeg', 0.84);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

function subirUno(file, onProgreso){
  return _achicarImagen(file).then(function(f){
    if (f.size > MAX_BYTES) {
      throw new Error('pesa ' + peso(f.size) + ' y el tope es ' + MAX_MB + ' MB');
    }
    return _leerBase64(f).then(function(b64){
      var id = db.ref(basePath() + '/docs').push().key;
      var partes = [];
      for (var p = 0; p < b64.length; p += PEDAZO) partes.push(b64.slice(p, p + PEDAZO));
      // Primero el contenido, de a un pedazo (así se ve el avance de verdad y
      // ninguna escritura pasa el tope de la base). El índice se escribe AL
      // FINAL: si la subida se corta a la mitad, el documento no aparece
      // listado como si estuviera completo.
      var hecho = 0;
      var cadena = partes.reduce(function(prev, pedazo, n){
        return prev.then(function(){
          return db.ref('documentacion/archivos/' + id + '/partes/' + n).set(pedazo).then(function(){
            hecho++;
            if (onProgreso) onProgreso(Math.round(hecho / partes.length * 96));
          });
        });
      }, Promise.resolve());
      return cadena.then(function(){
        return db.ref(basePath() + '/docs/' + id).set({
          nombre: f.name,
          carpeta: carpActual || '',
          etiqueta: '',
          nota: '',
          mime: f.type || '',
          ext: extDe(f.name),
          tam: f.size,
          partes: partes.length,
          creado: Date.now(), por: uid, porMail: mail
        });
      }).then(function(){ if (onProgreso) onProgreso(100); });
    });
  });
}

/* ── Leer un archivo (sólo cuando alguien lo pide) ─────────────────── */
function _leerArchivo(id, d){
  return db.ref('documentacion/archivos/' + id + '/partes').once('value').then(function(s){
    var v = s.val();
    if (!v) throw new Error('El contenido de este documento no está en la base.');
    // El nodo puede volver como objeto o como array según cómo lo serialice
    // Firebase; en los dos casos hay que reordenar por índice numérico.
    var claves = Object.keys(v).sort(function(a, b){ return (+a) - (+b); });
    var b64 = claves.map(function(k){ return v[k]; }).join('');
    var bin = atob(b64), n = bin.length, buf = new Uint8Array(n);
    for (var i = 0; i < n; i++) buf[i] = bin.charCodeAt(i);
    return new Blob([buf], { type: d.mime || 'application/octet-stream' });
  });
}

function bajarDoc(id){
  var d = docs[id]; if (!d) return;
  aviso('Preparando la descarga…');
  _leerArchivo(id, d).then(function(blob){
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = d.nombre || 'documento';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }).catch(function(e){ alert('No se pudo descargar.\n\n' + (e && e.message ? e.message : e)); });
}

function abrirDoc(id){
  var d = docs[id]; if (!d) return;
  var e = d.ext || extDe(d.nombre);
  var esPDF = e === 'pdf' || d.mime === 'application/pdf';
  var esImg = /^image\//.test(d.mime || '') || claseExt(e) === 'img';
  if (!esPDF && !esImg) {
    // Excel, Word y compañía no se pueden mostrar en el navegador: se bajan.
    bajarDoc(id);
    return;
  }
  aviso('Abriendo…');
  _leerArchivo(id, d).then(function(blob){
    var url = URL.createObjectURL(blob);
    modal('<h3>' + esc(d.nombre) + '</h3>' +
      '<div class="sub">' + esc([d.etiqueta, peso(d.tam), 'subido el ' + fecha(d.creado), d.porMail].filter(Boolean).join(' · ')) + '</div>' +
      (esPDF ? '<iframe id="visor" src="' + url + '"></iframe>'
             : '<img id="visorImg" src="' + url + '" alt="">') +
      (d.nota ? '<div style="margin-top:12px;color:var(--ink2);font-size:13px">' + esc(d.nota) + '</div>' : '') +
      '<div class="pie">' +
        '<button class="btn" id="mBajar">↓ Descargar</button>' +
        '<button class="btn pri" id="mCerrar">Cerrar</button>' +
      '</div>', true);
    document.getElementById('mBajar').onclick = function(){ bajarDoc(id); };
    document.getElementById('mCerrar').onclick = function(){
      cerrarModal(); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    };
  }).catch(function(e2){ alert('No se pudo abrir.\n\n' + (e2 && e2.message ? e2.message : e2)); });
}

/* ── Editar / borrar un documento ──────────────────────────────────── */
function opcionesCarpetas(sel){
  var out = '<option value=""' + (sel ? '' : ' selected') + '>Todo el proyecto (sin carpeta)</option>';
  function rec(padre, nivel){
    hijasDe(padre).forEach(function(c){
      out += '<option value="' + esc(c.id) + '"' + (sel === c.id ? ' selected' : '') + '>' +
             new Array(nivel + 1).join('— ') + esc(c.nombre) + '</option>';
      rec(c.id, nivel + 1);
    });
  }
  rec('', 1);
  return out;
}
function editarDoc(id){
  var d = docs[id]; if (!d || !puedeEditar) return;
  modal('<h3>Editar documento</h3>' +
    '<div class="sub">' + esc(peso(d.tam)) + ' · subido el ' + fecha(d.creado) + ' por ' + esc(d.porMail || '') + '</div>' +
    '<label>Nombre</label><input type="text" id="eNom" value="' + esc(d.nombre) + '">' +
    '<label>Carpeta</label><select id="eCarp">' + opcionesCarpetas(d.carpeta || '') + '</select>' +
    '<label>Etiqueta</label><input type="text" id="eEti" list="etiLista" value="' + esc(d.etiqueta || '') + '" placeholder="Escritura, Posesión, Fondos…">' +
    '<datalist id="etiLista">' + ETIQUETAS.map(function(e){ return '<option value="' + esc(e) + '">'; }).join('') + '</datalist>' +
    '<label>Nota</label><textarea id="eNota" placeholder="Opcional: de qué se trata, a qué unidad corresponde, qué falta…">' + esc(d.nota || '') + '</textarea>' +
    '<div class="err" id="eErr"></div>' +
    '<div class="pie"><button class="btn" id="eCancel">Cancelar</button>' +
    '<button class="btn pri" id="eGuardar">Guardar</button></div>');
  document.getElementById('eCancel').onclick = cerrarModal;
  document.getElementById('eGuardar').onclick = function(){
    var nom = document.getElementById('eNom').value.trim();
    if (!nom) { document.getElementById('eErr').textContent = 'El nombre no puede quedar vacío.'; return; }
    // Se escriben SÓLO los campos editables, por ruta puntual: así dos personas
    // tocando documentos distintos (o campos distintos) no se pisan.
    db.ref(basePath() + '/docs/' + id).update({
      nombre: nom,
      carpeta: document.getElementById('eCarp').value || '',
      etiqueta: document.getElementById('eEti').value.trim(),
      nota: document.getElementById('eNota').value.trim(),
      ext: extDe(nom) || d.ext || '',
      mod: Date.now(), modPor: mail
    }).then(function(){ cerrarModal(); aviso('Guardado.'); })
      .catch(function(){ document.getElementById('eErr').textContent = 'No se pudo guardar.'; });
  };
}
function borrarDoc(id){
  var d = docs[id]; if (!d || !puedeEditar) return;
  if (!confirm('¿Borrar "' + (d.nombre || '') + '"?\n\n' +
               peso(d.tam) + ' · subido el ' + fecha(d.creado) + ' por ' + (d.porMail || '') + '\n\n' +
               'Se borra también el archivo. Esta acción no se puede deshacer.')) return;
  // El índice primero: si lo segundo fallara, queda un archivo huérfano
  // ocupando lugar, que es mucho menos grave que un documento listado cuyo
  // contenido ya no existe.
  db.ref(basePath() + '/docs/' + id).remove().then(function(){
    return db.ref('documentacion/archivos/' + id).remove();
  }).then(function(){ aviso('Documento borrado.'); })
    .catch(function(){ aviso('No se pudo borrar del todo.'); });
}

/* ── Modal ─────────────────────────────────────────────────────────── */
function modal(html, ancho){
  cerrarModal();
  var velo = document.createElement('div'); velo.id = 'velo';
  velo.innerHTML = '<div id="modal"' + (ancho ? ' class="ancho"' : '') + '>' + html + '</div>';
  velo.onclick = function(e){ if (e.target === velo) cerrarModal(); };
  document.body.appendChild(velo);
}
function cerrarModal(){
  var v = document.getElementById('velo');
  if (v) v.remove();
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') cerrarModal(); });

/* ── Service worker ────────────────────────────────────────────────── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
