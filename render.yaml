# Despliegue del backend en Render (plan gratuito).
#
# Cómo se usa: en Render → New → Blueprint → elegir este repositorio. Render lee
# este archivo, crea el servicio y PIDE los valores de las variables marcadas con
# `sync: false` (no viajan en el repo: se cargan a mano en el panel de Render).
#
# Por qué runtime `node` y no el Dockerfile de functions/: esa imagen trae
# Chromium para el "robot propio" de ARCA y pesa ~2 GB, demasiado para el plan
# gratuito. Con el runtime de Node arranca todo el backend menos ese robot
# (que igual es experimental). Si algún día hace falta, se pasa a Docker.
#
# ⚠️ Límite del plan gratuito: el servicio se duerme a los 15 minutos sin uso y
# el primer pedido después tarda ~50 s. Lo que se llama a demanda (Gemini, el
# asistente, ARCA, Belvo) funciona igual, con esa demora la primera vez. Lo que
# necesita estar despierto —el aviso diario de vencimientos y el bot de mail que
# revisa cada 2 minutos— NO corre mientras el servicio duerme. Ver
# DESPLIEGUE-RENDER.md.

services:
  - type: web
    name: mess-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: functions
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

      # ── ARCA / AFIP ──────────────────────────────────────────
      - key: AFIP_CUIT
        sync: false
      - key: AFIP_CERT          # certificado en base64
        sync: false
      - key: AFIP_KEY           # clave privada en base64
        sync: false
      - key: AFIP_ENV           # production | testing
        sync: false
      - key: AFIP_ACCESS_TOKEN
        sync: false

      # ── Gemini (asistente, lectura de facturas, WhatsApp) ────
      - key: GEMINI_API_KEY
        sync: false

      # ── Firebase Admin (verifica sesiones y /usuarios/*) ─────
      - key: FIREBASE_SERVICE_ACCOUNT   # el JSON completo, crudo o en base64
        sync: false

      # ── Seguridad del backend ────────────────────────────────
      - key: APP_API_TOKEN      # mismo valor que se carga en Config → Token del backend
        sync: false
      - key: ALLOWED_ORIGINS    # ej. https://speranzaemiliano-rk.github.io
        sync: false

      # ── Mail bot y avisos de vencimientos ────────────────────
      - key: MAIL_BOT_USER
        sync: false
      - key: MAIL_BOT_APP_PASSWORD
        sync: false
      - key: MAIL_BOT_ALLOWED
        sync: false
      - key: ALERTAS_EMAIL_DEFAULT
        sync: false

      # ── Open banking (opcionales) ────────────────────────────
      - key: BELVO_SECRET_ID
        sync: false
      - key: BELVO_SECRET_PASSWORD
        sync: false
      - key: BELVO_ENV
        sync: false
      - key: PROMETEO_API_KEY
        sync: false
      - key: PROMETEO_ENV
        sync: false

      # ── WhatsApp (opcionales) ────────────────────────────────
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
