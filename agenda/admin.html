<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agenda de posesiones · Administración</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3f1;--card:#fff;--ink:#141414;--mut:#6b6b6b;--line:#e2e0dc;--acc:#141414;--accink:#fff;--ok:#1d7a46;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbeae9;--warn:#8a5a00;--warnbg:#fdf3dc}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--ink:#f1f0ee;--mut:#9a9893;--line:#303030;--acc:#f1f0ee;--accink:#141414;--ok:#5fcf8f;--okbg:#17291f;--bad:#ff8a80;--badbg:#2e1a19;--warn:#f1c45c;--warnbg:#2d2512}.logo-rk{filter:invert(1)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.top img{height:40px}.top .gr{flex:1}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=text],textarea{width:100%}
label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin:0 0 3px}
.f{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.mut{background:var(--line);color:var(--mut)}
.hours{display:flex;flex-wrap:wrap;gap:8px}
.hr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:150px;background:var(--card);font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.hr b{display:block}.hr small{color:var(--mut)}
.hr.libre{border-color:var(--ok);background:var(--okbg)}.hr.res{border-color:var(--warn);background:var(--warnbg)}
.days label{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--ink);font-weight:500;margin-right:10px}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}
.mut{color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0}dt{color:var(--mut)}dd{margin:0;font-weight:500;word-break:break-word}
.hide{display:none!important}
#login{max-width:380px;margin:60px auto}
#login input{width:100%;margin-bottom:10px}
@media print{.top .gr,.tabs,.noprint,#tabHor,#tabLinks,#tabAjustes{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0}.logo-rk{filter:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card hide">
    <img src="logo-rk.svg" alt="RK Arquitectura" class="logo-rk" style="height:44px;margin-bottom:14px">
    <h1>Agenda de posesiones</h1>
    <p class="mut">Acceso para administradores.</p>
    <input type="text" id="lMail" placeholder="Mail" autocomplete="username">
    <input type="password" id="lPass" placeholder="Contraseña" autocomplete="current-password">
    <div id="lErr"></div>
    <button class="btn" id="lEntrar" style="width:100%">Entrar</button>
    <button class="btn sec" id="lGoogle" style="width:100%;margin-top:8px">Entrar con Google</button>
  </div>

  <div id="panel" class="hide">
    <div class="top">
      <img src="logo-rk.svg" class="logo-rk" alt="RK">
      <h1>Agenda de posesiones</h1>
      <span class="gr"></span>
      <div><label for="selEd">Edificio</label><select id="selEd"></select></div>
      <div class="mut" id="quien"></div>
      <button class="btn sec sm" id="btnSalir">Salir</button>
    </div>
    <div id="aviso"></div>
    <div class="tabs">
      <button class="tab on" data-t="Reservas">📋 Reservas</button>
      <button class="tab" data-t="Hor">🗓️ Horarios</button>
      <button class="tab" data-t="Links">🔗 Links por unidad</button>
      <button class="tab" data-t="Ajustes">⚙️ Ajustes</button>
    </div>

    <div id="tabReservas"></div>
    <div id="tabHor" class="hide"></div>
    <div id="tabLinks" class="hide"></div>
    <div id="tabAjustes" class="hide"></div>
  </div>
</div>

<dialog id="dlg"></dialog>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
var CFG = window.AGENDA_CONFIG;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function jsq(s){ return esc(String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")); }

firebase.initializeApp(CFG.firebase);
var auth = firebase.auth(), db = firebase.database();

var rol = '', puedeEscribir = false, ED = '';
var cfgEd = {}, disp = {}, ocup = {}, tokens = {}, reservas = {}, unidades = [];
var oyentes = [];
var diaSel = '', filtro = '';

// ── Login ───────────────────────────────────────────────────────────────
function lerr(t){ $('lErr').innerHTML = t ? '<div class="msg bad">' + esc(t) + '</div>' : ''; }
$('lEntrar').onclick = function(){
  lerr('');
  auth.signInWithEmailAndPassword($('lMail').value.trim(), $('lPass').value).catch(function(e){ lerr('No se pudo ingresar: ' + (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found' ? 'mail o contraseña incorrectos.' : e.message)); });
};
$('lPass').onkeydown = function(e){ if (e.key === 'Enter') $('lEntrar').click(); };
$('lGoogle').onclick = function(){ lerr(''); auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){ lerr(e.message); }); };
$('btnSalir').onclick = function(){ auth.signOut(); };

auth.onAuthStateChanged(function(u){
  desengancharTodo();
  if (!u) { $('panel').classList.add('hide'); $('login').classList.remove('hide'); return; }
  db.ref('roles/' + u.uid).once('value').then(function(s){
    rol = s.val() || '';
    var ok = ['superadmin', 'admin', 'editor', 'lector'].indexOf(rol) >= 0;
    if (!ok) {
      $('panel').classList.add('hide'); $('login').classList.remove('hide');
      lerr(rol === '' ? 'Tu cuenta todavía no tiene un rol asignado. Pedile al administrador que te habilite.' : 'Tu cuenta no tiene acceso a la agenda.');
      auth.signOut(); return;
    }
    puedeEscribir = rol !== 'lector';
    $('login').classList.add('hide'); $('panel').classList.remove('hide');
    $('quien').textContent = (u.email || '') + ' · ' + rol;
    cargarEdificios(u);
  }).catch(function(e){ lerr('No se pudo leer tu rol: ' + e.message); });
});

// ── Edificios ───────────────────────────────────────────────────────────
function cargarEdificios(u){
  u.getIdToken().then(function(tok){
    return fetch(CFG.firebase.databaseURL + '/global/edificios.json?shallow=true&auth=' + encodeURIComponent(tok)).then(function(r){ return r.json(); });
  }).then(function(ids){
    ids = ids && !ids.error ? Object.keys(ids) : [];
    return Promise.all(ids.map(function(id){ return db.ref('global/edificios/' + id + '/nombre').once('value').then(function(s){ return { id: id, nombre: s.val() || id }; }); }));
  }).catch(function(){ return []; }).then(function(lista){
    var guardado = ''; try { guardado = localStorage.getItem('agenda_ed') || ''; } catch (e) {}
    $('selEd').innerHTML = lista.map(function(e){ return '<option value="' + esc(e.id) + '">' + esc(e.nombre) + '</option>'; }).join('') || '<option value="">(sin edificios)</option>';
    if (guardado && lista.some(function(e){ return e.id === guardado; })) $('selEd').value = guardado;
    $('selEd').onchange = function(){ try { localStorage.setItem('agenda_ed', this.value); } catch (e) {} elegirEdificio(this.value); };
    elegirEdificio($('selEd').value);
  });
}

function desengancharTodo(){ oyentes.forEach(function(o){ o.ref.off('value', o.fn); }); oyentes = []; }
function escuchar(ruta, fn){
  var ref = db.ref(ruta);
  var f = function(s){ fn(s.val()); };
  ref.on('value', f, function(e){ avisar('No se pudo leer ' + ruta + ': ' + e.message); });
  oyentes.push({ ref: ref, fn: f });
}
function avisar(t, tipo){ $('aviso').innerHTML = t ? '<div class="msg ' + (tipo || 'bad') + '">' + esc(t) + '</div>' : ''; if (t && tipo === 'ok') setTimeout(function(){ $('aviso').innerHTML = ''; }, 3500); }

function elegirEdificio(id){
  desengancharTodo(); ED = id || '';
  cfgEd = {}; disp = {}; ocup = {}; tokens = {}; reservas = {}; unidades = [];
  if (!ED) { renderTodo(); return; }
  var b = 'agendaPosesiones/' + ED;
  escuchar(b + '/config', function(v){ cfgEd = v || {}; renderTodo(); });
  escuchar(b + '/disponibilidad', function(v){ disp = v || {}; renderTodo(); });
  escuchar(b + '/ocupados', function(v){ ocup = v || {}; renderTodo(); });
  escuchar(b + '/tokens', function(v){ tokens = v || {}; renderTodo(); });
  escuchar(b + '/reservas', function(v){ reservas = v || {}; renderTodo(); });
  db.ref('global/edificios/' + ED + '/unidades').once('value').then(function(s){
    var v = s.val() || {};
    unidades = Object.keys(v).map(function(k){ return { n: v[k].n || k, o: v[k].o == null ? 9999 : v[k].o }; }).sort(function(a, b){ return a.o - b.o; });
    renderTodo();
  }).catch(function(){ renderTodo(); });
}

// ── Pestañas ────────────────────────────────────────────────────────────
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
  b.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){ x.classList.toggle('on', x === b); });
    ['Reservas', 'Hor', 'Links', 'Ajustes'].forEach(function(t){ $('tab' + t).classList.toggle('hide', t !== b.getAttribute('data-t')); });
  };
});
function renderTodo(){
  var ro = !puedeEscribir ? '<div class="msg warn">Tu cuenta es de solo lectura: podés ver las reservas pero no cambiar nada.</div>' : '';
  if (!ED) { $('tabReservas').innerHTML = '<div class="card">No hay edificios cargados todavía. Cargalos desde el módulo Unidades.</div>'; return; }
  renderReservas(ro); renderHorarios(); renderLinks(); renderAjustes();
}

// ── Utilidades ──────────────────────────────────────────────────────────
function hoyISO(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function fecha(f){ return new Date(f + 'T12:00:00').toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
function rango(h){ var n = parseInt(h, 10); return ('0' + n).slice(-2) + ':00 a ' + ('0' + (n + 1)).slice(-2) + ':00'; }
function pad(n){ return ('0' + n).slice(-2); }
function base(){ return 'agendaPosesiones/' + ED; }
function linkDe(t){ return new URL('index.html', location.href).href.split('?')[0] + '?e=' + encodeURIComponent(ED) + '&t=' + encodeURIComponent(t); }
function nuevoToken(){ var a = new Uint8Array(12); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(x){ return 'abcdefghjkmnpqrstuvwxyz23456789'[x % 31]; }).join(''); }
function lista(o){ return !o ? [] : Array.isArray(o) ? o.filter(Boolean) : Object.keys(o).map(function(k){ return o[k]; }); }
function guardar(up, ok){
  if (!puedeEscribir) { avisar('Tu cuenta es de solo lectura.'); return Promise.resolve(); }
  return db.ref(base()).update(up).then(function(){ if (ok) avisar(ok, 'ok'); }).catch(function(e){ avisar('No se pudo guardar: ' + (e.code === 'PERMISSION_DENIED' ? 'sin permiso. Si es la primera vez, falta publicar las reglas de Firebase (ver agenda/CLAUDE.md).' : e.message)); });
}
function reservasLista(){
  return Object.keys(reservas).map(function(t){ var r = reservas[t]; r._t = t; return r; })
    .sort(function(a, b){ return (a.fecha + a.hora).localeCompare(b.fecha + b.hora); });
}

// ── Reservas ────────────────────────────────────────────────────────────
function renderReservas(ro){
  var rs = reservasLista(), q = filtro.toLowerCase();
  var vis = rs.filter(function(r){ return !q || [r.unidad, r.nombre, r.dni, r.mail, r.tel].join(' ').toLowerCase().indexOf(q) >= 0; });
  var pend = pendientes();
  var pers = rs.reduce(function(a, r){ return a + (r.personas || 0); }, 0);
  var h = ro +
   '<div class="f noprint"><div style="flex:1;min-width:200px"><label>Buscar</label><input type="text" id="qRes" value="' + esc(filtro) + '" placeholder="Unidad, nombre, DNI, mail…"></div>' +
   '<button class="btn sec" id="btnCsv">⬇ Excel (CSV)</button><button class="btn sec" id="btnPrint">🖨️ Imprimir</button></div>' +
   '<div class="card"><b>' + rs.length + '</b> turnos reservados · <b>' + pers + '</b> personas · <b>' + pend.length + '</b> unidades con link sin reservar' +
   '<div class="scroll" style="margin-top:10px"><table><thead><tr><th>Día</th><th>Hora</th><th>Unidad</th><th>Titular</th><th>DNI</th><th>Teléfono</th><th>Pers.</th><th>Apod.</th><th class="noprint"></th></tr></thead><tbody>' +
   (vis.map(function(r){
     return '<tr><td>' + esc(fecha(r.fecha)) + '</td><td>' + esc(rango(r.hora)) + '</td><td><b>' + esc(r.unidad) + '</b></td><td>' + esc(r.nombre) + '</td><td>' + esc(r.dni) + '</td><td>' + esc(r.tel) + '</td><td>' + esc(r.personas) + '</td><td>' + (r.apoderado ? 'Sí' : '') +
       '</td><td class="noprint"><button class="btn sec sm" onclick="AG.ver(\'' + jsq(r._t) + '\')">Ver</button></td></tr>';
   }).join('') || '<tr><td colspan="9" class="mut">Todavía no hay reservas.</td></tr>') +
   '</tbody></table></div></div>' +
   (pend.length ? '<div class="card"><h2>Sin reservar (' + pend.length + ')</h2>' + pend.map(function(u){ return '<span class="pill mut" style="margin:2px">' + esc(u) + '</span>'; }).join('') + '</div>' : '');
  var cont = $('tabReservas'), foco = document.activeElement && document.activeElement.id === 'qRes';
  cont.innerHTML = h;
  $('qRes').oninput = function(){ filtro = this.value; var p = this.selectionStart; renderReservas(ro); var n = $('qRes'); n.focus(); n.setSelectionRange(p, p); };
  $('btnCsv').onclick = csv; $('btnPrint').onclick = function(){ window.print(); };
}
function pendientes(){
  var conRes = {};
  Object.keys(reservas).forEach(function(t){ conRes[t] = true; });
  return Object.keys(tokens).filter(function(t){ return !conRes[t]; }).map(function(t){ return tokens[t].u; }).sort();
}
function csv(){
  var cab = ['Día', 'Hora', 'Unidad', 'Titular', 'DNI', 'Teléfono', 'Mail', 'Personas', 'Apoderado', 'DNI apoderado', 'Acompañantes', 'Comentarios'];
  var filas = reservasLista().map(function(r){
    return [r.fecha, rango(r.hora), r.unidad, r.nombre, r.dni, r.tel, r.mail, r.personas, r.apoderado ? r.apoNombre : '', r.apoderado ? r.apoDni : '',
      lista(r.acompanantes).map(function(a){ return a.nombre + (a.dni ? ' (' + a.dni + ')' : ''); }).join(' / '), r.notas || ''];
  });
  var txt = [cab].concat(filas).map(function(f){ return f.map(function(c){ c = String(c == null ? '' : c); if (/^[=+\-@]/.test(c)) c = "'" + c; return '"' + c.replace(/"/g, '""') + '"'; }).join(';'); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' })); a.download = 'posesiones-' + ED + '.csv'; a.click();
}
function ver(t){
  var r = reservas[t]; if (!r) return;
  var ac = lista(r.acompanantes);
  $('dlg').innerHTML = '<h2>Unidad ' + esc(r.unidad) + '</h2><p><b>' + esc(fecha(r.fecha)) + ' · ' + esc(rango(r.hora)) + '</b></p><dl>' +
    '<dt>Titular</dt><dd>' + esc(r.nombre) + '</dd><dt>DNI</dt><dd>' + esc(r.dni) + '</dd><dt>Teléfono</dt><dd>' + esc(r.tel) + '</dd><dt>Mail</dt><dd>' + esc(r.mail) + '</dd>' +
    '<dt>Personas</dt><dd>' + esc(r.personas) + '</dd>' +
    (r.apoderado ? '<dt>Apoderado</dt><dd>' + esc(r.apoNombre) + ' · DNI ' + esc(r.apoDni) + '</dd>' : '') +
    (ac.length ? '<dt>Acompañantes</dt><dd>' + ac.map(function(a){ return esc(a.nombre) + (a.dni ? ' · DNI ' + esc(a.dni) : ''); }).join('<br>') + '</dd>' : '') +
    (r.notas ? '<dt>Comentarios</dt><dd>' + esc(r.notas) + '</dd>' : '') +
    '<dt>Cargado</dt><dd>' + esc(new Date(r.creada).toLocaleString('es-AR')) + '</dd></dl>' +
    '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">' +
    (puedeEscribir ? '<button class="btn bad sm" onclick="AG.cancelar(\'' + jsq(t) + '\')">Cancelar turno (libera el horario)</button>' : '') +
    '<button class="btn sec sm" onclick="document.getElementById(\'dlg\').close()">Cerrar</button></div>';
  $('dlg').showModal();
}
function cancelar(t){
  var r = reservas[t]; if (!r) return;
  if (!confirm('¿Cancelar el turno de la unidad ' + r.unidad + ' (' + r.nombre + ')?\nEl horario queda libre y la unidad puede volver a reservar con su mismo link.')) return;
  var up = {}; up['reservas/' + t] = null; up['ocupados/' + r.fecha + '/' + r.hora] = null;
  guardar(up, 'Turno cancelado.').then(function(){ $('dlg').close(); });
}

// ── Horarios ────────────────────────────────────────────────────────────
function renderHorarios(){
  var hoy = hoyISO(); if (!diaSel) diaSel = hoy;
  var opts = ''; for (var h = CFG.horaMin; h <= CFG.horaMax; h++) opts += '<option value="' + h + '">' + pad(h) + ':00</option>';
  var dias = Object.keys(disp).filter(function(f){ return f >= hoy; }).sort();
  var resumen = dias.map(function(f){
    var hs = Object.keys(disp[f] || {}).filter(function(x){ return disp[f][x] === true; });
    var oc = hs.filter(function(x){ return ocup[f] && ocup[f][x]; }).length;
    return '<tr style="cursor:pointer" onclick="AG.irDia(\'' + f + '\')"><td>' + esc(fecha(f)) + '</td><td>' + hs.length + '</td><td>' + oc + '</td><td>' + (hs.length - oc) + '</td></tr>';
  }).join('');
  var ro = puedeEscribir ? '' : ' disabled';
  $('tabHor').innerHTML =
   '<div class="card"><h2>Habilitar o bloquear varios días</h2>' +
   '<div class="f"><div><label>Desde</label><input type="date" id="bDesde" value="' + hoy + '"' + ro + '></div><div><label>Hasta</label><input type="date" id="bHasta" value="' + hoy + '"' + ro + '></div>' +
   '<div><label>Primer turno</label><select id="bH1"' + ro + '>' + opts + '</select></div><div><label>Último turno (empieza)</label><select id="bH2"' + ro + '>' + opts + '</select></div></div>' +
   '<div class="days" id="bDias">' + ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].map(function(n, i){ return '<label><input type="checkbox" value="' + i + '"' + (i >= 1 && i <= 5 ? ' checked' : '') + ro + '> ' + n + '</label>'; }).join('') + '</div>' +
   '<div class="f" style="margin-top:10px"><button class="btn" id="bHab"' + ro + '>✅ Habilitar</button><button class="btn sec" id="bBlo"' + ro + '>⛔ Bloquear</button></div>' +
   '<p class="mut" style="margin:0">Cada turno dura 1 hora. Los turnos ya reservados no se tocan: para liberarlos cancelá la reserva.</p></div>' +
   '<div class="card"><h2>Un día en particular</h2><div class="f"><div><label>Día</label><input type="date" id="dDia" value="' + diaSel + '"></div></div><div class="hours" id="dHoras"></div></div>' +
   '<div class="card"><h2>Próximos días habilitados</h2><div class="scroll"><table><thead><tr><th>Día</th><th>Turnos</th><th>Reservados</th><th>Libres</th></tr></thead><tbody>' + (resumen || '<tr><td colspan="4" class="mut">No hay días habilitados.</td></tr>') + '</tbody></table></div></div>';
  $('bH1').value = 9; $('bH2').value = 17;
  $('dDia').onchange = function(){ diaSel = this.value || hoy; pintarDia(); };
  $('bHab').onclick = function(){ masivo(true); }; $('bBlo').onclick = function(){ masivo(false); };
  pintarDia();
}
function pintarDia(){
  var f = diaSel, hs = '';
  for (var h = CFG.horaMin; h <= CFG.horaMax; h++) {
    var k = pad(h), libre = disp[f] && disp[f][k] === true, o = ocup[f] && ocup[f][k];
    var res = o ? reservasLista().filter(function(r){ return r.fecha === f && r.hora === k; })[0] : null;
    hs += '<button class="hr ' + (o ? 'res' : libre ? 'libre' : '') + '" onclick="AG.toggle(\'' + f + '\',\'' + k + '\')"><b>' + rango(k) + '</b><small>' + (o ? '🔒 ' + (res ? esc(res.unidad + ' · ' + res.nombre) : 'ocupado') : libre ? 'Habilitado' : 'Bloqueado') + '</small></button>';
  }
  $('dHoras').innerHTML = hs;
}
function toggle(f, k){
  if (ocup[f] && ocup[f][k]) { var r = reservasLista().filter(function(x){ return x.fecha === f && x.hora === k; })[0]; if (r) ver(r._t); return; }
  var up = {}; up['disponibilidad/' + f + '/' + k] = (disp[f] && disp[f][k] === true) ? null : true;
  guardar(up);
}
function masivo(habilitar){
  var d1 = $('bDesde').value, d2 = $('bHasta').value, h1 = +$('bH1').value, h2 = +$('bH2').value;
  var dias = Array.prototype.filter.call($('bDias').querySelectorAll('input'), function(i){ return i.checked; }).map(function(i){ return +i.value; });
  if (!d1 || !d2 || d2 < d1) return avisar('Revisá las fechas.');
  if (h2 < h1) return avisar('El último turno no puede ser anterior al primero.');
  if (!dias.length) return avisar('Elegí al menos un día de la semana.');
  var up = {}, n = 0, salteados = 0;
  for (var d = new Date(d1 + 'T12:00:00'), fin = new Date(d2 + 'T12:00:00'); d <= fin; d.setDate(d.getDate() + 1)) {
    if (dias.indexOf(d.getDay()) < 0) continue;
    var f = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    for (var h = h1; h <= h2; h++) {
      var k = pad(h);
      if (!habilitar && ocup[f] && ocup[f][k]) { salteados++; continue; }
      up['disponibilidad/' + f + '/' + k] = habilitar ? true : null; n++;
    }
  }
  if (!n) return avisar('No hay nada para cambiar con esa selección.');
  if (n > 2000) return avisar('Son demasiados turnos de una vez (' + n + '). Probá con un rango más corto.');
  guardar(up, (habilitar ? 'Habilitados ' : 'Bloqueados ') + n + ' turnos.' + (salteados ? ' ' + salteados + ' ya reservados no se tocaron.' : ''));
}

// ── Links ───────────────────────────────────────────────────────────────
function tokenDeUnidad(u){ var r = null; Object.keys(tokens).forEach(function(t){ if (tokens[t].u === u) r = t; }); return r; }
function renderLinks(){
  var nombres = unidades.map(function(u){ return u.n; });
  Object.keys(tokens).forEach(function(t){ if (nombres.indexOf(tokens[t].u) < 0) nombres.push(tokens[t].u); });
  var sinLink = nombres.filter(function(u){ return !tokenDeUnidad(u); }).length;
  var ro = puedeEscribir ? '' : ' disabled';
  var filas = nombres.map(function(u){
    var t = tokenDeUnidad(u), r = t && reservas[t];
    var est = !t ? '<span class="pill mut">Sin link</span>' : r ? '<span class="pill ok">Reservó · ' + esc(fecha(r.fecha)) + ' ' + esc(pad(parseInt(r.hora, 10))) + ':00</span>' : '<span class="pill warn">Pendiente</span>';
    var acc = !t ? '<button class="btn sm"' + ro + ' onclick="AG.crearLink(\'' + jsq(u) + '\')">Crear link</button>' :
      '<button class="btn sec sm" onclick="AG.copiar(\'' + jsq(t) + '\')">📋 Copiar</button> <button class="btn sec sm" onclick="AG.wa(\'' + jsq(t) + '\')">WhatsApp</button> <button class="btn sec sm"' + ro + ' onclick="AG.revocar(\'' + jsq(t) + '\')">Anular</button>';
    return '<tr><td><b>' + esc(u) + '</b></td><td>' + est + '</td><td>' + acc + '</td></tr>';
  }).join('');
  $('tabLinks').innerHTML =
   '<div class="card"><h2>Un link por unidad</h2><p class="mut" style="margin-top:0">Cada link es personal: abre la agenda ya identificada con la unidad y solo muestra horarios libres, nunca datos de otros. Cada unidad reserva un solo turno.</p>' +
   '<div class="f"><button class="btn" id="btnTodos"' + ro + '>Crear los ' + sinLink + ' links que faltan</button>' +
   '<div><label>Agregar unidad a mano</label><input type="text" id="uNueva" placeholder="Ej: 4B" style="width:140px"' + ro + '></div><button class="btn sec" id="btnUNueva"' + ro + '>Agregar</button></div>' +
   '<div class="scroll"><table><thead><tr><th>Unidad</th><th>Estado</th><th>Link</th></tr></thead><tbody>' + (filas || '<tr><td colspan="3" class="mut">No hay unidades cargadas en este edificio. Podés agregarlas a mano.</td></tr>') + '</tbody></table></div></div>';
  $('btnTodos').onclick = function(){
    var up = {}; nombres.forEach(function(u){ if (!tokenDeUnidad(u)) up['tokens/' + nuevoToken()] = { u: u }; });
    if (Object.keys(up).length) guardar(up, 'Links creados.');
  };
  $('btnUNueva').onclick = function(){
    var u = ($('uNueva').value || '').trim(); if (!u) return;
    if (tokenDeUnidad(u)) return avisar('Esa unidad ya tiene link.');
    crearLink(u);
  };
}
function crearLink(u){ var up = {}; up['tokens/' + nuevoToken()] = { u: u }; guardar(up, 'Link creado para ' + u + '.'); }
function copiar(t){
  var l = linkDe(t);
  (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(function(){ avisar('Link copiado.', 'ok'); }).catch(function(){ prompt('Copiá el link:', l); });
}
function wa(t){
  var u = tokens[t].u, txt = 'Hola! Te enviamos el link para elegir día y horario de la entrega de posesión de tu unidad ' + u + (cfgEd.titulo ? ' en ' + cfgEd.titulo : '') + ':\n' + linkDe(t);
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
}
function revocar(t){
  var r = reservas[t];
  if (!confirm('¿Anular el link de la unidad ' + tokens[t].u + '? El link deja de funcionar.' + (r ? '\n\nOJO: ya tiene un turno reservado. El turno NO se cancela (hacelo desde Reservas).' : ''))) return;
  var up = {}; up['tokens/' + t] = null; guardar(up, 'Link anulado.');
}

// ── Ajustes ─────────────────────────────────────────────────────────────
function renderAjustes(){
  var ro = puedeEscribir ? '' : ' disabled';
  $('tabAjustes').innerHTML =
   '<div class="card"><h2>Datos que ven los inversores</h2>' +
   '<div class="f"><div style="flex:1;min-width:220px"><label>Nombre del edificio</label><input type="text" id="aTitulo" value="' + esc(cfgEd.titulo || '') + '" placeholder="Casa 1"' + ro + '></div>' +
   '<div style="flex:1;min-width:220px"><label>Dirección</label><input type="text" id="aDir" value="' + esc(cfgEd.direccion || '') + '"' + ro + '></div></div>' +
   '<label>Contacto para cambios <span class="mut">(se muestra en la confirmación)</span></label><input type="text" id="aCont" value="' + esc(cfgEd.contacto || '') + '" placeholder="info@rkarquitectura.com.ar · +54 11 3855-3955"' + ro + '>' +
   '<label style="margin-top:10px">Mensaje de bienvenida <span class="mut">(opcional)</span></label><textarea id="aMsg" rows="4"' + ro + '>' + esc(cfgEd.mensaje || '') + '</textarea>' +
   '<label style="margin-top:10px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="aAbierta"' + (cfgEd.abierto === false ? '' : ' checked') + ro + '> Agenda abierta (si la destildás, los links muestran “cerrada” y nadie puede reservar desde la pantalla)</label>' +
   '<div class="f" style="margin-top:12px"><button class="btn" id="aGuardar"' + ro + '>Guardar</button></div></div>';
  $('aGuardar').onclick = function(){
    var up = {};
    up['config'] = { titulo: $('aTitulo').value.trim(), direccion: $('aDir').value.trim(), contacto: $('aCont').value.trim(), mensaje: $('aMsg').value.trim(), abierto: $('aAbierta').checked };
    guardar(up, 'Ajustes guardados.');
  };
}

window.AG = { ver: ver, cancelar: cancelar, toggle: toggle, irDia: function(f){ diaSel = f; renderHorarios(); window.scrollTo(0, 0); }, crearLink: crearLink, copiar: copiar, wa: wa, revocar: revocar };
})();
</script>
</body>
</html>
