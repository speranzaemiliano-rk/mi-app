<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agenda de posesiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3f1;--card:#fff;--ink:#141414;--mut:#6b6b6b;--line:#e2e0dc;--acc:#141414;--accink:#fff;--ok:#1d7a46;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbeae9;--sel:#141414}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--ink:#f1f0ee;--mut:#9a9893;--line:#303030;--acc:#f1f0ee;--accink:#141414;--ok:#5fcf8f;--okbg:#17291f;--bad:#ff8a80;--badbg:#2e1a19;--sel:#f1f0ee}.logo-rk{filter:invert(1)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:16px;padding:8px 0 20px;border-bottom:1px solid var(--line);margin-bottom:22px}
header img{max-height:54px;max-width:46%;object-fit:contain}
header .sep{width:1px;align-self:stretch;background:var(--line)}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
h2{font-size:15px;margin:0 0 12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;text-align:center;min-width:92px}
.chip small{display:block;color:var(--mut);font-size:12px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--sel);color:var(--accink);border-color:var(--sel)}
.chip.on small{color:inherit;opacity:.75}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}
label .opt{font-weight:400;color:var(--mut)}
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:14px;margin-top:16px;cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;flex:none}
.apo,.acomp{border-left:3px solid var(--line);padding-left:12px;margin-top:6px}
.btn{display:inline-block;background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:20px}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;padding:10px 16px;margin:8px 8px 0 0;font-weight:500}
.btn:disabled{opacity:.5;cursor:wait}
.msg{padding:12px 14px;border-radius:10px;margin:12px 0;font-size:14px}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg.ok{background:var(--okbg);color:var(--ok)}
.unit{display:inline-block;background:var(--ink);color:var(--bg);border-radius:8px;padding:3px 10px;font-weight:700;font-size:14px}
dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:8px 12px}
dt{color:var(--mut);font-size:13px}dd{margin:0;font-weight:500;word-break:break-word}
.big{font-size:20px;font-weight:700;margin:2px 0 14px}
.hide{display:none!important}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logoEd" alt="" class="hide">
    <span class="sep hide" id="sepLogo"></span>
    <img id="logoRk" class="logo-rk" alt="RK Arquitectura">
  </header>
  <div id="app"><p class="sub">Cargando…</p></div>
  <footer>RK Arquitectura</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
var CFG = window.AGENDA_CONFIG;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// ── Logos (el del edificio es opcional) ─────────────────────────────────
$('logoRk').src = CFG.logoRK;
var le = $('logoEd');
le.onload = function(){ le.classList.remove('hide'); $('sepLogo').classList.remove('hide'); };
le.src = CFG.logoEdificio;

// ── Parámetros del link ─────────────────────────────────────────────────
var q = new URLSearchParams(location.search);
var ED = q.get('e') || '', TK = q.get('t') || '';
var okId = /^[A-Za-z0-9_-]{1,80}$/;
var app = $('app');
function pantalla(html){ app.innerHTML = html; }
function invalido(txt){ pantalla('<div class="card"><h1>Link no válido</h1><p class="sub">' + esc(txt || 'Este link no es correcto o ya no está vigente. Pedí uno nuevo a quien te lo envió.') + '</p></div>'); }
if (!okId.test(ED) || !okId.test(TK)) { invalido(); return; }

firebase.initializeApp(CFG.firebase);
var db = firebase.database();
var base = 'agendaPosesiones/' + ED;

var cfgEd = {}, unidad = '', disp = {}, ocup = {}, selF = '', selH = '', enviando = false;

// ── Fechas ──────────────────────────────────────────────────────────────
function hoyISO(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function fechaLarga(f){ var d = new Date(f + 'T12:00:00'); return d.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
function diaCorto(f){ var d = new Date(f + 'T12:00:00'); return { dia: d.toLocaleDateString('es-AR', {weekday:'short'}).replace('.', ''), num: d.toLocaleDateString('es-AR', {day:'numeric', month:'short'}).replace('.', '') }; }
function rango(h){ var n = parseInt(h, 10); return ('0' + n).slice(-2) + ':00 a ' + ('0' + (n + 1)).slice(-2) + ':00 hs'; }

function esFuturo(f, h){
  var hoy = hoyISO();
  if (f > hoy) return true;
  if (f < hoy) return false;
  return parseInt(h, 10) > new Date().getHours();
}
function libresPorDia(){
  var out = {};
  Object.keys(disp || {}).sort().forEach(function(f){
    Object.keys(disp[f] || {}).sort().forEach(function(h){
      if (disp[f][h] !== true) return;
      if (ocup[f] && ocup[f][h]) return;
      if (!esFuturo(f, h)) return;
      (out[f] = out[f] || []).push(h);
    });
  });
  return out;
}

// ── Carga inicial ───────────────────────────────────────────────────────
Promise.all([
  db.ref(base + '/config').once('value'),
  db.ref(base + '/tokens/' + TK).once('value')
]).then(function(r){
  cfgEd = r[0].val() || {};
  var tk = r[1].val();
  if (!tk || !tk.u) { invalido(); return; }
  unidad = tk.u;
  document.title = 'Agenda de posesiones' + (cfgEd.titulo ? ' · ' + cfgEd.titulo : '');
  return db.ref(base + '/reservas/' + TK).once('value').then(function(s){
    if (s.exists()) { confirmacion(s.val()); return; }
    if (cfgEd.abierto === false) {
      pantalla(cabecera() + '<div class="card"><p class="msg bad">La agenda está cerrada por el momento. ' + esc(cfgEd.contacto || '') + '</p></div>');
      return;
    }
    iniciarReserva();
  });
}).catch(function(e){
  console.error(e);
  invalido('No pudimos conectarnos. Revisá tu conexión y volvé a abrir el link.');
});

function cabecera(){
  return '<h1>Agenda de posesiones' + (cfgEd.titulo ? ' · ' + esc(cfgEd.titulo) : '') + '</h1>' +
    '<p class="sub">Unidad <span class="unit">' + esc(unidad) + '</span>' + (cfgEd.direccion ? ' &nbsp;·&nbsp; ' + esc(cfgEd.direccion) : '') + '</p>';
}

// ── Reserva ─────────────────────────────────────────────────────────────
function iniciarReserva(){
  pantalla(
    cabecera() +
    (cfgEd.mensaje ? '<div class="card" style="white-space:pre-line">' + esc(cfgEd.mensaje) + '</div>' : '') +
    '<div class="card"><h2>1 · Elegí el día</h2><div class="chips" id="dias"></div><div id="sinTurnos"></div></div>' +
    '<div class="card hide" id="cardHoras"><h2>2 · Elegí el horario</h2><div class="chips" id="horas"></div></div>' +
    '<form class="card hide" id="form" autocomplete="on" novalidate><h2>3 · Tus datos</h2>' +
      '<div id="resumen" class="big"></div>' +
      '<label for="fNombre">Nombre y apellido del titular</label><input type="text" id="fNombre" maxlength="120" autocomplete="name" required>' +
      '<div class="row2"><div><label for="fDni">DNI</label><input type="text" id="fDni" maxlength="30" inputmode="numeric" required></div>' +
      '<div><label for="fTel">Teléfono</label><input type="tel" id="fTel" maxlength="40" autocomplete="tel" required></div></div>' +
      '<label for="fMail">Mail</label><input type="email" id="fMail" maxlength="120" autocomplete="email" required>' +
      '<label class="chk"><input type="checkbox" id="fApo"><span>Voy a asistir con apoderado (o el apoderado asiste en mi lugar)</span></label>' +
      '<div class="apo hide" id="apoBox"><p class="sub" style="margin:8px 0 0;font-size:13px">Recordá traer el poder correspondiente.</p>' +
        '<label for="fApoN">Nombre y apellido del apoderado</label><input type="text" id="fApoN" maxlength="120">' +
        '<label for="fApoD">DNI del apoderado</label><input type="text" id="fApoD" maxlength="30" inputmode="numeric"></div>' +
      '<label for="fPers">Cantidad total de personas que asisten <span class="opt">(contándote a vos)</span></label>' +
      '<select id="fPers"></select>' +
      '<div id="acompBox"></div>' +
      '<label for="fNotas">Comentarios <span class="opt">(opcional)</span></label><textarea id="fNotas" rows="2" maxlength="500"></textarea>' +
      '<div id="err"></div>' +
      '<button class="btn" type="submit" id="btnEnviar">Confirmar turno</button>' +
    '</form>'
  );
  var sel = $('fPers'); var o = '';
  for (var i = 1; i <= 8; i++) o += '<option value="' + i + '">' + i + '</option>';
  sel.innerHTML = o;
  sel.onchange = armarAcomp;
  $('fApo').onchange = function(){ $('apoBox').classList.toggle('hide', !this.checked); };
  $('form').onsubmit = enviar;
  db.ref(base + '/disponibilidad').on('value', function(s){ disp = s.val() || {}; pintar(); });
  db.ref(base + '/ocupados').on('value', function(s){ ocup = s.val() || {}; pintar(); });
}

function pintar(){
  if (!$('dias')) return;
  var lib = libresPorDia(), fechas = Object.keys(lib).sort();
  if (selF && (!lib[selF] || (selH && lib[selF].indexOf(selH) < 0))) {
    if (selH && !enviando) aviso('El horario que habías elegido ya no está disponible. Elegí otro.');
    if (!lib[selF]) selF = '';
    selH = '';
  }
  $('dias').innerHTML = fechas.map(function(f){
    var c = diaCorto(f);
    return '<button type="button" class="chip' + (f === selF ? ' on' : '') + '" data-f="' + f + '">' + esc(c.dia) + '<small>' + esc(c.num) + '</small></button>';
  }).join('');
  $('sinTurnos').innerHTML = fechas.length ? '' : '<p class="msg bad">Por ahora no hay horarios disponibles. ' + esc(cfgEd.contacto || 'Volvé a intentar más tarde o comunicate con nosotros.') + '</p>';
  Array.prototype.forEach.call($('dias').children, function(b){ b.onclick = function(){ selF = b.getAttribute('data-f'); selH = ''; pintar(); }; });
  $('cardHoras').classList.toggle('hide', !selF);
  if (selF) {
    $('horas').innerHTML = lib[selF].map(function(h){
      return '<button type="button" class="chip' + (h === selH ? ' on' : '') + '" data-h="' + h + '">' + esc(rango(h)) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('horas').children, function(b){ b.onclick = function(){ selH = b.getAttribute('data-h'); pintar(); var f = $('form'); f.scrollIntoView({behavior:'smooth', block:'start'}); }; });
  }
  $('form').classList.toggle('hide', !(selF && selH));
  if (selF && selH) $('resumen').textContent = fechaLarga(selF) + ' · ' + rango(selH);
}
function aviso(t){ var e = $('err'); if (e) e.innerHTML = '<div class="msg bad">' + esc(t) + '</div>'; }

function armarAcomp(){
  var n = parseInt($('fPers').value, 10) - 1, box = $('acompBox');
  var previos = [];
  Array.prototype.forEach.call(box.querySelectorAll('.acomp'), function(d){ previos.push([d.querySelector('.an').value, d.querySelector('.ad').value]); });
  var h = '';
  for (var i = 0; i < n; i++) {
    h += '<div class="acomp"><label>Acompañante ' + (i + 1) + ' · nombre y apellido</label><input type="text" class="an" maxlength="120" value="' + esc((previos[i] || [])[0] || '') + '">' +
         '<label>DNI <span class="opt">(si corresponde)</span></label><input type="text" class="ad" maxlength="30" inputmode="numeric" value="' + esc((previos[i] || [])[1] || '') + '"></div>';
  }
  box.innerHTML = h;
}

function enviar(ev){
  ev.preventDefault();
  if (enviando) return;
  var v = function(id){ return ($(id).value || '').trim(); };
  var nombre = v('fNombre'), dni = v('fDni'), tel = v('fTel'), mail = v('fMail');
  if (!selF || !selH) return aviso('Elegí el día y el horario.');
  if (!nombre || !dni || !tel) return aviso('Completá nombre, DNI y teléfono.');
  if (!/^\S+@\S+\.\S+$/.test(mail)) return aviso('Revisá el mail: no parece válido.');
  var apo = $('fApo').checked, apoN = v('fApoN'), apoD = v('fApoD');
  if (apo && (!apoN || !apoD)) return aviso('Completá nombre y DNI del apoderado.');
  var acomp = [], falta = false;
  Array.prototype.forEach.call($('acompBox').querySelectorAll('.acomp'), function(d){
    var n = d.querySelector('.an').value.trim(), dd = d.querySelector('.ad').value.trim();
    if (!n) falta = true; else acomp.push({ nombre: n, dni: dd });
  });
  if (falta) return aviso('Completá el nombre de cada acompañante (o bajá la cantidad de personas).');
  var r = { nombre: nombre, dni: dni, tel: tel, mail: mail, personas: parseInt($('fPers').value, 10),
            apoderado: apo, fecha: selF, hora: selH, unidad: unidad, creada: Date.now() };
  if (apo) { r.apoNombre = apoN; r.apoDni = apoD; }
  if (acomp.length) r.acompanantes = acomp;
  var notas = v('fNotas'); if (notas) r.notas = notas;

  enviando = true; $('btnEnviar').disabled = true; $('err').innerHTML = '';
  var up = {}; up['reservas/' + TK] = r; up['ocupados/' + selF + '/' + selH] = true;
  db.ref(base).update(up).then(function(){
    db.ref(base + '/disponibilidad').off(); db.ref(base + '/ocupados').off();
    confirmacion(r, true);
  }).catch(function(e){
    enviando = false; $('btnEnviar').disabled = false;
    console.error(e);
    var perm = e && (e.code === 'PERMISSION_DENIED' || /permission/i.test(e.message || ''));
    aviso(perm ? 'Ese horario se acaba de ocupar o ya tenés un turno reservado. Elegí otro horario o recargá la página.' : 'No se pudo guardar. Revisá tu conexión e intentá de nuevo.');
  });
}

// ── Confirmación ────────────────────────────────────────────────────────
function confirmacion(r, recien){
  var acomp = r.acompanantes ? (Array.isArray(r.acompanantes) ? r.acompanantes : Object.keys(r.acompanantes).map(function(k){ return r.acompanantes[k]; })) : [];
  var h = cabecera() +
    '<div class="card">' + (recien ? '<p class="msg ok">¡Listo! Tu turno quedó confirmado.</p>' : '<p class="msg ok">Ya tenés un turno reservado.</p>') +
    '<div class="big">' + esc(fechaLarga(r.fecha)) + '<br>' + esc(rango(r.hora)) + '</div><dl>' +
    '<dt>Titular</dt><dd>' + esc(r.nombre) + '</dd><dt>DNI</dt><dd>' + esc(r.dni) + '</dd>' +
    '<dt>Teléfono</dt><dd>' + esc(r.tel) + '</dd><dt>Mail</dt><dd>' + esc(r.mail) + '</dd>' +
    '<dt>Personas</dt><dd>' + esc(r.personas) + '</dd>' +
    (r.apoderado ? '<dt>Apoderado</dt><dd>' + esc(r.apoNombre) + ' · DNI ' + esc(r.apoDni) + '<br><small>Recordá traer el poder.</small></dd>' : '') +
    (acomp.length ? '<dt>Acompañantes</dt><dd>' + acomp.map(function(a){ return esc(a.nombre) + (a.dni ? ' · DNI ' + esc(a.dni) : ''); }).join('<br>') + '</dd>' : '') +
    (r.notas ? '<dt>Comentarios</dt><dd>' + esc(r.notas) + '</dd>' : '') +
    '</dl><button class="btn sec" id="btnIcs" type="button">📅 Agregar al calendario</button></div>' +
    '<p class="sub">Si necesitás cambiar el día o el horario, comunicate con nosotros' + (cfgEd.contacto ? ': ' + esc(cfgEd.contacto) : '') + '. Guardá este link: desde acá podés volver a ver tu turno.</p>';
  pantalla(h);
  $('btnIcs').onclick = function(){ bajarIcs(r); };
}
function bajarIcs(r){
  var p = function(s){ return s.replace(/-/g, ''); };
  var ini = p(r.fecha) + 'T' + r.hora + '0000', fin = p(r.fecha) + 'T' + ('0' + (parseInt(r.hora, 10) + 1)).slice(-2) + '0000';
  var t = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RK Arquitectura//Agenda//ES','BEGIN:VEVENT','UID:' + TK + '@agenda-posesiones',
    'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART;TZID=America/Argentina/Buenos_Aires:' + ini, 'DTEND;TZID=America/Argentina/Buenos_Aires:' + fin,
    'SUMMARY:Posesión ' + (cfgEd.titulo || '') + ' · unidad ' + r.unidad, (cfgEd.direccion ? 'LOCATION:' + cfgEd.direccion.replace(/[,;]/g, ' ') : 'X-NOTE:'), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], {type:'text/calendar'})); a.download = 'posesion.ics'; a.click();
}
})();
</script>
</body>
</html>
