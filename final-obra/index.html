              'acceso a la consola de Firebase:</div>' +
            '<ol class="pasos">' +
              '<li>Firebase Console → proyecto <b>' + esc(FB.projectId || "de la obra") + '</b>.</li>' +
              '<li>Realtime Database → pestaña <b>Reglas</b>.</li>' +
              (CFG.proyectoPropio
                ? '<li>Pegar esto en <b>Reglas</b>, <b>reemplazando todo</b> lo que haya, y publicar. ' +
                    'Esta base es sólo del tablero, así que no hay nada más que conservar:</li>'
                : '<li>Pegar esto <b>justo después</b> de la línea <code>"rules": {</code>, sin borrar ' +
                    'nada de lo que ya está:</li>') +
            '</ol>' +
            '<div class="codigo" id="nReglas">' + esc(bloqueReglas()) + '</div>' +
            '<button class="bfull sec" id="nCopiar">Copiar el texto</button>' +
            '<div class="ayuda" style="margin-top:11px">Para sumar a otra persona después, se encadena ' +
              'con <code>||</code>: <code>auth.token.email === \'uno@x.com\' || auth.token.email === \'otro@x.com\'</code>.</div>'
          : '<div class="ayuda">Mientras tanto el tablero anda igual: todo lo que cargues queda guardado ' +
              'en este equipo.</div>') +
        '<button class="bfull" id="nReintentar" style="margin-top:6px">Ya está publicado — reintentar</button>' +
        '<button class="bfull sec" id="nSalir2" style="margin-top:8px">Entrar con otra cuenta</button>');
      if ($("nCopiar")) $("nCopiar").addEventListener("click", function(){ copiarTexto(bloqueReglas()); });
      $("nReintentar").addEventListener("click", function(){
        cerrarModal(); toast("Probando de nuevo…");
        soltarDatos(); nube.estado = "yendo"; nube.error = ""; pintarNube();
        conectarDatos();
      });
      $("nSalir2").addEventListener("click", function(){ salir(); cerrarModal(); });
      return;
    }

    abrirModal('<h2>Entrar</h2>' +
      '<div class="ayuda">Con tu cuenta de la obra. Es la misma que usás en el parte de personal.</div>' +
      (nube.estado === "mal" && nube.error ? '<div class="aviso mal">' + esc(nube.error) + '</div>' : "") +
      '<input class="campo" id="nMail" type="email" inputmode="email" autocomplete="username" placeholder="Mail">' +
      '<input class="campo" id="nClave" type="password" autocomplete="current-password" placeholder="Contraseña">' +
      '<div class="aviso mal" id="nError" style="display:none"></div>' +
      '<button class="bfull" id="nEntrar">Entrar</button>');
    var mail = $("nMail"), clave = $("nClave");
    function probar(){
      var er = $("nError");
      er.style.display = "none";
      if (!mail.value.trim() || !clave.value) { er.textContent = "Faltan el mail y la contraseña."; er.style.display = ""; return; }
      $("nEntrar").disabled = true; $("nEntrar").textContent = "Entrando…";
      entrar(mail.value.trim(), clave.value, function(err){
        $("nEntrar").disabled = false; $("nEntrar").textContent = "Entrar";
        if (err) { er.textContent = err; er.style.display = ""; return; }
        cerrarModal(); toast("Listo, ya sincroniza");
      });
    }
    $("nEntrar").addEventListener("click", probar);
    clave.addEventListener("keydown", function(e){ if (e.key === "Enter") probar(); });
    mail.focus();
  });

  /* ---- Sin señal: el sistema y la caja no abren, el tablero sí ---- */
  function pintarModulos(){
    var hayRed = navigator.onLine !== false;
    var links = document.querySelectorAll("#modulos .mod[data-necesita-red]");
    for (var i = 0; i < links.length; i++) {
      links[i].classList.toggle("sinred", !hayRed);
      if (hayRed) links[i].removeAttribute("title");
      else links[i].setAttribute("title", "Necesita señal. El tablero sí funciona sin datos.");
    }
    var av = $("modAviso");
    if (av) av.style.display = hayRed ? "none" : "";
  }
  window.addEventListener("online", function(){
    pintarModulos();
    if (nube.estado === "sinred") iniciarNube();
  });
  window.addEventListener("offline", pintarModulos);

  /* =========================================================
     12) ARRANQUE
  ========================================================= */
  function arrancar(){
    leer(CLAVE).then(function(txt){
      var hay = false;
      if (txt) {
        try {
          datos = normalizar(JSON.parse(txt));
          hay = Object.keys(datos.entidades).length > 0;
        } catch(e){ hay = false; }
      }
      // Primera vez en este equipo: se parte de la carga inicial. Si además
      // hay nube, `fusionar()` va a resolver qué manda.
      if (!hay) { sembrar(); guardarLocal(); }
      render();
      document.title = nombreObra() + " — Final de obra";
      pintarAcciones();
      pintarModulos();
      iniciarNube();
      setTimeout(function(){ $("splash").classList.add("fuera"); }, 380);
    });
  }

  /* ---- Instalar en el celular ---- */
  var pedidoInstalar = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    pedidoInstalar = e;
    $("btnInstalar").hidden = false;
  });
  $("btnInstalar").addEventListener("click", function(){
    if (!pedidoInstalar) return;
    pedidoInstalar.prompt();
    pedidoInstalar.userChoice.then(function(){ pedidoInstalar = null; $("btnInstalar").hidden = true; });
  });

  /* ---- Sin señal en la obra: el service worker guarda la página ---- */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  /* ---- Que un error no deje la pantalla en blanco ---- */
  function mostrarError(e){
    var d = document.getElementById("splash");
    if (d) d.classList.add("fuera");
    var caja = document.createElement("div");
    caja.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:300;background:#D70015;" +
      "color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.4";
    caja.textContent = "Se rompió algo: " + (e && e.message ? e.message : String(e));
    document.body.appendChild(caja);
  }
  window.addEventListener("error", function(ev){ mostrarError(ev.error || ev.message); });

  arrancar();
})();
</script>
</body>
</html>
