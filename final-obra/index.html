<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final de obra — Control de unidades</title>
<meta name="description" content="Control de pendientes de final de obra por unidad, espacio común y rubro.">
<meta name="theme-color" content="#F0F0F3">
<!-- Se puede instalar en el celular (Agregar a pantalla de inicio) y funciona sin señal. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Final de obra">
<style>
  :root{
    /* Misma paleta que el sistema y la planilla de obra (ver :root de
       ../index.html y ../obra/index.html): superficie casi blanca,
       bordes finos, acento azul y la marca en violeta. */
    --surface:      #FAFAFC;
    --surface-2:    #E8E8EE;
    --card:         #FFFFFF;
    --ink:          #1D1D1F;
    --text-2:       #4A4A52;
    --text-3:       #9A9AA2;
    --border:       #E3E3EA;
    --border-soft:  #ECECF0;
    --sidebar-bg:   #F0F0F3;
    --acento:       #0071E3;
    --acento-osc:   #0062C4;
    --acento-pale:  #EEF5FE;
    --danger:       #D70015;
    --danger-bg:    #FDEEF0;
    --brand-mark:   #6D4BE0;
    --radius:       14px;
    --radius-sm:    10px;
    --radius-pill:  980px;
    --shadow:       0 1px 2px rgba(20,20,40,.04);

    /* Semáforo del avance. El corte es por cantidad de pendientes:
       0 = terminada, 1-4 menores, 5-10 medios, 11+ críticos. */
    --crit:      #D70015;  --crit-bg:  #FDEEF0;
    --medio:     #C2410C;  --medio-bg: #FFF1E8;
    --menor:     #946200;  --menor-bg: #FDF6E3;
    --listo:     #1A7F37;  --listo-bg: #E9F6EC;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--surface);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.35;
    padding:0 0 90px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 14px}

  /* ── Encabezado ─────────────────────────────────────────────── */
  header{
    background:var(--sidebar-bg);color:var(--ink);
    padding:16px 0 14px;margin-bottom:0;
    border-bottom:1px solid var(--border);
  }
  /* Cambiador de módulo. El de acá es el activo y no se puede tocar. */
  .modulos{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
  .mod{
    display:inline-block;text-decoration:none;font-family:inherit;
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:5px 12px;border-radius:var(--radius-pill);
    border:1px solid rgba(109,75,224,.28);background:var(--card);
    color:var(--brand-mark);cursor:pointer;
  }
  .mod:active{background:rgba(109,75,224,.10)}
  .mod.act{background:var(--brand-mark);border-color:var(--brand-mark);color:#fff;cursor:default}
  /* Sin señal el sistema y la caja no abren: se avisa en vez de dejar
     que el capataz salga del tablero a una pantalla de error. */
  .mod.sinred{opacity:.4;pointer-events:none}
  .mod-aviso{align-self:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}

  .titulo{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-mark)}
  .cab-row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:6px}
  .cab-nombre{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:150px}
  .tablero{text-align:right;line-height:1}
  .tablero .n{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tablero .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2);margin-top:4px}

  .chapas{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chapa{
    background:var(--card);border:1px solid var(--border);color:var(--text-2);
    border-radius:var(--radius-sm);padding:4px 9px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
    display:flex;gap:6px;align-items:center;
  }
  .chapa b{font-size:13px;color:var(--acento);font-variant-numeric:tabular-nums}
  .chapa.ok b{color:var(--listo)}
  .chapa.alerta{background:var(--danger-bg);border-color:var(--danger);color:#7A0710}
  .chapa.alerta b{color:var(--danger)}

  /* Barra de avance general */
  .avance{margin-top:12px}
  .avance .pista{height:8px;border-radius:var(--radius-pill);background:var(--surface-2);overflow:hidden}
  .avance .pista i{display:block;height:100%;background:linear-gradient(90deg,#22D3EE,#7C5CFF 60%,#C084FC);border-radius:var(--radius-pill);transition:width .3s}
  .avance .pie{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:5px;letter-spacing:.04em;text-transform:uppercase}

  .nube{
    display:flex;align-items:center;gap:9px;margin-top:12px;width:100%;
    background:var(--acento);border:0;color:#fff;
    border-radius:var(--radius-pill);padding:11px 16px;font-family:inherit;
    font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    cursor:pointer;text-align:left;
  }
  .nube:active{background:var(--acento-osc)}
  .nube.on{background:var(--acento-pale);border:1px solid var(--acento);color:var(--acento-osc)}
  .nube.on:active{background:#DDEBFB}
  .nube.on .nube-mas{display:none}
  .nube.gris{background:var(--card);border:1px solid var(--border);color:var(--text-2)}
  .nube.gris:active{background:var(--surface-2)}
  .nube.gris .nube-mas{display:none}
  .nube.mal{background:var(--danger);color:#fff}
  .nube.mal:active{background:#A80010}
  .nube-ico{font-size:16px;line-height:1;flex:0 0 auto}
  .nube-txt{flex:1;min-width:0}
  .nube-mas{flex:0 0 auto;font-size:15px;font-weight:700;line-height:1;background:rgba(255,255,255,.22);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
  .instalar{
    display:flex;align-items:center;gap:8px;margin-top:11px;width:100%;
    background:transparent;border:1px dashed var(--border);color:var(--text-2);
    border-radius:var(--radius-pill);padding:9px 15px;font-family:inherit;font-size:11px;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-align:left;
  }
  .instalar:active{background:var(--surface-2)}
  .instalar[hidden]{display:none}

  /* ── Pestañas ───────────────────────────────────────────────── */
  .tabs{display:flex;background:var(--sidebar-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .tabs .in{display:flex;max-width:820px;margin:0 auto;width:100%;padding:0 14px}
  .tab{
    flex:1;padding:11px 4px;background:none;border:0;border-bottom:2px solid transparent;
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--text-2);
    cursor:pointer;white-space:nowrap;
  }
  .tab.act{color:var(--brand-mark);border-bottom-color:var(--brand-mark)}

  /* ── Filtros ────────────────────────────────────────────────── */
  .filtros{background:var(--card);border-bottom:1px solid var(--border);padding:10px 0}
  .frow{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .frow::-webkit-scrollbar{display:none}
  .frow+.frow{margin-top:7px}
  .flbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;flex:0 0 auto}
  .fbtn{
    font-family:inherit;font-size:13px;font-weight:500;padding:4px 12px;
    border:1px solid var(--border);background:transparent;color:var(--text-2);
    border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;flex:0 0 auto;
  }
  .fbtn.act{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rbtn{
    font-family:inherit;font-size:12.5px;font-weight:500;padding:3px 11px;
    border:1px solid var(--rc,#aaa);background:transparent;color:var(--rc,#555);
    border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;flex:0 0 auto;
  }
  .rbtn.act{background:var(--rc);color:#fff}
  .buscar{
    width:100%;font-family:inherit;font-size:15px;padding:8px 14px;margin-top:8px;
    border:1px solid var(--border);border-radius:var(--radius-pill);
    background:var(--surface);color:var(--ink);outline:none;
  }
  .buscar:focus{border-color:var(--acento);background:var(--card)}

  /* ── Lista ──────────────────────────────────────────────────── */
  .lista{padding-top:12px}
  .grupo{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin:14px 2px 7px}
  .grupo:first-child{margin-top:2px}
  .tarjeta{
    background:var(--card);border:1px solid var(--border);border-left:3px solid var(--sv,var(--border));
    border-radius:var(--radius);padding:11px 13px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);
  }
  .tarjeta:active{background:var(--surface-2)}
  .t-cab{display:flex;align-items:center;gap:10px}
  .t-nom{font-size:16px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
  .t-nom .ico{margin-right:5px}
  .t-izq{flex:1;min-width:0}
  .t-sub{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
  .t-piso{font-size:11px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
  .t-num{text-align:right;line-height:1.1;flex:0 0 auto}
  .t-num b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--sv,var(--ink))}
  .t-num span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
  .t-flecha{color:var(--text-3);font-size:20px;flex:0 0 auto}
  .pila{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.06em;
        text-transform:uppercase;padding:2px 8px;border-radius:var(--radius-pill);
        background:var(--sv-bg,var(--surface-2));color:var(--sv,var(--text-2))}
  .t-barra{height:5px;border-radius:var(--radius-pill);background:var(--surface-2);overflow:hidden;margin-top:9px}
  .t-barra i{display:block;height:100%;background:var(--listo);border-radius:var(--radius-pill);transition:width .3s}
  .t-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
  .rtag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--radius-sm);border:1px solid;white-space:nowrap}
  .rtag b{font-weight:800;font-variant-numeric:tabular-nums}
  .vacio{text-align:center;color:var(--text-3);font-size:14px;padding:34px 10px}

  /* ── Detalle (panel que entra desde la derecha) ─────────────── */
  #detalle{
    position:fixed;inset:0;z-index:60;background:var(--surface);
    display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  #detalle.open{transform:translateX(0)}
  .d-top{background:var(--sidebar-bg);border-bottom:1px solid var(--border);padding:11px 0}
  .d-top .in{max-width:820px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:10px}
  .d-volver{background:none;border:0;font-family:inherit;font-size:15px;font-weight:600;color:var(--acento);cursor:pointer;padding:4px 2px;flex:0 0 auto}
  .d-tit{flex:1;min-width:0}
  .d-tit h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .d-tit .sub{font-size:11px;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
  .d-cuerpo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:30px}
  .d-acciones{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
  .bt{
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.03em;
    padding:7px 13px;border-radius:var(--radius-pill);border:1px solid var(--border);
    background:var(--card);color:var(--text-2);cursor:pointer;
  }
  .bt:active{background:var(--surface-2)}
  .bt.pri{background:var(--acento);border-color:var(--acento);color:#fff}
  .bt.pri:active{background:var(--acento-osc)}
  .bt.mal{color:var(--danger);border-color:rgba(215,0,21,.35)}

  .r-bloque{margin-top:14px;border:1px solid var(--border);border-left:3px solid var(--rc,#888);
            border-radius:var(--radius);background:var(--card);overflow:hidden}
  .r-cab{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-2)}
  .r-cab .nom{flex:1;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--rc,#555)}
  .r-cab .cuenta{font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .r-mas{background:var(--card);border:1px solid var(--border);color:var(--rc,#555);
         width:26px;height:26px;border-radius:50%;font-size:16px;font-weight:700;line-height:1;cursor:pointer;flex:0 0 auto}
  .r-mas:active{background:var(--surface-2)}
  .item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--border-soft)}
  .item .tick{
    flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);
    background:var(--card);cursor:pointer;font-size:13px;line-height:19px;text-align:center;color:transparent;padding:0;
  }
  .item.ok .tick{background:var(--listo);border-color:var(--listo);color:#fff}
  .item .txt{flex:1;min-width:0;font-size:15px;line-height:1.32;cursor:text;word-break:break-word}
  .item.ok .txt{text-decoration:line-through;color:var(--text-3)}
  .item .quitar{flex:0 0 auto;background:none;border:0;color:var(--text-3);font-size:17px;cursor:pointer;padding:0 2px;line-height:1}
  .item .quitar:active{color:var(--danger)}
  .item input.edit{
    flex:1;min-width:0;font-family:inherit;font-size:15px;padding:5px 9px;
    border:1px solid var(--acento);border-radius:var(--radius-sm);background:var(--card);color:var(--ink);outline:none;
  }
  .modal-box .item{border-top:1px solid var(--border-soft);padding:9px 0}
  .modal-box .item .txt{font-size:14px}
  .item-cuerpo{flex:1;min-width:0}
  .item-pie{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .chip{
    font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.02em;
    padding:2px 8px;border-radius:var(--radius-pill);border:1px solid var(--border);
    background:var(--card);color:var(--text-2);cursor:pointer;white-space:nowrap;
  }
  .chip:active{background:var(--surface-2)}
  .chip.resp{border-color:rgba(109,75,224,.32);color:var(--brand-mark);background:rgba(109,75,224,.06)}
  .chip.hecho{border-color:rgba(26,127,55,.3);color:var(--listo);background:var(--listo-bg);cursor:default}
  .chip.foto{border-color:rgba(0,113,227,.3);color:var(--acento);background:var(--acento-pale)}
  .chip.vacio{color:var(--text-3);border-style:dashed}
  .miniaturas{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .mini{width:62px;height:62px;border-radius:var(--radius-sm);object-fit:cover;border:1px solid var(--border);
        background:var(--surface-2);cursor:pointer;display:block}
  .foto-grande{width:100%;border-radius:var(--radius-sm);display:block;margin-bottom:10px}
  .item .marca{flex:0 0 auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);align-self:center}

  /* ── Vista por rubro ────────────────────────────────────────── */
  .r-ent{padding:7px 12px 3px;font-size:11px;font-weight:700;letter-spacing:.08em;
         text-transform:uppercase;color:var(--text-3);border-top:1px solid var(--border-soft)}

  /* ── Modal y avisos ─────────────────────────────────────────── */
  .modal{position:fixed;inset:0;background:rgba(20,20,40,.42);z-index:90;display:none;align-items:flex-end;justify-content:center}
  .modal.open{display:flex}
  .modal-box{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:560px;
             max-height:88vh;overflow-y:auto;padding:18px 16px 26px;position:relative}
  @media(min-width:620px){
    .modal{align-items:center}
    .modal-box{border-radius:var(--radius);max-height:84vh}
  }
  .modal-box h2{font-size:17px;font-weight:800;margin-bottom:10px;padding-right:34px}
  .modal-box h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin:16px 0 7px}
  .cerrar{position:absolute;top:12px;right:13px;background:var(--surface-2);border:0;border-radius:50%;
          width:29px;height:29px;font-size:17px;line-height:1;color:var(--text-2);cursor:pointer}
  .campo{width:100%;font-family:inherit;font-size:16px;padding:10px 12px;margin-bottom:9px;
         border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);outline:none}
  .campo:focus{border-color:var(--acento);background:var(--card)}
  select.campo{-webkit-appearance:none;appearance:none;background-image:none}
  .ayuda{font-size:13px;color:var(--text-2);margin-bottom:12px;line-height:1.45}
  .aviso{background:var(--acento-pale);border:1px solid #CFE3FA;border-radius:var(--radius-sm);
         padding:10px 12px;font-size:13px;color:var(--text-2);line-height:1.45;margin-bottom:12px}
  .aviso.mal{background:var(--danger-bg);border-color:#F4C9CE;color:#7A0710}
  .bfull{width:100%;font-family:inherit;font-size:14px;font-weight:600;padding:12px;border:0;
         border-radius:var(--radius-pill);background:var(--acento);color:#fff;cursor:pointer;margin-top:4px}
  .bfull:active{background:var(--acento-osc)}
  .bfull.sec{background:var(--card);border:1px solid var(--border);color:var(--text-2)}
  .bfull.malo{background:var(--danger)}
  .chk{display:flex;align-items:center;gap:9px;padding:7px 2px;font-size:14px;cursor:pointer}
  .chk input{width:19px;height:19px;accent-color:var(--acento);flex:0 0 auto}
  .rejilla{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .rejilla button{font-family:inherit;font-size:12.5px;padding:4px 10px;border-radius:var(--radius-pill);
                  border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer}
  .rejilla button.act{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* Bloque para copiar (las reglas de Firebase). user-select:all para que en
     el celular alcance con tocarlo para seleccionar todo. */
  .codigo{background:var(--ink);color:#EAE4FF;border-radius:var(--radius-sm);padding:11px 12px;
          font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
          line-height:1.5;white-space:pre;overflow-x:auto;margin-bottom:9px;
          -webkit-user-select:all;user-select:all}
  .pasos{font-size:13.5px;color:var(--text-2);line-height:1.5;margin:0 0 11px 17px}
  .pasos li{margin-bottom:5px}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(70px);
         background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--radius-pill);
         font-size:13.5px;z-index:120;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
  #toast button{margin-left:9px;background:none;border:0;color:#7FC4FF;font-family:inherit;
                font-size:13.5px;font-weight:700;cursor:pointer;padding:0}

  /* ── Splash ─────────────────────────────────────────────────── */
  #splash{position:fixed;inset:0;background:#0A0D14;z-index:200;display:flex;align-items:center;
          justify-content:center;transition:opacity .4s}
  #splash.fuera{opacity:0;pointer-events:none}
  .sp{text-align:center}
  .sp img{width:120px;height:120px}
  .sp-nom{color:#EAE4FF;font-size:23px;font-weight:800;letter-spacing:.02em;margin-top:6px}
  .sp-linea{width:52px;height:2px;margin:11px auto;background:linear-gradient(90deg,#22D3EE,#7C5CFF 55%,#C084FC)}
  .sp-sub{color:#9A93B8;font-size:11px;letter-spacing:.18em;text-transform:uppercase}

  /* ── Informe imprimible ─────────────────────────────────────── */
  #reporte{display:none}
  @media print{
    body{background:#fff;padding:0}
    /* Al imprimir queda el informe y nada más. Enumerar qué esconder es
       frágil: cualquier bloque nuevo se colaría en la hoja. */
    body.imprimiendo > *{display:none!important}
    body.imprimiendo > #reporte{display:block!important}
    @page{margin:14mm}
  }
  #reporte{font-size:11px;color:#111}

<script>
(function(){
  "use strict";

  /* =========================================================
     1) PERSISTENCIA
     Prueba window.storage (vista previa de Claude); si no está,
     usa localStorage (archivo local o GitHub Pages).
     El equipo es la fuente local: el tablero abre y se usa sin
     señal. La nube (sección 8) es un espejo.
  ========================================================= */
  var CLAVE = "finalObra_v1";
  var memoria = {};

  function leer(k){
    if (typeof window.storage !== "undefined" && window.storage) {
      return window.storage.get(k).then(function(r){ return r ? r.value : null; })
                                  .catch(function(){ return null; });
    }
    try { return Promise.resolve(localStorage.getItem(k)); }
    catch(e){ return Promise.resolve(memoria[k] || null); }
  }
  function escribir(k, v){
    if (typeof window.storage !== "undefined" && window.storage) {
      return window.storage.set(k, v).catch(function(){ memoria[k] = v; });
    }
    try { localStorage.setItem(k, v); } catch(e){ memoria[k] = v; }
    return Promise.resolve();
  }

  /* =========================================================
     2) ESTADO
     Tres colecciones planas indexadas por id, como el resto del
     sistema. Que sean planas no es un detalle: permite escribir
     en la nube SÓLO el ítem que cambió, así dos personas pueden
     estar tildando cosas distintas a la vez sin pisarse.

       rubros[rid]    = { nombre, color, orden }
       entidades[eid] = { tipo:'unidad'|'comun', nombre, piso, icono, orden, del }
       items[iid]     = { ent, rubro, texto, ok, orden, del }

     `del` es una marca de borrado, no un delete: si borrara de
     verdad, un equipo que estuvo sin señal volvería a subir lo
     que ya se había borrado en otro. Además deja deshacer.
  ========================================================= */
  // fotos  → la ficha de cada foto (liviana, se sincroniza siempre)
  // fotosData → los bytes en base64, APARTE y bajo demanda: si viajaran con el
  //             resto, cada equipo se bajaría todas las fotos de la obra al abrir.
  // personas → directorio de responsables, para elegir en vez de retipear.
  var datos = { obra:"", rubros:{}, entidades:{}, items:{}, personas:{}, fotos:{} };
  var fotosCache = {};   // id → base64 ya traído en esta sesión
  var CFG   = window.FINAL_OBRA_CONFIG || {};

  function uid(){ return Math.random().toString(36).slice(2, 9); }
  function esc(t){ var d = document.createElement("div"); d.textContent = String(t == null ? "" : t); return d.innerHTML; }

  // Sin tildes y en minúscula: buscar "albanileria" tiene que encontrar "Albañilería".
  function plano(t){
    var s = String(t == null ? "" : t).toLowerCase();
    return s.normalize ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "") : s;
  }

  function sembrar(){
    var s = window.FINAL_OBRA_SEED;
    if (!s) return;
    var nombre = datos.obra;              // volver a la carga inicial no borra
    var personas = datos.personas || {};  // el nombre ni el directorio de gente
    datos = { obra: nombre || "",
              rubros: JSON.parse(JSON.stringify(s.rubros)),
              entidades: JSON.parse(JSON.stringify(s.entidades)),
              items: JSON.parse(JSON.stringify(s.items)),
              personas: personas, fotos: {} };
  }

  /* ---- Normalización -------------------------------------------------
     Todo lo que entra (del equipo o de la nube) pasa por acá, así el
     resto del código nunca se encuentra con un campo faltante ni con un
     número donde esperaba texto. Firebase, además, no guarda las claves
     con valor null, así que los booleanos en false vuelven ausentes.  */
  function normRubro(v){
    v = v || {};
    return { nombre: String(v.nombre || "Sin rubro"),
             color:  /^#[0-9a-fA-F]{3,8}$/.test(v.color || "") ? v.color : "#8a847a",
             orden:  Number(v.orden) || 0,
             m:      Number(v.m) || 0 };
  }
  function normEnt(v){
    v = v || {};
    var e = { tipo: v.tipo === "comun" ? "comun" : "unidad",
              nombre: String(v.nombre || "Sin nombre"),
              piso: v.piso == null ? "" : String(v.piso),
              icono: v.icono == null ? "" : String(v.icono),
              orden: Number(v.orden) || 0,
              m: Number(v.m) || 0 };
    if (v.del) e.del = 1;
    return e;
  }
  function normItem(v){
    v = v || {};
    var i = { ent: String(v.ent || ""), rubro: String(v.rubro || ""),
              texto: String(v.texto || ""), ok: !!v.ok, orden: Number(v.orden) || 0,
              m: Number(v.m) || 0 };
    if (v.del) i.del = 1;
    // Quién es el responsable de resolverlo (id de datos.personas).
    if (v.resp) i.resp = String(v.resp);
    // Quién lo dio por hecho y cuándo. Se graba al tildar, no al editar: la
    // pregunta que importa después es "¿quién controló esto?".
    if (v.por) i.por = String(v.por);
    if (v.cuando) i.cuando = Number(v.cuando) || 0;
    return i;
  }
  function normPersona(v){
    v = v || {};
    var p = { nombre: String(v.nombre || ""), email: String(v.email || ""),
              m: Number(v.m) || 0 };
    if (v.del) p.del = 1;
    return p;
  }
  // La foto se parte en dos: la ficha (esto) y los bytes (fotosData/<id>).
  function normFoto(v){
    v = v || {};
    var f = { item: String(v.item || ""), ent: String(v.ent || ""), rubro: String(v.rubro || ""),
              nota: String(v.nota || ""), mime: String(v.mime || "image/jpeg"),
              por: String(v.por || ""), m: Number(v.m) || 0 };
    if (v.del) f.del = 1;
    return f;
  }
  function normalizar(v){
    v = v || {};
    var out = { obra: String(v.obra || ""), rubros:{}, entidades:{}, items:{}, personas:{}, fotos:{} };
    Object.keys(v.rubros    || {}).forEach(function(k){ out.rubros[k]    = normRubro(v.rubros[k]); });
    Object.keys(v.entidades || {}).forEach(function(k){ out.entidades[k] = normEnt(v.entidades[k]); });
    Object.keys(v.items     || {}).forEach(function(k){
      var i = normItem(v.items[k]);
      if (i.ent && i.rubro) out.items[k] = i;     // un ítem huérfano no se muestra en ningún lado
    });
    Object.keys(v.personas  || {}).forEach(function(k){ out.personas[k] = normPersona(v.personas[k]); });
    Object.keys(v.fotos     || {}).forEach(function(k){ out.fotos[k]    = normFoto(v.fotos[k]); });
    return out;
  }

  function guardarLocal(){ escribir(CLAVE, JSON.stringify(datos)); }

  /* =========================================================
     3) CÁLCULOS
     El semáforo es por cantidad de pendientes, con los mismos
     cortes que el tablero original: 0 terminada, 1-4 menores,
     5-10 medios, 11 o más críticos.
  ========================================================= */
  var SEV = {
    crit:  { txt:"Críticos",  color:"var(--crit)",  bg:"var(--crit-bg)"  },
    medio: { txt:"Medios",    color:"var(--medio)", bg:"var(--medio-bg)" },
    menor: { txt:"Menores",   color:"var(--menor)", bg:"var(--menor-bg)" },
    listo: { txt:"Terminada", color:"var(--listo)", bg:"var(--listo-bg)" }
  };
  function sevDe(pend){ return pend === 0 ? "listo" : (pend <= 4 ? "menor" : (pend <= 10 ? "medio" : "crit")); }

  function vivos(col, filtro){
    return Object.keys(col).filter(function(k){ return !col[k].del && (!filtro || filtro(col[k], k)); });
  }
  function porOrden(col){
    return function(a, b){
      var d = (col[a].orden || 0) - (col[b].orden || 0);
      return d !== 0 ? d : String(col[a].nombre || a).localeCompare(String(col[b].nombre || b), "es");
    };
  }
  function rubrosOrdenados(){ return vivos(datos.rubros).sort(porOrden(datos.rubros)); }
  function entidadesDe(tipo){
    return vivos(datos.entidades, function(e){ return e.tipo === tipo; }).sort(porOrden(datos.entidades));
  }
  function rubroNom(rid){ return (datos.rubros[rid] || {}).nombre || rid; }
  function rubroCol(rid){ return (datos.rubros[rid] || {}).color || "#8a847a"; }

  // Índice ítems por entidad y por rubro. Se rearma en cada pintada:
  // con 800 ítems es instantáneo y evita estados a medio actualizar.
  var idx = { porEnt:{}, porRubro:{}, porItem:{} };
  function indexar(){
    idx = { porEnt:{}, porRubro:{}, porItem:{} };
    Object.keys(datos.fotos).forEach(function(fid){
      var f = datos.fotos[fid];
      if (f.del || !f.item) return;
      (idx.porItem[f.item] = idx.porItem[f.item] || []).push(fid);
    });
    Object.keys(datos.items).forEach(function(iid){
      var it = datos.items[iid];
      if (it.del) return;
      if (!datos.entidades[it.ent] || datos.entidades[it.ent].del) return;
      (idx.porEnt[it.ent]   = idx.porEnt[it.ent]   || []).push(iid);
      (idx.porRubro[it.rubro] = idx.porRubro[it.rubro] || []).push(iid);
    });
    var cmp = function(a, b){
      var A = datos.items[a], B = datos.items[b];
      var d = (A.orden || 0) - (B.orden || 0);
      return d !== 0 ? d : a.localeCompare(b);
    };
    Object.keys(idx.porEnt).forEach(function(k){ idx.porEnt[k].sort(cmp); });
    Object.keys(idx.porRubro).forEach(function(k){ idx.porRubro[k].sort(cmp); });
  }

  function itemsDe(eid){ return idx.porEnt[eid] || []; }
  function cuentaDe(ids){
    var n = { total: ids.length, ok: 0 };
    ids.forEach(function(i){ if (datos.items[i].ok) n.ok++; });
    n.pend = n.total - n.ok;
    return n;
  }
  // Pendientes de una entidad agrupados por rubro, respetando el orden del rubro.
  function rubrosDe(eid){
    var mapa = {}, orden = [];
    itemsDe(eid).forEach(function(iid){
      var r = datos.items[iid].rubro;
      if (!mapa[r]) { mapa[r] = []; orden.push(r); }
      mapa[r].push(iid);
    });
    return orden.map(function(r){ return { rubro: r, items: mapa[r] }; });
  }

  /* =========================================================
     4) PINTAR LA PANTALLA
  ========================================================= */
  var filtro = { vista:"unidad", sev:"todas", rubros:[], texto:"" };
  var $ = function(id){ return document.getElementById(id); };

  function nombreObra(){ return datos.obra || CFG.obraNombre || "Final de obra"; }

  function pintarCabecera(){
    $("obraNombre").textContent = nombreObra();
    var todos = vivos(datos.items, function(it){
      return datos.entidades[it.ent] && !datos.entidades[it.ent].del;
    });
    var n = cuentaDe(todos);
    var pct = n.total ? Math.round(n.ok * 100 / n.total) : 0;
    $("kpiPend").textContent = n.pend;
    $("avanceBarra").style.width = pct + "%";
    $("avanceTxt").textContent = n.ok + " de " + n.total + " resueltos";
    $("avancePct").textContent = pct + "%";

    var us = entidadesDe("unidad"), cs = entidadesDe("comun");
    var listas = us.filter(function(e){ return cuentaDe(itemsDe(e)).pend === 0; }).length;
    var criticas = us.filter(function(e){ return sevDe(cuentaDe(itemsDe(e)).pend) === "crit"; }).length;
    var ch = [];
    ch.push('<span class="chapa">Unidades <b>' + us.length + '</b></span>');
    ch.push('<span class="chapa">Comunes <b>' + cs.length + '</b></span>');
    ch.push('<span class="chapa ok">Terminadas <b>' + listas + '</b></span>');
    if (criticas) ch.push('<span class="chapa alerta">Críticas <b>' + criticas + '</b></span>');
    $("chapas").innerHTML = ch.join("");
  }

  function pintarFiltroRubros(){
    var fila = $("filaRubros");
    var html = ['<span class="flbl">Rubro</span>'];
    rubrosOrdenados().forEach(function(rid){
      // Sólo los rubros que hoy tienen algo pendiente o cargado: la fila de
      // filtros con los 20 rubros del catálogo no se puede ni recorrer.
      if (!(idx.porRubro[rid] || []).length) return;
      html.push('<button class="rbtn' + (filtro.rubros.indexOf(rid) !== -1 ? ' act' : '') +
                '" data-rubro="' + esc(rid) + '" style="--rc:' + esc(rubroCol(rid)) + '">' +
                esc(rubroNom(rid)) + '</button>');
    });
    fila.innerHTML = html.join("");
  }

  // ¿Esta entidad pasa los filtros de arriba?
  function pasaFiltro(eid){
    var ids = itemsDe(eid), n = cuentaDe(ids), e = datos.entidades[eid];
    if (filtro.sev !== "todas" && sevDe(n.pend) !== filtro.sev) return false;
    if (filtro.rubros.length) {
      var tiene = filtro.rubros.some(function(r){
        return ids.some(function(i){ return datos.items[i].rubro === r && !datos.items[i].ok; });
      });
      if (!tiene) return false;
    }
    if (filtro.texto) {
      var heno = plano(e.nombre + " " + (e.piso ? "piso " + e.piso : "") + " " +
        ids.map(function(i){ return rubroNom(datos.items[i].rubro) + " " + datos.items[i].texto; }).join(" "));
      if (heno.indexOf(filtro.texto) === -1) return false;
    }
    return true;
  }

  function tarjetaEntidad(eid){
    var e = datos.entidades[eid], ids = itemsDe(eid), n = cuentaDe(ids);
    var sv = sevDe(n.pend), s = SEV[sv];
    var pct = n.total ? Math.round(n.ok * 100 / n.total) : 100;

    // Chips de rubros con lo que falta de cada uno.
    var porR = {}, ordenR = [];
    ids.forEach(function(i){
      var it = datos.items[i];
      if (it.ok) return;
      if (!porR[it.rubro]) { porR[it.rubro] = 0; ordenR.push(it.rubro); }
      porR[it.rubro]++;
    });
    var tags = ordenR.map(function(r){
      var c = rubroCol(r);
      return '<span class="rtag" style="background:' + c + '18;color:' + c + ';border-color:' + c + '55">' +
             esc(rubroNom(r)) + ' <b>' + porR[r] + '</b></span>';
    }).join("");

    return '<div class="tarjeta" data-ent="' + esc(eid) + '" style="--sv:' + s.color + ';--sv-bg:' + s.bg + '">' +
      '<div class="t-cab">' +
        '<div class="t-izq">' +
          '<div class="t-nom">' + (e.icono ? '<span class="ico">' + esc(e.icono) + '</span>' : "") + esc(e.nombre) + '</div>' +
          '<div class="t-sub">' +
            (e.piso ? '<span class="t-piso">Piso ' + esc(e.piso) + '</span>' : "") +
            '<span class="pila">' + s.txt + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="t-num"><b>' + n.pend + '</b><span>' + (n.pend === 1 ? "pendiente" : "pendientes") + '</span></div>' +
        '<span class="t-flecha">›</span>' +
      '</div>' +
      '<div class="t-barra"><i style="width:' + pct + '%"></i></div>' +
      (tags ? '<div class="t-tags">' + tags + '</div>' : "") +
    '</div>';
  }

  function tarjetaRubro(rid){
    var ids = (idx.porRubro[rid] || []), n = cuentaDe(ids);
    var c = rubroCol(rid);
    var pct = n.total ? Math.round(n.ok * 100 / n.total) : 100;
    // En cuántas unidades/espacios queda algo de este rubro.
    var ents = {};
    ids.forEach(function(i){ if (!datos.items[i].ok) ents[datos.items[i].ent] = 1; });
    var cuantas = Object.keys(ents).length;
    return '<div class="tarjeta" data-rubro="' + esc(rid) + '" style="--sv:' + c + ';--sv-bg:' + c + '18">' +
      '<div class="t-cab">' +
        '<div class="t-izq">' +
          '<div class="t-nom">' + esc(rubroNom(rid)) + '</div>' +
          '<div class="t-sub"><span class="t-piso">' +
            (cuantas ? "en " + cuantas + (cuantas === 1 ? " lugar" : " lugares") : "sin pendientes") +
          '</span></div>' +
        '</div>' +
        '<div class="t-num"><b>' + n.pend + '</b><span>' + (n.pend === 1 ? "pendiente" : "pendientes") + '</span></div>' +
        '<span class="t-flecha">›</span>' +
      '</div>' +
      '<div class="t-barra"><i style="width:' + pct + '%"></i></div>' +
    '</div>';
  }

  function pintarLista(){
    var cont = $("lista"), html = [];

    if (filtro.vista === "rubro") {
      var rs = rubrosOrdenados().filter(function(rid){
        if (!(idx.porRubro[rid] || []).length) return false;
        if (filtro.rubros.length && filtro.rubros.indexOf(rid) === -1) return false;
        if (filtro.texto && plano(rubroNom(rid)).indexOf(filtro.texto) === -1) {
          var hay = idx.porRubro[rid].some(function(i){ return plano(datos.items[i].texto).indexOf(filtro.texto) !== -1; });
          if (!hay) return false;
        }
        if (filtro.sev !== "todas" && sevDe(cuentaDe(idx.porRubro[rid]).pend) !== filtro.sev) return false;
        return true;
      });
      // De mayor a menor: primero lo que más falta.
      rs.sort(function(a, b){ return cuentaDe(idx.porRubro[b]).pend - cuentaDe(idx.porRubro[a]).pend; });
      html = rs.map(tarjetaRubro);
      cont.innerHTML = html.length ? html.join("") : '<div class="vacio">No hay rubros que cumplan el filtro.</div>';
      return;
    }

    var lista = entidadesDe(filtro.vista).filter(pasaFiltro);
    if (!lista.length) {
      cont.innerHTML = '<div class="vacio">No hay ' +
        (filtro.vista === "unidad" ? "unidades" : "espacios") + ' que cumplan el filtro.<br>' +
        '<button class="bt" style="margin-top:12px" data-acc="limpiar">Limpiar filtros</button></div>';
      return;
    }
    if (filtro.vista === "unidad") {
      var pisoActual = null;
      lista.forEach(function(eid){
        var p = datos.entidades[eid].piso || "";
        if (p !== pisoActual) { pisoActual = p; html.push('<div class="grupo">' + (p ? "Piso " + esc(p) : "Sin piso") + '</div>'); }
        html.push(tarjetaEntidad(eid));
      });
    } else {
      html = lista.map(tarjetaEntidad);
    }
    cont.innerHTML = html.join("");
  }

  // Un solo repintado por tanda: si bajan 800 ítems de la nube de a uno,
  // no tiene sentido dibujar 800 veces.
  var pendienteRender = null;
  function render(){
    indexar();
    pintarCabecera();
    pintarFiltroRubros();
    pintarLista();
    if (detalleAbierto) pintarDetalle();
  }
  function pedirRender(){
    if (pendienteRender) return;
    pendienteRender = setTimeout(function(){
      pendienteRender = null;
      // Si está tipeando no le arrebato el foco: se reintenta al soltar el
      // campo. Sin el reintento, un cambio que baja de la nube justo en ese
      // momento se perdía hasta el próximo repintado.
      if (escribiendo()) { pedirRender(); return; }
      render();
    }, escribiendo() ? 400 : 60);
  }

  /* =========================================================
     5) DETALLE — una unidad, un espacio común o un rubro
  ========================================================= */
  var detalleAbierto = null;   // { tipo:'ent'|'rubro', id }
  var verHechos = true;        // los tildados se siguen viendo, tachados

  // El botón físico de "atrás" del celular tiene que cerrar el detalle, no
  // salir de la app: al abrirlo se apila un estado y `popstate` lo cierra.
  var histPuesto = false;

  function abrirDetalle(tipo, id){
    detalleAbierto = { tipo: tipo, id: id };
    pintarDetalle();
    $("detalle").classList.add("open");
    $("detalle").querySelector(".d-cuerpo").scrollTop = 0;
    if (!histPuesto) { try { history.pushState({ fo:1 }, ""); histPuesto = true; } catch(e){} }
  }
  function cerrarDetalle(){
    detalleAbierto = null;
    $("detalle").classList.remove("open");
    // history.back() dispara popstate, que ya encuentra el detalle cerrado.
    if (histPuesto) { histPuesto = false; try { history.back(); } catch(e){} }
  }

  function personaNom(pid){
    var p = datos.personas[pid];
    return p && !p.del ? (p.nombre || p.email || "?") : "";
  }
  function fechaCorta(ms){
    if (!ms) return "";
    var d = new Date(ms);
    return d.getDate() + "/" + (d.getMonth() + 1);
  }
  // De un mail sale un nombre legible: no hace falta cargar a nadie para que el
  // "controló" diga algo útil.
  function nombreDe(mail){
    if (!mail) return "este equipo";
    var n = String(mail).split("@")[0].replace(/[._-]+/g, " ").trim();
    return n ? n.charAt(0).toUpperCase() + n.slice(1) : mail;
  }

  function filaItem(iid, conRubro){
    var it = datos.items[iid];
    if (it.ok && !verHechos) return "";
    var fotos = (idx.porItem[iid] || []).length;
    var pie = [];
    if (it.resp && personaNom(it.resp))
      pie.push('<button class="chip resp" data-acc="responsable">👤 ' + esc(personaNom(it.resp)) + '</button>');
    else if (!it.ok)
      pie.push('<button class="chip vacio" data-acc="responsable">👤 Asignar</button>');
    if (it.ok && (it.por || it.cuando))
      pie.push('<span class="chip hecho">✓ ' + esc(nombreDe(it.por)) +
               (it.cuando ? ' · ' + fechaCorta(it.cuando) : "") + '</span>');
    pie.push('<button class="chip' + (fotos ? " foto" : " vacio") + '" data-acc="fotos">📷' +
             (fotos ? " " + fotos : "") + '</button>');

    return '<div class="item' + (it.ok ? " ok" : "") + '" data-item="' + esc(iid) + '">' +
      '<button class="tick" data-acc="tick" title="Marcar como hecho">✓</button>' +
      '<div class="item-cuerpo">' +
        '<span class="txt" data-acc="editar">' + esc(it.texto) + '</span>' +
        '<div class="item-pie">' + pie.join("") + '</div>' +
      '</div>' +
      (conRubro ? '<span class="marca" style="color:' + esc(rubroCol(it.rubro)) + '">' + esc(rubroNom(it.rubro)) + '</span>' : "") +
      '<button class="quitar" data-acc="borrar" title="Borrar">×</button>' +
    '</div>';
  }

  function pintarDetalleEntidad(eid){
    var e = datos.entidades[eid], n = cuentaDe(itemsDe(eid));
    $("dTitulo").textContent = (e.icono ? e.icono + " " : "") + e.nombre;
    $("dSub").textContent = (e.piso ? "Piso " + e.piso + " · " : "") +
      n.pend + " de " + n.total + " pendientes";

    var h = ['<div class="d-acciones">' +
      '<button class="bt pri" data-acc="nuevoRubro">+ Rubro</button>' +
      '<button class="bt" data-acc="verHechos">' + (verHechos ? "Ocultar hechos" : "Ver hechos") + '</button>' +
      '<button class="bt" data-acc="compartir">Compartir</button>' +
      '<button class="bt" data-acc="fotosEnt">📷 ' + fotosDeEntidad(eid).length + '</button>' +
      '<button class="bt" data-acc="editarEnt">Renombrar</button>' +
      '<button class="bt mal" data-acc="borrarEnt">Borrar</button>' +
    '</div>'];

    var bloques = rubrosDe(eid);
    if (!bloques.length) h.push('<div class="vacio">Todavía no hay nada cargado acá.<br>Tocá «+ Rubro» para empezar.</div>');

    bloques.forEach(function(b){
      var c = rubroCol(b.rubro), cu = cuentaDe(b.items);
      h.push('<div class="r-bloque" style="--rc:' + esc(c) + '">' +
        '<div class="r-cab">' +
          '<span class="nom">' + esc(rubroNom(b.rubro)) + '</span>' +
          '<span class="cuenta">' + cu.pend + '/' + cu.total + '</span>' +
          '<button class="r-mas" data-acc="nuevoItem" data-rubro="' + esc(b.rubro) + '" title="Agregar ítem">+</button>' +
        '</div>' +
        b.items.map(function(i){ return filaItem(i, false); }).join("") +
      '</div>');
    });
    $("dCuerpo").innerHTML = h.join("");
  }

  function pintarDetalleRubro(rid){
    var ids = (idx.porRubro[rid] || []), n = cuentaDe(ids);
    $("dTitulo").textContent = rubroNom(rid);
    $("dSub").textContent = n.pend + " de " + n.total + " pendientes en toda la obra";

    var h = ['<div class="d-acciones">' +
      '<button class="bt" data-acc="verHechos">' + (verHechos ? "Ocultar hechos" : "Ver hechos") + '</button>' +
      '<button class="bt pri" data-acc="compartir">Compartir con el gremio</button>' +
      '<button class="bt" data-acc="editarRubro">Editar rubro</button>' +
    '</div>'];

    // Agrupado por unidad / espacio, en el orden en que se ven en la lista.
    var porEnt = {};
    ids.forEach(function(i){ (porEnt[datos.items[i].ent] = porEnt[datos.items[i].ent] || []).push(i); });
    var ents = Object.keys(porEnt).sort(porOrden(datos.entidades));
    var algo = false;
    var cuerpo = ents.map(function(eid){
      var e = datos.entidades[eid];
      var filas = porEnt[eid].map(function(i){ return filaItem(i, false); }).join("");
      if (!filas) return "";
      algo = true;
      var cu = cuentaDe(porEnt[eid]);
      return '<div class="r-ent">' + (e.icono ? esc(e.icono) + " " : "") + esc(e.nombre) +
             (e.piso ? " · Piso " + esc(e.piso) : "") + " — " + cu.pend + "/" + cu.total + '</div>' + filas;
    }).join("");

    h.push('<div class="r-bloque" style="--rc:' + esc(rubroCol(rid)) + '">' +
      (algo ? cuerpo : '<div class="vacio">No queda nada de este rubro.</div>') + '</div>');
    $("dCuerpo").innerHTML = h.join("");
  }

  function pintarDetalle(){
    if (!detalleAbierto) return;
    if (detalleAbierto.tipo === "ent") {
      if (!datos.entidades[detalleAbierto.id] || datos.entidades[detalleAbierto.id].del) return cerrarDetalle();
      pintarDetalleEntidad(detalleAbierto.id);
    } else {
      if (!datos.rubros[detalleAbierto.id]) return cerrarDetalle();
      pintarDetalleRubro(detalleAbierto.id);
    }
  }

  /* =========================================================
     6) EDITAR
     Cada cambio toca UN registro y sube solo ese registro
     (ver sección 8). Nunca se reescribe la colección entera.
  ========================================================= */
  function tocarItem(iid, cambios){
    var it = datos.items[iid];
    if (!it) return;
    Object.keys(cambios).forEach(function(k){ it[k] = cambios[k]; });
    subir("items", iid, it);
  }
  function tocarEnt(eid, cambios){
    var e = datos.entidades[eid];
    if (!e) return;
    Object.keys(cambios).forEach(function(k){ e[k] = cambios[k]; });
    subir("entidades", eid, e);
  }
  function tocarRubro(rid, cambios){
    var r = datos.rubros[rid];
    if (!r) return;
    Object.keys(cambios).forEach(function(k){ r[k] = cambios[k]; });
    subir("rubros", rid, r);
  }

  function nuevoItem(eid, rid, texto){
    var t = String(texto || "").trim();
    if (!t) return null;
    var ultimo = 0;
    itemsDe(eid).forEach(function(i){ ultimo = Math.max(ultimo, datos.items[i].orden || 0); });
    var iid = "i_" + eid + "_" + rid + "_" + uid();
    datos.items[iid] = { ent: eid, rubro: rid, texto: t, ok: false, orden: ultimo + 1 };
    subir("items", iid, datos.items[iid]);
    return iid;
  }

  // Editar el texto en el lugar: se cambia el <span> por un <input>.
  function editarEnLugar(fila){
    var iid = fila.getAttribute("data-item"), it = datos.items[iid];
    if (!it || fila.querySelector("input.edit")) return;
    var span = fila.querySelector(".txt");
    var inp = document.createElement("input");
    inp.type = "text"; inp.className = "edit"; inp.value = it.texto;
    span.style.display = "none";
    span.parentElement.insertBefore(inp, span.nextSibling);
    inp.focus(); inp.select();
    var cerrado = false;
    function guardar(){
      if (cerrado) return; cerrado = true;
      var v = inp.value.trim();
      inp.remove(); span.style.display = "";
      if (v && v !== it.texto) { tocarItem(iid, { texto: v }); pedirRender(); }
    }
    inp.addEventListener("blur", guardar);
    inp.addEventListener("keydown", function(ev){
      if (ev.key === "Enter") { ev.preventDefault(); guardar(); }
      if (ev.key === "Escape") { cerrado = true; inp.remove(); span.style.display = ""; }
    });
  }

  /* =========================================================
     7) MODALES Y AVISOS

  var modal = $("modal"), modalContenido = $("modalContenido");
  function abrirModal(html){ modalContenido.innerHTML = html; modal.classList.add("open"); }
  function cerrarModal(){ modal.classList.remove("open"); modalContenido.innerHTML = ""; }
  $("btnCerrar").addEventListener("click", cerrarModal);
  modal.addEventListener("click", function(e){ if (e.target === modal) cerrarModal(); });

  var tToast = null, accionToast = null;
  function toast(msg, accion){
    var t = $("toast");
    accionToast = accion || null;
    t.innerHTML = esc(msg) + (accion ? ' <button id="toastAcc">' + esc(accion.txt) + '</button>' : "");
    t.classList.add("show");
    if (tToast) clearTimeout(tToast);
    tToast = setTimeout(function(){ t.classList.remove("show"); accionToast = null; }, accion ? 5200 : 1900);
  }
  $("toast").addEventListener("click", function(e){
    if (e.target.id !== "toastAcc" || !accionToast) return;
    var fn = accionToast.fn; accionToast = null;
    $("toast").classList.remove("show");
    fn();
  });

  /* ---- Alta de ítem ---- */
  function modalNuevoItem(eid, rid){
    abrirModal('<h2>Agregar pendiente</h2>' +
      '<div class="ayuda">' + esc(rubroNom(rid)) + ' · ' + esc(datos.entidades[eid].nombre) + '</div>' +
      '<textarea class="campo" id="mItem" rows="3" placeholder="Qué falta hacer"></textarea>' +
      '<button class="bfull" id="mGuardar">Agregar</button>');

      if (!nuevoItem(eid, rid, ta.value)) { ta.focus(); return; }

    $("mGuardar").addEventListener("click", guardar);

  /* ---- Alta de rubro dentro de una unidad ---- */
  function modalNuevoRubro(eid){
    var yaTiene = {};
    rubrosDe(eid).forEach(function(b){ yaTiene[b.rubro] = 1; });
    var libres = rubrosOrdenados().filter(function(r){ return !yaTiene[r]; });
    abrirModal('<h2>Agregar rubro</h2>' +
      '<div class="ayuda">Elegí uno del listado o creá uno nuevo. Después vas a poder cargarle pendientes.</div>' +
      (libres.length ? '<div class="rejilla" id="mRejilla">' + libres.map(function(r){
          return '<button data-rubro="' + esc(r) + '" style="border-color:' + esc(rubroCol(r)) + '55;color:' + esc(rubroCol(r)) + '">' +
                 esc(rubroNom(r)) + '</button>';
        }).join("") + '</div>' : "") +
      '<h3>Rubro nuevo</h3>' +
      '<input class="campo" id="mRubroNom" placeholder="Nombre del rubro">' +
      '<button class="bfull sec" id="mRubroCrear">Crear rubro</button>');

    if ($("mRejilla")) $("mRejilla").addEventListener("click", function(e){
      var b = e.target.closest("button[data-rubro]");
      if (!b) return;
      cerrarModal();
      modalNuevoItem(eid, b.getAttribute("data-rubro"));

    $("mRubroCrear").addEventListener("click", function(){
      var nom = $("mRubroNom").value.trim();
      if (!nom) { $("mRubroNom").focus(); return; }
      var rid = crearRubro(nom);
      cerrarModal();
      modalNuevoItem(eid, rid);
    });
  }

  function crearRubro(nombre){
    var base = plano(nombre).replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "rubro";
    var rid = base, k = 2;
    while (datos.rubros[rid]) { rid = base + "_" + (k++); }
    var maxO = 0;
    Object.keys(datos.rubros).forEach(function(r){ maxO = Math.max(maxO, datos.rubros[r].orden || 0); });
    datos.rubros[rid] = { nombre: nombre.trim(), color: colorSugerido(), orden: maxO + 1 };
    subir("rubros", rid, datos.rubros[rid]);
    return rid;
  }
  // Colores de la paleta del sistema, para que un rubro nuevo no salga gris.
  var PALETA = ["#5c6370","#6c63a8","#2563eb","#92650a","#0772a1","#157a3a","#7e22ce","#b91c1c",
                "#a16207","#4b5563","#c2410c","#0f766e","#78350f","#0e7490","#0891b2","#7c3aed","#be123c"];
  function colorSugerido(){
    var usados = {};
    Object.keys(datos.rubros).forEach(function(r){ usados[(datos.rubros[r].color || "").toLowerCase()] = 1; });
    for (var i = 0; i < PALETA.length; i++) if (!usados[PALETA[i]]) return PALETA[i];
    return PALETA[Object.keys(datos.rubros).length % PALETA.length];
  }

  /* ---- Alta y edición de unidades / espacios ---- */
  function modalNuevaEntidad(tipo){
    var esU = tipo === "unidad";
    abrirModal('<h2>' + (esU ? "Nueva unidad" : "Nuevo espacio común") + '</h2>' +

      (esU ? '<input class="campo" id="mPiso" placeholder="Piso (ej: 1)">'
           : '<input class="campo" id="mIco" placeholder="Ícono opcional (ej: 🎉)">') +

    $("mGuardar").addEventListener("click", function(){
      var nom = $("mNom").value.trim();
      if (!nom) { $("mNom").focus(); return; }

      datos.entidades[eid] = { tipo: tipo, nombre: nom,

      '<input class="campo" id="mNom" value="' + esc(e.nombre) + '">' +

  /* ---- Compartir: texto plano para WhatsApp o para copiar ---- */
  // " (Juan)" si el pendiente tiene responsable. Al mandarlo por WhatsApp,
  // saber de quién es cada cosa es la mitad del mensaje.
  function _quien(iid){
    var n = personaNom(datos.items[iid].resp);
    return n ? " (" + n + ")" : "";
  }

  function textoDe(tipo, id){
    var L = [], obra = nombreObra();
    if (tipo === "ent") {
      var e = datos.entidades[id];
      L.push("*" + obra + " — " + e.nombre + (e.piso ? " (Piso " + e.piso + ")" : "") + "*");
      rubrosDe(id).forEach(function(b){
        var pend = b.items.filter(function(i){ return !datos.items[i].ok; });
        if (!pend.length) return;
        L.push("");
        L.push("*" + rubroNom(b.rubro) + "*");
        pend.forEach(function(i){ L.push("• " + datos.items[i].texto + _quien(i)); });
      });
      if (L.length === 1) L.push("", "Sin pendientes ✅");
    } else {
      L.push("*" + obra + " — " + rubroNom(id) + "*");
      var porEnt = {};
      (idx.porRubro[id] || []).forEach(function(i){
        if (datos.items[i].ok) return;
        (porEnt[datos.items[i].ent] = porEnt[datos.items[i].ent] || []).push(i);
      });
      var ents = Object.keys(porEnt).sort(porOrden(datos.entidades));
      ents.forEach(function(eid){
        var e = datos.entidades[eid];
        L.push("");
        L.push("*" + e.nombre + (e.piso ? " (Piso " + e.piso + ")" : "") + "*");
        porEnt[eid].forEach(function(i){ L.push("• " + datos.items[i].texto + _quien(i)); });
      });
      if (L.length === 1) L.push("", "Sin pendientes ✅");
    }
    return L.join("\n");
  }

  function modalCompartir(tipo, id){
    var txt = textoDe(tipo, id);
    abrirModal('<h2>Compartir pendientes</h2>' +
      '<div class="ayuda">Se manda sólo lo que falta. Lo tildado no sale.</div>' +
      '<textarea class="campo" id="mTxt" rows="10" style="font-size:13px">' + esc(txt) + '</textarea>' +
      '<button class="bfull" id="mWa">Enviar por WhatsApp</button>' +
      '<button class="bfull sec" id="mCopiar" style="margin-top:8px">Copiar el texto</button>');
    $("mWa").addEventListener("click", function(){

  /* =========================================================

     Borrar no borra: marca `del`. Así lo borrado se puede
     recuperar y, sobre todo, un equipo que estuvo sin señal no
     vuelve a subir lo que ya se había sacado en otro.

  function borrados(){
    var L = [];
    Object.keys(datos.entidades).forEach(function(k){
      if (datos.entidades[k].del) L.push({ col:"entidades", id:k, txt: datos.entidades[k].nombre, tipo:"lugar" });
    });
    Object.keys(datos.items).forEach(function(k){
      if (!datos.items[k].del) return;
      var e = datos.entidades[datos.items[k].ent];
      L.push({ col:"items", id:k, txt: datos.items[k].texto, tipo: (e ? e.nombre : "—") });
    });
    return L;
  }

  function modalAjustes(){
    var b = borrados();
    var n = cuentaDe(vivos(datos.items, function(it){

    abrirModal('<h2>Ajustes</h2>' +

        ' espacios comunes · ' + n.total + ' ítems (' + n.ok + ' resueltos).</div>' +
      '<h3>Informe</h3>' +
      '<button class="bfull sec" id="aInforme">Armar informe para imprimir o PDF</button>' +
      '<h3>Papelera (' + b.length + ')</h3>' +
      (b.length
        ? '<div id="aPapelera">' + b.slice(0, 60).map(function(x){
            return '<div class="item"><span class="txt">' + esc(x.txt) +
                   '<span class="marca" style="display:block">' + esc(x.tipo) + '</span></span>' +
                   '<button class="bt" data-rec="' + x.col + '|' + esc(x.id) + '">Recuperar</button></div>';
          }).join("") + '</div>' +
          '<button class="bfull sec malo" id="aVaciar" style="margin-top:10px">Vaciar la papelera</button>'
        : '<div class="ayuda">No hay nada borrado.</div>') +
      '<h3>Empezar de nuevo</h3>' +
      '<div class="ayuda">Borra todo lo cargado en este equipo y vuelve a la carga inicial ' +
        '(las 39 unidades y los 13 espacios comunes del relevamiento). Si estás sincronizando, ' +
        'también se sube: lo pierden todos los equipos.</div>' +
      '<button class="bfull malo" id="aReset">Volver a la carga inicial</button>');

    $("aObra").addEventListener("change", function(){
      datos.obra = this.value.trim();
      guardarLocal(); subirNombre();
      pintarCabecera(); toast("Nombre guardado");
    });
    $("aInforme").addEventListener("click", function(){ cerrarModal(); modalInforme(); });
    if ($("aPapelera")) $("aPapelera").addEventListener("click", function(e){

      guardarLocal(); render(); cerrarModal(); toast("Papelera vacía");

    $("aReset").addEventListener("click", function(){

  /* =========================================================

     Desde ahí el celular ofrece "Guardar como PDF".

  var infCfg = { alcance:"ambos", rubros:[], soloPendientes:true, firmas:true };

  function modalInforme(){

    function repintarCuenta(){
      var d = datosInforme();
      $("iCuenta").textContent = d.total
        ? "Van a salir " + d.ents.length + (d.ents.length === 1 ? " lugar" : " lugares") + " y " + d.total +
          (d.total === 1 ? " ítem." : " ítems.")

    $("iAlcance").addEventListener("click", function(e){

      else { infCfg.rubros.splice(i, 1); b.classList.remove("act"); }
      repintarCuenta();

    $("iFirmas").addEventListener("change", function(){ infCfg.firmas = this.checked; });
    $("iHacer").addEventListener("click", imprimirInforme);

  function datosInforme(){
    var tipos = infCfg.alcance === "ambos" ? ["unidad","comun"] : [infCfg.alcance];
    var ents = [], total = 0;
    tipos.forEach(function(t){
      entidadesDe(t).forEach(function(eid){
        var bloques = rubrosDe(eid).map(function(b){
          if (infCfg.rubros.length && infCfg.rubros.indexOf(b.rubro) === -1) return null;
          var its = b.items.filter(function(i){ return infCfg.soloPendientes ? !datos.items[i].ok : true; });
          return its.length ? { rubro: b.rubro, items: its } : null;
        }).filter(Boolean);
        if (!bloques.length) return;
        bloques.forEach(function(b){ total += b.items.length; });
        ents.push({ id: eid, bloques: bloques });
      });
    });
    return { ents: ents, total: total };
  }

  function fechaLarga(){
    var d = new Date();
    var m = ["enero","febrero","marzo","abril","mayo","junio","julio",
             "agosto","septiembre","octubre","noviembre","diciembre"];
    return d.getDate() + " de " + m[d.getMonth()] + " de " + d.getFullYear();
  }

  function armarInforme(){
    var d = datosInforme(), obra = nombreObra();
    var L = ['<div class="rep-head">' +
        '<img class="rep-logo" src="../assets/mess-logo.svg" alt="">' +
        '<div class="rep-t"><h1>' + esc(obra) + '</h1>' +
          '<div class="rep-sub">Pendientes de final de obra</div></div>' +
        '<div class="rep-meta"><span class="f">' + esc(fechaLarga()) + '</span>' +
          esc(d.ents.length + (d.ents.length === 1 ? " lugar" : " lugares")) + ' · ' +
          esc(d.total + (d.total === 1 ? " ítem" : " ítems")) + '</div></div>'];

    // Resumen: cuánto falta por rubro en todo lo que entra al informe.
    var porR = {}, ordenR = [];
    d.ents.forEach(function(x){
      x.bloques.forEach(function(b){
        if (!porR[b.rubro]) { porR[b.rubro] = 0; ordenR.push(b.rubro); }
        porR[b.rubro] += b.items.filter(function(i){ return !datos.items[i].ok; }).length;
      });
    });
    ordenR.sort(function(a, b){ return porR[b] - porR[a]; });
    if (ordenR.length) {
      L.push('<table class="rep-res"><tbody>' +
        ordenR.map(function(r){
          return '<tr><td>' + esc(rubroNom(r)) + '</td><td class="n">' + porR[r] + '</td></tr>';
        }).join("") +
        '<tr class="tot"><td>Total pendiente</td><td class="n">' +
          ordenR.reduce(function(s, r){ return s + porR[r]; }, 0) + '</td></tr></tbody></table>');
    }

    d.ents.forEach(function(x){
      var e = datos.entidades[x.id], n = cuentaDe(itemsDe(x.id));
      L.push('<div class="rep-ent"><h2>' +
        esc((e.icono ? e.icono + " " : "") + e.nombre + (e.piso ? " — Piso " + e.piso : "")) +
        '<span>' + n.pend + ' de ' + n.total + ' pendientes</span></h2>' +
        x.bloques.map(function(b){
          return '<div class="rep-ru">' + esc(rubroNom(b.rubro)) + '</div>' +
            b.items.map(function(i){
              var it = datos.items[i];
              var quien = it.ok
                ? "controló " + nombreDe(it.por) + (it.cuando ? " el " + fechaCorta(it.cuando) : "")
                : (personaNom(it.resp) || "");
              return '<div class="rep-it' + (it.ok ? " ok" : "") + '">' +
                     '<span class="cj"></span><span>' + esc(it.texto) + '</span>' +
                     (quien ? '<span class="rep-quien">' + esc(quien) + '</span>' : "") + '</div>';
            }).join("");
        }).join("") + '</div>');
    });

    if (infCfg.firmas) {
      L.push('<div class="rep-firmas">' +
        '<div><div class="linea"></div>Dirección de obra</div>' +
        '<div><div class="linea"></div>Contratista</div>' +
        '<div><div class="linea"></div>Fecha</div></div>');
    }
    L.push('<div class="rep-pie">Generado con Mess · Final de obra — ' + esc(fechaLarga()) + '</div>');
    return L.join("");
  }

  function imprimirInforme(){
    var d = datosInforme();
    if (!d.total) { toast("Con ese filtro no hay nada para imprimir"); return; }
    $("reporte").innerHTML = armarInforme();
    cerrarModal();

    setTimeout(function(){
      try { window.print(); } catch(e){}
      setTimeout(function(){ document.body.classList.remove("imprimiendo"); }, 600);
    }, 220);
  }

  /* =========================================================
     11) SINCRONIZAR ENTRE EQUIPOS (con login)
     Los datos viven en finalObra/<obraId> del proyecto de la
     obra, aparte del sistema de gestión. Sólo entra quien tenga
     cuenta Y esté en la lista de permitidos de las reglas.

     A diferencia de la planilla de personal, acá NO se sube el
     tablero entero en cada cambio: se escribe sólo el registro
     que se tocó. Con dos o tres personas recorriendo unidades
     distintas al mismo tiempo, subir todo junto haría que el
     último en guardar borre lo que acaba de tildar el otro.

     Cada registro lleva `m` (cuándo se modificó). Sirve para
     reconectar después de haber trabajado sin señal: gana el
     más nuevo, no "el que llegó último".
  ========================================================= */
  var FB = CFG.firebase || {};
  var OBRA_ID = CFG.obraId || "obra1";
  // fotosData NO está acá a propósito: es lo pesado y se baja de a una foto,
  // cuando alguien la abre (ver traerFoto()).
  var COLS = ["rubros", "entidades", "items", "personas", "fotos"];

  function hayBase(){ return !!(FB.databaseURL && FB.apiKey); }
  function configFirebase(){
    var c = { apiKey: FB.apiKey, databaseURL: FB.databaseURL };
    if (FB.projectId)  c.projectId  = FB.projectId;
    if (FB.authDomain) c.authDomain = FB.authDomain;
    else if (FB.projectId) c.authDomain = FB.projectId + ".firebaseapp.com";
    return c;
  }

  var nube = { ref:null, estado:"off", usuario:null, uid:"", error:"", motivo:"" };

  function pintarNube(){
    var b = $("btnNube"), t = $("nubeTxt"), i = $("nubeIco");
    if (!b || !t) return;
    b.className = "nube" +
      (nube.estado === "ok" ? " on" :
       (nube.estado === "mal" ? " mal" :
        (nube.estado === "sinred" ? " gris" : "")));
    i.textContent = nube.estado === "mal" ? "⚠" : "☁";
    if (nube.estado === "ok")          t.textContent = "Sincronizado — " + (nube.usuario || "");
    else if (nube.estado === "yendo")  t.textContent = "Conectando…";
    else if (nube.estado === "sinred") t.textContent = "Sin señal — sincroniza cuando vuelva";
    else if (nube.estado === "mal")    t.textContent = (nube.motivo === "permiso")
                                          ? "Falta habilitar tu cuenta — tocá acá"
                                          : "No sincroniza — tocá acá";
    else if (!hayBase())               t.textContent = "Sin sincronizar — falta configurar";
    else                               t.textContent = "Entrar para sincronizar";
  }

  // El SDK se baja recién cuando hace falta: sin configurar, el tablero no
  // pide nada a la red y abre igual de rápido.
  var fbCargando = false, fbCola = [];
  function cargarFirebase(cb){
    if (window.firebase && window.firebase.database && window.firebase.auth) return cb(true);
    fbCola.push(cb);
    if (fbCargando) return;
    fbCargando = true;
    var urls = ["https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js",
                "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js",
                "https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"];
    var i = 0;
    function listo(ok){
      fbCargando = false;
      var cola = fbCola; fbCola = [];
      cola.forEach(function(f){ f(ok); });
    }
    (function siguiente(){
      if (i >= urls.length) {
        try { if (!firebase.apps.length) firebase.initializeApp(configFirebase()); }
        catch(e){ return listo(false); }
        return listo(true);
      }
      var sc = document.createElement("script");
      sc.src = urls[i++];
      sc.onload = siguiente;
      sc.onerror = function(){ listo(false); };
      document.head.appendChild(sc);
    })();
  }

  // Firma estable de un registro: las claves ordenadas. Sin esto, el mismo
  // dato con las claves en otro orden parecería un cambio y el tablero se
  // repintaría en ciclo con cada eco de la nube.
  function firma(o){
    if (!o || typeof o !== "object") return JSON.stringify(o);
    return JSON.stringify(Object.keys(o).sort().map(function(k){ return [k, o[k]]; }));
  }
  var NORM = { items: normItem, entidades: normEnt, rubros: normRubro,
               personas: normPersona, fotos: normFoto };
  function normDe(col, v){ return (NORM[col] || normRubro)(v); }

  function subir(col, id, v){
    v.m = Date.now();                 // marca de modificación, para reconectar
    guardarLocal();
    if (!nube.ref) return;            // sin nube: queda en el equipo y sube al reconectar
    nube.ref.child(col + "/" + id).set(v).catch(marcarError);
  }
  function subirNombre(){
    if (!nube.ref) return;
    nube.ref.child("obra").set(datos.obra).catch(marcarError);
  }
  function borrarEnNube(col, id){
    if (!nube.ref) return;
    nube.ref.child(col + "/" + id).remove().catch(marcarError);
  }
  function subirTodo(){
    if (!nube.ref) return;
    nube.ref.set(datos).then(function(){
      nube.estado = "ok"; nube.motivo = ""; pintarNube();
    }).catch(marcarError);
  }

  // Primera conexión: juntar lo del equipo con lo de la nube sin perder nada.
  function fusionar(remoto){
    remoto = normalizar(remoto || {});
    // El nombre no lleva marca de tiempo: si acá no hay nada, se toma el de
    // la nube; si acá hay y allá no, se sube.
    if (remoto.obra && !datos.obra) datos.obra = remoto.obra;
    else if (datos.obra && datos.obra !== remoto.obra) subirNombre();
    COLS.forEach(function(col){
      Object.keys(remoto[col]).forEach(function(id){
        var r = remoto[col][id], l = datos[col][id];
        if (!l || (r.m || 0) >= (l.m || 0)) datos[col][id] = r;   // gana el más nuevo
        else subir(col, id, l);                                    // lo de acá es más nuevo
      });
      Object.keys(datos[col]).forEach(function(id){
        if (!remoto[col][id]) subir(col, id, datos[col][id]);      // sólo está en este equipo
      });
    });
    guardarLocal();
  }

  function escribiendo(){
    var a = document.activeElement;
    return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"));
  }

  function escuchar(col){
    var ref = nube.ref.child(col);
    function entra(snap){
      var id = snap.key, v = normDe(col, snap.val());
      if (firma(datos[col][id]) === firma(v)) return;   // es el eco de lo que subimos
      datos[col][id] = v;
      guardarLocal();
      pedirRender();
    }
    ref.on("child_added", entra, marcarError);
    ref.on("child_changed", entra, marcarError);
    ref.on("child_removed", function(snap){
      if (!datos[col][snap.key]) return;
      delete datos[col][snap.key];
      guardarLocal();
      pedirRender();
    }, marcarError);
  }

  function conectarDatos(){
    try { nube.ref = firebase.database().ref("finalObra/" + OBRA_ID); }
    catch(e){ marcarError(e); return; }
    nube.estado = "yendo"; pintarNube();
    nube.ref.once("value").then(function(snap){
      var v = snap.val();
      if (!v) subirTodo();            // primera vez en esta obra: sube lo que hay
      else { fusionar(v); render(); }
      COLS.forEach(escuchar);         // de acá en más, de a un registro por vez
      nube.ref.child("obra").on("value", function(sn){
        var v = String(sn.val() || "");
        if (v === datos.obra) return;
        datos.obra = v; guardarLocal(); pintarCabecera();
      }, marcarError);
      nube.estado = "ok"; nube.motivo = ""; pintarNube();
    }).catch(marcarError);
  }

  function soltarDatos(){
    if (nube.ref) { try { nube.ref.off(); } catch(e){} }
    nube.ref = null;
  }

  function marcarError(e){
    var c = e && e.code ? e.code : "";
    nube.motivo = (c === "PERMISSION_DENIED" || c === "permission-denied") ? "permiso" : "otro";
    nube.error  = mensajeError(e);
    nube.estado = "mal";
    pintarNube();
  }

  function mensajeError(e){
    var c = e && e.code ? e.code : "";
    if (c === "PERMISSION_DENIED" || c === "permission-denied")
      return "Tu cuenta entró bien, pero no está habilitada para esta obra. Hay que agregar tu mail a las reglas de Firebase (nodo finalObra).";
    if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found")
      return "Mail o contraseña incorrectos.";
    if (c === "auth/invalid-email")          return "Ese mail no tiene un formato válido.";
    if (c === "auth/too-many-requests")      return "Demasiados intentos seguidos. Esperá un rato y probá de nuevo.";
    if (c === "auth/network-request-failed") return "Sin conexión. El tablero sigue funcionando en este equipo.";
    if (c === "auth/operation-not-allowed")
      return "Falta habilitar el ingreso con mail y contraseña en Firebase (Authentication → Sign-in method).";
    // Distinto del anterior: acá Authentication no está activado en el
    // proyecto todavía, así que no hay ni pantalla de métodos de ingreso.
    if (c === "auth/configuration-not-found")
      return "Falta activar Authentication en el proyecto de Firebase: entrá a Authentication → Comenzar → " +
             "Correo electrónico/contraseña, y creá tu usuario en la pestaña Users.";
    if (c === "auth/api-key-not-valid" || (c === "auth/invalid-api-key"))
      return "La apiKey del proyecto no es válida. Hay que copiarla de nuevo de Firebase Console.";
    return (e && e.message) ? e.message : String(e);
  }

  // Arranca el login: si ya había sesión, Firebase la recuerda y entra solo.
  function iniciarNube(){
    pintarNube();
    if (!hayBase()) return;
    cargarFirebase(function(ok){
      if (!ok) { nube.estado = "sinred"; nube.error = ""; pintarNube(); return; }
      firebase.auth().onAuthStateChanged(function(u){
        if (u) {
          nube.usuario = u.email || "";
          nube.uid = u.uid || "";
          conectarDatos();
        } else {
          nube.usuario = null; nube.uid = "";
          soltarDatos();
          nube.estado = "off";
          pintarNube();
        }
      });
    });
  }

  // Las reglas que hay que publicar, con el mail de quien está adentro ya
  // puesto. Vienen de dos formas según con quién se comparta la base:
  //
  //   proyectoPropio  → el archivo ENTERO, para reemplazar lo que haya. Es
  //                     lo más difícil de hacer mal: seleccionar todo y
  //                     pegar. Vale porque el proyecto es sólo del tablero.
  //   compartida      → sólo el nodo finalObra, para INSERTAR. Si mandáramos
  //                     el archivo entero y alguien lo pegara reemplazando,
  //                     se llevaría puestas las reglas de la otra app.
  function bloqueReglas(){
    var mail = nube.usuario || "tu-mail@ejemplo.com";
    var cond = "auth != null && auth.token.email === '" + mail + "'";
    var secciones = "$seccion === 'rubros' || $seccion === 'entidades' || " +
                    "$seccion === 'items' || $seccion === 'obra' || " +
                    "$seccion === 'personas' || $seccion === 'fotos' || $seccion === 'fotosData'";
    if (CFG.proyectoPropio) {
      return '{\n' +
             '  "rules": {\n' +
             '    ".read": false,\n' +
             '    ".write": false,\n' +
             '    "finalObra": {\n' +
             '      "$obra": {\n' +
             '        ".read":  "' + cond + '",\n' +
             '        ".write": "' + cond + '",\n' +
             '        "$seccion": {\n' +
             '          ".validate": "' + secciones + '"\n' +
             '        }\n' +
             '      }\n' +
             '    }\n' +
             '  }\n' +
             '}';
    }
    return '"finalObra": {\n' +
           '  "$obra": {\n' +
           '    ".read":  "' + cond + '",\n' +
           '    ".write": "' + cond + '",\n' +
           '    "$seccion": {\n' +
           '      ".validate": "' + secciones + '"\n' +
           '    }\n' +
           '  }\n' +
           '},';
  }

  function copiarTexto(txt){
    var ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, 99999);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    ta.remove();
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(txt).then(function(){ toast("Copiado"); })
        .catch(function(){ toast("No pude copiar — tocá el bloque y copialo a mano"); });
      return;
    }
    toast(ok ? "Copiado" : "No pude copiar — tocá el bloque y copialo a mano");
  }

  /* ---- Fotos ---------------------------------------------------------
     Se guardan en dos pedazos: la ficha (liviana, viaja con todo) y los
     bytes en base64, que van aparte y se bajan sólo cuando alguien abre la
     foto. Si viajaran juntos, abrir el tablero en la obra se bajaría todas
     las fotos del edificio con datos del celular.                       */
  var MAX_LADO = 1280, CALIDAD = 0.72;

  function comprimirImagen(file, cb){
    var lector = new FileReader();
    lector.onerror = function(){ cb(null); };
    lector.onload = function(){
      var img = new Image();
      img.onerror = function(){ cb(null); };
      img.onload = function(){
        var w = img.width, h = img.height;
        var r = Math.min(1, MAX_LADO / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * r); c.height = Math.round(h * r);
        try {
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          cb(c.toDataURL("image/jpeg", CALIDAD));
        } catch(e){ cb(null); }
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  }

  function claveFoto(fid){ return CLAVE + "_foto_" + fid; }

  function guardarFoto(ficha, dataUrl, cuando){
    var fid = "f_" + uid();
    datos.fotos[fid] = { item: ficha.item || "", ent: ficha.ent || "", rubro: ficha.rubro || "",
                         nota: ficha.nota || "", mime: "image/jpeg", por: (nube.usuario || ""), m: 0 };
    fotosCache[fid] = dataUrl;
    escribir(claveFoto(fid), dataUrl);            // queda en el equipo, aunque no haya señal
    subir("fotos", fid, datos.fotos[fid]);        // la ficha viaja con el resto
    if (nube.ref) nube.ref.child("fotosData/" + fid).set({ d: dataUrl }).catch(marcarError);
    if (cuando) cuando(fid);
  }

  function traerFoto(fid, cb){
    if (fotosCache[fid]) return cb(fotosCache[fid]);
    leer(claveFoto(fid)).then(function(local){
      if (local) { fotosCache[fid] = local; return cb(local); }
      if (!nube.ref) return cb(null);
      nube.ref.child("fotosData/" + fid).once("value").then(function(sn){
        var v = sn.val(), d = v && v.d ? String(v.d) : "";
        if (d) { fotosCache[fid] = d; escribir(claveFoto(fid), d); }
        cb(d || null);
      }).catch(function(){ cb(null); });
    });
  }

  function borrarFoto(fid){
    var f = datos.fotos[fid];
    if (!f) return;
    f.del = 1;
    subir("fotos", fid, f);
    if (nube.ref) nube.ref.child("fotosData/" + fid).remove().catch(function(){});
    delete fotosCache[fid];
    escribir(claveFoto(fid), "");
  }

  // Pinta las miniaturas de a una, a medida que llega cada foto.
  function pintarMiniaturas(cont, ids){
    cont.innerHTML = ids.length ? "" : '<div class="ayuda">Todavía no hay fotos.</div>';
    ids.forEach(function(fid){
      var img = document.createElement("img");
      img.className = "mini"; img.alt = "Foto";
      img.addEventListener("click", function(){ verFoto(fid); });
      cont.appendChild(img);
      traerFoto(fid, function(d){
        if (d) img.src = d;
        else { img.replaceWith(document.createTextNode("")); }
      });
    });
  }

  function modalFotoLibre(){
